function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ nome: file.name, tipo: file.type, tamanho: file.size, dataUrl: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Campo de anexos (upload local, guardado como base64 dentro do próprio registro).
// Aviso: como todo o sistema guarda os dados num único bloco compartilhado, muitos anexos
// grandes deixam esse bloco mais pesado — por isso o alerta de tamanho abaixo.
function AnexosField({ anexos, onChange }) {
  const inputRef = useRef(null);
  const [carregando, setCarregando] = useState(false);
  const totalBytes = (anexos || []).reduce((s, a) => s + (a.tamanho || 0), 0);

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setCarregando(true);
    try {
      const novos = await Promise.all(Array.from(files).map(readFileAsDataURL));
      onChange([...(anexos || []), ...novos]);
    } finally {
      setCarregando(false);
    }
  };
  const remove = (idx) => onChange(anexos.filter((_, i) => i !== idx));

  return (
    <div>
      <input ref={inputRef} type="file" multiple accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf"
        style={{ display: "none" }} onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
      <button type="button" className="gf-btn gf-btn-ghost" onClick={() => inputRef.current?.click()} disabled={carregando}>
        <Paperclip size={14} /> {carregando ? "Carregando…" : "Anexar arquivo (PDF, JPG, PNG)"}
      </button>
      {(anexos || []).length > 0 && (
        <div className="gf-anexos-list">
          {anexos.map((a, i) => (
            <div className="gf-anexo-item" key={i}>
              <Paperclip size={12} /> <span>{a.nome}</span> <span className="gf-muted">({((a.tamanho || 0) / 1024).toFixed(0)} KB)</span>
              <button type="button" className="gf-icon-btn" title="Remover" onClick={() => remove(i)}><X size={12} /></button>
            </div>
          ))}
        </div>
      )}
      {totalBytes > 3 * 1024 * 1024 && (
        <p className="gf-warn" style={{ marginTop: 6 }}>
          ⚠️ Estes anexos somam {(totalBytes / 1024 / 1024).toFixed(1)} MB. O sistema guarda tudo num único registro compartilhado — muitos anexos grandes deixam o carregamento mais lento para todo mundo. Prefira arquivos leves (fotos/PDFs compactados) sempre que possível.
        </p>
      )}
    </div>
  );
}

function GerContaPagarModal({ conta, obraId, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, onClose, onSave }) {
  const editando = !!conta;
  const [parcelado, setParcelado] = useState(false);
  const [apropriacaoExcecoes, setApropriacaoExcecoes] = useState([]);
  const [f, setF] = useState(conta || { descricao: "", valor: "", dataVencimento: todayISO(), apropriacao: "", fornecedor: "", anexos: [] });
  const [parcelasRows, setParcelasRows] = useState([
    { id: uid("prc"), valor: "", vencimento: addDaysISO(todayISO(), 30) },
    { id: uid("prc"), valor: "", vencimento: addDaysISO(todayISO(), 60) },
  ]);
  const upd = (p) => setF((s) => ({ ...s, ...p }));
  const updParcela = (id, patch) => setParcelasRows((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  const addParcela = () => setParcelasRows((prev) => [...prev, { id: uid("prc"), valor: "", vencimento: "" }]);
  const removeParcela = (id) => setParcelasRows((prev) => (prev.length > 1 ? prev.filter((r) => r.id !== id) : prev));

  const fornecedorSelectOptions = [{ value: "Não se aplica", label: "Não se aplica" }, ...fornecedorOptions.map((s) => ({ value: s, label: s }))];

  const submit = (e) => {
    e.preventDefault();
    if (!f.descricao.trim() || !f.apropriacao || !f.fornecedor) return;
    if (!f.anexos || f.anexos.length === 0) return;
    const base = { obraId, descricao: f.descricao.trim(), apropriacao: f.apropriacao, fornecedor: f.fornecedor, anexos: f.anexos };
    if (editando) {
      if (!f.valor || Number(f.valor) <= 0 || !f.dataVencimento) return;
      onSave([{ ...conta, ...base, valor: Number(f.valor), dataVencimento: f.dataVencimento }]);
      return;
    }
    if (!parcelado) {
      if (!f.valor || Number(f.valor) <= 0 || !f.dataVencimento) return;

function GerDepositoModal({ deposito, obraId, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, onClose, onSave }) {
  const editando = !!deposito;
  const [parcelado, setParcelado] = useState(false);
  const [apropriacaoExcecoes, setApropriacaoExcecoes] = useState([]);
  const [f, setF] = useState(deposito || {
    descricao: "", valor: "", dataVencimento: todayISO(), apropriacao: "", fornecedor: "", observacoes: "",
    dadosBancarios: { banco: "", agencia: "", conta: "", tipoConta: "Corrente", titular: "", documento: "", pix: "" },
  });
  const [parcelasRows, setParcelasRows] = useState([
    { id: uid("prc"), valor: "", vencimento: addDaysISO(todayISO(), 30) },
    { id: uid("prc"), valor: "", vencimento: addDaysISO(todayISO(), 60) },
  ]);
  const upd = (p) => setF((s) => ({ ...s, ...p }));
  const updBanc = (p) => setF((s) => ({ ...s, dadosBancarios: { ...s.dadosBancarios, ...p } }));
  const updParcela = (id, patch) => setParcelasRows((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  const addParcela = () => setParcelasRows((prev) => [...prev, { id: uid("prc"), valor: "", vencimento: "" }]);
  const removeParcela = (id) => setParcelasRows((prev) => (prev.length > 1 ? prev.filter((r) => r.id !== id) : prev));

  const fornecedorSelectOptions = [{ value: "Não se aplica", label: "Não se aplica" }, ...fornecedorOptions.map((s) => ({ value: s, label: s }))];

  const submit = (e) => {
    e.preventDefault();
    if (!f.descricao.trim() || !f.apropriacao || !f.fornecedor) return;
    const base = { obraId, descricao: f.descricao.trim(), apropriacao: f.apropriacao, fornecedor: f.fornecedor, observacoes: f.observacoes, dadosBancarios: f.dadosBancarios };
    if (editando) {
      if (!f.valor || Number(f.valor) <= 0 || !f.dataVencimento) return;
      onSave([{ ...deposito, ...base, valor: Number(f.valor), dataVencimento: f.dataVencimento }]);
      return;
    }
    if (!parcelado) {
      if (!f.valor || Number(f.valor) <= 0 || !f.dataVencimento) return;
      onSave([{ ...base, id: uid("gdp"), groupId: uid("grpdp"), seq: 1, total: 1, valor: Number(f.valor), dataVencimento: f.dataVencimento, status: "Pendente de envio", remessaId: null }]);
    } else {
      const validas = parcelasRows.filter((r) => r.valor && Number(r.valor) > 0 && r.vencimento);
      if (validas.length < 2) return;
      const grpId = uid("grpdp");
      onSave(validas.map((r, i) => ({
        ...base, id: uid("gdp"), groupId: grpId, seq: i + 1, total: validas.length,
        valor: Number(r.valor), dataVencimento: r.vencimento, status: "Pendente de envio", remessaId: null,
      })));
    }
  };

  return (
    <Modal title={editando ? "Editar depósito" : "Novo depósito/transferência"} onClose={onClose} width={680}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Descrição" className="gf-span-2"><input required value={f.descricao} onChange={(e) => upd({ descricao: e.target.value })} /></Field>
        <Field label="Fornecedor/beneficiário">
          <SearchableSelect value={f.fornecedor} onChange={(v) => upd({ fornecedor: v })} options={fornecedorSelectOptions} placeholder="Buscar fornecedor…" />
        </Field>
        <Field label="Apropriação">
          <ApropriacaoField
            value={f.apropriacao} onChange={(v) => upd({ apropriacao: v })}
            centroCustoId={obraId} fornecedorNome={f.fornecedor}
            apropriacoesGlobais={apropriacoes} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
            excecoes={apropriacaoExcecoes} onAddExcecao={(nome) => setApropriacaoExcecoes((prev) => [...new Set([...prev, nome])])}
          />
        </Field>

        {!editando && (
          <div className="gf-span-2">
            <label className="gf-checkbox">
              <input type="checkbox" checked={parcelado} onChange={(e) => setParcelado(e.target.checked)} />
              <span>Pagamento parcelado</span>
            </label>
          </div>
        )}

        {!parcelado || editando ? (
          <>
            <Field label="Valor (R$)"><input type="number" min="0.01" step="0.01" required value={f.valor} onChange={(e) => upd({ valor: e.target.value })} /></Field>
            <Field label="Data de vencimento"><input type="date" required value={f.dataVencimento} onChange={(e) => upd({ dataVencimento: e.target.value })} /></Field>
          </>
        ) : (
          <div className="gf-span-2">
            <span className="gf-field-label" style={{ display: "block", marginBottom: 8 }}>Parcelas</span>
            {parcelasRows.map((r, i) => (
              <div className="gf-rateio-row" key={r.id}>
                <span className="mono" style={{ alignSelf: "center", fontSize: 12.5, color: "var(--gf-muted)" }}>{i + 1}/{parcelasRows.length}</span>
                <input type="number" min="0.01" step="0.01" placeholder="Valor (R$)" value={r.valor} onChange={(e) => updParcela(r.id, { valor: e.target.value })} />
                <input type="date" value={r.vencimento} onChange={(e) => updParcela(r.id, { vencimento: e.target.value })} />
                <button type="button" className="gf-icon-btn danger" onClick={() => removeParcela(r.id)}><Trash2 size={13} /></button>
              </div>
            ))}
            <button type="button" className="gf-btn gf-btn-ghost" style={{ marginTop: 6 }} onClick={addParcela}><Plus size={14} /> Adicionar parcela</button>
            <p className="gf-field-hint" style={{ marginTop: 6 }}>Total: {BRL(parcelasRows.reduce((s, r) => s + (Number(r.valor) || 0), 0))}</p>
          </div>
        )}

        <div className="gf-span-2" style={{ borderTop: "1px solid var(--gf-border)", paddingTop: 14, marginTop: 4 }}>
          <span className="gf-field-label" style={{ display: "block", marginBottom: 8 }}>Dados bancários para o cliente realizar o pagamento</span>
        </div>
        <Field label="Banco"><input value={f.dadosBancarios.banco} onChange={(e) => updBanc({ banco: e.target.value })} /></Field>
        <Field label="Tipo de conta">
          <select value={f.dadosBancarios.tipoConta} onChange={(e) => updBanc({ tipoConta: e.target.value })}>
            <option>Corrente</option><option>Poupança</option>
          </select>
        </Field>
        <Field label="Agência"><input value={f.dadosBancarios.agencia} onChange={(e) => updBanc({ agencia: e.target.value })} /></Field>
        <Field label="Conta"><input value={f.dadosBancarios.conta} onChange={(e) => updBanc({ conta: e.target.value })} /></Field>
        <Field label="Titular"><input value={f.dadosBancarios.titular} onChange={(e) => updBanc({ titular: e.target.value })} /></Field>
        <Field label="CPF/CNPJ"><input value={f.dadosBancarios.documento} onChange={(e) => updBanc({ documento: e.target.value })} /></Field>
        <Field label="Chave PIX" className="gf-span-2" hint="Opcional"><input value={f.dadosBancarios.pix} onChange={(e) => updBanc({ pix: e.target.value })} /></Field>
        <Field label="Observações" className="gf-span-2" hint="Opcional"><input value={f.observacoes} onChange={(e) => upd({ observacoes: e.target.value })} /></Field>

        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">Salvar</button>
        </div>
      </form>
    </Modal>
  );
}

function gerarEmailRemessa({ obraNome, cliente, periodoLabel, numero, contas, depositos, reembolsos, totalBoletos, totalDepositos, totalReembolsos, dadosBancariosConstrutora }) {
  let corpo = `Prezados,\n\nSegue a remessa de pagamentos referente à obra ${obraNome}${cliente ? " — " + cliente : ""}.\n\n`;
  corpo += `Remessa #${String(numero).padStart(3, "0")} — ${periodoLabel}\n\n`;

  if (contas.length) {
    corpo += `BOLETOS A PAGAR\n`;
    contas.forEach((c) => {
      corpo += `- ${c.fornecedor} | ${c.descricao} | Venc: ${fmtDate(c.dataVencimento)} | ${BRL(c.valor)}${c.total > 1 ? ` (parcela ${c.seq}/${c.total})` : ""}\n`;
    });
    corpo += `Subtotal boletos: ${BRL(totalBoletos)}\n\n`;
  }
  if (depositos.length) {
    corpo += `DEPÓSITOS/TRANSFERÊNCIAS\n`;
    depositos.forEach((d) => {
      const b = d.dadosBancarios || {};
      corpo += `- ${d.fornecedor} | ${d.descricao} | Venc: ${fmtDate(d.dataVencimento)} | ${BRL(d.valor)}\n`;
      corpo += `  Banco: ${b.banco || "—"} | Ag: ${b.agencia || "—"} | Conta: ${b.conta || "—"} (${b.tipoConta || "—"}) | Titular: ${b.titular || "—"}${b.documento ? " | Doc: " + b.documento : ""}${b.pix ? " | PIX: " + b.pix : ""}\n`;
    });
    corpo += `Subtotal depósitos: ${BRL(totalDepositos)}\n\n`;
  }
  if (reembolsos.length) {
    corpo += `REEMBOLSOS À CONSTRUTORA\n`;
    reembolsos.forEach((r) => {
      corpo += `- ${fmtDate(r.data)} | ${r.descricao || "—"} | ${r.fornecedor || "—"} | ${BRL(r.valor)}\n`;
    });
    corpo += `Subtotal reembolsos: ${BRL(totalReembolsos)}\n`;
    if (dadosBancariosConstrutora) corpo += `Dados bancários da construtora para reembolso: ${dadosBancariosConstrutora}\n`;
    corpo += `\n`;
  }
  corpo += `TOTAL DA REMESSA: ${BRL(totalBoletos + totalDepositos + totalReembolsos)}\n\n`;
  corpo += `Qualquer dúvida, estamos à disposição.\n\nAtenciosamente.`;
  return corpo;
}

                  <td>{fmtDate(e.data)}</td>
                  <td className="gf-td-desc" title={e.descricao}>{e.descricao || "—"}</td>
                  <td>{e.fornecedor || "—"}</td>
                  <td>{e.apropriacao}</td>
                  <td>{accountName(e.contaId)}</td>
                  <td className="num mono neg">{BRL(e.valor)}</td>
                  <td><Badge tone={STATUS_GER_REEMBOLSO_TONE[e.statusRb]}>{e.statusRb}</Badge></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function GerResumoTab({ obraId, gerContasPagar, gerDepositos, entries, gerReembolsos, apropriacoes }) {
  const [filtroApropriacao, setFiltroApropriacao] = useState("");
  const [filtroDe, setFiltroDe] = useState("");
  const [filtroAte, setFiltroAte] = useState("");

  const contas = gerContasPagar.filter((c) => c.obraId === obraId)
    .filter((c) => (filtroApropriacao ? c.apropriacao === filtroApropriacao : true))
    .filter((c) => (filtroDe ? c.dataVencimento >= filtroDe : true))
    .filter((c) => (filtroAte ? c.dataVencimento <= filtroAte : true));
  const depositos = gerDepositos.filter((d) => d.obraId === obraId)
    .filter((d) => (filtroApropriacao ? d.apropriacao === filtroApropriacao : true))
    .filter((d) => (filtroDe ? d.dataVencimento >= filtroDe : true))
    .filter((d) => (filtroAte ? d.dataVencimento <= filtroAte : true));
  const reembolsaveis = entries.filter((e) => e.obraId === obraId && e.tipo === "saida")
    .filter((e) => (filtroApropriacao ? e.apropriacao === filtroApropriacao : true))
    .filter((e) => (filtroDe ? e.data >= filtroDe : true))
    .filter((e) => (filtroAte ? e.data <= filtroAte : true));

  const porApropriacao = useMemo(() => {
    const map = {};
    const add = (nome, campo, valor) => { if (!map[nome]) map[nome] = { apropriacao: nome, boletos: 0, depositos: 0, reembolsos: 0 }; map[nome][campo] += valor; };
    contas.forEach((c) => add(c.apropriacao, "boletos", c.valor));
    depositos.forEach((d) => add(d.apropriacao, "depositos", d.valor));
    reembolsaveis.forEach((e) => add(e.apropriacao, "reembolsos", e.valor));
    return Object.values(map).map((r) => ({ ...r, total: r.boletos + r.depositos + r.reembolsos })).sort((a, b) => b.total - a.total);
  }, [contas, depositos, reembolsaveis]);

  const totalBoletos = contas.reduce((s, c) => s + c.valor, 0);
  const totalDepositos = depositos.reduce((s, d) => s + d.valor, 0);
  const totalReembolsos = reembolsaveis.reduce((s, e) => s + e.valor, 0);
  const enviados = [...contas, ...depositos].filter((x) => x.status !== "Pendente de envio").reduce((s, x) => s + x.valor, 0);
  const naoEnviados = [...contas, ...depositos].filter((x) => x.status === "Pendente de envio").reduce((s, x) => s + x.valor, 0);
  const reembolsosSolicitados = reembolsaveis.filter((e) => statusReembolso(e.id, gerReembolsos) !== "Pendente de cobrança").reduce((s, e) => s + e.valor, 0);
  const reembolsosNaoSolicitados = reembolsaveis.filter((e) => statusReembolso(e.id, gerReembolsos) === "Pendente de cobrança").reduce((s, e) => s + e.valor, 0);

  return (
    <div>
      <div className="gf-filters-grid" style={{ gridTemplateColumns: "repeat(3,1fr)", marginBottom: 14 }}>
        <select value={filtroApropriacao} onChange={(e) => setFiltroApropriacao(e.target.value)}>
          <option value="">Apropriação (todas)</option>
          {apropriacoes.map((a) => <option key={a} value={a}>{a}</option>)}
        </select>
        <input type="date" title="De" value={filtroDe} onChange={(e) => setFiltroDe(e.target.value)} />
        <input type="date" title="Até" value={filtroAte} onChange={(e) => setFiltroAte(e.target.value)} />
      </div>

      <div className="gf-tiles" style={{ gridTemplateColumns: "repeat(3,1fr)", marginBottom: 16 }}>
        <div className="gf-tile"><span className="gf-tile-label">Valores programados</span><span className="gf-tile-value">{BRL(totalBoletos + totalDepositos)}</span></div>
        <div className="gf-tile"><span className="gf-tile-label">Já enviados em remessa</span><span className="gf-tile-value pos">{BRL(enviados)}</span></div>
        <div className="gf-tile"><span className="gf-tile-label">Ainda não enviados</span><span className="gf-tile-value">{BRL(naoEnviados)}</span></div>
        <div className="gf-tile"><span className="gf-tile-label">Reembolsos solicitados</span><span className="gf-tile-value pos">{BRL(reembolsosSolicitados)}</span></div>
        <div className="gf-tile"><span className="gf-tile-label">Reembolsos ainda não solicitados</span><span className="gf-tile-value">{BRL(reembolsosNaoSolicitados)}</span></div>
        <div className="gf-tile gf-tile-primary"><span className="gf-tile-label">Total geral da obra</span><span className="gf-tile-value">{BRL(totalBoletos + totalDepositos + totalReembolsos)}</span></div>
      </div>

      <div className="gf-table-wrap">
        <table className="gf-table">
          <thead><tr><th>Apropriação</th><th className="num">Boletos</th><th className="num">Depósitos</th><th className="num">Reembolsos</th><th className="num">Total</th></tr></thead>
          <tbody>
            {porApropriacao.length === 0 && <tr><td colSpan={5}><EmptyState icon={FolderKanban} title="Nada por aqui ainda" body="Cadastre contas a pagar, depósitos, ou lance gastos vinculados a esta obra." /></td></tr>}
            {porApropriacao.map((r) => (
              <tr key={r.apropriacao}>
                <td><b>{r.apropriacao}</b></td>
                <td className="num mono">{BRL(r.boletos)}</td>
                <td className="num mono">{BRL(r.depositos)}</td>
                <td className="num mono">{BRL(r.reembolsos)}</td>
                <td className="num mono"><b>{BRL(r.total)}</b></td>
              </tr>
            ))}
          </tbody>
          {porApropriacao.length > 0 && (
            <tfoot>
              <tr>
                <td><b>Total geral</b></td>
                <td className="num mono"><b>{BRL(totalBoletos)}</b></td>
                <td className="num mono"><b>{BRL(totalDepositos)}</b></td>
                <td className="num mono"><b>{BRL(totalReembolsos)}</b></td>
                <td className="num mono"><b>{BRL(totalBoletos + totalDepositos + totalReembolsos)}</b></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

function GerRemessasTab({ obra, gerContasPagar, setGerContasPagar, gerDepositos, setGerDepositos, entries, gerReembolsos, setGerReembolsos, gerRemessas, setGerRemessas, currentUser, logAudit, podeLancar }) {
  const [showNova, setShowNova] = useState(false);
  const [detailRemessa, setDetailRemessa] = useState(null);
  const podeCancelar = can(currentUser, "lancamentos_aprovar");
  const remessasObra = gerRemessas.filter((r) => r.obraId === obra.id).sort((a, b) => b.numero - a.numero);

  const gerarRemessa = ({ contasIds, depositosIds, reembolsoEntryIds, periodoLabel, dadosBancariosConstrutora }) => {
    const numero = (Math.max(0, ...gerRemessas.filter((r) => r.obraId === obra.id).map((r) => r.numero)) || 0) + 1;
    const now = Date.now();

    const contasSelecionadas = gerContasPagar.filter((c) => contasIds.includes(c.id));
    const depositosSelecionados = gerDepositos.filter((d) => depositosIds.includes(d.id));
    const reembolsosSelecionados = entries.filter((e) => reembolsoEntryIds.includes(e.id));

    const totalBoletos = contasSelecionadas.reduce((s, c) => s + c.valor, 0);
    const totalDepositos = depositosSelecionados.reduce((s, d) => s + d.valor, 0);
    const totalReembolsos = reembolsosSelecionados.reduce((s, e) => s + e.valor, 0);

    const emailGerado = gerarEmailRemessa({
      obraNome: obra.nome, cliente: obra.cliente, periodoLabel, numero,
      contas: contasSelecionadas, depositos: depositosSelecionados,
      reembolsos: reembolsosSelecionados, totalBoletos, totalDepositos, totalReembolsos, dadosBancariosConstrutora,
    });

    const remessa = {
      id: uid("rem"), numero, obraId: obra.id, cliente: obra.cliente, dataGeracao: now, periodoLabel,
      usuarioResponsavel: currentUser?.nome || "—",
      contasPagarIds: contasIds, depositosIds: depositosIds, reembolsoEntryIds: reembolsoEntryIds,
      totalBoletos, totalDepositos, totalReembolsos, totalGeral: totalBoletos + totalDepositos + totalReembolsos,
      emailGerado, status: "Gerada", canceladoPor: null, canceladoEm: null,
    };

    setGerRemessas((prev) => [...prev, remessa]);
    setGerContasPagar((prev) => prev.map((c) => (contasIds.includes(c.id) ? { ...c, status: "Enviado em remessa", remessaId: remessa.id } : c)));
    setGerDepositos((prev) => prev.map((d) => (depositosIds.includes(d.id) ? { ...d, status: "Enviado em remessa", remessaId: remessa.id } : d)));
    setGerReembolsos((prev) => {
      const outros = prev.filter((r) => !reembolsoEntryIds.includes(r.entryId));
      const novos = reembolsoEntryIds.map((entryId) => ({ entryId, status: "Solicitado em remessa", remessaId: remessa.id }));
      return [...outros, ...novos];
    });
    logAudit?.({ tipoOperacao: "Geração de remessa (Gerenciamento)", registroAlterado: `${obra.nome} — Remessa #${numero}`, valorAnterior: "—", valorNovo: BRL(remessa.totalGeral) });
    setShowNova(false);
  };

  const cancelarRemessa = (remessa) => {
    if (!podeCancelar) return;
    if (!window.confirm(`Cancelar a Remessa #${remessa.numero}? Os itens voltam a ficar disponíveis para uma nova remessa.`)) return;
    setGerContasPagar((prev) => prev.map((c) => (remessa.contasPagarIds.includes(c.id) ? { ...c, status: "Pendente de envio", remessaId: null } : c)));
    setGerDepositos((prev) => prev.map((d) => (remessa.depositosIds.includes(d.id) ? { ...d, status: "Pendente de envio", remessaId: null } : d)));
    setGerReembolsos((prev) => prev.map((r) => (remessa.reembolsoEntryIds.includes(r.entryId) ? { ...r, status: "Pendente de cobrança", remessaId: null } : r)));
    setGerRemessas((prev) => prev.map((r) => (r.id === remessa.id ? { ...r, status: "Cancelada", canceladoPor: currentUser?.nome, canceladoEm: Date.now() } : r)));
    logAudit?.({ tipoOperacao: "Cancelamento de remessa (Gerenciamento)", registroAlterado: `${obra.nome} — Remessa #${remessa.numero}`, valorAnterior: "Gerada", valorNovo: "Cancelada" });
    setDetailRemessa(null);
  };

  return (
    <div>
      <div className="gf-toolbar"><div />{podeLancar && <button className="gf-btn gf-btn-primary" onClick={() => setShowNova(true)}><Send size={15} /> Nova remessa</button>}</div>
      {remessasObra.length === 0 ? (
        <EmptyState icon={Send} title="Nenhuma remessa gerada" body="Selecione contas a pagar, depósitos e reembolsos pendentes para montar a primeira remessa." />
      ) : (
        <div className="gf-table-wrap">
          <table className="gf-table">
            <thead><tr><th>Remessa</th><th>Período</th><th>Data</th><th>Responsável</th><th className="num">Total</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {remessasObra.map((r) => (
                <tr key={r.id} className="gf-row-clickable" onClick={() => setDetailRemessa(r)}>
                  <td><b>#{String(r.numero).padStart(3, "0")}</b></td>
                  <td>{r.periodoLabel}</td>
                  <td>{nowStampFromTs(r.dataGeracao)}</td>
                  <td>{r.usuarioResponsavel}</td>
                  <td className="num mono">{BRL(r.totalGeral)}</td>
                  <td><Badge tone={r.status === "Cancelada" ? "red" : "green"}>{r.status}</Badge></td>
                  <td><ChevronRight size={15} className="gf-muted" /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {showNova && (
        <NovaRemessaModal
          obra={obra} gerContasPagar={gerContasPagar.filter((c) => c.obraId === obra.id)}
          gerDepositos={gerDepositos.filter((d) => d.obraId === obra.id)}
          entries={entries.filter((e) => e.obraId === obra.id && e.tipo === "saida")}
          gerReembolsos={gerReembolsos}
          onClose={() => setShowNova(false)} onGerar={gerarRemessa}
        />
      )}
      {detailRemessa && (
        <RemessaDetailModal remessa={detailRemessa} podeCancelar={podeCancelar} onClose={() => setDetailRemessa(null)} onCancelar={cancelarRemessa} />
      )}
    </div>
  );
}

function NovaRemessaModal({ obra, gerContasPagar, gerDepositos, entries, gerReembolsos, onClose, onGerar }) {
  const contasDisponiveis = gerContasPagar.filter((c) => c.status === "Pendente de envio");
  const depositosDisponiveis = gerDepositos.filter((d) => d.status === "Pendente de envio");
  const reembolsosDisponiveis = entries.filter((e) => statusReembolso(e.id, gerReembolsos) === "Pendente de cobrança");

  const [periodoLabel, setPeriodoLabel] = useState("");
  const [dadosBancariosConstrutora, setDadosBancariosConstrutora] = useState("");
  const [contasSel, setContasSel] = useState([]);
  const [depositosSel, setDepositosSel] = useState([]);
  const [reembolsosSel, setReembolsosSel] = useState([]);

  const toggle = (setFn, id) => setFn((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));

  const totalBoletos = gerContasPagar.filter((c) => contasSel.includes(c.id)).reduce((s, c) => s + c.valor, 0);
  const totalDepositos = gerDepositos.filter((d) => depositosSel.includes(d.id)).reduce((s, d) => s + d.valor, 0);
  const totalReembolsos = entries.filter((e) => reembolsosSel.includes(e.id)).reduce((s, e) => s + e.valor, 0);
  const totalGeral = totalBoletos + totalDepositos + totalReembolsos;
  const nadaSelecionado = contasSel.length + depositosSel.length + reembolsosSel.length === 0;

  const confirmar = () => {
    if (!periodoLabel.trim() || nadaSelecionado) return;
    onGerar({ contasIds: contasSel, depositosIds: depositosSel, reembolsoEntryIds: reembolsosSel, periodoLabel: periodoLabel.trim(), dadosBancariosConstrutora });
  };

  return (
    <Modal title={`Nova remessa — ${obra.nome}`} onClose={onClose} width={820}>
      <Field label="Período da remessa" className="gf-span-2"><input required placeholder="Ex: Semana de 05 a 11/10" value={periodoLabel} onChange={(e) => setPeriodoLabel(e.target.value)} /></Field>

      {contasDisponiveis.length > 0 && (
        <>
          <h4 className="gf-chart-title" style={{ marginTop: 14 }}>Contas a pagar disponíveis</h4>
          <div className="gf-table-wrap" style={{ maxHeight: 200 }}>
            <table className="gf-table">
              <thead><tr><th></th><th>Descrição</th><th>Fornecedor</th><th>Vencimento</th><th className="num">Valor</th></tr></thead>
              <tbody>
                {contasDisponiveis.map((c) => (
                  <tr key={c.id}>
                    <td><input type="checkbox" checked={contasSel.includes(c.id)} onChange={() => toggle(setContasSel, c.id)} /></td>
                    <td>{c.descricao}{c.total > 1 && ` (${c.seq}/${c.total})`}</td>
                    <td>{c.fornecedor}</td>
                    <td>{fmtDate(c.dataVencimento)}</td>
                    <td className="num mono">{BRL(c.valor)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {depositosDisponiveis.length > 0 && (
        <>
          <h4 className="gf-chart-title" style={{ marginTop: 14 }}>Depósitos disponíveis</h4>
          <div className="gf-table-wrap" style={{ maxHeight: 200 }}>
            <table className="gf-table">
              <thead><tr><th></th><th>Descrição</th><th>Beneficiário</th><th>Vencimento</th><th className="num">Valor</th></tr></thead>
              <tbody>
                {depositosDisponiveis.map((d) => (
                  <tr key={d.id}>
                    <td><input type="checkbox" checked={depositosSel.includes(d.id)} onChange={() => toggle(setDepositosSel, d.id)} /></td>
                    <td>{d.descricao}{d.total > 1 && ` (${d.seq}/${d.total})`}</td>
                    <td>{d.fornecedor}</td>
                    <td>{fmtDate(d.dataVencimento)}</td>
                    <td className="num mono">{BRL(d.valor)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {reembolsosDisponiveis.length > 0 && (
        <>
          <h4 className="gf-chart-title" style={{ marginTop: 14 }}>Reembolsos disponíveis</h4>
          <div className="gf-table-wrap" style={{ maxHeight: 200 }}>
            <table className="gf-table">
              <thead><tr><th></th><th>Data</th><th>Descrição</th><th>Fornecedor</th><th className="num">Valor</th></tr></thead>
              <tbody>
                {reembolsosDisponiveis.map((e) => (
                  <tr key={e.id}>
                    <td><input type="checkbox" checked={reembolsosSel.includes(e.id)} onChange={() => toggle(setReembolsosSel, e.id)} /></td>
                    <td>{fmtDate(e.data)}</td>
                    <td>{e.descricao || "—"}</td>
                    <td>{e.fornecedor || "—"}</td>
                    <td className="num mono">{BRL(e.valor)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <Field label="Dados bancários da construtora (para o reembolso)" className="gf-span-2" hint="Aparecem no e-mail para o cliente saber onde depositar">
            <input value={dadosBancariosConstrutora} onChange={(e) => setDadosBancariosConstrutora(e.target.value)} placeholder="Banco, agência, conta, titular…" />
          </Field>
        </>
      )}

      {contasDisponiveis.length === 0 && depositosDisponiveis.length === 0 && reembolsosDisponiveis.length === 0 && (
        <EmptyState icon={Send} title="Nada pendente" body="Não há contas, depósitos ou reembolsos pendentes de envio para esta obra." />
      )}

      <div className="gf-form-actions" style={{ marginTop: 16 }}>
        <button type="button" className="gf-btn gf-btn-primary" disabled={nadaSelecionado || !periodoLabel.trim()} onClick={confirmar}>
          Gerar remessa — Total {BRL(totalGeral)}
        </button>
      </div>
    </Modal>
  );
}

function RemessaDetailModal({ remessa, podeCancelar, onClose, onCancelar }) {
  const [copiado, setCopiado] = useState(false);
  const copiarEmail = () => {
    navigator.clipboard?.writeText(remessa.emailGerado).then(() => { setCopiado(true); setTimeout(() => setCopiado(false), 2000); });
  };
  return (
    <Modal title={`Remessa #${String(remessa.numero).padStart(3, "0")} — ${remessa.periodoLabel}`} onClose={onClose} width={720}>
      <div className="gf-detail-meta" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
        <div><span>Status</span><b><Badge tone={remessa.status === "Cancelada" ? "red" : "green"}>{remessa.status}</Badge></b></div>
        <div><span>Gerada em</span><b>{nowStampFromTs(remessa.dataGeracao)}</b></div>
        <div><span>Responsável</span><b>{remessa.usuarioResponsavel}</b></div>
        <div><span>Total</span><b className="mono">{BRL(remessa.totalGeral)}</b></div>
      </div>

      {remessa.status === "Cancelada" && (
        <p className="gf-warn" style={{ marginTop: 10 }}>Cancelada por {remessa.canceladoPor} em {nowStampFromTs(remessa.canceladoEm)}.</p>
      )}

      <h4 className="gf-chart-title" style={{ marginTop: 14 }}>Conteúdo do e-mail gerado</h4>
      <textarea readOnly value={remessa.emailGerado} rows={14} className="gf-textarea-mono" />

      <div className="gf-form-actions" style={{ marginTop: 12 }}>
        <button type="button" className="gf-btn gf-btn-primary" onClick={copiarEmail}>{copiado ? "Copiado!" : "Copiar texto do e-mail"}</button>
        <a className="gf-btn gf-btn-ghost" href={`mailto:?subject=${encodeURIComponent(`Remessa #${String(remessa.numero).padStart(3, "0")}`)}&body=${encodeURIComponent(remessa.emailGerado)}`}>
          Abrir no e-mail
        </a>
        {remessa.status !== "Cancelada" && podeCancelar && (
          <button type="button" className="gf-btn gf-btn-ghost" onClick={() => onCancelar(remessa)}><Undo2 size={14} /> Cancelar remessa</button>
        )}
      </div>
    </Modal>
  );
}

function ObraGerenciamentoDetail({ obra, entries, accounts, gerContasPagar, setGerContasPagar, gerDepositos, setGerDepositos, gerReembolsos, setGerReembolsos, gerRemessas, setGerRemessas, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, podeLancar, currentUser, logAudit, onBack }) {

  const entriesObra = entries.filter((e) => e.obraId === obra.id);

  return (
    <div className="gf-stack">

      <div className="gf-toolbar"><h2>{obra.nome}</h2><Badge tone="blue">{obra.cliente || "—"}</Badge></div>

      <div className="gf-segmented">
        <button className={tab === "contaspagar" ? "is-active" : ""} onClick={() => setTab("contaspagar")}>Contas a Pagar</button>
        <button className={tab === "reembolsos" ? "is-active" : ""} onClick={() => setTab("reembolsos")}>Reembolsos</button>
        <button className={tab === "depositos" ? "is-active" : ""} onClick={() => setTab("depositos")}>Programação de Depósitos</button>
        <button className={tab === "resumo" ? "is-active" : ""} onClick={() => setTab("resumo")}>Painel Resumo</button>
        <button className={tab === "remessas" ? "is-active" : ""} onClick={() => setTab("remessas")}>Remessas</button>
      </div>

      <section className="gf-card">
        {tab === "contaspagar" && (
          <GerContasPagarTab obraId={obra.id} gerContasPagar={gerContasPagar} setGerContasPagar={setGerContasPagar}
            apropriacoes={apropriacoes} fornecedorOptions={fornecedorOptions} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
            podeLancar={podeLancar} logAudit={logAudit} />
        )}
        {tab === "reembolsos" && (
          <GerReembolsosTab obraId={obra.id} entries={entriesObra} accounts={accounts} gerReembolsos={gerReembolsos} />
        )}
        {tab === "depositos" && (
          <GerDepositosTab obraId={obra.id} gerDepositos={gerDepositos} setGerDepositos={setGerDepositos}
            apropriacoes={apropriacoes} fornecedorOptions={fornecedorOptions} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
            podeLancar={podeLancar} logAudit={logAudit} />
        )}
        {tab === "resumo" && (
          <GerResumoTab obraId={obra.id} gerContasPagar={gerContasPagar} gerDepositos={gerDepositos} entries={entriesObra} gerReembolsos={gerReembolsos} apropriacoes={apropriacoes} />
        )}
        {tab === "remessas" && (
          <GerRemessasTab obra={obra} gerContasPagar={gerContasPagar} setGerContasPagar={setGerContasPagar}
            gerDepositos={gerDepositos} setGerDepositos={setGerDepositos} entries={entriesObra}
            gerReembolsos={gerReembolsos} setGerReembolsos={setGerReembolsos}
            gerRemessas={gerRemessas} setGerRemessas={setGerRemessas}
            currentUser={currentUser} logAudit={logAudit} podeLancar={podeLancar} />
        )}
      </section>
    </div>
  );
}

function ObrasGerenciamentoPage({ obras, entries, gerContasPagar, setGerContasPagar, gerDepositos, setGerDepositos, gerReembolsos, setGerReembolsos, gerRemessas, setGerRemessas, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, accounts, currentUser, logAudit }) {
  const [selectedObraId, setSelectedObraId] = useState(null);

  const obrasGer = obras.filter((o) => o.modalidade === "Gerenciamento").sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { numeric: true }));
  const selectedObra = obras.find((o) => o.id === selectedObraId);

  if (selectedObra) {
    return (
      <ObraGerenciamentoDetail
        obra={selectedObra} entries={entries} accounts={accounts}
        gerContasPagar={gerContasPagar} setGerContasPagar={setGerContasPagar}
        gerDepositos={gerDepositos} setGerDepositos={setGerDepositos}
        gerReembolsos={gerReembolsos} setGerReembolsos={setGerReembolsos}
        gerRemessas={gerRemessas} setGerRemessas={setGerRemessas}
        apropriacoes={apropriacoes} fornecedorOptions={fornecedorOptions} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
        podeLancar={podeLancar} currentUser={currentUser} logAudit={logAudit}

  return (
    <div className="gf-stack">
      <div className="gf-toolbar"><h2>Obras Gerenciamento</h2></div>
      <p className="gf-field-hint">
        Obras administradas pela Glover, mas pagas diretamente pelo cliente. Para marcar uma obra nessa modalidade, edite-a no Painel de Obras e selecione "Obra por Gerenciamento".
      </p>
      {obrasGer.length === 0 ? (
        <div className="gf-card"><EmptyState icon={FolderKanban} title="Nenhuma obra em Gerenciamento" body='Marque uma obra como "Obra por Gerenciamento" no Painel de Obras para que ela apareça aqui.' /></div>
      ) : (
        <div className="gf-grid-cards">
          {obrasGer.map((o) => {
            const ultimaRemessa = gerRemessas.filter((r) => r.obraId === o.id).sort((a, b) => b.numero - a.numero)[0];
            const pendentesContas = gerContasPagar.filter((c) => c.obraId === o.id && c.status === "Pendente de envio").reduce((s, c) => s + c.valor, 0);
            const pendentesDepositos = gerDepositos.filter((d) => d.obraId === o.id && d.status === "Pendente de envio").reduce((s, d) => s + d.valor, 0);
            return (
              <button className="gf-card gf-obra-card" key={o.id} onClick={() => setSelectedObraId(o.id)}>
                <div className="gf-card-head">
                  <div><div className="gf-eyebrow">{o.cliente || "—"}</div><h3>{o.nome}</h3></div>
                  <Badge tone={o.status === "Concluída" ? "gray" : "green"}>{o.status}</Badge>
                </div>
                <div className="gf-account-rows">
                  <div><span>Pendente (boletos+depósitos)</span><b className="mono">{BRL(pendentesContas + pendentesDepositos)}</b></div>
                  <div><span>Última remessa</span><b className="mono">{ultimaRemessa ? `#${String(ultimaRemessa.numero).padStart(3, "0")}` : "—"}</b></div>
                </div>
                <span className="gf-card-cta">Abrir painel <ChevronRight size={14} /></span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Página: Custos Internos
--------------------------------------------------------------- */

function CustosInternosPage({ entries, apropriacoes, accounts }) {
  const [filters, setFilters] = useState({ apropriacao: "", de: "", ate: "" });
  const accountName = (id) => accounts.find((a) => a.id === id)?.nome || "—";

  const internos = useMemo(
    () => entries.filter((e) => e.obraId === SEM_OBRA && e.tipo === "saida"),
    [entries]
  );

  const filtered = internos
    .filter((e) => (filters.apropriacao ? e.apropriacao === filters.apropriacao : true))
    .filter((e) => (filters.de ? e.data >= filters.de : true))
    .filter((e) => (filters.ate ? e.data <= filters.ate : true))
    .sort((a, b) => (a.data < b.data ? 1 : -1));

  const now = new Date();
  const curKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const prevD = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevKey = `${prevD.getFullYear()}-${String(prevD.getMonth() + 1).padStart(2, "0")}`;

  const totalGeral = filtered.reduce((s, e) => s + e.valor, 0);
  const totalMesAtual = internos.filter((e) => monthKey(e.data) === curKey).reduce((s, e) => s + e.valor, 0);
  const totalMesAnterior = internos.filter((e) => monthKey(e.data) === prevKey).reduce((s, e) => s + e.valor, 0);
  const variacao = totalMesAnterior ? ((totalMesAtual - totalMesAnterior) / totalMesAnterior) * 100 : null;

  const porMes = useMemo(() => {
    const map = {};
    filtered.forEach((e) => {
      const k = monthKey(e.data);
      if (!map[k]) map[k] = { mes: k, total: 0 };
      map[k].total += e.valor;
    });
    return Object.values(map).sort((a, b) => a.mes.localeCompare(b.mes)).map((r) => ({ ...r, mesLabel: monthLabel(r.mes) }));
  }, [filtered]);

  const porApropriacao = useMemo(() => {
    const map = {};
    filtered.forEach((e) => { map[e.apropriacao] = (map[e.apropriacao] || 0) + e.valor; });
    return Object.entries(map).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered]);

  return (
    <div className="gf-stack">
      <div className="gf-toolbar"><h2>Custos internos</h2></div>

      <div className="gf-tiles" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
        <div className="gf-tile">
          <span className="gf-tile-label">Total no período filtrado</span>
          <span className="gf-tile-value neg">{BRL(totalGeral)}</span>
        </div>
        <div className="gf-tile">
          <span className="gf-tile-label">Gasto no mês atual</span>
          <span className="gf-tile-value neg">{BRL(totalMesAtual)}</span>
        </div>
        <div className="gf-tile">
          <span className="gf-tile-label">Gasto no mês anterior</span>
          <span className="gf-tile-value">{BRL(totalMesAnterior)}</span>
        </div>
        <div className="gf-tile">
          <span className="gf-tile-label">Variação vs mês anterior</span>
          <span className={`gf-tile-value ${variacao === null ? "" : variacao <= 0 ? "pos" : "neg"}`}>
            {variacao === null ? "—" : `${variacao > 0 ? "+" : ""}${variacao.toFixed(0)}%`}
          </span>
        </div>
      </div>

      <section className="gf-card">
        <div className="gf-card-head"><h2>Filtros</h2></div>
        <div className="gf-filters-grid" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
          <select value={filters.apropriacao} onChange={(e) => setFilters((f) => ({ ...f, apropriacao: e.target.value }))}>
            <option value="">Apropriação (todas)</option>
            {apropriacoes.map((a) => <option key={a} value={a}>{a}</option>)}
          </select>
          <input type="date" title="De" value={filters.de} onChange={(e) => setFilters((f) => ({ ...f, de: e.target.value }))} />
          <input type="date" title="Até" value={filters.ate} onChange={(e) => setFilters((f) => ({ ...f, ate: e.target.value }))} />
        </div>
      </section>

      {internos.length === 0 ? (
        <div className="gf-card">
          <EmptyState icon={BarChart3} title="Nenhum custo interno lançado" body='Registre saídas na página Lançamentos com o centro de custo "Administrativo / Custos internos" para vê-las aqui.' />
        </div>
      ) : (
        <>
          <section className="gf-card">
            <div className="gf-card-head"><h2>Custos internos por mês</h2></div>
            <div className="gf-chart-box">
              <ResponsiveContainer width="100%" height={260}>
                <BarChart data={porMes} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
                  <CartesianGrid stroke="var(--gf-border)" vertical={false} />
                  <XAxis dataKey="mesLabel" tick={{ fontSize: 11, fill: "var(--gf-muted)" }} axisLine={{ stroke: "var(--gf-border)" }} tickLine={false} />
                  <YAxis tick={{ fontSize: 11, fill: "var(--gf-muted)" }} axisLine={false} tickLine={false} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} width={44} />
                  <Tooltip formatter={(v) => BRL(v)} contentStyle={{ fontFamily: "var(--gf-font-mono)", fontSize: 12, borderRadius: 8, border: "1px solid var(--gf-border)" }} />
                  <Bar dataKey="total" name="Custos internos" fill="var(--gf-danger)" radius={[4, 4, 0, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </section>

          <section className="gf-card">
            <div className="gf-card-head"><h2>Distribuição por apropriação</h2></div>
            <div className="gf-chart-box gf-chart-box-pie">
              <ResponsiveContainer width="100%" height={260}>
                <PieChart>
                  <Pie data={porApropriacao} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={90} label={(d) => d.name}>
                    {porApropriacao.map((_, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                  </Pie>
                  <Tooltip formatter={(v) => BRL(v)} contentStyle={{ fontFamily: "var(--gf-font-mono)", fontSize: 12, borderRadius: 8, border: "1px solid var(--gf-border)" }} />
                </PieChart>
              </ResponsiveContainer>
            </div>
          </section>

          <section className="gf-card">
            <div className="gf-card-head"><h2>Lançamentos de custos internos</h2></div>
            <div className="gf-table-wrap">
              <table className="gf-table gf-table-ledger">
                <thead><tr><th>Data</th><th>Conta</th><th>Apropriação</th><th>Fornecedor</th><th>Descrição</th><th className="num">Valor</th></tr></thead>
                <tbody>
                  {filtered.map((e) => (
                    <tr key={e.id} className="row-neg">
                      <td>{fmtDate(e.data)}</td>
                      <td>{accountName(e.contaId)}</td>
                      <td>{e.apropriacao}</td>
                      <td>{e.fornecedor || "—"}</td>
                      <td className="gf-td-desc" title={e.descricao}>{e.descricao || "—"}</td>
                      <td className="num mono neg">{BRL(e.valor)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </>
      )}

      <p className="gf-field-hint">
        Pró-labore dos sócios é controlado separadamente na página Sócios e não entra nestes totais.
      </p>
    </div>
  );
}

/* ---------------------------------------------------------------
   Página: Aprovação de Lançamentos
--------------------------------------------------------------- */

const ORIGEM_LABEL = { lancamentos: "Lançamentos", contaspagar: "Contas a Pagar", socios: "Sócios" };
const ORIGEM_TONE = { lancamentos: "blue", contaspagar: "orange", socios: "green" };

function AprovacaoLancamentosPage({ entries, setEntries, contasPagar, setContasPagar, movimentosSocios, setMovimentosSocios, accounts, obras, apropriacoes, socios, contasInvestidores, fornecedorOptions, currentUser, logAudit }) {
  const [filtroOrigem, setFiltroOrigem] = useState("");
  const [filtroDe, setFiltroDe] = useState("");
  const [filtroAte, setFiltroAte] = useState("");
  const [editingItem, setEditingItem] = useState(null);

  const obraName = (id) => (id === SEM_OBRA ? "Administrativo / Custos internos" : obras.find((o) => o.id === id)?.nome || "—");
  const accountName = (id) => accounts.find((a) => a.id === id)?.nome || "—";
  const investidorName = (id) => (contasInvestidores || []).find((c) => c.id === id)?.nome || "Conta Investidor";
  const socioName = (id) => socios.find((s) => s.id === id)?.nome || "—";

  const pendentes = useMemo(() => {
    const doLancamentos = entries.filter((e) => statusAprovacao(e) === "pendente").map((e) => ({
      origem: "lancamentos", id: e.id, data: e.data,
      centroCusto: obraName(e.obraId),
      contaBancaria: e.origemTipo === "CONTA_INVESTIDOR" ? `${investidorName(e.contaInvestidorId)} — Investidor` : accountName(e.contaId),
      fornecedor: e.fornecedor || "—", descricao: e.descricao || "—",
      valor: e.valor, tipo: e.tipo, criadoPor: e.criadoPor || "—", criadoEm: e.criadoEm, raw: e,
    }));
    const doContasPagar = contasPagar.filter((c) => statusAprovacao(c) === "pendente").map((c) => ({
      origem: "contaspagar", id: c.id, data: c.dataVencimento,
      centroCusto: c.rateio && c.rateio.length > 1 ? `Rateado (${c.rateio.length})` : obraName(c.rateio?.[0]?.centroCusto ?? c.centroCusto),
      contaBancaria: "—", fornecedor: c.fornecedor || "—", descricao: c.descricao || "—",
      valor: c.valorPrevisto, tipo: "saida", criadoPor: c.criadoPor || "—", criadoEm: c.criadoEm, raw: c,
    }));
    const doSocios = movimentosSocios.filter((m) => statusAprovacao(m) === "pendente").map((m) => ({
      origem: "socios", id: m.id, data: m.data, centroCusto: "—", contaBancaria: accountName(m.contaId),
      fornecedor: socioName(m.socioId),
      descricao: m.descricao || (m.tipo === "aporte" ? "Aporte" : m.tipo === "pro-labore" ? "Pró-labore" : "Retirada"),
      valor: m.valor, tipo: m.tipo === "aporte" ? "entrada" : "saida", criadoPor: m.criadoPor || "—", criadoEm: m.criadoEm, raw: m,
    }));
    return [...doLancamentos, ...doContasPagar, ...doSocios].sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  }, [entries, contasPagar, movimentosSocios, obras, accounts, socios, contasInvestidores]);

  const filtrados = pendentes
    .filter((p) => (filtroOrigem ? p.origem === filtroOrigem : true))
    .filter((p) => (filtroDe ? p.data >= filtroDe : true))
    .filter((p) => (filtroAte ? p.data <= filtroAte : true));

  const totalPendente = filtrados.reduce((s, p) => s + p.valor, 0);

  const aprovar = (item) => {
    if (!can(currentUser, "lancamentos_aprovar")) return;
    const now = Date.now();
    const patch = { status: "aprovado", aprovadoPor: currentUser.nome, aprovadoEm: now };
    if (item.origem === "lancamentos") setEntries((prev) => prev.map((e) => (e.id === item.id ? { ...e, ...patch } : e)));
    if (item.origem === "contaspagar") setContasPagar((prev) => prev.map((c) => (c.id === item.id ? { ...c, ...patch } : c)));
    if (item.origem === "socios") setMovimentosSocios((prev) => prev.map((m) => (m.id === item.id ? { ...m, ...patch } : m)));
    logAudit?.({
      tipoOperacao: `Aprovação de lançamento (${ORIGEM_LABEL[item.origem]})`, registroAlterado: item.descricao,
      valorAnterior: "Pendente", valorNovo: `Aprovado por ${currentUser.nome}`,
    });
  };

  const salvarEdicao = (item, patch, aprovarTambem) => {
    const carimbo = carimbarEdicao(currentUser);
    const statusPatch = aprovarTambem ? { status: "aprovado", aprovadoPor: currentUser.nome, aprovadoEm: Date.now() } : {};
    if (item.origem === "lancamentos") setEntries((prev) => prev.map((e) => (e.id === item.id ? { ...e, ...patch, ...carimbo, ...statusPatch } : e)));
    if (item.origem === "contaspagar") setContasPagar((prev) => prev.map((c) => (c.id === item.id ? { ...c, ...patch, ...carimbo, ...statusPatch } : c)));
    if (item.origem === "socios") setMovimentosSocios((prev) => prev.map((m) => (m.id === item.id ? { ...m, ...patch, ...carimbo, ...statusPatch } : m)));
    logAudit?.({
      tipoOperacao: aprovarTambem ? `Edição e aprovação (${ORIGEM_LABEL[item.origem]})` : `Edição de lançamento pendente (${ORIGEM_LABEL[item.origem]})`,
      registroAlterado: patch.descricao || item.descricao,
      valorAnterior: BRL(item.valor), valorNovo: BRL(patch.valor ?? patch.valorPrevisto ?? item.valor),
    });
    setEditingItem(null);
  };

  return (
    <div className="gf-stack">
      <div className="gf-toolbar"><h2>Aprovação de lançamentos</h2></div>

      <div className="gf-tiles" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
        <div className="gf-tile tone-yellow">
          <span className="gf-tile-label">Lançamentos pendentes</span>
          <span className="gf-tile-value">{filtrados.length}</span>
        </div>
        <div className="gf-tile tone-yellow">
          <span className="gf-tile-label">Valor total pendente</span>
          <span className="gf-tile-value">{BRL(totalPendente)}</span>
        </div>
        <div className="gf-tile">
          <span className="gf-tile-label">Aprovadores</span>
          <span className="gf-tile-value" style={{ fontSize: 14 }}>{socios.map((s) => s.nome).join(" · ") || "—"}</span>
        </div>
      </div>

      <section className="gf-card">
        <div className="gf-card-head"><h2>Filtros</h2></div>
        <div className="gf-filters-grid" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
          <select value={filtroOrigem} onChange={(e) => setFiltroOrigem(e.target.value)}>
            <option value="">Origem (todas)</option>
            <option value="lancamentos">Lançamentos</option>
            <option value="contaspagar">Contas a Pagar</option>
            <option value="socios">Sócios</option>
          </select>
          <input type="date" title="De" value={filtroDe} onChange={(e) => setFiltroDe(e.target.value)} />
          <input type="date" title="Até" value={filtroAte} onChange={(e) => setFiltroAte(e.target.value)} />
        </div>
      </section>

      <section className="gf-card">
        <div className="gf-card-head"><h2>Pendentes de aprovação</h2></div>
        {filtrados.length === 0 ? (
          <EmptyState icon={ClipboardCheck} title="Nada pendente" body="Todos os lançamentos, contas a pagar e movimentos de sócios criados por outros usuários já foram aprovados." />
        ) : (
          <div className="gf-table-wrap">
            <table className="gf-table gf-table-ledger">
              <thead>
                <tr>
                  <th>Origem</th><th>Data</th><th>Centro de custo</th><th>Conta bancária</th><th>Fornecedor/beneficiário</th>
                  <th>Descrição</th><th className="num">Valor</th><th>Criado por</th><th>Criado em</th><th></th>
                </tr>
              </thead>
              <tbody>
                {filtrados.map((p) => (
                  <tr key={`${p.origem}-${p.id}`} className={p.tipo === "entrada" ? "row-pos" : "row-neg"}>
                    <td><Badge tone={ORIGEM_TONE[p.origem]}>{ORIGEM_LABEL[p.origem]}</Badge></td>
                    <td>{fmtDate(p.data)}</td>
                    <td>{p.centroCusto}</td>
                    <td>{p.contaBancaria}</td>
                    <td>{p.fornecedor}</td>
                    <td className="gf-td-desc" title={p.descricao}>{p.descricao}</td>
                    <td className={`num mono ${p.tipo === "entrada" ? "pos" : "neg"}`}>{BRL(p.valor)}</td>
                    <td>{p.criadoPor}</td>
                    <td className="mono">{p.criadoEm ? nowStampFromTs(p.criadoEm) : "—"}</td>
                    <td>
                      <div className="gf-row-actions">
                        <button className="gf-icon-btn" title="Aprovar" onClick={() => aprovar(p)}><Check size={14} /></button>
                        <button className="gf-icon-btn" title="Editar" onClick={() => setEditingItem(p)}><Pencil size={14} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <p className="gf-field-hint" style={{ marginTop: 10 }}>
          Um lançamento é considerado aprovado assim que <b>um</b> dos sócios o aprova — não é necessário que os dois aprovem.
          A aprovação é só controle interno: o valor já impacta o saldo bancário desde a criação do lançamento, aprovado ou não.
        </p>
      </section>

      {editingItem && (
        <AprovacaoEditModal
          item={editingItem} obras={obras} apropriacoes={apropriacoes} fornecedorOptions={fornecedorOptions}
          onClose={() => setEditingItem(null)} onSave={salvarEdicao}
        />
      )}
    </div>
  );
}

function AprovacaoEditModal({ item, obras, apropriacoes, fornecedorOptions, onClose, onSave }) {
  const raw = item.raw;
  const isLan = item.origem === "lancamentos";
  const isCP = item.origem === "contaspagar";

  const [valor, setValor] = useState(String(isCP ? raw.valorPrevisto : raw.valor));
  const [data, setData] = useState(isCP ? raw.dataVencimento : raw.data);
  const [descricao, setDescricao] = useState(raw.descricao || "");
  const [fornecedor, setFornecedor] = useState(raw.fornecedor || "");
  const [apropriacao, setApropriacao] = useState(raw.apropriacao || (apropriacoes[0] || ""));
  const [obraId, setObraId] = useState(isLan ? raw.obraId : SEM_OBRA);

  const centroCustoOptions = [{ value: SEM_OBRA, label: "Administrativo / Custos internos" }, ...obras.filter((o) => !o.arquivada).map((o) => ({ value: o.id, label: o.nome }))];
  const centroCustoOptionsArquivadas = obras.filter((o) => o.arquivada).map((o) => ({ value: o.id, label: o.nome }));
  const fornecedorSelectOptions = [{ value: "Não se aplica", label: "Não se aplica" }, ...fornecedorOptions.map((f) => ({ value: f, label: f }))];

  const montarPatch = () => {
    const patch = { descricao };
    if (isCP) {
      patch.valorPrevisto = Number(valor) || 0; patch.dataVencimento = data;
      patch.fornecedor = fornecedor; patch.apropriacao = apropriacao;
    } else {
      patch.valor = Number(valor) || 0; patch.data = data; patch.fornecedor = fornecedor;
      if (isLan) { patch.apropriacao = apropriacao; patch.obraId = obraId; }
    }
    return patch;
  };

  const submit = (e, aprovarTambem) => {
    e.preventDefault();
    if (!valor || Number(valor) <= 0 || !data) return;
    onSave(item, montarPatch(), aprovarTambem);
  };

  return (
    <Modal title={`Editar — ${ORIGEM_LABEL[item.origem]}`} onClose={onClose} width={640}>
      <form onSubmit={(e) => submit(e, false)} className="gf-form-grid gf-modal-form">
        <div className="gf-span-2 gf-hint">
          Criado por <b>{item.criadoPor}</b> em {item.criadoEm ? nowStampFromTs(item.criadoEm) : "—"}. Revise os dados antes de aprovar.
        </div>
        <Field label={isCP ? "Valor previsto (R$)" : "Valor (R$)"}>
          <input type="number" min="0.01" step="0.01" required value={valor} onChange={(e) => setValor(e.target.value)} />
        </Field>
        <Field label={isCP ? "Data de vencimento" : "Data"}>
          <input type="date" required value={data} onChange={(e) => setData(e.target.value)} />
        </Field>
        {(isLan || isCP) && (
          <Field label="Fornecedor">
            <SearchableSelect value={fornecedor} onChange={setFornecedor} options={fornecedorSelectOptions} placeholder="Buscar fornecedor…" />
          </Field>
        )}
        {(isLan || isCP) && (
          <Field label="Apropriação">
            <select value={apropriacao} onChange={(e) => setApropriacao(e.target.value)}>
              {apropriacoes.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
        )}
        {isLan && (
          <Field label="Centro de custo" className="gf-span-2">
            <SearchableSelect value={obraId} onChange={setObraId} options={centroCustoOptions} extraOptions={centroCustoOptionsArquivadas} placeholder="Selecione o centro de custo…" />
          </Field>
        )}
        <Field label="Descrição" className="gf-span-2">
          <input value={descricao} onChange={(e) => setDescricao(e.target.value)} />
        </Field>

        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-ghost">Salvar (manter pendente)</button>
          <button type="button" className="gf-btn gf-btn-primary" onClick={(e) => submit(e, true)}>Salvar e aprovar</button>
        </div>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   Página: Faturamento Direto
   Gastos pagos direto pelo cliente ao fornecedor (não passam pelas contas da empresa).
   Cada registro gera um PAR de lançamentos na conta "Fat Direto" — uma entrada (receita da obra
   faturada) e uma saída (gasto, da mesma obra ou de outra) — de mesmo valor, de modo que o saldo
   da conta é sempre R$ 0,00. Os dois lados contam no resultado das obras.
--------------------------------------------------------------- */

// Anexos do faturamento direto (nota fiscal / boleto). Os arquivos ficam em chaves próprias do
// armazenamento compartilhado (não no bloco principal); no lançamento fica só a lista (nome, tipo, tamanho).
const FD_ANEXO_TIPOS = ["Nota fiscal", "Boleto", "Outro"];
const FD_ANEXO_MAX_CHARS = 4_200_000; // ~3,1 MB de arquivo (limite de valor do armazenamento é 5 MB)
const fdChaveAnexo = (fdId, anexoId) => `glover:fd:anexo:${fdId}:${anexoId}`;
const fdAdivinharTipo = (nome) => (/boleto/i.test(nome) ? "Boleto" : /(^|[^a-z])(nf|nfe|nfs|nota)/i.test(nome) ? "Nota fiscal" : "Nota fiscal");
const fdLerArquivo = (file) => new Promise((resolve, reject) => {
  const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error("Falha ao ler o arquivo.")); r.readAsDataURL(file);
});

function FdAnexosField({ anexos, onChange }) {
  const inputRef = useRef(null);
  const [carregando, setCarregando] = useState(false);
  const [aviso, setAviso] = useState("");
  const adicionar = async (files) => {
    if (!files || !files.length) return;
    setCarregando(true); setAviso("");
    const novos = [], recusados = [];
    for (const f of Array.from(files)) {
      try {
        let dataUri, tipo = f.type, tamanho = f.size;
        if (/^image\//.test(f.type)) { const r = await relProcessarFoto(f); dataUri = r.dataUri; tipo = "image/jpeg"; tamanho = Math.round(dataUri.length * 0.75); }
        else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) { dataUri = await fdLerArquivo(f); tipo = "application/pdf"; }
        else { recusados.push(`${f.name} (formato não aceito — use PDF, JPG ou PNG)`); continue; }
        if (dataUri.length > FD_ANEXO_MAX_CHARS) { recusados.push(`${f.name} (maior que 3 MB — compacte o arquivo)`); continue; }
        novos.push({ id: uid("anx"), nome: f.name, tipo, tamanho, tipoDoc: fdAdivinharTipo(f.name), dataUri });
      } catch (e) { recusados.push(`${f.name} (não foi possível ler)`); }
    }
    if (novos.length) onChange([...(anexos || []), ...novos]);
    if (recusados.length) setAviso("Não anexado: " + recusados.join("; "));
    setCarregando(false);
  };
  return (
    <div>
      <input ref={inputRef} type="file" multiple accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf"
        style={{ display: "none" }} onChange={(e) => { adicionar(e.target.files); e.target.value = ""; }} />
      <button type="button" className="gf-btn gf-btn-ghost" onClick={() => inputRef.current?.click()} disabled={carregando}>
        <Paperclip size={14} /> {carregando ? "Carregando…" : "Anexar nota fiscal / boleto (PDF, JPG, PNG)"}
      </button>
      {aviso && <p className="gf-warn" style={{ marginTop: 6 }}>{aviso}</p>}
      {(anexos || []).length > 0 && (
        <div className="gf-anexos-list">
          {anexos.map((a) => (
            <div className="gf-anexo-item" key={a.id}>
              <Paperclip size={12} /> <span>{a.nome}</span> <span className="gf-muted">({((a.tamanho || 0) / 1024).toFixed(0)} KB)</span>
              <select value={a.tipoDoc || "Outro"} onChange={(e) => onChange(anexos.map((x) => (x.id === a.id ? { ...x, tipoDoc: e.target.value } : x)))} style={{ marginLeft: 8 }}>
                {FD_ANEXO_TIPOS.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
              <button type="button" className="gf-icon-btn" title="Remover" onClick={() => onChange(anexos.filter((x) => x.id !== a.id))}><X size={12} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FdAnexosModal({ registro, onClose }) {
  const lista = registro.saida.anexos || [];
  const [baixando, setBaixando] = useState("");
  const [erro, setErro] = useState("");
  const baixar = async (a) => {
    setBaixando(a.id); setErro("");
    try {
      const t = await relLerTexto(fdChaveAnexo(registro.id, a.id));
      if (!t) throw new Error("Arquivo não encontrado no armazenamento.");
      const l = document.createElement("a"); l.href = t; l.download = a.nome; document.body.appendChild(l); l.click(); l.remove();
    } catch (e) { setErro((e && e.message) || "Não foi possível baixar o arquivo."); }
    setBaixando("");
  };
  return (
    <Modal title={`Anexos — ${registro.saida.fornecedor}`} onClose={onClose} width={520}>
      {lista.length === 0 ? <EmptyState icon={Paperclip} title="Sem anexos" body="Nenhum arquivo anexado a este lançamento." /> : (
        <div className="gf-anexos-list">
          {lista.map((a) => (
            <button type="button" key={a.id} className="gf-anexo-item" onClick={() => baixar(a)} disabled={baixando === a.id} style={{ width: "100%", textAlign: "left", cursor: "pointer" }}>
              <Paperclip size={13} /> <span>{a.nome}</span> <Badge tone={a.tipoDoc === "Boleto" ? "orange" : "blue"}>{a.tipoDoc || "Arquivo"}</Badge>
              <span className="gf-muted">({((a.tamanho || 0) / 1024).toFixed(0)} KB)</span>
              <Download size={13} /> {baixando === a.id && <span className="gf-muted">baixando…</span>}
            </button>
          ))}
        </div>
      )}
      {erro && <p className="gf-warn" style={{ marginTop: 8 }}>{erro}</p>}
    </Modal>
  );
}

function FaturamentoDiretoPage({ accounts, setAccounts, accountStats, obras, obrasTodas, entries, setEntries, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, currentUser, logAudit }) {
  const conta = accounts.find(isFatDiretoAccount);
  const podeGerenciar = can(currentUser, "fatdireto_gerenciar");
  const idsEscopo = useMemo(() => new Set(obras.map((o) => o.id)), [obras]);
  const todasObras = obrasTodas || obras;
  const nomeObra = (id) => todasObras.find((o) => o.id === id)?.nome || "—";
  const blank = { id: null, data: todayISO(), valor: "", obraEntradaId: "", mesmaObra: true, obraSaidaId: "", fornecedor: "", apropriacao: "", descricao: "", anexos: [] };
  const [form, setForm] = useState(blank);
  const [salvando, setSalvando] = useState(false);
  const [verAnexos, setVerAnexos] = useState(null);
  const [erros, setErros] = useState({});
  const [excecoes, setExcecoes] = useState([]);
  const [filtros, setFiltros] = useState({ q: "", obraId: "", de: "", ate: "" });

  // A conta "Fat Direto" é criada automaticamente (saldo inicial 0) se ainda não existir.
  useEffect(() => {
    if (conta) return;
    setAccounts((prev) => (prev.some(isFatDiretoAccount) ? prev : [...prev, {
      id: FAT_DIRETO_ID, banco: "Faturamento direto", nome: FAT_DIRETO_NOME, agencia: "—", numero: "—",
      saldoInicial: 0, dataSaldoInicial: todayISO(), status: "Ativa",
    }]));
    logAudit?.({ tipoOperacao: "Cadastro de conta bancária", registroAlterado: FAT_DIRETO_NOME, valorAnterior: "—", valorNovo: BRL(0) });
  }, [!!conta]);

  const upd = (p) => { setForm((f) => ({ ...f, ...p })); setErros((e) => { const n = { ...e }; Object.keys(p).forEach((k) => delete n[k]); return n; }); };
  const obraSaidaEfetiva = form.mesmaObra ? form.obraEntradaId : form.obraSaidaId;

  // Pares (entrada + saída) agrupados por fdId
  const registros = useMemo(() => {
    const m = new Map();
    entries.filter((e) => e.fatDireto && e.fdId).forEach((e) => {
      const r = m.get(e.fdId) || { id: e.fdId };
      if (e.tipo === "entrada") r.entrada = e; else r.saida = e;
      m.set(e.fdId, r);
    });
    return [...m.values()].filter((r) => r.entrada && r.saida)
      .sort((a, b) => (a.saida.data < b.saida.data ? 1 : a.saida.data > b.saida.data ? -1 : (b.saida.createdAt || 0) - (a.saida.createdAt || 0)));
  }, [entries]);
  const visiveis = registros.filter((r) => idsEscopo.has(r.entrada.obraId) || idsEscopo.has(r.saida.obraId));
  const filtrados = visiveis.filter((r) => {
    if (filtros.de && r.saida.data < filtros.de) return false;
    if (filtros.ate && r.saida.data > filtros.ate) return false;
    if (filtros.obraId && r.entrada.obraId !== filtros.obraId && r.saida.obraId !== filtros.obraId) return false;
    if (filtros.q) {
      const q = relNorm(filtros.q);
      const txt = relNorm([r.saida.fornecedor, r.saida.apropriacao, r.saida.descricao, nomeObra(r.entrada.obraId), nomeObra(r.saida.obraId)].join(" "));
      if (!txt.includes(q)) return false;
    }
    return true;
  });
  const orfaos = conta ? entries.filter((e) => e.contaId === conta.id && !e.fatDireto) : [];
  const saldo = conta ? (accountStats?.[conta.id]?.saldoAtual ?? 0) : 0;
  const saldoZero = Math.abs(saldo) < 0.005;
  const totalFiltrado = filtrados.reduce((s, r) => s + (Number(r.saida.valor) || 0), 0);

  const resumoObras = obras.filter((o) => !o.arquivada || registros.some((r) => r.entrada.obraId === o.id || r.saida.obraId === o.id)).map((o) => {
    let fat = 0, gasto = 0;
    registros.forEach((r) => { if (r.entrada.obraId === o.id) fat += Number(r.entrada.valor) || 0; if (r.saida.obraId === o.id) gasto += Number(r.saida.valor) || 0; });
    return { obra: o, fat, gasto };
  }).filter((x) => x.fat || x.gasto);

  const obraOptions = obras.filter((o) => !o.arquivada).map((o) => ({ value: o.id, label: o.nome }));
  const obraOptionsArq = obras.filter((o) => o.arquivada).map((o) => ({ value: o.id, label: o.nome }));
  const saidaOptions = todasObras.filter((o) => !o.arquivada).map((o) => ({ value: o.id, label: o.nome }));
  const saidaOptionsArq = todasObras.filter((o) => o.arquivada).map((o) => ({ value: o.id, label: o.nome }));
  const fornecedorSelectOptions = fornecedorOptions.map((f) => ({ value: f, label: f }));

  const limpar = () => { setForm({ ...blank, data: form.data }); setErros({}); setExcecoes([]); };

  const submit = async (e) => {
    e.preventDefault();
    if (!podeGerenciar || !conta || salvando) return;
    const er = {};
    if (!form.data) er.data = true;
    if (!form.valor || Number(form.valor) <= 0) er.valor = true;
    if (!form.obraEntradaId) er.obraEntradaId = true;
    if (!obraSaidaEfetiva) er.obraSaidaId = true;
    if (!form.fornecedor || !form.fornecedor.trim()) er.fornecedor = true;
    if (!form.apropriacao) er.apropriacao = true;
    if (Object.keys(er).length) { setErros(er); return; }
    const valor = Math.round(Number(form.valor) * 100) / 100;
    const editando = !!form.id;
    const atual = editando ? registros.find((r) => r.id === form.id) : null;
    const fdId = editando ? form.id : uid("fd");
    // Anexos: grava primeiro os arquivos novos; se algum falhar, nada é lançado.
    setSalvando(true);
    const anexosMeta = (form.anexos || []).map(({ dataUri, ...m }) => m);
    try {
      for (const a of (form.anexos || []).filter((x) => x.dataUri)) await relGravarTexto(fdChaveAnexo(fdId, a.id), a.dataUri);
    } catch (err) {
      setSalvando(false);
      window.alert("Não foi possível salvar os anexos: " + ((err && err.message) || err) + "\nNada foi lançado. Tente novamente.");
      return;
    }
    for (const a of (atual?.saida.anexos || []).filter((x) => !anexosMeta.some((m) => m.id === x.id))) {
      try { await relGravarTexto(fdChaveAnexo(fdId, a.id), ""); } catch (err2) { /* melhor esforço */ }
    }
    const obraE = todasObras.find((o) => o.id === form.obraEntradaId);
    const comum = { contaId: conta.id, origemTipo: "CONTA_EMPRESA", contaInvestidorId: null, data: form.data, valor, fatDireto: true, fdId };
    const carimbo = (orig) => (editando ? { createdAt: orig?.createdAt || Date.now(), ...(orig?.status ? { status: orig.status, criadoPor: orig.criadoPor, criadoEm: orig.criadoEm, aprovadoPor: orig.aprovadoPor, aprovadoEm: orig.aprovadoEm } : {}), ...carimbarEdicao(currentUser) } : { createdAt: Date.now(), ...carimbarCriacao(currentUser) });
    const entrada = {
      ...comum, id: editando ? atual.entrada.id : uid("lan"), tipo: "entrada", obraId: form.obraEntradaId,
      fornecedor: (obraE && obraE.cliente) || "Faturamento direto", apropriacao: "",
      descricao: `Faturamento direto — ${form.fornecedor.trim()}${form.descricao.trim() ? " — " + form.descricao.trim() : ""}`,
      ...carimbo(atual?.entrada),
    };
    const saida = {
      ...comum, id: editando ? atual.saida.id : uid("lan"), tipo: "saida", obraId: obraSaidaEfetiva,
      fornecedor: form.fornecedor.trim(), apropriacao: form.apropriacao, descricao: form.descricao.trim(),
      anexos: anexosMeta,
      ...carimbo(atual?.saida),
    };
    if (editando) setEntries((prev) => prev.map((x) => (x.id === entrada.id ? entrada : x.id === saida.id ? saida : x)));
    else setEntries((prev) => [...prev, entrada, saida]);
    logAudit?.({
      tipoOperacao: editando ? "Edição de Faturamento Direto" : "Lançamento de Faturamento Direto",
      registroAlterado: `${nomeObra(entrada.obraId)} → ${saida.fornecedor}${entrada.obraId !== saida.obraId ? ` (gasto: ${nomeObra(saida.obraId)})` : ""}`,
      valorAnterior: editando ? BRL(atual.saida.valor) : "—", valorNovo: BRL(valor),
    });
    setSalvando(false);
    limpar();
  };

  const editar = (r) => {
    setForm({
      id: r.id, data: r.saida.data, valor: String(r.saida.valor), obraEntradaId: r.entrada.obraId,
      mesmaObra: r.entrada.obraId === r.saida.obraId, obraSaidaId: r.saida.obraId,
      fornecedor: r.saida.fornecedor || "", apropriacao: r.saida.apropriacao || "", descricao: r.saida.descricao || "",
      anexos: (r.saida.anexos || []).map((a) => ({ ...a })),
    });
    setExcecoes(r.saida.apropriacao ? [r.saida.apropriacao] : []);
    setErros({});
    window.scrollTo?.({ top: 0, behavior: "smooth" });
  };
  const excluir = (r) => {
    if (!podeGerenciar) return;
    if (!window.confirm(`Excluir este faturamento direto de ${BRL(r.saida.valor)} (${r.saida.fornecedor})? Serão removidos a entrada e a saída correspondentes.`)) return;
    setEntries((prev) => prev.filter((x) => x.id !== r.entrada.id && x.id !== r.saida.id));
    (r.saida.anexos || []).forEach((a) => { relGravarTexto(fdChaveAnexo(r.id, a.id), "").catch(() => {}); });
    logAudit?.({ tipoOperacao: "Exclusão de Faturamento Direto", registroAlterado: `${nomeObra(r.entrada.obraId)} → ${r.saida.fornecedor}`, valorAnterior: BRL(r.saida.valor), valorNovo: "—" });
    if (form.id === r.id) limpar();
  };

  return (
    <div className="gf-stack">
      <section className="gf-card">
        <div className="gf-card-head">
          <h2>Faturamento Direto</h2>
          <div className="gf-summary-inline">
            <span>Saldo da conta “{FAT_DIRETO_NOME}” <b className={saldoZero ? "pos" : "neg"}>{BRL(saldo)}</b></span>
            <span>Registros <b>{visiveis.length}</b></span>
          </div>
        </div>
        <p className="gf-field-hint">
          Gastos pagos diretamente pelo cliente ao fornecedor: não passam pelas contas da empresa, mas são descontados do contrato e entram no resultado da obra.
          Cada registro lança automaticamente uma <b>entrada</b> (obra faturada) e uma <b>saída</b> (gasto) de mesmo valor na conta “{FAT_DIRETO_NOME}”, por isso o saldo permanece sempre em R$ 0,00.
        </p>
        {!saldoZero && <div className="gf-warn">O saldo da conta {FAT_DIRETO_NOME} deveria ser R$ 0,00. Há lançamentos avulsos nessa conta fora desta página; confira a lista abaixo.</div>}
        {orfaos.length > 0 && (
          <div className="gf-warn" style={{ marginTop: 8 }}>
            Existem {orfaos.length} lançamento(s) avulso(s) na conta {FAT_DIRETO_NOME} feitos fora desta página (aba Lançamentos). Exclua-os lá e refaça-os aqui para que o saldo volte a R$ 0,00:{" "}
            {orfaos.slice(0, 5).map((e) => `${fmtDate(e.data)} ${e.tipo === "entrada" ? "+" : "−"}${BRL(e.valor)}`).join("; ")}{orfaos.length > 5 ? "…" : ""}
          </div>
        )}
      </section>

      {!podeGerenciar ? (
        <section className="gf-card"><EmptyState icon={Lock} title="Somente consulta" body="Seu usuário não tem permissão para lançar faturamento direto." /></section>
      ) : (
        <section className="gf-card gf-entry-card">
          <div className="gf-card-head">
            <h2>{form.id ? "Editar faturamento direto" : "Novo faturamento direto"}</h2>
            {form.id && <button className="gf-btn gf-btn-ghost" onClick={limpar}>Cancelar edição</button>}
          </div>
          <form onSubmit={submit} className="gf-entry-form">
            <div className="gf-form-grid">
              <Field label="Obra faturada (entrada)" hint="Obra cujo contrato foi descontado pelo pagamento direto">
                <SearchableSelect value={form.obraEntradaId} onChange={(v) => {
                  const efetiva = form.mesmaObra ? v : form.obraSaidaId;
                  const disp = computeApropriacoesDisponiveis(efetiva, form.fornecedor, apropriacoes, orcamentoItens, fornecedoresCadastro);
                  upd({ obraEntradaId: v, apropriacao: form.apropriacao && [...disp, ...excecoes].includes(form.apropriacao) ? form.apropriacao : "" });
                }} options={obraOptions} extraOptions={obraOptionsArq} placeholder="Selecione a obra…" error={!!erros.obraEntradaId} />
              </Field>
              <Field label="Obra do gasto (saída)">
                <label className="gf-checkbox" style={{ marginBottom: 6 }}>
                  <input type="checkbox" checked={form.mesmaObra} onChange={(e) => upd({ mesmaObra: e.target.checked, apropriacao: "" })} />
                  <span>Mesma obra da entrada</span>
                </label>
                {!form.mesmaObra && (
                  <SearchableSelect value={form.obraSaidaId} onChange={(v) => {
                    const disp = computeApropriacoesDisponiveis(v, form.fornecedor, apropriacoes, orcamentoItens, fornecedoresCadastro);
                    upd({ obraSaidaId: v, apropriacao: form.apropriacao && [...disp, ...excecoes].includes(form.apropriacao) ? form.apropriacao : "" });
                  }} options={saidaOptions} extraOptions={saidaOptionsArq} placeholder="Selecione a obra do gasto…" error={!!erros.obraSaidaId} />
                )}
              </Field>
              <Field label="Data">
                <input type="date" required className={erros.data ? "gf-input-error" : ""} value={form.data} onChange={(e) => upd({ data: e.target.value })} />
              </Field>
              <Field label="Valor (R$)">
                <input type="number" min="0.01" step="0.01" required className={erros.valor ? "gf-input-error" : ""} value={form.valor} onChange={(e) => upd({ valor: e.target.value })} />
              </Field>
              <Field label="Fornecedor" hint="Fornecedor que recebeu direto do cliente">
                <SearchableSelect value={form.fornecedor} onChange={(v) => {
                  const disp = computeApropriacoesDisponiveis(obraSaidaEfetiva, v, apropriacoes, orcamentoItens, fornecedoresCadastro);
                  upd({ fornecedor: v, apropriacao: form.apropriacao && [...disp, ...excecoes].includes(form.apropriacao) ? form.apropriacao : "" });
