function LancamentosPage({ accounts, obras, apropriacoes, setApropriacoes, entries, setEntries, supplierNames, fornecedorOptions, orcamentoItens, fornecedoresCadastro, dividas, setDividas, investimentos, setInvestimentos, contasInvestidores, currentUser, logAudit }) {
  const blankForm = {
    id: null, tipo: "saida", origemTipo: "CONTA_EMPRESA",
    contaId: accounts.find((a) => a.status === "Ativa" && !isFatDiretoAccount(a))?.id || "",
    contaInvestidorId: (contasInvestidores || []).find((c) => c.status === "Ativa")?.id || "",
    obraId: SEM_OBRA, data: todayISO(), valor: "", fornecedor: "", apropriacao: apropriacoes[0] || "", descricao: "",
    classificacao: "",
    divInstituicao: "", divTipoOperacao: TIPOS_DIVIDA[0], divTaxaJuros: "", divSistemaAmortizacao: SISTEMAS_AMORTIZACAO[0],
    divQtdParcelas: "", divValorParcela: "", divProximoVencimento: "",
    dividaSelecionada: "", divAmortizacao: "", divJuros: "", divEncargos: "",
    invModo: "nova", investimentoSelecionado: "",
    invInstituicao: "", invTipoInvestimento: TIPOS_INVESTIMENTO[0], invDataVencimento: "", invLiquidez: LIQUIDEZ_OPCOES[0],
    invModoEntrada: "resgate",
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [editingClassificacao, setEditingClassificacao] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [fieldErrors, setFieldErrors] = useState({});
  const [apropriacaoExcecoes, setApropriacaoExcecoes] = useState([]);
  const valorRef = useRef(null);
  const podeCriar = can(currentUser, "lancamentos_criar");
  const podeEditar = can(currentUser, "lancamentos_editar");
  const podeExcluir = can(currentUser, "lancamentos_excluir");

  const [filters, setFilters] = useState({
    q: "", de: "", ate: "", obraId: "", contaId: "", fornecedor: "", apropriacao: "", tipo: "",
  });

  const activeAccounts = accounts.filter((a) => a.status === "Ativa" && !isFatDiretoAccount(a));
  const activeContasInvestidoras = (contasInvestidores || []).filter((c) => c.status === "Ativa");

  const updateForm = (patch) => {
    setForm((f) => ({ ...f, ...patch }));
    setFieldErrors((prev) => {
      const next = { ...prev };
      Object.keys(patch).forEach((k) => delete next[k]);
      return next;
    });
  };

  const submit = (e) => {
    e.preventDefault();

    // Validação de campos obrigatórios. Para lançamentos de gasto (saída), exige também
    // Centro de custo, Fornecedor e Apropriação, além de Conta bancária, Data e Valor.
    const errors = {};
    if (form.origemTipo === "CONTA_INVESTIDOR") {
      if (!form.contaInvestidorId) errors.contaInvestidorId = true;
    } else {
      if (!form.contaId) errors.contaId = true;
    }
    if (!form.data) errors.data = true;
    if (!form.valor || Number(form.valor) <= 0) errors.valor = true;
    if (form.tipo === "saida") {
      if (!form.obraId) errors.obraId = true;
      if (!form.fornecedor || !form.fornecedor.trim()) errors.fornecedor = true;
      if (!form.apropriacao) errors.apropriacao = true;
    }
    if (Object.keys(errors).length > 0) {
      setFieldErrors(errors);
      return;
    }
    setFieldErrors({});

    if (editingId && !can(currentUser, "lancamentos_editar")) return;
    if (!editingId && !can(currentUser, "lancamentos_criar")) return;

    // Validações da classificação especial (apenas em novos lançamentos)
    let extra = {};
    if (!editingId && form.classificacao === "divida") {
      if (form.tipo === "entrada") {
        if (!form.divInstituicao.trim() || !form.divQtdParcelas) return;
      } else {
        if (!form.dividaSelecionada) return;
        const soma = (Number(form.divAmortizacao) || 0) + (Number(form.divJuros) || 0) + (Number(form.divEncargos) || 0);
        if (Math.abs(soma - Number(form.valor)) > 0.01) return;
      }
    }
    if (!editingId && form.classificacao === "investimento") {
      if (form.tipo === "saida") {
        if (form.invModo === "nova" && !form.invInstituicao.trim()) return;
        if (form.invModo === "aporte" && !form.investimentoSelecionado) return;
      } else {
        if (!form.investimentoSelecionado) return;
      }
    }

    const payload = {
      id: editingId || uid("lan"),
      tipo: form.tipo,
      origemTipo: form.origemTipo === "CONTA_INVESTIDOR" ? "CONTA_INVESTIDOR" : "CONTA_EMPRESA",
      contaId: form.origemTipo === "CONTA_INVESTIDOR" ? null : form.contaId,
      contaInvestidorId: form.origemTipo === "CONTA_INVESTIDOR" ? form.contaInvestidorId : null,
      obraId: form.obraId || SEM_OBRA,
      data: form.data, valor: Number(form.valor), fornecedor: form.fornecedor.trim(),
      apropriacao: form.apropriacao, descricao: form.descricao.trim(),
      createdAt: editingId ? entries.find((e2) => e2.id === editingId)?.createdAt || Date.now() : Date.now(),
      ...(editingId ? carimbarEdicao(currentUser) : carimbarCriacao(currentUser)),
    };

    if (!editingId && form.classificacao === "divida") {
      if (form.tipo === "entrada") {
        const novaDividaId = uid("div");
        setDividas((prev) => [...prev, {
          id: novaDividaId, instituicao: form.divInstituicao.trim(), tipoOperacao: form.divTipoOperacao,
          dataContratacao: form.data, valorContratado: Number(form.valor), taxaJuros: form.divTaxaJuros,
          sistemaAmortizacao: form.divSistemaAmortizacao, qtdParcelas: Number(form.divQtdParcelas) || 0,
          valorParcelaEstimado: Number(form.divValorParcela) || 0, proximoVencimento: form.divProximoVencimento || "",
          obraId: form.obraId || SEM_OBRA, status: "Ativa", createdAt: Date.now(),
        }]);
        extra = { dividaId: novaDividaId, dividaSubtipo: "contratacao" };
        payload.fornecedor = payload.fornecedor || form.divInstituicao.trim();
      } else {
        extra = {
          dividaId: form.dividaSelecionada, dividaSubtipo: "pagamento",
          amortizacao: Number(form.divAmortizacao) || 0, juros: Number(form.divJuros) || 0, encargos: Number(form.divEncargos) || 0,
        };
      }
    }
    if (!editingId && form.classificacao === "investimento") {
      if (form.tipo === "saida") {
        if (form.invModo === "nova") {
          const novoInvId = uid("inv");
          setInvestimentos((prev) => [...prev, {
            id: novoInvId, instituicao: form.invInstituicao.trim(), tipoInvestimento: form.invTipoInvestimento,
            dataAplicacao: form.data, valorAplicado: Number(form.valor), dataVencimento: form.invDataVencimento || "",
            liquidez: form.invLiquidez, obraId: form.obraId || SEM_OBRA, status: "Ativo", createdAt: Date.now(),
          }]);
          extra = { investimentoId: novoInvId, investimentoSubtipo: "aplicacao" };
          payload.fornecedor = payload.fornecedor || form.invInstituicao.trim();
        } else {
          extra = { investimentoId: form.investimentoSelecionado, investimentoSubtipo: "aporte" };
        }
      } else {
        extra = { investimentoId: form.investimentoSelecionado, investimentoSubtipo: form.invModoEntrada };
      }
    }
    Object.assign(payload, extra);

    if (editingId) {
      const anterior = entries.find((e2) => e2.id === editingId);
      setEntries((prev) => prev.map((e2) => (e2.id === editingId ? { ...anterior, ...payload } : e2)));
      if (anterior && anterior.valor !== payload.valor) {
        logAudit?.({
          tipoOperacao: "Alteração de valor de lançamento", registroAlterado: payload.descricao || payload.fornecedor || "Lançamento",
          valorAnterior: BRL(anterior.valor), valorNovo: BRL(payload.valor), centroCusto: payload.obraId,
        });
      }
    } else {
      setEntries((prev) => [payload, ...prev]);
    }
    setEditingId(null); setEditingClassificacao(null); setFieldErrors({}); setApropriacaoExcecoes([]);
    setForm({ ...blankForm, contaId: form.contaId, obraId: form.obraId, tipo: form.tipo });
    setTimeout(() => valorRef.current?.focus(), 0);
  };

  const startEdit = (entry) => {
    if (!can(currentUser, "lancamentos_editar")) return;
    setEditingId(entry.id);
    setEditingClassificacao(entry.classificacao || (entry.dividaId ? "divida" : entry.investimentoId ? "investimento" : null));
    setFieldErrors({});
    // Se a apropriação já salva não estiver mais na lista padrão (regra nova, lançamento antigo),
    // trata como exceção automaticamente — não força o usuário a trocar o que já estava certo.
    const disponiveisAtuais = computeApropriacoesDisponiveis(entry.obraId, entry.fornecedor, apropriacoes, orcamentoItens, fornecedoresCadastro);
    setApropriacaoExcecoes(disponiveisAtuais.includes(entry.apropriacao) ? [] : [entry.apropriacao]);
    setForm({
      ...blankForm,
      id: entry.id, tipo: entry.tipo,
      origemTipo: entry.origemTipo === "CONTA_INVESTIDOR" ? "CONTA_INVESTIDOR" : "CONTA_EMPRESA",
      contaId: entry.contaId || (accounts.find((a) => a.status === "Ativa" && !isFatDiretoAccount(a))?.id || ""),
      contaInvestidorId: entry.contaInvestidorId || ((contasInvestidores || []).find((c) => c.status === "Ativa")?.id || ""),
      obraId: entry.obraId,
      data: entry.data, valor: String(entry.valor), fornecedor: entry.fornecedor, apropriacao: entry.apropriacao, descricao: entry.descricao,
    });
    window.scrollTo?.({ top: 0, behavior: "smooth" });
  };

  const cancelEdit = () => { setEditingId(null); setEditingClassificacao(null); setForm(blankForm); setFieldErrors({}); setApropriacaoExcecoes([]); };

  const duplicate = (entry) => {
    if (!can(currentUser, "lancamentos_criar")) return;
    setEntries((prev) => [{ ...entry, id: uid("lan"), data: todayISO(), createdAt: Date.now(), ...carimbarCriacao(currentUser) }, ...prev]);
  };

  const remove = (id) => {
    if (!can(currentUser, "lancamentos_excluir")) return;
    const entry = entries.find((e) => e.id === id);
    setEntries((prev) => prev.filter((e) => e.id !== id));
    setConfirmDeleteId(null);
    if (entry) {
      logAudit?.({
        tipoOperacao: "Exclusão de lançamento", registroAlterado: entry.descricao || entry.fornecedor || "Lançamento",
        valorAnterior: BRL(entry.valor), valorNovo: "—", centroCusto: entry.obraId,
      });
    }
  };

  const aprovar = (entry) => {
    if (!can(currentUser, "lancamentos_aprovar")) return;
    setEntries((prev) => prev.map((e) => (e.id === entry.id ? { ...e, status: "aprovado", aprovadoPor: currentUser.nome, aprovadoEm: Date.now() } : e)));
    logAudit?.({ tipoOperacao: "Aprovação de lançamento", registroAlterado: entry.descricao || entry.fornecedor || "Lançamento", valorAnterior: "Pendente", valorNovo: "Aprovado", centroCusto: entry.obraId });
  };

  const accountName = (id) => accounts.find((a) => a.id === id)?.nome || "—";
  const obraName = (id) => (id === SEM_OBRA ? "Administrativo / Custos internos" : obras.find((o) => o.id === id)?.nome || "—");
  const investidorName = (id) => (contasInvestidores || []).find((c) => c.id === id)?.nome || "Conta Investidor";
  const contaDisplay = (e) => (e.origemTipo === "CONTA_INVESTIDOR" ? investidorName(e.contaInvestidorId) : accountName(e.contaId));

  const filtered = useMemo(() => {
    return entries
      .filter((e) => (filters.tipo ? e.tipo === filters.tipo : true))
      .filter((e) => (filters.obraId ? e.obraId === filters.obraId : true))
      .filter((e) => (filters.contaId ? e.contaId === filters.contaId : true))
      .filter((e) => (filters.fornecedor ? e.fornecedor === filters.fornecedor : true))
      .filter((e) => (filters.apropriacao ? e.apropriacao === filters.apropriacao : true))
      .filter((e) => (filters.de ? e.data >= filters.de : true))
      .filter((e) => (filters.ate ? e.data <= filters.ate : true))
      .filter((e) => {
        if (!filters.q) return true;
        const q = filters.q.toLowerCase();
        return (
          (e.descricao || "").toLowerCase().includes(q) ||
          (e.fornecedor || "").toLowerCase().includes(q) ||
          contaDisplay(e).toLowerCase().includes(q) ||
          obraName(e.obraId).toLowerCase().includes(q)
        );
      })
      .sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : b.createdAt - a.createdAt));
  }, [entries, filters, accounts, obras, contasInvestidores]);

  const totals = useMemo(() => {
    let entradas = 0, saidas = 0;
    filtered.forEach((e) => { if (e.tipo === "entrada") entradas += e.valor; else saidas += e.valor; });
    return { entradas, saidas, resultado: entradas - saidas };
  }, [filtered]);

  const fornecedorSelectOptions = useMemo(() => {
    const base = fornecedorOptions.map((f) => ({ value: f, label: f }));
    return [{ value: "Não se aplica", label: "Não se aplica" }, ...base];
  }, [fornecedorOptions]);

  return (
    <div className="gf-stack">
      {!podeCriar && !podeEditar ? (
        <section className="gf-card">
          <EmptyState icon={Lock} title="Sem permissão para lançar" body="Seu usuário não tem permissão para criar ou editar lançamentos. Fale com um administrador." />
        </section>
      ) : (
      <section className="gf-card gf-entry-card">
        <div className="gf-card-head">
          <h2>{editingId ? "Editar lançamento" : "Novo lançamento"}</h2>
          {editingId && <button className="gf-btn gf-btn-ghost" onClick={cancelEdit}>Cancelar edição</button>}
        </div>
        <form onSubmit={submit} className="gf-entry-form">
          <div className="gf-segmented">
            <button type="button" className={form.tipo === "entrada" ? "is-active pos" : ""} onClick={() => { updateForm({ tipo: "entrada" }); setFieldErrors({}); }}>
              <ArrowUpRight size={14} /> Entrada
            </button>
            <button type="button" className={form.tipo === "saida" ? "is-active neg" : ""} onClick={() => { updateForm({ tipo: "saida" }); setFieldErrors({}); }}>
              <ArrowDownRight size={14} /> Saída
            </button>
          </div>

          {activeContasInvestidoras.length > 0 && !editingId && (
            <div className="gf-segmented gf-origem-segmented">
              <button type="button" className={form.origemTipo === "CONTA_EMPRESA" ? "is-active" : ""}
                onClick={() => updateForm({ origemTipo: "CONTA_EMPRESA" })}>
                <Wallet size={14} /> Conta da Empresa
              </button>
              <button type="button" className={form.origemTipo === "CONTA_INVESTIDOR" ? "is-active gf-origem-investidor" : ""}
                onClick={() => updateForm({ origemTipo: "CONTA_INVESTIDOR" })}>
                <HandCoins size={14} /> Conta Investidor
              </button>
            </div>
          )}
          {editingId && form.origemTipo === "CONTA_INVESTIDOR" && (
            <div className="gf-hint gf-span-2" style={{ marginBottom: 4 }}>
              <Badge tone="purple">Investidor</Badge> Este lançamento foi pago através de uma Conta Investidor — não afeta os saldos bancários da empresa.
            </div>
          )}

          <div className="gf-form-grid">
            {form.origemTipo === "CONTA_INVESTIDOR" ? (
              <Field label="Conta Investidor" hint="Origem externa — não altera saldos bancários da empresa">
                <select required className={fieldErrors.contaInvestidorId ? "gf-input-error" : ""} value={form.contaInvestidorId} onChange={(e) => updateForm({ contaInvestidorId: e.target.value })}>
                  <option value="" disabled>Selecione…</option>
                  {activeContasInvestidoras.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select>
              </Field>
            ) : (
              <Field label="Conta bancária">
                <select required className={fieldErrors.contaId ? "gf-input-error" : ""} value={form.contaId} onChange={(e) => updateForm({ contaId: e.target.value })}>
                  <option value="" disabled>Selecione…</option>
                  {activeAccounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
                </select>
              </Field>
            )}
            <Field label="Centro de custo" hint="Obra vinculada ou custo interno (salários, escritório, etc.)">
              <SearchableSelect
                value={form.obraId}
                onChange={(v) => {
                  const disponiveis = computeApropriacoesDisponiveis(v, form.fornecedor, apropriacoes, orcamentoItens, fornecedoresCadastro);
                  const aindaValida = form.apropriacao && [...disponiveis, ...apropriacaoExcecoes].includes(form.apropriacao);
                  updateForm({ obraId: v, apropriacao: aindaValida ? form.apropriacao : "" });
                }}
                options={[{ value: SEM_OBRA, label: "Administrativo / Custos internos" }, ...obras.filter((o) => !o.arquivada).map((o) => ({ value: o.id, label: o.nome }))]}
                extraOptions={obras.filter((o) => o.arquivada).map((o) => ({ value: o.id, label: o.nome }))}
                placeholder="Selecione o centro de custo…"
                error={!!fieldErrors.obraId}
              />
            </Field>
            <Field label="Data">
              <input type="date" required className={fieldErrors.data ? "gf-input-error" : ""} value={form.data} onChange={(e) => updateForm({ data: e.target.value })} />
            </Field>
            <Field label="Valor (R$)">
              <input ref={valorRef} type="number" min="0.01" step="0.01" required placeholder="0,00"
                className={fieldErrors.valor ? "gf-input-error" : ""}
                value={form.valor} onChange={(e) => updateForm({ valor: e.target.value })} />
            </Field>
            <Field label={form.tipo === "entrada" ? "Cliente / origem" : "Fornecedor"} hint={form.tipo !== "entrada" ? "Só fornecedores cadastrados na página Fornecedores" : undefined}>
              <SearchableSelect
                value={form.fornecedor}
                onChange={(v) => {
                  const disponiveis = computeApropriacoesDisponiveis(form.obraId, v, apropriacoes, orcamentoItens, fornecedoresCadastro);
                  const aindaValida = form.apropriacao && [...disponiveis, ...apropriacaoExcecoes].includes(form.apropriacao);
                  updateForm({ fornecedor: v, apropriacao: aindaValida ? form.apropriacao : "" });
                }}
                options={fornecedorSelectOptions}
                placeholder="Buscar fornecedor…"
                error={!!fieldErrors.fornecedor}
              />
            </Field>
            <Field label="Apropriação">
              <ApropriacaoField
                value={form.apropriacao}
                onChange={(v) => updateForm({ apropriacao: v })}
                centroCustoId={form.obraId}
                fornecedorNome={form.fornecedor}
                apropriacoesGlobais={apropriacoes}
                orcamentoItens={orcamentoItens}
                fornecedoresCadastro={fornecedoresCadastro}
                excecoes={apropriacaoExcecoes}
                onAddExcecao={(nome) => setApropriacaoExcecoes((prev) => [...new Set([...prev, nome])])}
                error={!!fieldErrors.apropriacao}
              />
            </Field>
            <Field label="Descrição" className="gf-span-2">
              <input placeholder="Ex: Compra de cimento e agregados" value={form.descricao}
                onChange={(e) => updateForm({ descricao: e.target.value })} />
            </Field>

            {editingId && editingClassificacao && (
              <div className="gf-span-2 gf-hint">
                Este lançamento está vinculado a {editingClassificacao === "divida" ? "uma dívida/crédito" : "um investimento"} — a classificação não pode ser alterada aqui. Ajustes de {editingClassificacao === "divida" ? "dívidas" : "investimentos"} são feitos na página "Dívidas e Investimentos".
              </div>
            )}

            {!editingId && (
              <Field label="Classificação especial" className="gf-span-2" hint="Opcional — vincula este lançamento ao painel Dívidas e Investimentos">
                <select value={form.classificacao} onChange={(e) => updateForm({ classificacao: e.target.value })}>
                  <option value="">Nenhuma</option>
                  <option value="divida">Dívida / Crédito</option>
                  <option value="investimento">Investimento</option>
                </select>
              </Field>
            )}

            {!editingId && form.classificacao === "divida" && form.tipo === "entrada" && (
              <div className="gf-span-2 gf-classificacao-box">
                <span className="gf-field-label" style={{ display: "block", marginBottom: 8 }}>Nova dívida / contratação</span>
                <div className="gf-form-grid" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
                  <Field label="Instituição financeira/credor">
                    <input value={form.divInstituicao} onChange={(e) => updateForm({ divInstituicao: e.target.value })} placeholder="Ex: Banco X" />
                  </Field>
                  <Field label="Tipo de operação">
                    <select value={form.divTipoOperacao} onChange={(e) => updateForm({ divTipoOperacao: e.target.value })}>
                      {TIPOS_DIVIDA.map((t) => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </Field>
                  <Field label="Taxa de juros">
                    <input value={form.divTaxaJuros} onChange={(e) => updateForm({ divTaxaJuros: e.target.value })} placeholder="Ex: 1,2% a.m." />
                  </Field>
                  <Field label="Sistema de amortização">
                    <select value={form.divSistemaAmortizacao} onChange={(e) => updateForm({ divSistemaAmortizacao: e.target.value })}>
                      {SISTEMAS_AMORTIZACAO.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </Field>
                  <Field label="Quantidade de parcelas">
                    <input type="number" min="1" value={form.divQtdParcelas} onChange={(e) => updateForm({ divQtdParcelas: e.target.value })} />
                  </Field>
                  <Field label="Valor estimado da parcela (R$)" hint="Opcional">
                    <input type="number" step="0.01" value={form.divValorParcela} onChange={(e) => updateForm({ divValorParcela: e.target.value })} />
                  </Field>
                  <Field label="Próximo vencimento" hint="Opcional" className="gf-span-2">
                    <input type="date" value={form.divProximoVencimento} onChange={(e) => updateForm({ divProximoVencimento: e.target.value })} />
                  </Field>
                </div>
                <p className="gf-field-hint">O valor lançado acima (entrada) será registrado como o valor originalmente contratado desta dívida.</p>
              </div>
            )}

            {!editingId && form.classificacao === "divida" && form.tipo === "saida" && (
              <div className="gf-span-2 gf-classificacao-box">
                <span className="gf-field-label" style={{ display: "block", marginBottom: 8 }}>Pagamento de parcela</span>
                <Field label="Dívida" className="gf-span-2">
                  <select value={form.dividaSelecionada} onChange={(e) => updateForm({ dividaSelecionada: e.target.value })}>
                    <option value="">Selecione a dívida…</option>
                    {dividas.filter((d) => d.status === "Ativa").map((d) => <option key={d.id} value={d.id}>{d.instituicao} — {d.tipoOperacao}</option>)}
                  </select>
                </Field>
                {dividas.length === 0 && <p className="gf-field-hint">Nenhuma dívida cadastrada ainda. Registre a contratação primeiro (lançamento de entrada).</p>}
                <div className="gf-form-grid" style={{ gridTemplateColumns: "repeat(3,1fr)", marginTop: 10 }}>
                  <Field label="Amortização (R$)"><input type="number" step="0.01" value={form.divAmortizacao} onChange={(e) => updateForm({ divAmortizacao: e.target.value })} /></Field>
                  <Field label="Juros (R$)"><input type="number" step="0.01" value={form.divJuros} onChange={(e) => updateForm({ divJuros: e.target.value })} /></Field>
                  <Field label="Encargos/IOF (R$)"><input type="number" step="0.01" value={form.divEncargos} onChange={(e) => updateForm({ divEncargos: e.target.value })} /></Field>
                </div>
                {(() => {
                  const soma = (Number(form.divAmortizacao) || 0) + (Number(form.divJuros) || 0) + (Number(form.divEncargos) || 0);
                  const dif = Math.round((Number(form.valor || 0) - soma) * 100) / 100;
                  const fecha = Math.abs(dif) < 0.01;
                  return (
                    <p className={`gf-field-hint ${fecha ? "" : "gf-warn"}`} style={{ marginTop: 8 }}>
                      {fecha ? "✓ A soma bate com o valor do lançamento." : `Falta detalhar ${BRL(dif)} para fechar com o valor total da parcela.`}
                    </p>
                  );
                })()}
              </div>
            )}

            {!editingId && form.classificacao === "investimento" && form.tipo === "saida" && (
              <div className="gf-span-2 gf-classificacao-box">
                <div className="gf-segmented" style={{ marginBottom: 10 }}>
                  <button type="button" className={form.invModo === "nova" ? "is-active" : ""} onClick={() => updateForm({ invModo: "nova" })}>Novo investimento</button>
                  <button type="button" className={form.invModo === "aporte" ? "is-active" : ""} onClick={() => updateForm({ invModo: "aporte" })}>Aporte em investimento existente</button>
                </div>
                {form.invModo === "nova" ? (
                  <div className="gf-form-grid" style={{ gridTemplateColumns: "repeat(2,1fr)" }}>
                    <Field label="Instituição"><input value={form.invInstituicao} onChange={(e) => updateForm({ invInstituicao: e.target.value })} placeholder="Ex: Banco X" /></Field>
                    <Field label="Tipo de investimento">
                      <select value={form.invTipoInvestimento} onChange={(e) => updateForm({ invTipoInvestimento: e.target.value })}>
                        {TIPOS_INVESTIMENTO.map((t) => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </Field>
                    <Field label="Data de vencimento" hint="Opcional"><input type="date" value={form.invDataVencimento} onChange={(e) => updateForm({ invDataVencimento: e.target.value })} /></Field>
                    <Field label="Liquidez">
                      <select value={form.invLiquidez} onChange={(e) => updateForm({ invLiquidez: e.target.value })}>
                        {LIQUIDEZ_OPCOES.map((l) => <option key={l} value={l}>{l}</option>)}
                      </select>
                    </Field>
                  </div>
                ) : (
                  <Field label="Investimento">
                    <select value={form.investimentoSelecionado} onChange={(e) => updateForm({ investimentoSelecionado: e.target.value })}>
                      <option value="">Selecione…</option>
                      {investimentos.filter((i) => i.status === "Ativo").map((i) => <option key={i.id} value={i.id}>{i.instituicao} — {i.tipoInvestimento}</option>)}
                    </select>
                  </Field>
                )}
              </div>
            )}

            {!editingId && form.classificacao === "investimento" && form.tipo === "entrada" && (
              <div className="gf-span-2 gf-classificacao-box">
                <div className="gf-segmented" style={{ marginBottom: 10 }}>
                  <button type="button" className={form.invModoEntrada === "resgate" ? "is-active" : ""} onClick={() => updateForm({ invModoEntrada: "resgate" })}>Resgate</button>
                  <button type="button" className={form.invModoEntrada === "rendimento" ? "is-active" : ""} onClick={() => updateForm({ invModoEntrada: "rendimento" })}>Rendimento</button>
                </div>
                <Field label="Investimento">
                  <select value={form.investimentoSelecionado} onChange={(e) => updateForm({ investimentoSelecionado: e.target.value })}>
                    <option value="">Selecione…</option>
                    {investimentos.filter((i) => i.status === "Ativo").map((i) => <option key={i.id} value={i.id}>{i.instituicao} — {i.tipoInvestimento}</option>)}
                  </select>
                </Field>
                {investimentos.length === 0 && <p className="gf-field-hint">Nenhum investimento cadastrado ainda. Registre a aplicação inicial primeiro (lançamento de saída).</p>}
              </div>
            )}
          </div>

          {Object.keys(fieldErrors).length > 0 && (
            <div className="gf-warn gf-form-error">
              Preencha os campos obrigatórios: {Object.keys(fieldErrors).map((k) => LANCAMENTO_FIELD_LABELS[k] || k).join(", ")}.
            </div>
          )}

          <div className="gf-form-actions">
            <button type="submit" className="gf-btn gf-btn-primary" disabled={editingId ? !podeEditar : !podeCriar}>
              {editingId ? "Salvar alterações" : "Lançar movimento"}
            </button>
            {!editingId && <span className="gf-hint">Ao salvar, o formulário limpa e fica pronto para o próximo lançamento.</span>}
          </div>
        </form>
      </section>
      )}

      <section className="gf-card">
        <div className="gf-card-head">
          <h2>Lançamentos</h2>
          <div className="gf-summary-inline">
            <span>Entradas <b className="pos">{BRL(totals.entradas)}</b></span>
            <span>Saídas <b className="neg">{BRL(totals.saidas)}</b></span>
            <span>Resultado <b className={totals.resultado >= 0 ? "pos" : "neg"}>{BRL(totals.resultado)}</b></span>
          </div>
        </div>

        <div className="gf-filters">
          <div className="gf-search">
            <Search size={15} />
            <input placeholder="Pesquisar por descrição, fornecedor, conta, obra…" value={filters.q}
              onChange={(e) => setFilters((f) => ({ ...f, q: e.target.value }))} />
          </div>
          <div className="gf-filters-grid">
            <input type="date" title="De" value={filters.de} onChange={(e) => setFilters((f) => ({ ...f, de: e.target.value }))} />
            <input type="date" title="Até" value={filters.ate} onChange={(e) => setFilters((f) => ({ ...f, ate: e.target.value }))} />
            <select value={filters.tipo} onChange={(e) => setFilters((f) => ({ ...f, tipo: e.target.value }))}>
              <option value="">Tipo (todos)</option><option value="entrada">Entrada</option><option value="saida">Saída</option>
            </select>
            <select value={filters.obraId} onChange={(e) => setFilters((f) => ({ ...f, obraId: e.target.value }))}>
              <option value="">Centro de custo (todos)</option>
              <option value={SEM_OBRA}>Administrativo / Custos internos</option>
              {obras.map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
            </select>
            <select value={filters.contaId} onChange={(e) => setFilters((f) => ({ ...f, contaId: e.target.value }))}>
              <option value="">Conta (todas)</option>
              {accounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
            </select>
            <select value={filters.fornecedor} onChange={(e) => setFilters((f) => ({ ...f, fornecedor: e.target.value }))}>
              <option value="">Fornecedor (todos)</option>
              {supplierNames.map((f) => <option key={f} value={f}>{f}</option>)}
            </select>
            <select value={filters.apropriacao} onChange={(e) => setFilters((f) => ({ ...f, apropriacao: e.target.value }))}>
              <option value="">Apropriação (todas)</option>
              {apropriacoes.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>

        <div className="gf-table-wrap">
          <table className="gf-table gf-table-ledger">
            <thead>
              <tr>
                <th>Data</th><th>Tipo</th><th>Conta</th><th>Centro de custo</th><th>Fornecedor</th>
                <th className="num">Valor</th><th>Descrição</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 && (
                <tr><td colSpan={8}><EmptyState icon={Receipt} title="Nenhum lançamento encontrado" body="Ajuste os filtros ou registre um novo lançamento acima." /></td></tr>
              )}
              {filtered.map((e) => (
                <tr key={e.id} className={e.tipo === "entrada" ? "row-pos" : "row-neg"}>
                  <td>{fmtDate(e.data)}</td>
                  <td>
                    <Badge tone={e.tipo === "entrada" ? "green" : "red"}>{e.tipo === "entrada" ? "Entrada" : "Saída"}</Badge>
                    <span className={`gf-dot gf-dot-${statusAprovacao(e) === "aprovado" ? "green" : "orange"}`}
                      style={{ marginLeft: 6 }} title={statusAprovacao(e) === "aprovado" ? "Aprovado" : "Pendente de aprovação"} />
                  </td>
                  <td>
                    {contaDisplay(e)}
                    {e.origemTipo === "CONTA_INVESTIDOR" && <Badge tone="purple" style={{ marginLeft: 6 }}>Investidor</Badge>}
                  </td>
                  <td>{obraName(e.obraId)}</td>
                  <td>{e.fornecedor || "—"}</td>
                  <td className={`num mono ${e.tipo === "entrada" ? "pos" : "neg"}`}>
                    {e.tipo === "entrada" ? "+" : "−"} {BRL(e.valor)}
                  </td>
                  <td className="gf-td-desc" title={e.descricao}>
                    {e.descricao || "—"}
                    {e.dividaId && <span className="gf-mini-tag" title="Vinculado a uma dívida"> · Dívida</span>}
                    {e.investimentoId && <span className="gf-mini-tag" title="Vinculado a um investimento"> · Invest.</span>}
                  </td>
                  <td>
                    <div className="gf-row-actions">
                      {confirmDeleteId === e.id ? (
                        <>
                          <button className="gf-icon-btn danger" title="Confirmar exclusão" onClick={() => remove(e.id)}><Check size={14} /></button>
                          <button className="gf-icon-btn" title="Cancelar" onClick={() => setConfirmDeleteId(null)}><X size={14} /></button>
                        </>
                      ) : (
                        <>
                          {statusAprovacao(e) === "pendente" && can(currentUser, "lancamentos_aprovar") && (
                            <button className="gf-icon-btn" title="Aprovar" onClick={() => aprovar(e)}><Check size={14} /></button>
                          )}
                          {podeEditar && <button className="gf-icon-btn" title="Editar" onClick={() => startEdit(e)}><Pencil size={14} /></button>}
                          {podeCriar && <button className="gf-icon-btn" title="Duplicar" onClick={() => duplicate(e)}><Copy size={14} /></button>}
                          {podeExcluir && <button className="gf-icon-btn" title="Excluir" onClick={() => setConfirmDeleteId(e.id)}><Trash2 size={14} /></button>}
                        </>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    </div>
  );
}

function SaldosPage({ accounts, setAccounts, accountStats, entries, transfers, setTransfers, movimentosSocios, obras, socios = [], contasInvestidores = [], movimentosInvestidores = [], retiradasInvestidores = [], currentUser, logAudit }) {
  const [showNew, setShowNew] = useState(false);
  const [showTransfer, setShowTransfer] = useState(false);
  const [editingAccount, setEditingAccount] = useState(null);
  const [detailAccountId, setDetailAccountId] = useState(null);
  const podeCadastrar = can(currentUser, "contasbancarias_cadastrar");
  const podeSaldoInicial = can(currentUser, "contasbancarias_saldoinicial");
  const podeTransferir = can(currentUser, "contasbancarias_transferir");

  const saveAccount = (data) => {
    if (data.id) {
      const anterior = accounts.find((a) => a.id === data.id);
      // Reforço de segurança: mesmo que o formulário seja manipulado, o saldo inicial só muda se o usuário tiver permissão.
      const saldoInicialFinal = podeSaldoInicial ? data.saldoInicial : anterior?.saldoInicial;
      setAccounts((prev) => prev.map((a) => (a.id === data.id ? { ...data, saldoInicial: saldoInicialFinal } : a)));
      if (anterior && podeSaldoInicial && anterior.saldoInicial !== data.saldoInicial) {
        logAudit?.({
          tipoOperacao: "Alteração de saldo inicial", registroAlterado: data.nome,
          valorAnterior: BRL(anterior.saldoInicial), valorNovo: BRL(data.saldoInicial),
        });
      } else if (anterior && (anterior.nome !== data.nome || anterior.status !== data.status || anterior.agencia !== data.agencia || anterior.numero !== data.numero)) {
        logAudit?.({ tipoOperacao: "Alteração de conta bancária", registroAlterado: data.nome, valorAnterior: anterior.nome, valorNovo: data.nome });
      }
    } else {
      if (!podeCadastrar) return;
      setAccounts((prev) => [...prev, { ...data, id: uid("acc") }]);
      logAudit?.({ tipoOperacao: "Cadastro de conta bancária", registroAlterado: data.nome, valorAnterior: "—", valorNovo: BRL(data.saldoInicial) });
    }
    setShowNew(false); setEditingAccount(null);
  };

  const doTransfer = (t) => {
    if (!podeTransferir) return;
    setTransfers((prev) => [...prev, { ...t, id: uid("trf"), createdAt: Date.now() }]);
    setShowTransfer(false);
  };

  // evolução do saldo total ao longo do tempo
  const evolutionData = useMemo(() => {
    const baseline = accounts.reduce((s, a) => s + (Number(a.saldoInicial) || 0), 0);
    const movs = [];
    entries.forEach((e) => movs.push({ data: e.data, delta: e.tipo === "entrada" ? e.valor : -e.valor }));
    (movimentosSocios || []).forEach((m) => movs.push({ data: m.data, delta: m.tipo === "aporte" ? m.valor : -m.valor }));
    movimentosInvestidores.forEach((m) => { if (m.origemAporte === "GLOVER" && m.contaGloverId) movs.push({ data: m.data, delta: -Number(m.valor) }); });
    retiradasInvestidores.forEach((r) => { if (r.tipo === "GLOVER" && r.contaGloverDestinoId) movs.push({ data: r.data, delta: Number(r.valor) }); });
    // transferências não afetam o total da empresa (saem de uma conta, entram em outra)
    const byDate = {};
    movs.forEach((m) => { byDate[m.data] = (byDate[m.data] || 0) + m.delta; });
    const dates = Object.keys(byDate).sort();
    let running = baseline;
    const points = [{ data: "Início", saldo: baseline }];
    dates.forEach((d) => { running += byDate[d]; points.push({ data: fmtDate(d), saldo: running }); });
    return points;
  }, [accounts, entries, movimentosSocios, movimentosInvestidores, retiradasInvestidores]);

  return (
    <div className="gf-stack">
      <div className="gf-toolbar">
        <h2>Contas bancárias</h2>
        <div className="gf-toolbar-actions">
          {podeTransferir && (
            <button className="gf-btn gf-btn-ghost" onClick={() => setShowTransfer(true)}>
              <ArrowLeftRight size={15} /> Transferir entre contas
            </button>
          )}
          {podeCadastrar && (
            <button className="gf-btn gf-btn-primary" onClick={() => setShowNew(true)}>
              <Plus size={15} /> Nova conta bancária
            </button>
          )}
        </div>
      </div>

      {accounts.length === 0 ? (
        <div className="gf-card"><EmptyState icon={Wallet} title="Nenhuma conta cadastrada" body="Cadastre a primeira conta bancária para começar a lançar movimentos." /></div>
      ) : (
        <div className="gf-grid-cards">
          {accounts.map((a) => {
            const s = accountStats[a.id] || { entradas: 0, saidas: 0, saldoAtual: a.saldoInicial };
            return (
              <div
                className={`gf-card gf-account-card gf-account-card-clickable ${a.status !== "Ativa" ? "is-inactive" : ""}`}
                key={a.id} onClick={() => setDetailAccountId(a.id)}
              >
                <div className="gf-card-head">
                  <div>
                    <div className="gf-eyebrow">{a.banco}</div>
                    <h3>{a.nome}</h3>
                  </div>
                  <div className="gf-row-actions">
                    <Badge tone={a.status === "Ativa" ? "green" : "gray"}>{a.status}</Badge>
                    {podeCadastrar && <button className="gf-icon-btn" title="Editar conta" onClick={(e) => { e.stopPropagation(); setEditingAccount(a); }}><Pencil size={14} /></button>}
                  </div>
                </div>
                <div className="gf-account-meta">Ag. {a.agencia} · Conta {a.numero}</div>
                <div className="gf-account-rows">
                  <div><span>Saldo inicial</span><b className="mono">{BRL(a.saldoInicial)}</b></div>
                  <div><span>Entradas</span><b className="mono pos">+ {BRL(s.entradas)}</b></div>
                  <div><span>Saídas</span><b className="mono neg">− {BRL(s.saidas)}</b></div>
                  {(s.transfIn || s.transfOut) ? (
                    <div><span>Transferências (líq.)</span><b className={`mono ${s.transfIn - s.transfOut >= 0 ? "pos" : "neg"}`}>{BRL(s.transfIn - s.transfOut)}</b></div>
                  ) : null}
                  {(s.socioIn || s.socioOut) ? (
                    <div><span>Sócios (líq.)</span><b className={`mono ${s.socioIn - s.socioOut >= 0 ? "pos" : "neg"}`}>{BRL(s.socioIn - s.socioOut)}</b></div>
                  ) : null}
                </div>
                <div className="gf-account-balance">
                  <span>Saldo atual</span>
                  <strong className={`mono ${s.saldoAtual >= 0 ? "pos" : "neg"}`}>{BRL(s.saldoAtual)}</strong>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <section className="gf-card">
        <div className="gf-card-head"><h2>Evolução do saldo bancário</h2></div>
        <div className="gf-chart-box">
          <ResponsiveContainer width="100%" height={260}>
            <LineChart data={evolutionData} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
              <CartesianGrid stroke="var(--gf-border)" vertical={false} />
              <XAxis dataKey="data" tick={{ fontSize: 11, fill: "var(--gf-muted)" }} axisLine={{ stroke: "var(--gf-border)" }} tickLine={false} />
              <YAxis tick={{ fontSize: 11, fill: "var(--gf-muted)" }} axisLine={false} tickLine={false}
                tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} width={44} />
              <Tooltip formatter={(v) => BRL(v)} contentStyle={{ fontFamily: "var(--gf-font-mono)", fontSize: 12, borderRadius: 8, border: "1px solid var(--gf-border)" }} />
              <Line type="monotone" dataKey="saldo" stroke="var(--gf-accent)" strokeWidth={2.2} dot={false} activeDot={{ r: 4 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </section>

      {(showNew || editingAccount) && (
        <AccountModal account={editingAccount} podeSaldoInicial={podeSaldoInicial} onClose={() => { setShowNew(false); setEditingAccount(null); }} onSave={saveAccount} />
      )}
      {showTransfer && (
        <TransferModal accounts={accounts.filter((a) => a.status === "Ativa" && !isFatDiretoAccount(a))} onClose={() => setShowTransfer(false)} onSave={doTransfer} />
      )}
      {detailAccountId && (
        <ContaLancamentosModal
          conta={accounts.find((a) => a.id === detailAccountId)}
          entries={entries.filter((e) => e.contaId === detailAccountId)}
          transfers={transfers} accounts={accounts}
          movimentosSocios={(movimentosSocios || []).filter((m) => m.contaId === detailAccountId)} socios={socios}
          aportesInvestidores={movimentosInvestidores.filter((m) => m.origemAporte === "GLOVER" && m.contaGloverId === detailAccountId)}
          retiradasInvestidores={retiradasInvestidores.filter((r) => r.tipo === "GLOVER" && r.contaGloverDestinoId === detailAccountId)}
          contasInvestidores={contasInvestidores}
          obras={obras}
          onClose={() => setDetailAccountId(null)}
        />
      )}
    </div>
  );
}

// Extrato completo da conta bancária: lançamentos + transferências entre contas + aportes/retiradas
// de sócios (inclui pró-labore) + aportes/retiradas da Glover em Contas Investidoras, com saldo corrente.
function ContaLancamentosModal({ conta, entries, transfers = [], accounts = [], movimentosSocios = [], socios = [], aportesInvestidores = [], retiradasInvestidores = [], contasInvestidores = [], obras, onClose }) {
  const obraName = (id) => (id === SEM_OBRA ? "Administrativo / Custos internos" : obras.find((o) => o.id === id)?.nome || "—");
  const contaNome = (id) => accounts.find((a) => a.id === id)?.nome || "—";
  const contaInvNome = (id) => contasInvestidores.find((c) => c.id === id)?.nome || "—";
  const socioNome = (id) => socios.find((x) => x.id === id)?.nome || "Sócio";
  const SOCIO_TIPO = { aporte: "Aporte de sócio", retirada: "Retirada de sócio", "pro-labore": "Pró-labore" };

  const movs = [
    ...entries.map((e) => ({
      id: `l-${e.id}`, data: e.data, createdAt: e.createdAt || 0, tipo: e.tipo === "entrada" ? "Entrada" : "Saída",
      origem: `${obraName(e.obraId)}${e.fornecedor ? ` · ${e.fornecedor}` : ""}`, descricao: e.descricao,
      valor: e.tipo === "entrada" ? Number(e.valor) : -Number(e.valor),
    })),
    ...transfers.filter((t) => t.destinoId === conta?.id).map((t) => ({
      id: `ti-${t.id}`, data: t.data, createdAt: t.createdAt || 0, tipo: "Transferência recebida",
      origem: `De: ${contaNome(t.origemId)}`, descricao: t.descricao, valor: Math.abs(Number(t.valor)),
    })),
    ...transfers.filter((t) => t.origemId === conta?.id).map((t) => ({
      id: `to-${t.id}`, data: t.data, createdAt: t.createdAt || 0, tipo: "Transferência enviada",
      origem: `Para: ${contaNome(t.destinoId)}`, descricao: t.descricao, valor: -Math.abs(Number(t.valor)),
    })),
    ...movimentosSocios.map((m) => ({
      id: `s-${m.id}`, data: m.data, createdAt: m.createdAt || 0, tipo: SOCIO_TIPO[m.tipo] || "Movimento de sócio",
      origem: socioNome(m.socioId), descricao: m.descricao, valor: m.tipo === "aporte" ? Math.abs(Number(m.valor)) : -Math.abs(Number(m.valor)),
    })),
    ...aportesInvestidores.map((m) => ({
      id: `ai-${m.id}`, data: m.data, createdAt: m.createdAt || 0, tipo: "Aporte em Conta Investidor",
      origem: `Para: ${contaInvNome(m.contaInvestidorId)}`, descricao: m.descricao, valor: -Math.abs(Number(m.valor)),
    })),
    ...retiradasInvestidores.map((r) => ({
      id: `ri-${r.id}`, data: r.data, createdAt: r.createdAt || 0, tipo: "Retirada de Conta Investidor",
      origem: `De: ${contaInvNome(r.contaInvestidorId)}`, descricao: r.descricao, valor: Math.abs(Number(r.valor)),
    })),
  ];

  // saldo corrente em ordem cronológica; exibição do mais recente para o mais antigo
  const cronologico = [...movs].sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : a.createdAt - b.createdAt));
  let running = Number(conta?.saldoInicial) || 0;
  const comSaldo = cronologico.map((m) => { running += m.valor; return { ...m, saldoApos: running }; });
  const ordenados = [...comSaldo].reverse();

  const totalEntradas = movs.filter((m) => m.valor > 0).reduce((s, m) => s + m.valor, 0);
  const totalSaidas = movs.filter((m) => m.valor < 0).reduce((s, m) => s - m.valor, 0);

  return (
    <Modal title={`${conta?.nome || "Conta"} — Movimentações`} onClose={onClose} width={900}>
      <div className="gf-summary-inline" style={{ marginBottom: 14 }}>
        <span>Saldo inicial <b className="mono">{BRL(conta?.saldoInicial || 0)}</b></span>
        <span>Entradas <b className="pos">+ {BRL(totalEntradas)}</b></span>
        <span>Saídas <b className="neg">− {BRL(totalSaidas)}</b></span>
        <span>Saldo atual <b className={running >= 0 ? "pos" : "neg"}>{BRL(running)}</b></span>
      </div>
      <div className="gf-table-wrap">
        <table className="gf-table gf-table-ledger">
          <thead>
            <tr><th>Data</th><th>Tipo</th><th>Centro de custo / Origem-destino</th><th>Descrição</th><th className="num">Valor</th><th className="num">Saldo após</th></tr>
          </thead>
          <tbody>
            {ordenados.length === 0 && (
              <tr><td colSpan={6}><EmptyState icon={Receipt} title="Nenhuma movimentação" body="Nenhuma movimentação registrada para esta conta ainda." /></td></tr>
            )}
            {ordenados.map((m) => (
              <tr key={m.id} className={m.valor >= 0 ? "row-pos" : "row-neg"}>
                <td>{fmtDate(m.data)}</td>
                <td><Badge tone={m.valor >= 0 ? "green" : "red"}>{m.tipo}</Badge></td>
                <td>{m.origem}</td>
                <td className="gf-td-desc" title={m.descricao}>{m.descricao || "—"}</td>
                <td className={`num mono ${m.valor >= 0 ? "pos" : "neg"}`}>{m.valor >= 0 ? "+" : "−"} {BRL(Math.abs(m.valor))}</td>
                <td className="num mono">{BRL(m.saldoApos)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

function AccountModal({ account, podeSaldoInicial, onClose, onSave }) {
  const [f, setF] = useState(account || {
    banco: "", nome: "", agencia: "", numero: "", saldoInicial: "", dataSaldoInicial: todayISO(), status: "Ativa",
  });
  const [tentouEditarSaldo, setTentouEditarSaldo] = useState(false);
  const upd = (p) => setF((s) => ({ ...s, ...p }));
  const submit = (e) => {
    e.preventDefault();
    if (!f.banco || !f.nome) return;
    onSave({ ...f, saldoInicial: Number(f.saldoInicial) || 0 });
  };
  return (
    <Modal title={account ? "Editar conta bancária" : "Nova conta bancária"} onClose={onClose}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Banco"><input required value={f.banco} onChange={(e) => upd({ banco: e.target.value })} placeholder="Ex: Itaú" /></Field>
        <Field label="Nome / apelido da conta"><input required value={f.nome} onChange={(e) => upd({ nome: e.target.value })} placeholder="Ex: Itaú - Conta Principal" /></Field>
        <Field label="Agência"><input value={f.agencia} onChange={(e) => upd({ agencia: e.target.value })} /></Field>
        <Field label="Número da conta"><input value={f.numero} onChange={(e) => upd({ numero: e.target.value })} /></Field>
        <Field label="Saldo inicial (R$)">
          {podeSaldoInicial ? (
            <input type="number" step="0.01" value={f.saldoInicial} onChange={(e) => upd({ saldoInicial: e.target.value })} />
          ) : (
            <div className="gf-locked-field" onClick={() => setTentouEditarSaldo(true)}>
              <span className="mono">{BRL(f.saldoInicial)}</span>
              <Lock size={14} />
            </div>
          )}
        </Field>
        {tentouEditarSaldo && !podeSaldoInicial && (
          <div className="gf-warn gf-span-2">Acesso restrito. A alteração do saldo inicial só pode ser realizada por um usuário administrador.</div>
        )}
        <Field label="Data do saldo inicial"><input type="date" disabled={!podeSaldoInicial} value={f.dataSaldoInicial} onChange={(e) => upd({ dataSaldoInicial: e.target.value })} /></Field>
        <Field label="Status">
          <select value={f.status} onChange={(e) => upd({ status: e.target.value })}>
            <option>Ativa</option><option>Inativa</option>
          </select>
        </Field>
        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">Salvar conta</button>
        </div>
      </form>
    </Modal>
  );
}

function TransferModal({ accounts, onClose, onSave }) {
  const [f, setF] = useState({ origemId: accounts[0]?.id || "", destinoId: accounts[1]?.id || "", valor: "", data: todayISO(), descricao: "" });
  const upd = (p) => setF((s) => ({ ...s, ...p }));
  const submit = (e) => {
    e.preventDefault();
    if (!f.origemId || !f.destinoId || f.origemId === f.destinoId || !f.valor) return;
    onSave({ ...f, valor: Number(f.valor) });
  };
  return (
    <Modal title="Transferência entre contas" onClose={onClose}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Conta de origem">
          <select required value={f.origemId} onChange={(e) => upd({ origemId: e.target.value })}>
            {accounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </Field>
        <Field label="Conta de destino">
          <select required value={f.destinoId} onChange={(e) => upd({ destinoId: e.target.value })}>
            {accounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </Field>
        <Field label="Valor (R$)"><input type="number" min="0.01" step="0.01" required value={f.valor} onChange={(e) => upd({ valor: e.target.value })} /></Field>
        <Field label="Data"><input type="date" required value={f.data} onChange={(e) => upd({ data: e.target.value })} /></Field>
        <Field label="Descrição" className="gf-span-2"><input value={f.descricao} onChange={(e) => upd({ descricao: e.target.value })} placeholder="Opcional" /></Field>
        {f.origemId === f.destinoId && <div className="gf-warn gf-span-2">Escolha contas diferentes para origem e destino.</div>}
        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">Confirmar transferência</button>
          <span className="gf-hint">Não afeta receitas/despesas nem o resultado das obras.</span>
        </div>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   Página: Contas Investidores
   Regra fundamental: recursos de terceiros (clientes/investidores/parceiros) usados para
   pagar despesas de obra. Afetam normalmente o custo da obra e a apropriação, mas NUNCA
   os saldos bancários da empresa. Um único lançamento (entries) com origemTipo
   "CONTA_INVESTIDOR" é a fonte da verdade — esta página apenas consulta e apresenta.
--------------------------------------------------------------- */

function ContasInvestidoresPage({ contasInvestidores, setContasInvestidores, investidorStats, investidorComposicao, entries, obras, accounts, movimentosInvestidores, setMovimentosInvestidores, transfersInvestidores, setTransfersInvestidores, retiradasInvestidores, setRetiradasInvestidores, currentUser, logAudit }) {
  const [showNew, setShowNew] = useState(false);
  const [showTransfer, setShowTransfer] = useState(false);
  const [showAporte, setShowAporte] = useState(false);
  const [editingConta, setEditingConta] = useState(null);
  const [detailContaId, setDetailContaId] = useState(null);
  const podeCadastrar = can(currentUser, "investidores_cadastrar");
  const podeAportar = can(currentUser, "investidores_aportar");
  const podeTransferir = can(currentUser, "investidores_transferir");

  const saveConta = (data) => {
    if (data.id) {
      const anterior = contasInvestidores.find((c) => c.id === data.id);
      setContasInvestidores((prev) => prev.map((c) => (c.id === data.id ? { ...c, ...data } : c)));
      if (anterior && anterior.saldoInicial !== data.saldoInicial) {
        logAudit?.({ tipoOperacao: "Alteração de saldo inicial (Conta Investidor)", registroAlterado: data.nome, valorAnterior: BRL(anterior.saldoInicial), valorNovo: BRL(data.saldoInicial) });
      } else {
        logAudit?.({ tipoOperacao: "Alteração de Conta Investidor", registroAlterado: data.nome, valorAnterior: anterior?.nome || "—", valorNovo: data.nome });
      }
    } else {
      if (!podeCadastrar) return;
      setContasInvestidores((prev) => [...prev, { ...data, id: uid("inv-cta") }]);
      logAudit?.({ tipoOperacao: "Cadastro de Conta Investidor", registroAlterado: data.nome, valorAnterior: "—", valorNovo: BRL(data.saldoInicial) });
    }
    setShowNew(false); setEditingConta(null);
  };

  const doAporte = (a) => {
    if (!podeAportar) return;
    const registro = { ...a, id: uid("apinv"), createdAt: Date.now(), criadoPor: currentUser?.nome, criadoEm: Date.now() };
    setMovimentosInvestidores((prev) => [...prev, registro]);
    const conta = contasInvestidores.find((c) => c.id === a.contaInvestidorId);
    logAudit?.({
      tipoOperacao: a.origemAporte === "GLOVER" ? "Aporte da Glover em Conta Investidor" : "Aporte em Conta Investidor",
      registroAlterado: conta?.nome || "—", valorAnterior: "—", valorNovo: BRL(a.valor),
    });
    setShowAporte(false);
  };

  // Trata as 3 operações da funcionalidade "Transferir entre contas": transferência pura entre
  // Contas Investidoras, retirada da Glover (volta para conta bancária da empresa) e retirada do
  // próprio investidor (sai da estrutura controlada pelo sistema). Cada uma afeta de forma
  // diferente a composição econômica (participação) — nunca o custo realizado da obra.
  // Exclui um aporte, uma retirada ou uma transferência a partir do extrato da conta. Tudo é
  // recalculado automaticamente (saldos, composição Glover x Investidor, saldo das contas bancárias).
  const excluirMovimento = (kind, id) => {
    const conta = contasInvestidores.find((c) => c.id === detailContaId);
    if (kind === "aporte") {
      if (!podeAportar) return;
      const m = movimentosInvestidores.find((x) => x.id === id);
      setMovimentosInvestidores((prev) => prev.filter((x) => x.id !== id));
      logAudit?.({ tipoOperacao: "Exclusão de aporte em Conta Investidor", registroAlterado: conta?.nome || "—", valorAnterior: BRL(m?.valor || 0), valorNovo: "—" });
    } else if (kind === "retirada") {
      if (!podeTransferir) return;
      const r = retiradasInvestidores.find((x) => x.id === id);
      setRetiradasInvestidores((prev) => prev.filter((x) => x.id !== id));
      logAudit?.({ tipoOperacao: "Exclusão de retirada em Conta Investidor", registroAlterado: conta?.nome || "—", valorAnterior: BRL(r?.valor || 0), valorNovo: "—" });
    } else if (kind === "transferencia") {
      if (!podeTransferir) return;
      const t = transfersInvestidores.find((x) => x.id === id);
      setTransfersInvestidores((prev) => prev.filter((x) => x.id !== id));
      logAudit?.({ tipoOperacao: "Exclusão de transferência entre Contas Investidoras", registroAlterado: `${contasInvestidores.find((c) => c.id === t?.origemId)?.nome || "—"} → ${contasInvestidores.find((c) => c.id === t?.destinoId)?.nome || "—"}`, valorAnterior: BRL(t?.valor || 0), valorNovo: "—" });
    }
  };

  const doOperacao = (op) => {
    if (op.tipo === "TRANSFERENCIA") {
      if (!podeTransferir) return;
      setTransfersInvestidores((prev) => [...prev, { origemId: op.origemId, destinoId: op.destinoId, valor: op.valor, data: op.data, descricao: op.descricao, id: uid("trfinv"), createdAt: Date.now() }]);
      logAudit?.({ tipoOperacao: "Transferência entre Contas Investidoras", registroAlterado: `${contasInvestidores.find((c) => c.id === op.origemId)?.nome} → ${contasInvestidores.find((c) => c.id === op.destinoId)?.nome}`, valorAnterior: "—", valorNovo: BRL(op.valor) });
    } else {
      if (!podeTransferir) return;
      const registro = {
        id: uid("retinv"), contaInvestidorId: op.origemId, tipo: op.tipo === "RETIRADA_GLOVER" ? "GLOVER" : "INVESTIDOR",
        valor: op.valor, data: op.data, obraId: op.obraId || null,
        contaGloverDestinoId: op.tipo === "RETIRADA_GLOVER" ? op.contaGloverDestinoId : null,
        participanteInvestidor: op.tipo === "RETIRADA_INVESTIDOR" ? op.participanteInvestidor : null,
        destinoDescricao: op.tipo === "RETIRADA_INVESTIDOR" ? op.destinoDescricao : null,
        descricao: op.descricao, criadoPor: currentUser?.nome, criadoEm: Date.now(), createdAt: Date.now(),
      };
      setRetiradasInvestidores((prev) => [...prev, registro]);
      const conta = contasInvestidores.find((c) => c.id === op.origemId);
      logAudit?.({
        tipoOperacao: op.tipo === "RETIRADA_GLOVER" ? "Retirada Glover em Conta Investidor" : "Retirada de Investidor em Conta Investidor",
        registroAlterado: conta?.nome || "—", valorAnterior: "—", valorNovo: BRL(op.valor),
      });
    }
    setShowTransfer(false);
  };

  return (
    <div className="gf-stack">
      <div className="gf-toolbar">
        <h2>Contas Investidores</h2>
        <div className="gf-toolbar-actions">
          {podeTransferir && (
            <button className="gf-btn gf-btn-ghost" onClick={() => setShowTransfer(true)}>
              <ArrowLeftRight size={15} /> Transferir entre contas
            </button>
          )}
          {podeAportar && (
            <button className="gf-btn gf-btn-ghost" onClick={() => setShowAporte(true)}>
              <HandCoins size={15} /> Registrar aporte
            </button>
          )}
          {podeCadastrar && (
            <button className="gf-btn gf-btn-primary" onClick={() => setShowNew(true)}>
              <Plus size={15} /> Nova Conta
            </button>
          )}
        </div>
      </div>

      <p className="gf-field-hint">
        Contas Investidores representam recursos de clientes, investidores ou parceiros usados para pagar despesas de obra.
        Os gastos entram normalmente no custo realizado das obras e nas apropriações, mas nunca afetam os saldos bancários da empresa.
      </p>

      {contasInvestidores.length === 0 ? (
        <div className="gf-card"><EmptyState icon={HandCoins} title="Nenhuma Conta Investidor cadastrada" body="Cadastre uma conta de cliente, investidor ou parceiro para lançar gastos de obra pagos por terceiros." /></div>
      ) : (
        <div className="gf-grid-cards">
          {contasInvestidores.map((c) => {
            const s = investidorStats[c.id] || { entradas: 0, saidas: 0, saldoAtual: c.saldoInicial, transfIn: 0, transfOut: 0, aportes: 0, retiradas: 0 };
            const comp = investidorComposicao?.porConta?.[c.id] || { glover: 0, investidor: c.saldoInicial || 0 };
            return (
              <div
                className={`gf-card gf-account-card gf-account-card-clickable ${c.status !== "Ativa" ? "is-inactive" : ""}`}
                key={c.id} onClick={() => setDetailContaId(c.id)}
              >
                <div className="gf-card-head">
                  <div>
                    <div className="gf-eyebrow">{c.titular || "Conta Investidor"}{c.banco ? ` · ${c.banco}` : ""}</div>
                    <h3>{c.nome}</h3>
                  </div>
                  <div className="gf-row-actions">
                    <Badge tone="purple">Investidor</Badge>
                    <Badge tone={c.status === "Ativa" ? "green" : "gray"}>{c.status}</Badge>
                    {podeCadastrar && <button className="gf-icon-btn" title="Editar conta" onClick={(e) => { e.stopPropagation(); setEditingConta(c); }}><Pencil size={14} /></button>}
                  </div>
                </div>
                <div className="gf-account-rows">
                  <div><span>Saldo inicial</span><b className="mono">{BRL(c.saldoInicial)}</b></div>
                  <div><span>Gastos de obra</span><b className="mono neg">− {BRL(s.saidas)}</b></div>
                  {s.aportes ? <div><span>Aportes</span><b className="mono pos">+ {BRL(s.aportes)}</b></div> : null}
                  {s.retiradas ? <div><span>Retiradas</span><b className="mono neg">− {BRL(s.retiradas)}</b></div> : null}
                  {(s.transfIn || s.transfOut) ? (
                    <div><span>Transferências (líq.)</span><b className={`mono ${s.transfIn - s.transfOut >= 0 ? "pos" : "neg"}`}>{BRL(s.transfIn - s.transfOut)}</b></div>
                  ) : null}
                </div>
                <div className="gf-account-balance">
                  <span>Saldo atual</span>
                  <strong className={`mono ${s.saldoAtual >= 0 ? "pos" : "neg"}`}>{BRL(s.saldoAtual)}</strong>
                </div>
                {comp.glover > 0.004 && (
                  <div className="gf-field-hint" style={{ marginTop: 8 }}>
                    Composição: <b className="pos">Glover {BRL(comp.glover)}</b> · <b>{c.titular || "Investidor"} {BRL(comp.investidor)}</b>
                  </div>
                )}
                {c.observacoes && <p className="gf-field-hint" style={{ marginTop: 8 }}>{c.observacoes}</p>}
              </div>
            );
          })}
        </div>
      )}

      {(showNew || editingConta) && (
        <ContaInvestidorModal conta={editingConta} onClose={() => { setShowNew(false); setEditingConta(null); }} onSave={saveConta} />
      )}
      {showTransfer && (
        <TransferInvestidorModal
          contas={contasInvestidores.filter((c) => c.status === "Ativa")}
          accounts={accounts} obras={obras} investidorComposicao={investidorComposicao}
          onClose={() => setShowTransfer(false)} onSave={doOperacao}
        />
      )}
      {showAporte && (
        <AporteInvestidorModal contas={contasInvestidores.filter((c) => c.status === "Ativa")} accounts={accounts} obras={obras} onClose={() => setShowAporte(false)} onSave={doAporte} />
      )}
      {detailContaId && (
        <ContaInvestidorLancamentosModal
          conta={contasInvestidores.find((c) => c.id === detailContaId)}
          entries={entries.filter((e) => e.origemTipo === "CONTA_INVESTIDOR" && e.contaInvestidorId === detailContaId)}
          aportes={movimentosInvestidores.filter((m) => m.contaInvestidorId === detailContaId)}
          retiradas={retiradasInvestidores.filter((r) => r.contaInvestidorId === detailContaId)}
          transfIn={transfersInvestidores.filter((t) => t.destinoId === detailContaId)}
          transfOut={transfersInvestidores.filter((t) => t.origemId === detailContaId)}
          contasInvestidores={contasInvestidores}
          composicao={investidorComposicao?.porConta?.[detailContaId]}
          obras={obras}
          podeExcluirAporte={podeAportar} podeExcluirOutros={podeTransferir}
          onDelete={excluirMovimento}
          onClose={() => setDetailContaId(null)}
        />
      )}
    </div>
  );
}

function ContaInvestidorLancamentosModal({ conta, entries, aportes, retiradas, transfIn, transfOut, contasInvestidores, composicao, obras, onClose, onDelete, podeExcluirAporte = false, podeExcluirOutros = false }) {
  const obraName = (id) => (id === SEM_OBRA ? "Administrativo / Custos internos" : obras.find((o) => o.id === id)?.nome || "—");
  const contaNome = (id) => contasInvestidores.find((c) => c.id === id)?.nome || "—";

  const movs = [
    ...entries.map((e) => ({
      id: e.id, data: e.data, tipo: "Gasto de obra", descricao: e.descricao, fornecedor: e.fornecedor,
      obraId: e.obraId, apropriacao: e.apropriacao, valor: -Math.abs(e.valor), createdAt: e.createdAt || 0,
    })),
    ...aportes.map((m) => ({
      id: m.id, kind: "aporte", data: m.data, tipo: m.origemAporte === "GLOVER" ? "Aporte Glover" : "Aporte", descricao: m.descricao || "Aporte de recursos", fornecedor: "—",
      obraId: m.obraId || null, apropriacao: "—", valor: Math.abs(m.valor), createdAt: m.createdAt || 0,
    })),
    ...(retiradas || []).map((r) => ({
      id: r.id, kind: "retirada", data: r.data, tipo: r.tipo === "GLOVER" ? "Retirada Glover" : "Retirada Investidor",
      descricao: r.descricao || (r.tipo === "GLOVER" ? "Retirada para conta da Glover" : "Retirada do investidor"),
      fornecedor: "—", obraId: r.obraId || null, apropriacao: "—", valor: -Math.abs(r.valor), createdAt: r.createdAt || 0,
    })),
    ...transfIn.map((t) => ({
      id: t.id, kind: "transferencia", data: t.data, tipo: "Transferência recebida", descricao: t.descricao || `De: ${contaNome(t.origemId)}`, fornecedor: "—",
      obraId: null, apropriacao: "—", valor: Math.abs(t.valor), createdAt: t.createdAt || 0,
    })),
    ...transfOut.map((t) => ({
      id: t.id, kind: "transferencia", data: t.data, tipo: "Transferência enviada", descricao: t.descricao || `Para: ${contaNome(t.destinoId)}`, fornecedor: "—",
      obraId: null, apropriacao: "—", valor: -Math.abs(t.valor), createdAt: t.createdAt || 0,
    })),
  ];

  // ordem cronológica (mais antigo primeiro) para calcular o saldo corrente
  const cronologico = [...movs].sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : a.createdAt - b.createdAt));
  let running = Number(conta?.saldoInicial) || 0;
  const comSaldo = cronologico.map((m) => { running += m.valor; return { ...m, saldoApos: running }; });
  // exibição: mais recente primeiro
  const ordenados = [...comSaldo].reverse();

  const totalGastos = entries.reduce((s, e) => s + (Number(e.valor) || 0), 0);
  const totalAportes = aportes.reduce((s, m) => s + (Number(m.valor) || 0), 0);

  return (
    <Modal title={`${conta?.nome || "Conta Investidor"} — Movimentações`} onClose={onClose} width={860}>
      <div className="gf-summary-inline" style={{ marginBottom: 14 }}>
        <span>Saldo inicial <b className="mono">{BRL(conta?.saldoInicial || 0)}</b></span>
        <span>Aportes <b className="pos">+ {BRL(totalAportes)}</b></span>
        <span>Gastos de obra <b className="neg">− {BRL(totalGastos)}</b></span>
        <span>Saldo atual <b className={running >= 0 ? "pos" : "neg"}>{BRL(running)}</b></span>
      </div>
      {composicao && (
        <p className="gf-field-hint" style={{ marginBottom: 14 }}>
          Composição econômica do saldo atual: <b className="pos">Glover {BRL(composicao.glover)}</b> · <b>{conta?.titular || "Investidor"} {BRL(composicao.investidor)}</b>
        </p>
      )}
      <div className="gf-table-wrap">
        <table className="gf-table gf-table-ledger">
          <thead>
            <tr>
              <th>Data</th><th>Tipo</th><th>Descrição</th><th>Fornecedor</th><th>Centro de Custo</th><th>Apropriação</th>
              <th className="num">Valor</th><th className="num">Saldo após</th>{onDelete && <th></th>}
            </tr>
          </thead>
          <tbody>
            {ordenados.length === 0 && (
              <tr><td colSpan={9}><EmptyState icon={HandCoins} title="Nenhuma movimentação" body="Nenhum lançamento, aporte ou transferência registrado para esta conta ainda." /></td></tr>
            )}
            {ordenados.map((m) => (
              <tr key={`${m.tipo}-${m.id}`} className={m.valor >= 0 ? "row-pos" : "row-neg"}>
                <td>{fmtDate(m.data)}</td>
                <td><Badge tone={m.valor >= 0 ? "green" : "red"}>{m.tipo}</Badge></td>
                <td className="gf-td-desc" title={m.descricao}>{m.descricao || "—"}</td>
                <td>{m.fornecedor || "—"}</td>
                <td>{m.obraId ? obraName(m.obraId) : "—"}</td>
                <td>{m.apropriacao || "—"}</td>
                <td className={`num mono ${m.valor >= 0 ? "pos" : "neg"}`}>{m.valor >= 0 ? "+" : "−"} {BRL(Math.abs(m.valor))}</td>
                <td className="num mono">{BRL(m.saldoApos)}</td>
                {onDelete && (
                  <td>
                    {((m.kind === "aporte" && podeExcluirAporte) || ((m.kind === "retirada" || m.kind === "transferencia") && podeExcluirOutros)) && (
                      <button
                        className="gf-icon-btn danger" title={`Excluir ${m.tipo.toLowerCase()}`}
                        onClick={() => {
                          const extra = m.kind === "transferencia" ? " Ela será removida das duas contas envolvidas." : "";
                          if (window.confirm(`Excluir ${m.tipo.toLowerCase()} de ${BRL(Math.abs(m.valor))} (${fmtDate(m.data)})?${extra} Os saldos e a participação Glover x Investidor serão recalculados.`)) onDelete(m.kind, m.id);
                        }}
                      ><Trash2 size={14} /></button>
                    )}
                  </td>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

function ContaInvestidorModal({ conta, onClose, onSave }) {
  const [f, setF] = useState(conta || {
    nome: "", titular: "", banco: "", saldoInicial: "", observacoes: "", status: "Ativa",
  });
  const upd = (p) => setF((s) => ({ ...s, ...p }));
  const submit = (e) => {
    e.preventDefault();
    if (!f.nome || !f.titular) return;
    onSave({ ...f, saldoInicial: Number(f.saldoInicial) || 0 });
  };
  return (
    <Modal title={conta ? "Editar Conta Investidor" : "Nova Conta Investidor"} onClose={onClose}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Nome da conta"><input required value={f.nome} onChange={(e) => upd({ nome: e.target.value })} placeholder="Ex: Conta Cliente — Obra X" /></Field>
        <Field label="Titular / Cliente / Investidor"><input required value={f.titular} onChange={(e) => upd({ titular: e.target.value })} placeholder="Ex: Cliente ABC" /></Field>
        <Field label="Banco" hint="Opcional"><input value={f.banco} onChange={(e) => upd({ banco: e.target.value })} placeholder="Ex: Itaú" /></Field>
        <Field label="Saldo inicial (R$)"><input type="number" step="0.01" value={f.saldoInicial} onChange={(e) => upd({ saldoInicial: e.target.value })} /></Field>
        <Field label="Status">
          <select value={f.status} onChange={(e) => upd({ status: e.target.value })}>
            <option>Ativa</option><option>Inativa</option>
          </select>
        </Field>
        <Field label="Observações" className="gf-span-2" hint="Opcional">
          <textarea className="gf-textarea-mono" rows={3} value={f.observacoes} onChange={(e) => upd({ observacoes: e.target.value })} placeholder="Detalhes adicionais sobre esta conta…" />
        </Field>
        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">Salvar Conta Investidor</button>
        </div>
      </form>
    </Modal>
  );
}

function AporteInvestidorModal({ contas, accounts, obras, onClose, onSave }) {

    contaInvestidorId: contas[0]?.id || "", origemAporte: "INVESTIDOR",

    if (!f.contaInvestidorId || !f.valor) return;

    onSave({
      contaInvestidorId: f.contaInvestidorId, origemAporte: f.origemAporte,
      contaGloverId: f.origemAporte === "GLOVER" ? f.contaGloverId : null,

    <Modal title="Registrar aporte em Conta Investidor" onClose={onClose}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Conta Investidor" className="gf-span-2">
          <select required value={f.contaInvestidorId} onChange={(e) => upd({ contaInvestidorId: e.target.value })}>
