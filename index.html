<!-- "Atalho" de armazenamento: fora do Claude não existe window.storage, então esta
     versão implementa a mesma API usando o Supabase (dados compartilhados, na nuvem)
     para o que é de equipe, e a memória do navegador (localStorage) para o que é
     pessoal de cada dispositivo (ex: sessão de login). -->
<script>
(function () {
  const SUPABASE_URL = window.SUPABASE_URL || "";
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "";
  const configured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
  if (!configured) {
    document.getElementById("gf-config-banner").style.display = "block";
  }

  function personalKey(key) { return "gf-pessoal:" + key; }

  async function supabaseGet(key) {
    // Usamos apenas a opção "cache: no-store" do fetch para evitar cache — NUNCA um
    // parâmetro extra na URL, porque o Supabase (PostgREST) interpreta qualquer
    // parâmetro desconhecido como uma tentativa de filtro de busca (erro PGRST100).
    const url = SUPABASE_URL + "/rest/v1/kv_store?id=eq." + encodeURIComponent(key) + "&select=value";
    const res = await fetch(url, {
      cache: "no-store",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => "");
      throw new Error("Falha ao ler do Supabase (HTTP " + res.status + "): " + detail.slice(0, 200));
    }
    const rows = await res.json();
    if (!rows.length) throw new Error("chave não encontrada: " + key);
    return rows[0].value;
  }

  async function supabaseSet(key, value) {
    const url = SUPABASE_URL + "/rest/v1/kv_store?on_conflict=id";
    const res = await fetch(url, {
      method: "POST",
      cache: "no-store",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal",
      },
      body: JSON.stringify({ id: key, value: value, updated_at: new Date().toISOString() }),
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => "");
      throw new Error("Falha ao salvar no Supabase (HTTP " + res.status + "): " + detail.slice(0, 200));
    }
  }

  window.storage = {
    async get(key, shared) {
      if (shared && configured) {
        const value = await supabaseGet(key);
        return { key, value, shared: true };
      }
      const raw = localStorage.getItem(personalKey(key));
      if (raw === null) throw new Error("chave não encontrada: " + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      if (shared && configured) {
        await supabaseSet(key, value);
        return { key, value, shared: true };
      }
      localStorage.setItem(personalKey(key), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      if (shared && configured) return { key, deleted: true, shared: true };
      localStorage.removeItem(personalKey(key));
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      return { keys: [], prefix, shared: !!shared };
    },
  };
})();
</script>

   Usado em Lançamentos, Contas a Pagar e Cartão de Crédito (regra centralizada).

// Apropriações cadastradas para uma obra (via seção "Apropriações da obra" ou importação de
// orçamento). Retorna null quando a obra ainda não tem nenhuma cadastrada — nesse caso,
// tratamos como "sem restrição" (todas as apropriações do sistema continuam válidas), para
// não travar obras já existentes que ainda não foram configuradas com essa regra nova.
function apropriacoesDaObra(centroCustoId, orcamentoItens) {
  if (!centroCustoId || centroCustoId === SEM_OBRA) return null;
  const nomes = [...new Set(orcamentoItens.filter((o) => o.obraId === centroCustoId).map((o) => o.apropriacao))];
  return nomes.length ? nomes : null;
}

// Apropriações que um fornecedor atende. Retorna null quando o fornecedor ainda não tem
// nenhuma cadastrada (fornecedor antigo, de antes desta regra existir) — tratado como
// "sem restrição" pelo mesmo motivo acima.
function apropriacoesDoFornecedor(fornecedorNome, fornecedoresCadastro) {
  const f = fornecedoresCadastro.find((x) => x.nome === fornecedorNome);
  if (!f || !f.apropriacoesPermitidas || !f.apropriacoesPermitidas.length) return null;
  return f.apropriacoesPermitidas;
}

// Cruza as duas listas (interseção). Quando uma delas é null (sem restrição), usa só a outra.
// Quando as duas são null, não há nenhuma restrição — todas as apropriações do sistema valem.
function computeApropriacoesDisponiveis(centroCustoId, fornecedorNome, apropriacoesGlobais, orcamentoItens, fornecedoresCadastro) {
  const daObra = apropriacoesDaObra(centroCustoId, orcamentoItens);
  const doFornecedor = apropriacoesDoFornecedor(fornecedorNome, fornecedoresCadastro);
  if (daObra === null && doFornecedor === null) return apropriacoesGlobais;
  if (daObra === null) return doFornecedor;
  if (doFornecedor === null) return daObra;
  return daObra.filter((a) => doFornecedor.includes(a));
}

function addPeriodo(dataISO, periodicidade, customDias) {
  const d = new Date(dataISO + "T00:00:00");
  switch (periodicidade) {
    case "semanal": d.setDate(d.getDate() + 7); break;
    case "quinzenal": d.setDate(d.getDate() + 15); break;

  }
  return d.toISOString().slice(0, 10);
}

// Distribui um valor de referência entre centros de custo conforme percentuais,
// garantindo que a soma feche exatamente (o último item absorve o arredondamento).
function computeRateioValores(percentuais, valorRef) {
  const n = percentuais.length;
  let acumulado = 0;
  return percentuais.map((p, i) => {
    let valor;
    if (i === n - 1) valor = Math.round((valorRef - acumulado) * 100) / 100;
    else { valor = Math.round(((Number(p.percentual) || 0) / 100) * valorRef * 100) / 100; acumulado += valor; }
    return { centroCusto: p.centroCusto, percentual: Number(p.percentual) || 0, valor };
  });
}

// Rateia proporcionalmente um acréscimo/desconto total entre os itens de rateio já existentes.
function rateiaAcrescimo(rateio, acrescimoTotal) {
  const n = rateio.length;
  let acumulado = 0;
  return rateio.map((r, i) => {
    let acrescimo;
    if (i === n - 1) acrescimo = Math.round((acrescimoTotal - acumulado) * 100) / 100;
    else { acrescimo = Math.round(((r.percentual || 0) / 100) * acrescimoTotal * 100) / 100; acumulado += acrescimo; }
    return { ...r, acrescimo, valorFinal: Math.round((r.valor + acrescimo) * 100) / 100 };
  });
}

const ORCAMENTO_STATUS_TONE = { verde: "green", amarelo: "orange", vermelho: "red" };
function orcamentoStatusTone(pct) {
  if (pct > 100) return "vermelho";
  if (pct >= 80) return "amarelo";
  return "verde";
}

// Calcula, para uma obra, o orçado/comprometido/realizado por apropriação.
// Comprometido = Realizado (já pago) + Pendente (contas a pagar em aberto, não canceladas).
// Realizado vem dos lançamentos reais (entries), o que cobre tanto baixas de contas a pagar
// quanto lançamentos diretos feitos na página Lançamentos.
function computeOrcamentoObra(obraId, orcamentoItens, contasPagar, entries) {
  const orcadoPorApropriacao = {};
  orcamentoItens.filter((o) => o.obraId === obraId).forEach((o) => {
    orcadoPorApropriacao[o.apropriacao] = (orcadoPorApropriacao[o.apropriacao] || 0) + (Number(o.valorTotal) || 0);
  });

  const realizadoPorApropriacao = {};
  entries.filter((e) => e.tipo === "saida" && e.obraId === obraId).forEach((e) => {
    realizadoPorApropriacao[e.apropriacao] = (realizadoPorApropriacao[e.apropriacao] || 0) + (Number(e.valor) || 0);
  });

  const pendentePorApropriacao = {};
  contasPagar.filter((c) => !c.pagamento && !c.cancelada).forEach((c) => {
    (c.rateio || []).filter((r) => r.centroCusto === obraId).forEach((r) => {
      pendentePorApropriacao[c.apropriacao] = (pendentePorApropriacao[c.apropriacao] || 0) + (Number(r.valor) || 0);
    });
  });

  const apropriacoesEnvolvidas = new Set([
    ...Object.keys(orcadoPorApropriacao), ...Object.keys(realizadoPorApropriacao), ...Object.keys(pendentePorApropriacao),
  ]);

  const linhas = [...apropriacoesEnvolvidas].map((apropriacao) => {
    const orcado = orcadoPorApropriacao[apropriacao] || 0;
    const realizado = realizadoPorApropriacao[apropriacao] || 0;
    const pendente = pendentePorApropriacao[apropriacao] || 0;
    const comprometido = realizado + pendente;
    const saldo = orcado - comprometido;
    const pct = orcado > 0 ? (comprometido / orcado) * 100 : (comprometido > 0 ? 999 : 0);
    return { apropriacao, orcado, realizado, pendente, comprometido, saldo, pct, status: orcamentoStatusTone(pct) };
  }).sort((a, b) => b.orcado - a.orcado || b.comprometido - a.comprometido);

  const totais = linhas.reduce((acc, l) => ({
    orcado: acc.orcado + l.orcado, realizado: acc.realizado + l.realizado,
    pendente: acc.pendente + l.pendente, comprometido: acc.comprometido + l.comprometido,
  }), { orcado: 0, realizado: 0, pendente: 0, comprometido: 0 });
  totais.saldo = totais.orcado - totais.comprometido;
  totais.pct = totais.orcado > 0 ? (totais.comprometido / totais.orcado) * 100 : 0;

  return { linhas, totais, temOrcamento: Object.keys(orcadoPorApropriacao).length > 0 };
}

// Verifica, para um centro de custo + apropriação específicos, o que aconteceria
// se um novo valor fosse comprometido (usado no alerta ao lançar uma conta a pagar).
function checarAlertaOrcamento(obraId, apropriacao, valorNovo, orcamentoItens, contasPagar, entries) {
  if (!obraId || obraId === SEM_OBRA) return null;
  const { linhas } = computeOrcamentoObra(obraId, orcamentoItens, contasPagar, entries);
  const linha = linhas.find((l) => l.apropriacao === apropriacao);
  const orcado = linha?.orcado || 0;
  if (orcado <= 0) return null; // sem orçamento importado para esta apropriação
  const comprometidoAtual = linha?.comprometido || 0;
  const novoComprometido = comprometidoAtual + valorNovo;
  const pctNovo = (novoComprometido / orcado) * 100;
  const estouro = novoComprometido - orcado;
  return { orcado, comprometidoAtual, novoComprometido, pctNovo, estouro, ultrapassa: estouro > 0, atencao: pctNovo >= 80 };
}

/* ---------------------------------------------------------------
   Participação Glover x Investidores — composição econômica das Contas Investidores

   Cada Conta Investidor mistura, ao longo do tempo, recursos de duas origens:
   - "glover": dinheiro que a Glover aportou naquela conta (empréstimo/adiantamento);
   - "investidor": dinheiro que é originalmente do titular da conta.

   Sempre que um gasto de obra é pago por uma Conta Investidor, ele consome as duas origens
   PROPORCIONALMENTE à composição da conta naquele exato momento — isso é o que impede a dupla
   contagem: um aporte da Glover só "aparece" como participação Glover quando efetivamente
   gasto (ou permanece como saldo não utilizado, fora do realizado da obra).

   Processamos TODOS os eventos que afetam QUALQUER Conta Investidor em uma única ordem
   cronológica global (data + hora de criação), porque uma transferência liga duas contas e
   precisa que a origem já esteja com a composição correta no momento da saída.
--------------------------------------------------------------- */
function computeInvestidorComposicao(contasInvestidores, entries, movimentosInvestidores, transfersInvestidores, retiradasInvestidores) {
  const comp = {}; // contaId -> { glover, investidor }
  const porGasto = {}; // entryId -> { glover, investidor }
  const ensure = (contaId) => { if (!comp[contaId]) comp[contaId] = { glover: 0, investidor: 0 }; return comp[contaId]; };

  contasInvestidores.forEach((c) => {
    ensure(c.id).investidor = Number(c.saldoInicial) || 0;
  });

  const eventos = [];
  entries.forEach((e) => {
    if (e.origemTipo === "CONTA_INVESTIDOR" && e.tipo === "saida" && e.contaInvestidorId) {
      eventos.push({ contaId: e.contaInvestidorId, kind: "gasto", valor: Number(e.valor) || 0, data: e.data, createdAt: e.createdAt || 0, refId: e.id });
    }
  });
  (movimentosInvestidores || []).forEach((m) => {
    eventos.push({
      contaId: m.contaInvestidorId,
      kind: m.origemAporte === "GLOVER" ? "aporteGlover" : "aporteInvestidor",
      valor: Number(m.valor) || 0, data: m.data, createdAt: m.createdAt || 0, refId: m.id,
    });
  });
  (retiradasInvestidores || []).forEach((r) => {
    eventos.push({
      contaId: r.contaInvestidorId,
      kind: r.tipo === "GLOVER" ? "retiradaGlover" : "retiradaInvestidor",
      valor: Number(r.valor) || 0, data: r.data, createdAt: r.createdAt || 0, refId: r.id,
    });
  });
  const pendingTransfer = {};
  (transfersInvestidores || []).forEach((t) => {
    eventos.push({ contaId: t.origemId, kind: "transferOut", valor: Number(t.valor) || 0, data: t.data, createdAt: t.createdAt || 0, refId: t.id });
    eventos.push({ contaId: t.destinoId, kind: "transferIn", valor: Number(t.valor) || 0, data: t.data, createdAt: (t.createdAt || 0) + 0.5, refId: t.id });
  });

  eventos.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : a.createdAt - b.createdAt));

  eventos.forEach((ev) => {
    const c = ensure(ev.contaId);
    if (ev.kind === "aporteInvestidor") { c.investidor += ev.valor; return; }
    if (ev.kind === "aporteGlover") { c.glover += ev.valor; return; }
    if (ev.kind === "retiradaGlover") { c.glover = Math.max(0, c.glover - ev.valor); return; }
    if (ev.kind === "retiradaInvestidor") { c.investidor = Math.max(0, c.investidor - ev.valor); return; }
    if (ev.kind === "gasto") {
      const total = c.glover + c.investidor;
      const ratioGlover = total > 0 ? c.glover / total : 0;
      const gloverParte = ev.valor * ratioGlover;
      const investidorParte = ev.valor - gloverParte;
      c.glover = Math.max(0, c.glover - gloverParte);
      c.investidor = Math.max(0, c.investidor - investidorParte);
      porGasto[ev.refId] = { glover: gloverParte, investidor: investidorParte };
      return;
    }
    if (ev.kind === "transferOut") {
      const total = c.glover + c.investidor;
      const ratioGlover = total > 0 ? c.glover / total : 0;
      const gloverParte = ev.valor * ratioGlover;
      const investidorParte = ev.valor - gloverParte;
      c.glover = Math.max(0, c.glover - gloverParte);
      c.investidor = Math.max(0, c.investidor - investidorParte);
      pendingTransfer[ev.refId] = { glover: gloverParte, investidor: investidorParte };
      return;
    }
    if (ev.kind === "transferIn") {
      const parte = pendingTransfer[ev.refId] || { glover: 0, investidor: ev.valor };
      c.glover += parte.glover;
      c.investidor += parte.investidor;
      return;
    }
  });

  return { porConta: comp, porGasto };
}

// Participação financeira (Glover x cada Conta Investidor) de UMA obra, a partir do split
// econômico de cada gasto (porGasto) calculado por computeInvestidorComposicao.
function computeObraParticipacao(obraId, entries, contasInvestidores, porGasto) {
  let gloverTotal = 0;
  const porInvestidor = {}; // contaInvestidorId -> valor
  let totalGeral = 0;

  entries.filter((e) => e.obraId === obraId && e.tipo === "saida").forEach((e) => {
    const valor = Number(e.valor) || 0;
    totalGeral += valor;
    if (e.origemTipo === "CONTA_INVESTIDOR" && e.contaInvestidorId) {
      const split = porGasto[e.id] || { glover: 0, investidor: valor };
      gloverTotal += split.glover;
      porInvestidor[e.contaInvestidorId] = (porInvestidor[e.contaInvestidorId] || 0) + split.investidor;
    } else {
      gloverTotal += valor;
    }
  });

  const participantes = Object.entries(porInvestidor)
    .filter(([, valor]) => valor > 0.004)
    .map(([contaId, valor]) => {
      const conta = contasInvestidores.find((c) => c.id === contaId);
      return { contaId, nome: conta?.nome || "Conta Investidor", titular: conta?.titular || "", valor, pct: totalGeral > 0 ? (valor / totalGeral) * 100 : 0 };
    })
    .sort((a, b) => b.valor - a.valor);

  return {
    totalGeral, gloverTotal, gloverPct: totalGeral > 0 ? (gloverTotal / totalGeral) * 100 : 0,
    participantes, temInvestidor: participantes.length > 0,
  };
}

const TIPOS_DIVIDA = ["Empréstimo", "Financiamento", "Cheque especial", "Cartão de crédito", "Outro"];
const SISTEMAS_AMORTIZACAO = ["SAC", "PRICE", "Não se aplica", "Outro"];

function computeDividaStats(divida, entries) {
  const pagamentos = entries.filter((e) => e.dividaId === divida.id && e.dividaSubtipo === "pagamento");
  const totalAmortizado = pagamentos.reduce((s, e) => s + (Number(e.amortizacao) || 0), 0);
  const jurosPagos = pagamentos.reduce((s, e) => s + (Number(e.juros) || 0), 0);
  const encargosPagos = pagamentos.reduce((s, e) => s + (Number(e.encargos) || 0), 0);
  const parcelasPagas = pagamentos.length;
  const saldoDevedor = Math.max(0, (Number(divida.valorContratado) || 0) - totalAmortizado);
  const parcelasRestantes = Math.max(0, (Number(divida.qtdParcelas) || 0) - parcelasPagas);
  const totalDesembolsado = totalAmortizado + jurosPagos + encargosPagos;
  return { totalAmortizado, jurosPagos, encargosPagos, parcelasPagas, parcelasRestantes, saldoDevedor, totalDesembolsado, pagamentos };
}

function computeInvestimentoStats(investimento, entries) {
  const relacionados = entries.filter((e) => e.investimentoId === investimento.id);
  const aportes = relacionados.filter((e) => e.investimentoSubtipo === "aporte").reduce((s, e) => s + (Number(e.valor) || 0), 0);
  const resgates = relacionados.filter((e) => e.investimentoSubtipo === "resgate").reduce((s, e) => s + (Number(e.valor) || 0), 0);
  const rendimentos = relacionados.filter((e) => e.investimentoSubtipo === "rendimento").reduce((s, e) => s + (Number(e.valor) || 0), 0);
  const principalLiquido = (Number(investimento.valorAplicado) || 0) + aportes - resgates;
  const valorAtual = principalLiquido + rendimentos;
  const rentabilidade = principalLiquido > 0 ? (rendimentos / principalLiquido) * 100 : 0;
  return { aportes, resgates, rendimentos, principalLiquido, valorAtual, rentabilidade, relacionados };
}

function weekRange() {
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return { monday: monday.toISOString().slice(0, 10), sunday: sunday.toISOString().slice(0, 10) };
}

function addDaysISO(iso, days) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// Migra a antiga lista de nomes de fornecedores (texto livre) para o cadastro formal.
// Se já existir um cadastro salvo, usa ele; senão, reconstrói a partir do histórico.
function migrarFornecedoresCadastro(d) {
  if (d.fornecedoresCadastro && d.fornecedoresCadastro.length) return d.fornecedoresCadastro;
  const nomes = new Set(d.fornecedoresSeed || []);
  (d.entries || []).forEach((e) => { if (e.fornecedor && e.fornecedor !== "Não se aplica") nomes.add(e.fornecedor); });
  (d.contasPagar || []).forEach((c) => { if (c.fornecedor) nomes.add(c.fornecedor); });
  return [...nomes].filter(Boolean).sort((a, b) => a.localeCompare(b, "pt-BR")).map((nome) => ({
    id: uid("forn"), nome, documento: "", telefone: "", email: "", observacao: "", ativo: true,
  }));
}

// Preenche, com valores padrão sensatos, quaisquer permissões novas que ainda não existiam
// quando os usuários foram salvos pela última vez (ex.: a permissão de aprovar lançamentos).
// Admins recebem as novas permissões como "true" (mesmo padrão de quando são criados);
// os demais recebem "false" (padrão seguro).
function migrarPermissoesUsuarios(usuariosSalvos) {
  if (!usuariosSalvos || !usuariosSalvos.length) return DEFAULT_USUARIOS;
  const migrados = usuariosSalvos.map((u) => ({
    ...u,
    perms: { ...(u.papel === "admin" ? permsAllTrue() : u.papel === "gestor_obra" ? { ...permsAllFalse(), ...GESTOR_PERMS } : u.papel === "operacional" ? { ...permsAllFalse(), ...ASSISTENTE_PERMS } : permsAllFalse()), ...u.perms },
  }));
  // Gestores de obra padrão (André, Izabella, Leonardo): criados uma vez se ainda não existirem.
  const faltando = DEFAULT_USUARIOS.filter((d) => d.papel === "gestor_obra" && !migrados.some((u) => u.id === d.id));
  return [...migrados, ...faltando];
}

// Campo de seleção com busca (combobox). options: [{ value, label }].
// extraOptions (opcional): um segundo grupo (ex.: obras arquivadas/concluídas) escondido por padrão
// atrás de um item expansível "extraLabel" — ao digitar uma busca, os dois grupos são pesquisados juntos.
function SearchableSelect({ value, onChange, options, placeholder = "Buscar…", disabled = false, error = false, extraOptions = null, extraLabel = "Obras Concluídas" }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [extraOpen, setExtraOpen] = useState(false);
  const wrapRef = useRef(null);
  const extraRef = useRef(null);

  useEffect(() => {
    const onClickOutside = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) { setOpen(false); setQuery(""); setExtraOpen(false); } };
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  // Garante que, ao abrir o grupo "Obras Concluídas", a lista role automaticamente até ele —
  // sem isso, se o grupo ficar perto do fim da área visível, os itens revelados pareciam "não aparecer".
  useEffect(() => {
    if (extraOpen && extraRef.current) {
      extraRef.current.scrollIntoView({ block: "nearest" });
    }
  }, [extraOpen]);

  const temExtra = !!(extraOptions && extraOptions.length);
  const selected = options.find((o) => o.value === value) || (temExtra && extraOptions.find((o) => o.value === value));
  const q = query.trim().toLowerCase();
  const filtered = q ? options.filter((o) => o.label.toLowerCase().includes(q)) : options;
  const filteredExtra = temExtra && q ? extraOptions.filter((o) => o.label.toLowerCase().includes(q)) : [];

  const renderItem = (o, isExtra) => (
    <div
      key={o.value} className={`gf-searchselect-item ${o.value === value ? "is-selected" : ""}`}
      onClick={() => { onChange(o.value); setOpen(false); setQuery(""); setExtraOpen(false); }}
    >
      <span>{o.label}{isExtra && <span className="gf-searchselect-tag">Concluída</span>}</span>
      {o.value === value && <Check size={13} />}
    </div>
  );

  return (
    <div className={`gf-searchselect ${disabled ? "is-disabled" : ""} ${error ? "is-error" : ""}`} ref={wrapRef}>
      <button
        type="button" className="gf-searchselect-trigger" disabled={disabled}
        onClick={() => { setOpen((v) => !v); setQuery(""); setExtraOpen(false); }}
      >
        <span className={selected ? "" : "gf-searchselect-placeholder"}>{selected ? selected.label : placeholder}</span>
        <Search size={13} />
      </button>
      {open && (
        <div className="gf-searchselect-panel">
          <input autoFocus placeholder="Digite para buscar…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <div className="gf-searchselect-list">
            {filtered.length === 0 && filteredExtra.length === 0 && <div className="gf-searchselect-empty">Nenhum resultado encontrado</div>}
            {filtered.map((o) => renderItem(o, false))}
            {q && filteredExtra.map((o) => renderItem(o, true))}
            {!q && temExtra && (
              <div ref={extraRef}>
                <div className="gf-searchselect-group" onClick={() => setExtraOpen((v) => !v)}>
                  <Archive size={12} /> {extraLabel} ({extraOptions.length}) <ChevronRight size={12} className={extraOpen ? "gf-rot90" : ""} />
                </div>
                {extraOpen && extraOptions.map((o) => renderItem(o, true))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// Campo de Apropriação centralizado: fica bloqueado até Centro de Custo + Fornecedor serem
// escolhidos; depois mostra só as apropriações compatíveis com os dois; permite adicionar uma
// apropriação excepcional (via "+") válida somente para este lançamento específico.
function ApropriacaoField({ value, onChange, centroCustoId, centroCustoPreenchido, fornecedorNome, apropriacoesGlobais, orcamentoItens, fornecedoresCadastro, excecoes, onAddExcecao, error }) {
  const [addingExcecao, setAddingExcecao] = useState(false);
  const [novaExcecao, setNovaExcecao] = useState("");

  const prontoParaLiberar = (centroCustoPreenchido !== undefined ? centroCustoPreenchido : !!centroCustoId) && !!fornecedorNome;
  const disponiveis = prontoParaLiberar
    ? computeApropriacoesDisponiveis(centroCustoId, fornecedorNome, apropriacoesGlobais, orcamentoItens, fornecedoresCadastro)
    : [];
  const opcoesFinais = [...new Set([...disponiveis, ...excecoes])];

  const confirmarExcecao = () => {
    const v = novaExcecao.trim();
    if (!v) return;
    onAddExcecao(v);
    onChange(v);
    setNovaExcecao(""); setAddingExcecao(false);
  };

  if (!prontoParaLiberar) {
    return (
      <div className="gf-locked-field" title="Selecione o Centro de custo e o Fornecedor primeiro">
        <span>Selecione Centro de custo e Fornecedor primeiro</span>
        <Lock size={14} />
      </div>
    );
  }

  return (
    <div>
      {!addingExcecao ? (
        <div className="gf-inline-select">
          <select className={error ? "gf-input-error" : ""} value={value} onChange={(e) => onChange(e.target.value)}>
            <option value="" disabled>{opcoesFinais.length ? "Selecione…" : "Nenhuma apropriação disponível"}</option>
            {opcoesFinais.map((a) => <option key={a} value={a}>{a}{excecoes.includes(a) ? " (excepcional)" : ""}</option>)}
          </select>
          <button type="button" className="gf-icon-btn" title="Adicionar apropriação excepcional para este lançamento" onClick={() => setAddingExcecao(true)}>
            <Plus size={15} />
          </button>
        </div>
      ) : (
        <div className="gf-inline-select">
          <input autoFocus placeholder="Nova apropriação (só para este lançamento)" value={novaExcecao}
            onChange={(e) => setNovaExcecao(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), confirmarExcecao())} />
          <button type="button" className="gf-icon-btn" onClick={confirmarExcecao}><Check size={15} /></button>
          <button type="button" className="gf-icon-btn" onClick={() => setAddingExcecao(false)}><X size={15} /></button>
        </div>
      )}
      {opcoesFinais.length === 0 && !addingExcecao && (
        <p className="gf-warn" style={{ marginTop: 6 }}>Não existe apropriação disponível para este fornecedor neste centro de custo. Use o botão "+" para uma apropriação excepcional.</p>
      )}
    </div>
  );
}

  const [saveError, setSaveError] = useState(null);

  const lastRemoteJson = useRef(null);

  const applyRemoteData = (d) => {
    setAccounts(d.accounts || []);

    setApropriacoes(d.apropriacoes && d.apropriacoes.length ? d.apropriacoes : DEFAULT_APROPRIACOES);

    setSocios(d.socios && d.socios.length ? d.socios : DEFAULT_SOCIOS);

    setContasInvestidores(d.contasInvestidores || []);

    setProgramacoesPagamento(d.programacoesPagamento || []);

  };

  const applySeedData = () => {
    const seed = seedData();
    setAccounts(seed.accounts);
    setObras(seed.obras);
    setApropriacoes(seed.apropriacoes);
    setEntries(seed.entries);
    setTransfers(seed.transfers);
    setFornecedoresSeed(seed.fornecedoresSeed);
    setFornecedoresCadastro(seed.fornecedoresCadastro || []);
    setSocios(seed.socios);
    setMovimentosSocios(seed.movimentosSocios);
    setContasInvestidores([]);
    setMovimentosInvestidores([]);
    setTransfersInvestidores([]);
    setRetiradasInvestidores([]);
    setContasPagar(seed.contasPagar || []);
    setOrcamentoItens(seed.orcamentoItens || []);
    setDividas(seed.dividas || []);
    setInvestimentos(seed.investimentos || []);
    setDisciplinas(DEFAULT_DISCIPLINAS);
    setPlanejamentosSemanais([]);
    setCartoesCredito(seed.cartoesCredito || []);
    setLancamentosCartao(seed.lancamentosCartao || []);
    setFaturasCartao(seed.faturasCartao || []);
    setGerContasPagar([]); setGerDepositos([]); setGerReembolsos([]); setGerRemessas([]);
    setUsuarios(DEFAULT_USUARIOS);
  };

  // Carregar dados salvos — os dados do negócio são COMPARTILHADOS (toda a equipe vê o mesmo),
  // a sessão de login é PESSOAL (cada dispositivo guarda o seu próprio usuário logado).
  const [loadError, setLoadError] = useState(null);

  const carregarDados = async () => {
    setLoadError(null);
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) {
        applyRemoteData(JSON.parse(res.value));
        lastRemoteJson.current = res.value;
      } else {
        // Banco de dados genuinamente vazio (primeiríssima vez usando o sistema) — aqui sim
        // é seguro carregar os dados de exemplo, pois não existe nada real para perder.
        applySeedData();
      }
      try {
        const sess = await window.storage.get(SESSION_KEY, false);
        if (sess && sess.value) setCurrentUserId(JSON.parse(sess.value).currentUserId || null);
      } catch (e) { /* sem sessão salva ainda */ }
      setReady(true);
    } catch (e) {
      // IMPORTANTíSSIMO: uma falha ao buscar os dados (internet instável, banco de dados
      // indisponível por um instante, etc.) NUNCA pode ser tratada como "banco vazio" — isso
      // já causou perda real de dados. Em caso de erro, mostramos uma tela de erro com opção
      // de tentar novamente, e jamais carregamos (e muito menos salvamos) dados de exemplo
      // por cima de dados reais só porque a conexão falhou momentaneamente.
      setLoadError((e && e.message) || "Não foi possível conectar ao banco de dados.");
    }
  };

  useEffect(() => { carregarDados(); }, []);

  // Salvar dados do negócio (compartilhado entre todos os usuários da equipe).
  // Importante: comparamos o conteúdo que vamos gravar com o último conteúdo remoto conhecido.
  // Se forem idênticos, não há nada novo para salvar (ex.: acabamos de receber essa mesma
  // informação pela verificação automática) — evita gravações redundantes SEM correr o risco
  // de "pular" por engano uma mudança local genuína que aconteceu quase ao mesmo tempo.
  useEffect(() => {
    if (!ready) return;
    if (firstLoad.current) { firstLoad.current = false; return; }
    const t = setTimeout(async () => {
      try {
        // Sessão de investidor é estritamente somente leitura: nunca grava no banco compartilhado.
        if (isInvestidor(usuarios.find((u) => u.id === currentUserId))) return;
        const json = JSON.stringify({ accounts, obras, apropriacoes, entries, transfers, fornecedoresSeed, fornecedoresCadastro, socios, movimentosSocios, contasInvestidores, movimentosInvestidores, transfersInvestidores, retiradasInvestidores, contasPagar, orcamentoItens, dividas, investimentos, disciplinas, planejamentosSemanais, programacoesPagamento, contratosFornecedor, cartoesCredito, lancamentosCartao, faturasCartao, gerContasPagar, gerDepositos, gerReembolsos, gerRemessas, usuarios, auditLog });
        if (json === lastRemoteJson.current) return;
        await window.storage.set(STORAGE_KEY, json, true);
        lastRemoteJson.current = json;
        setSavedTick(Date.now());
        setSaveError(null);
      } catch (e) {
        setSaveError((e && e.message) || "Erro ao salvar os dados compartilhados");
      }
    }, 350);
    return () => clearTimeout(t);
  }, [accounts, obras, apropriacoes, entries, transfers, fornecedoresSeed, fornecedoresCadastro, socios, movimentosSocios, contasInvestidores, movimentosInvestidores, transfersInvestidores, retiradasInvestidores, contasPagar, orcamentoItens, dividas, investimentos, disciplinas, planejamentosSemanais, programacoesPagamento, contratosFornecedor, cartoesCredito, lancamentosCartao, faturasCartao, gerContasPagar, gerDepositos, gerReembolsos, gerRemessas, usuarios, auditLog, ready]);

  // Verifica periodicamente se alguém da equipe salvou algo novo, e atualiza a tela sozinho
  // (assim, se uma pessoa lança algo em um computador, as outras veem sem precisar recarregar a página).
  useEffect(() => {
    if (!ready) return;
    const interval = setInterval(async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        if (res && res.value && res.value !== lastRemoteJson.current) {
          lastRemoteJson.current = res.value;
          applyRemoteData(JSON.parse(res.value));
          setSavedTick(Date.now());
        }
        setSaveError(null);
      } catch (e) {
        setSaveError((e && e.message) || "Erro ao verificar atualizações");
      }
    }, 6000);
    return () => clearInterval(interval);
  }, [ready]);

  // Salvar sessão de login (pessoal deste dispositivo/navegador — não é compartilhada)
  useEffect(() => {
    if (!ready) return;
    if (firstLoadSession.current) { firstLoadSession.current = false; return; }
    window.storage.set(SESSION_KEY, JSON.stringify({ currentUserId }), false).catch(() => {});
  }, [currentUserId, ready]);

  const currentUser = usuarios.find((u) => u.id === currentUserId) || null;
  const ehInvestidor = isInvestidor(currentUser);
  const ehGestor = isGestor(currentUser);
  const page = ehInvestidor && !INVESTIDOR_PAGES.includes(pageRaw) ? "obras"
    : ehGestor && !GESTOR_PAGES.includes(pageRaw) ? "planejamentosemanal" : pageRaw;

  const logAudit = (entry) => {
    setAuditLog((prev) => [{
      id: uid("aud"), data: nowStamp(), usuario: currentUser?.nome || "—", ...entry,
    }, ...prev].slice(0, 500));
  };

  const resetDemo = async () => {
    if (!window.confirm("Isso vai apagar os dados atuais para TODA A EQUIPE e recarregar os dados de exemplo. Continuar?")) return;
    const seed = seedData();
    setAccounts(seed.accounts); setObras(seed.obras); setApropriacoes(seed.apropriacoes);
    setEntries(seed.entries); setTransfers(seed.transfers); setFornecedoresSeed(seed.fornecedoresSeed);
    setFornecedoresCadastro(seed.fornecedoresCadastro || []);
    setSocios(seed.socios); setMovimentosSocios(seed.movimentosSocios); setContasPagar(seed.contasPagar || []);
    setOrcamentoItens(seed.orcamentoItens || []);
    setDividas(seed.dividas || []); setInvestimentos(seed.investimentos || []);
    setCartoesCredito(seed.cartoesCredito || []); setLancamentosCartao(seed.lancamentosCartao || []); setFaturasCartao(seed.faturasCartao || []);
    setContasInvestidores([]); setMovimentosInvestidores([]); setTransfersInvestidores([]); setRetiradasInvestidores([]);
    setDisciplinas(DEFAULT_DISCIPLINAS); setPlanejamentosSemanais([]); setProgramacoesPagamento([]); setContratosFornecedor([]);
  };

  const clearAll = async () => {
    if (!window.confirm("Isso vai apagar TODOS os dados (contas, obras, lançamentos) para TODA A EQUIPE. Continuar?")) return;
    setAccounts([]); setObras([]); setEntries([]); setTransfers([]); setFornecedoresSeed([]);
    setFornecedoresCadastro([]);
    setApropriacoes(DEFAULT_APROPRIACOES);
    setMovimentosSocios([]); setSocios(DEFAULT_SOCIOS); setContasPagar([]); setOrcamentoItens([]);
    setDividas([]); setInvestimentos([]);
    setCartoesCredito([]); setLancamentosCartao([]); setFaturasCartao([]);
    setGerContasPagar([]); setGerDepositos([]); setGerReembolsos([]); setGerRemessas([]);
    setContasInvestidores([]); setMovimentosInvestidores([]); setTransfersInvestidores([]); setRetiradasInvestidores([]);
    setDisciplinas(DEFAULT_DISCIPLINAS); setPlanejamentosSemanais([]); setProgramacoesPagamento([]); setContratosFornecedor([]);
  };

  const exportarBackup = () => {
    const dados = {
      accounts, obras, apropriacoes, entries, transfers, fornecedoresSeed, fornecedoresCadastro,
      socios, movimentosSocios, contasInvestidores, movimentosInvestidores, transfersInvestidores, retiradasInvestidores,
      contasPagar, orcamentoItens, dividas, investimentos, disciplinas, planejamentosSemanais, programacoesPagamento, contratosFornecedor,
      cartoesCredito, lancamentosCartao, faturasCartao, gerContasPagar, gerDepositos, gerReembolsos, gerRemessas, usuarios, auditLog,
      exportadoEm: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const carimbo = new Date().toISOString().slice(0, 16).replace(/[-T:]/g, "");
    a.href = url;
    a.download = `backup-glover-financeiro-${carimbo}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importarBackup = (file) => {
    if (!file) return;
    if (!window.confirm("Isso vai SUBSTITUIR os dados atuais (de toda a equipe) pelo conteúdo deste arquivo de backup. Continuar?")) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const dados = JSON.parse(e.target.result);
        applyRemoteData(dados);
        logAudit?.({ tipoOperacao: "Restauração de backup", registroAlterado: "Sistema", valorAnterior: "—", valorNovo: dados.exportadoEm || "arquivo importado" });
      } catch (err) {
        window.alert("Não foi possível ler este arquivo. Verifique se é um backup válido gerado pelo próprio sistema.");
      }
    };
    reader.readAsText(file);
  };

  /* --------------------- cálculos derivados --------------------- */

  const accountStats = useMemo(() => {
    const map = {};
    accounts.forEach((a) => (map[a.id] = { entradas: 0, saidas: 0 }));
    entries.forEach((e) => {
      if (!map[e.contaId]) return;
      if (e.tipo === "entrada") map[e.contaId].entradas += Number(e.valor) || 0;
      else map[e.contaId].saidas += Number(e.valor) || 0;
    });
    const transfIn = {}, transfOut = {};
    transfers.forEach((t) => {
      transfIn[t.destinoId] = (transfIn[t.destinoId] || 0) + Number(t.valor);
      transfOut[t.origemId] = (transfOut[t.origemId] || 0) + Number(t.valor);
    });
    const socioIn = {}, socioOut = {};
    movimentosSocios.forEach((m) => {
      if (m.tipo === "aporte") socioIn[m.contaId] = (socioIn[m.contaId] || 0) + Number(m.valor);
      else socioOut[m.contaId] = (socioOut[m.contaId] || 0) + Number(m.valor); // retirada e pró-labore saem do caixa
    });
    // Aportes/retiradas da Glover em Contas Investidores também passam pela conta bancária da
    // empresa escolhida — mas NUNCA como lançamento de despesa/receita da obra (não usam `entries`).
    const investOut = {}, investIn = {};
    movimentosInvestidores.forEach((m) => {
      if (m.origemAporte === "GLOVER" && m.contaGloverId) {
        investOut[m.contaGloverId] = (investOut[m.contaGloverId] || 0) + Number(m.valor);
      }
    });
    retiradasInvestidores.forEach((r) => {
      if (r.tipo === "GLOVER" && r.contaGloverDestinoId) {
        investIn[r.contaGloverDestinoId] = (investIn[r.contaGloverDestinoId] || 0) + Number(r.valor);
      }
    });
    accounts.forEach((a) => {
      const s = map[a.id];
      s.transfIn = transfIn[a.id] || 0;
      s.transfOut = transfOut[a.id] || 0;
      s.socioIn = socioIn[a.id] || 0;
      s.socioOut = socioOut[a.id] || 0;
      s.investOut = investOut[a.id] || 0;
      s.investIn = investIn[a.id] || 0;
      s.saldoAtual = (Number(a.saldoInicial) || 0) + s.entradas - s.saidas + s.transfIn - s.transfOut + s.socioIn - s.socioOut + s.investIn - s.investOut;
    });
    return map;
  }, [accounts, entries, transfers, movimentosSocios, movimentosInvestidores, retiradasInvestidores]);

  // Saldos das Contas Investidores — completamente separados dos saldos bancários da empresa.
  // Só entram aqui lançamentos com origemTipo "CONTA_INVESTIDOR", aportes e transferências
  // entre Contas Investidores. Nada disso passa por accountStats (saldo da empresa) acima.
  const investidorStats = useMemo(() => {
    const map = {};
    contasInvestidores.forEach((c) => (map[c.id] = { entradas: 0, saidas: 0 }));
    entries.forEach((e) => {
      if (e.origemTipo !== "CONTA_INVESTIDOR" || !map[e.contaInvestidorId]) return;
      if (e.tipo === "entrada") map[e.contaInvestidorId].entradas += Number(e.valor) || 0;
      else map[e.contaInvestidorId].saidas += Number(e.valor) || 0;
    });
    const transfIn = {}, transfOut = {};
    (transfersInvestidores || []).forEach((t) => {
      transfIn[t.destinoId] = (transfIn[t.destinoId] || 0) + Number(t.valor);
      transfOut[t.origemId] = (transfOut[t.origemId] || 0) + Number(t.valor);
    });
    const aporteIn = {};
    (movimentosInvestidores || []).forEach((m) => {
      aporteIn[m.contaInvestidorId] = (aporteIn[m.contaInvestidorId] || 0) + Number(m.valor);
    });
    const retiradaOut = {};
    (retiradasInvestidores || []).forEach((r) => {
      retiradaOut[r.contaInvestidorId] = (retiradaOut[r.contaInvestidorId] || 0) + Number(r.valor);
    });
    contasInvestidores.forEach((c) => {
      const s = map[c.id];
      s.transfIn = transfIn[c.id] || 0;
      s.transfOut = transfOut[c.id] || 0;
      s.aportes = aporteIn[c.id] || 0;
      s.retiradas = retiradaOut[c.id] || 0;
      s.saldoAtual = (Number(c.saldoInicial) || 0) + s.entradas - s.saidas + s.transfIn - s.transfOut + s.aportes - s.retiradas;
    });
    return map;
  }, [contasInvestidores, entries, transfersInvestidores, movimentosInvestidores, retiradasInvestidores]);

  // Composição econômica (Glover x Investidor) de cada Conta Investidor, e o split de cada
  // gasto de obra pago por uma delas — base da seção "Participação Financeira" do Painel de Obras.
  const investidorComposicao = useMemo(
    () => computeInvestidorComposicao(contasInvestidores, entries, movimentosInvestidores, transfersInvestidores, retiradasInvestidores),
    [contasInvestidores, entries, movimentosInvestidores, transfersInvestidores, retiradasInvestidores]
  );

  const obraStats = useMemo(() => {
    const map = {};
    obras.forEach((o) => (map[o.id] = { receitas: 0, despesas: 0, count: 0 }));
    entries.forEach((e) => {
      if (!map[e.obraId]) return;
      map[e.obraId].count += 1;
      if (e.tipo === "entrada") map[e.obraId].receitas += Number(e.valor) || 0;
      else map[e.obraId].despesas += Number(e.valor) || 0;
    });
    obras.forEach((o) => {
      const s = map[o.id];
      s.resultado = s.receitas - s.despesas;
      s.margem = s.receitas > 0 ? (s.resultado / s.receitas) * 100 : null;
    });
    return map;
  }, [obras, entries]);

  const obraSemObra = useMemo(() => {
    let receitas = 0, despesas = 0, count = 0;
    entries.forEach((e) => {
      if (e.obraId !== SEM_OBRA) return;
      count += 1;
      if (e.tipo === "entrada") receitas += Number(e.valor) || 0; else despesas += Number(e.valor) || 0;
    });
    return { receitas, despesas, count, resultado: receitas - despesas };
  }, [entries]);

  const socioStats = useMemo(() => {
    const map = {};
    socios.forEach((s) => (map[s.id] = { aportes: 0, retiradas: 0, proLabore: 0 }));
    movimentosSocios.forEach((m) => {
      if (!map[m.socioId]) map[m.socioId] = { aportes: 0, retiradas: 0, proLabore: 0 };
      if (m.tipo === "aporte") map[m.socioId].aportes += Number(m.valor) || 0;
      else if (m.tipo === "pro-labore") map[m.socioId].proLabore += Number(m.valor) || 0;
      else map[m.socioId].retiradas += Number(m.valor) || 0;
    });
    socios.forEach((s) => { map[s.id].saldo = map[s.id].aportes - map[s.id].retiradas; });
    return map;
  }, [socios, movimentosSocios]);

  const supplierNames = useMemo(() => {
    const set = new Set(fornecedoresSeed);
    entries.forEach((e) => { if (e.fornecedor && e.fornecedor !== "Não se aplica") set.add(e.fornecedor); });
    return [...set].sort((a, b) => a.localeCompare(b, "pt-BR"));
  }, [entries, fornecedoresSeed]);

  const fornecedorOptions = useMemo(
    () => fornecedoresCadastro.filter((f) => f.ativo).map((f) => f.nome).sort((a, b) => a.localeCompare(b, "pt-BR")),
    [fornecedoresCadastro]
  );

  const supplierStats = useMemo(() => {
    const map = {};
    entries.forEach((e) => {
      if (e.tipo !== "saida" || !e.fornecedor || e.fornecedor === "Não se aplica") return;
      if (!map[e.fornecedor]) map[e.fornecedor] = { total: 0, count: 0, obras: new Set(), last: null };
      const s = map[e.fornecedor];
      s.total += Number(e.valor) || 0;
      s.count += 1;
      if (e.obraId && e.obraId !== SEM_OBRA) s.obras.add(e.obraId);
      if (!s.last || e.data > s.last) s.last = e.data;
    });
    return map;
  }, [entries]);

  const now = new Date();
  const curMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevMonthKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, "0")}`;

  // Entradas/saídas/resultado do mês são exibidos no painel financeiro da EMPRESA (página Saldos
  // Bancários) — por isso excluem lançamentos pagos via Conta Investidor, que não são caixa da empresa.
  const monthTotals = (key) => {
    let entradas = 0, saidas = 0;
    entries.forEach((e) => {
      if (monthKey(e.data) !== key) return;
      if (e.origemTipo === "CONTA_INVESTIDOR") return;
      if (e.fatDireto) return; // faturamento direto não passa pelo caixa da empresa
      if (e.tipo === "entrada") entradas += Number(e.valor) || 0; else saidas += Number(e.valor) || 0;
    });
    return { entradas, saidas, resultado: entradas - saidas };
  };
  const curMonth = monthTotals(curMonthKey);
  const prevMonth = monthTotals(prevMonthKey);

  const dashboard = {
    saldoTotal: accounts.filter((a) => a.status === "Ativa").reduce((s, a) => s + (accountStats[a.id]?.saldoAtual || 0), 0),
    totalGastoObras: obras.reduce((s, o) => s + (obraStats[o.id]?.despesas || 0), 0) + obraSemObra.despesas,
    obrasAndamento: obras.filter((o) => o.status === "Em execução").length,
  };

  const pct = (cur, prev) => {
    if (!prev) return null;
    return ((cur - prev) / Math.abs(prev)) * 100;
  };

  if (loadError) {
    return (
      <div className="gf-app">
        <style>{CSS}</style>
        <div className="gf-login">
          <div className="gf-login-card">
            <div className="gf-login-logo-tile">
              <img src={GLOVER_LOGO_DATA_URI} alt="Glover Engenharia" className="gf-login-logo-img" />
            </div>
            <h2 style={{ fontFamily: "var(--gf-font-display)", fontSize: 18, margin: "14px 0 4px", color: "var(--gf-danger)" }}>Não foi possível carregar os dados</h2>
            <p className="gf-field-hint" style={{ marginBottom: 6 }}>
              Houve um problema de conexão com o banco de dados: <b>{loadError}</b>
            </p>
            <p className="gf-field-hint" style={{ marginBottom: 16 }}>
              Por segurança, o sistema não prosseguiu para evitar sobrescrever dados reais. Verifique sua internet e tente novamente.
            </p>
            <button className="gf-btn gf-btn-primary" style={{ width: "100%", justifyContent: "center" }} onClick={carregarDados}>
              Tentar novamente
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (!ready) {
    return <div className="gf-app gf-loading">Carregando…</div>;
  }

  if (!currentUser) {
    return (
      <div className="gf-app">
        <style>{CSS}</style>
        <LoginScreen usuarios={usuarios} onLogin={(id) => setCurrentUserId(id)} />
      </div>
    );
  }

  const doLogout = () => setCurrentUserId(null);

  const NAV_PERMS = {
    lancamentos: null, saldos: "contasbancarias_visualizar", obras: "relatorios_acessar",
    fornecedores: "relatorios_acessar", contaspagar: null, cartoescredito: "cartao_lancar", custosinternos: "relatorios_acessar",
    dividasinvestimentos: "relatorios_acessar", obrasgerenciamento: "gerenciamento_lancar",
    socios: "socios_acessar", aprovacoes: "lancamentos_aprovar", usuarios: "usuarios_gerenciar",
    contasinvestidores: "investidores_visualizar", planejamentosemanal: "planejamento_visualizar", relatoriosobra: "relatorios_obra_visualizar", faturamentodireto: "fatdireto_visualizar", programacaopagamentos: "progpag_visualizar",
  };
  if (!ehInvestidor && NAV_PERMS[page] && !can(currentUser, NAV_PERMS[page])) {
    return (
      <div className="gf-app">
        <style>{CSS}</style>
        <Sidebar page={page} setPage={setPage} currentUser={currentUser} />
        <main className="gf-main">
          <div className="gf-page"><div className="gf-card"><EmptyState icon={Scale} title="Acesso restrito" body="Seu usuário não tem permissão para acessar esta página." /></div></div>
        </main>
      </div>
    );
  }

  // Escopo do usuário Investidor: só enxerga a obra e a Conta Investidor vinculadas a ele.
  const obrasEscopo = ehInvestidor
    ? obras.filter((o) => o.id === currentUser.investidorObraId).map((o) => ({ ...o, arquivada: false }))
    : ehGestor
      ? obras.filter((o) => (currentUser.gestorObras || []).includes(o.id))
      : obras;
  const contasInvestidoresEscopo = ehInvestidor
    ? contasInvestidores.filter((c) => c.id === currentUser.investidorContaId)
    : contasInvestidores;

  return (
    <div className="gf-app">
      <style>{CSS}</style>
      <Sidebar page={page} setPage={setPage} currentUser={currentUser} />
      <main className="gf-main">
        <TopBar
          page={page}
          curMonth={curMonth} prevMonth={prevMonth} pct={pct}
          dashboard={dashboard} savedTick={savedTick} saveError={saveError}
          onReset={resetDemo} onClear={clearAll} onExport={exportarBackup} onImport={importarBackup}
          currentUser={currentUser} onLogout={doLogout}
        />
        <div className="gf-page">
          {page === "lancamentos" && (
            <LancamentosPage
              accounts={accounts} obras={obras} apropriacoes={apropriacoes} setApropriacoes={setApropriacoes}
              entries={entries.filter((e) => !e.fatDireto)} setEntries={setEntries} supplierNames={supplierNames} fornecedorOptions={fornecedorOptions}
              orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
              dividas={dividas} setDividas={setDividas} investimentos={investimentos} setInvestimentos={setInvestimentos}
              contasInvestidores={contasInvestidores}
              currentUser={currentUser} logAudit={logAudit}
            />
          )}
          {page === "saldos" && (
            <SaldosPage
              accounts={accounts} setAccounts={setAccounts} accountStats={accountStats}
              entries={entries} transfers={transfers} setTransfers={setTransfers}
              movimentosSocios={movimentosSocios} obras={obras}
              socios={socios} contasInvestidores={contasInvestidores}
              movimentosInvestidores={movimentosInvestidores} retiradasInvestidores={retiradasInvestidores}
              currentUser={currentUser} logAudit={logAudit}
            />
          )}
          {page === "contasinvestidores" && (
            <ContasInvestidoresPage
              contasInvestidores={contasInvestidoresEscopo} setContasInvestidores={setContasInvestidores}
              investidorStats={investidorStats} investidorComposicao={investidorComposicao}
              entries={entries} obras={obras} accounts={ehInvestidor ? [] : accounts.filter((a) => a.status === "Ativa" && !isFatDiretoAccount(a))}
              movimentosInvestidores={movimentosInvestidores} setMovimentosInvestidores={setMovimentosInvestidores}
              transfersInvestidores={transfersInvestidores} setTransfersInvestidores={setTransfersInvestidores}
              retiradasInvestidores={retiradasInvestidores} setRetiradasInvestidores={setRetiradasInvestidores}
              currentUser={currentUser} logAudit={logAudit}
            />
          )}
          {page === "obras" && (

function TopBar({ page, curMonth, prevMonth, pct, dashboard, savedTick, saveError, onReset, onClear, onExport, onImport, currentUser, onLogout }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const importInputRef = useRef(null);
  const deltaEntradas = pct(curMonth.entradas, prevMonth.entradas);
  const deltaSaidas = pct(curMonth.saidas, prevMonth.saidas);
  const deltaResultado = pct(curMonth.resultado, prevMonth.resultado);
  const isAdmin = can(currentUser, "config_alterar");
  const showResumo = page === "saldos";

  const Delta = ({ v }) => {
    if (v === null || !isFinite(v)) return null;
    const up = v >= 0;
    return (
      <span className={`gf-delta ${up ? "up" : "down"}`}>
        {up ? <ArrowUpRight size={12} /> : <ArrowDownRight size={12} />}
        {Math.abs(v).toFixed(0)}% vs mês ant.
      </span>
    );
  };

  return (
    <header className="gf-topbar">
      <div className="gf-topbar-row">
        <div>
          {showResumo && (
            <>
              <div className="gf-eyebrow">Resumo geral</div>
              <h1>Painel financeiro</h1>
            </>
          )}
        </div>
        <div className="gf-topbar-actions">
          <span className={saveError ? "gf-saved gf-saved-error" : "gf-saved"}>
            {saveError ? `⚠️ Não foi possível salvar/sincronizar: ${saveError}` : (savedTick ? "Dados salvos automaticamente" : "Dados carregados")}
          </span>
          {isAdmin && (
            <div className="gf-menu-wrap">
              <button className="gf-btn gf-btn-ghost" onClick={() => setMenuOpen((v) => !v)}>Opções</button>
              {menuOpen && (
                <div className="gf-menu" onMouseLeave={() => setMenuOpen(false)}>
                  <button onClick={() => { onExport(); setMenuOpen(false); }}>⬇️ Baixar backup (JSON)</button>
                  <button onClick={() => { importInputRef.current?.click(); setMenuOpen(false); }}>⬆️ Restaurar backup</button>
                  <input ref={importInputRef} type="file" accept="application/json" style={{ display: "none" }}
                    onChange={(e) => { onImport(e.target.files[0]); e.target.value = ""; }} />
                  <button onClick={() => { onReset(); setMenuOpen(false); }}>Recarregar dados de exemplo</button>
                  <button onClick={() => { onClear(); setMenuOpen(false); }}>Apagar todos os dados</button>
                </div>

          <div className="gf-topbar-user">
            <span className="gf-topbar-user-name">{currentUser?.nome}</span>
            <button className="gf-icon-btn" title="Sair" onClick={onLogout}><LogOut size={14} /></button>

            <span className="gf-tile-label">Entradas no mês</span>
            <span className="gf-tile-value pos">{BRL(curMonth.entradas)}</span>
            <Delta v={deltaEntradas} />
          </div>
          <div className="gf-tile">
            <span className="gf-tile-label">Saídas no mês</span>
            <span className="gf-tile-value neg">{BRL(curMonth.saidas)}</span>

          </div>

function LoginScreen({ usuarios, onLogin }) {
  const [selecionado, setSelecionado] = useState(null);
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  // Investidores entram digitando nome + senha (a lista de usuários da equipe não é exibida
  // para eles, e eles não aparecem na lista da equipe).
  const [modoInvestidor, setModoInvestidor] = useState(false);
  const [nomeInvestidor, setNomeInvestidor] = useState("");

  const escolher = (id) => { setSelecionado(id); setSenha(""); setErro(""); };

  const entrar = (e) => {
    e?.preventDefault();
    if (modoInvestidor) {
      const nome = nomeInvestidor.trim().toLowerCase();
      const u = usuarios.find((x) => x.ativo && isInvestidor(x) && x.nome.trim().toLowerCase() === nome);
      if (!u || (u.senha || "") !== senha) { setErro("Usuário ou senha incorretos."); return; }
      onLogin(u.id);
      return;
    }
    const u = usuarios.find((x) => x.id === selecionado);
    if (!u) return;
    if ((u.senha || "") !== senha) { setErro("Senha incorreta. Tente novamente."); return; }
    onLogin(selecionado);
  };

  return (
    <div className="gf-login">
      <div className="gf-login-card">
        <div className="gf-login-logo-tile">
          <img src={GLOVER_LOGO_DATA_URI} alt="Glover Engenharia" className="gf-login-logo-img" />
        </div>
        <div className="gf-brand-sub" style={{ color: "var(--gf-muted)", marginBottom: 18 }}>financeiro</div>
        <h2 style={{ fontFamily: "var(--gf-font-display)", fontSize: 18, margin: "0 0 4px", color: "var(--gf-primary)" }}>{modoInvestidor ? "Acesso do investidor" : "Quem está acessando?"}</h2>
        <p className="gf-field-hint" style={{ marginBottom: 16 }}>{modoInvestidor ? "Informe o usuário e a senha fornecidos pela Glover Engenharia." : "Selecione seu usuário e informe a senha."}</p>

        {modoInvestidor && (
          <form onSubmit={entrar}>
            <Field label="Usuário">
              <input autoFocus value={nomeInvestidor} onChange={(e) => { setNomeInvestidor(e.target.value); setErro(""); }} placeholder="Seu nome de usuário" />
            </Field>
            <Field label="Senha" className="gf-login-senha-field">
              <input type="password" value={senha} onChange={(e) => { setSenha(e.target.value); setErro(""); }} placeholder="Digite sua senha" />
            </Field>
            {erro && <div className="gf-warn" style={{ marginTop: 6 }}>{erro}</div>}
          </form>
        )}

        {!modoInvestidor && <div className="gf-login-users">
          {usuarios.filter((u) => u.ativo && !isInvestidor(u)).map((u) => (
            <button key={u.id} className={`gf-login-user ${selecionado === u.id ? "is-selected" : ""}`} onClick={() => escolher(u.id)}>
              <div className="gf-sidebar-avatar" style={{ background: "var(--gf-primary)" }}>{u.nome.slice(0, 1)}</div>
              <div>
                <div className="gf-login-user-name">{u.nome}</div>
                <div className="gf-login-user-role">{PAPEL_LABEL[u.papel] || u.papel}</div>
              </div>
              {selecionado === u.id && <Check size={16} className="pos" />}
            </button>
          ))}
        </div>}

        {!modoInvestidor && selecionado && (
          <form onSubmit={entrar}>
            <Field label="Senha" className="gf-login-senha-field">
              <input type="password" autoFocus value={senha} onChange={(e) => { setSenha(e.target.value); setErro(""); }} placeholder="Digite sua senha" />
            </Field>
            {erro && <div className="gf-warn" style={{ marginTop: 6 }}>{erro}</div>}
          </form>
        )}

        <button className="gf-btn gf-btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: 16 }}
          disabled={modoInvestidor ? (!nomeInvestidor.trim() || !senha) : (!selecionado || !senha)} onClick={entrar}>
          Entrar
        </button>
        <button type="button" className="gf-btn gf-btn-ghost" style={{ width: "100%", justifyContent: "center", marginTop: 8 }}
          onClick={() => { setModoInvestidor((v) => !v); setSelecionado(null); setSenha(""); setErro(""); setNomeInvestidor(""); }}>
          {modoInvestidor ? "← Voltar ao acesso da equipe" : "Acesso de investidor"}
        </button>
        <p className="gf-field-hint" style={{ marginTop: 14, textAlign: "center" }}>
          Acesso restrito à equipe da Glover Engenharia. As senhas podem ser alteradas por um administrador na página Usuários.
        </p>
      </div>
    </div>
  );
}
