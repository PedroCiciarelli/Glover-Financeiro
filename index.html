// Lista de planejamentos de uma obra (mais recente primeiro) + ações de Visualizar/Editar/
// Gerar PNG/Duplicar/Excluir e criação de um novo planejamento.
function ObraPlanejamentosList({ obra, planejamentos, setPlanejamentosSemanais, disciplinas, setDisciplinas, fornecedorOptions, podeGerenciar, currentUser, logAudit, onBack }) {
  const [showNovo, setShowNovo] = useState(false);
  const [editId, setEditId] = useState(null);
  const [viewId, setViewId] = useState(null);

  const ordenados = useMemo(
    () => [...planejamentos].sort((a, b) => (a.dataInicio < b.dataInicio ? 1 : a.dataInicio > b.dataInicio ? -1 : 0)),
    [planejamentos]
  );

  const criarPlano = (dataInicio, dataFim) => {
    const dias = datesInRange(dataInicio, dataFim).map((data) => ({ data, atividades: [] }));
    const novo = {
      id: uid("plano"), obraId: obra.id, dataInicio, dataFim, status: "Em elaboração", dias,
      criadoPor: currentUser?.nome || "—", criadoEm: Date.now(),
      editadoPor: currentUser?.nome || "—", editadoEm: Date.now(), historico: [],
    };
    setPlanejamentosSemanais((prev) => [...prev, novo]);
    logAudit?.({ tipoOperacao: "Criação de Planejamento Semanal", registroAlterado: `${obra.nome} (${fmtDate(dataInicio)} a ${fmtDate(dataFim)})`, valorAnterior: "—", valorNovo: "Em elaboração" });
    setShowNovo(false);
    setEditId(novo.id);
  };

  const excluirPlano = (plano) => {
    if (!window.confirm(`Excluir o planejamento de ${fmtDate(plano.dataInicio)} a ${fmtDate(plano.dataFim)}? Esta ação não pode ser desfeita.`)) return;
    setPlanejamentosSemanais((prev) => prev.filter((p) => p.id !== plano.id));
    logAudit?.({ tipoOperacao: "Exclusão de Planejamento Semanal", registroAlterado: `${obra.nome} (${fmtDate(plano.dataInicio)} a ${fmtDate(plano.dataFim)})`, valorAnterior: plano.status, valorNovo: "Excluído" });
  };

  const duplicarPlano = (plano) => {
    const idMap = {};
    const dias = plano.dias.map((d) => ({
      data: d.data,
      atividades: d.atividades.map((a) => {
        let novoGroupId = a.groupId || null;
        if (a.groupId) {
          if (!idMap[a.groupId]) idMap[a.groupId] = uid("planoact-grp");
          novoGroupId = idMap[a.groupId];
        }
        return { ...a, id: uid("planoact"), groupId: novoGroupId };
      }),
    }));
    const copia = {
      id: uid("plano"), obraId: obra.id, dataInicio: plano.dataInicio, dataFim: plano.dataFim, status: "Em elaboração", dias,
      criadoPor: currentUser?.nome || "—", criadoEm: Date.now(),
      editadoPor: currentUser?.nome || "—", editadoEm: Date.now(), historico: [],
    };
    setPlanejamentosSemanais((prev) => [...prev, copia]);
    logAudit?.({ tipoOperacao: "Duplicação de Planejamento Semanal", registroAlterado: `${obra.nome} (${fmtDate(plano.dataInicio)} a ${fmtDate(plano.dataFim)})`, valorAnterior: "—", valorNovo: "Cópia criada" });
  };

  const editando = planejamentos.find((p) => p.id === editId);
  const visualizando = planejamentos.find((p) => p.id === viewId);

  if (editando || visualizando) {
    const plano = editando || visualizando;
    return (
      <PlanEditor
        obra={obra} plano={plano} readOnly={!editando}
        setPlanejamentosSemanais={setPlanejamentosSemanais}
        disciplinas={disciplinas} setDisciplinas={setDisciplinas}
        fornecedorOptions={fornecedorOptions}
        podeGerenciar={podeGerenciar}
        currentUser={currentUser} logAudit={logAudit}
        onBack={() => { setEditId(null); setViewId(null); }}
      />
    );
  }

  return (
    <div className="gf-stack">
      <button className="gf-btn gf-btn-ghost" onClick={onBack} style={{ alignSelf: "flex-start" }}>← Voltar para Planejamento Semanal</button>
      <div className="gf-toolbar">
        <h2>Planejamento Semanal — {obra.nome}</h2>
        {podeGerenciar && <button className="gf-btn gf-btn-primary" onClick={() => setShowNovo(true)}><Plus size={15} /> Novo Planejamento Semanal</button>}
      </div>

      {ordenados.length === 0 ? (
        <div className="gf-card">
          <EmptyState icon={CalendarRange} title="Nenhum planejamento cadastrado" body='Clique em "+ Novo Planejamento Semanal" para criar o primeiro planejamento desta obra.' />
        </div>
      ) : (
        <div className="gf-stack" style={{ gap: 10 }}>
          {ordenados.map((p) => {
            const totalAtividades = p.dias.reduce((s, d) => s + d.atividades.length, 0);
            return (
              <div className="gf-card" key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, flexWrap: "wrap" }}>
                <div>
                  <div className="gf-card-head" style={{ marginBottom: 4 }}>
                    <h3 style={{ fontFamily: "var(--gf-font-display)", color: "var(--gf-primary)" }}>{fmtDate(p.dataInicio)} a {fmtDate(p.dataFim)}</h3>
                    <Badge tone={p.status === "Finalizado" ? "green" : "orange"}>{p.status}</Badge>
                  </div>
                  <div className="gf-field-hint">
                    {p.dias.length} dia(s) · {totalAtividades} atividade(s) · Criado por {p.criadoPor || "—"} em {nowStampFromTs(p.criadoEm)}
                    {p.editadoPor && p.editadoEm && p.editadoEm !== p.criadoEm ? ` · Última edição por ${p.editadoPor} em ${nowStampFromTs(p.editadoEm)}` : ""}
                  </div>
                </div>
                <div className="gf-row-actions">
                  <button className="gf-btn gf-btn-ghost" onClick={() => setViewId(p.id)}>Visualizar</button>
                  {podeGerenciar && <button className="gf-btn gf-btn-ghost" onClick={() => setEditId(p.id)}><Pencil size={14} /> Editar</button>}
                  <button className="gf-btn gf-btn-ghost" onClick={() => gerarPlanejamentoPNG(p, obra)}><ImageDown size={14} /> Gerar PNG</button>
                  {podeGerenciar && <button className="gf-btn gf-btn-ghost" onClick={() => duplicarPlano(p)}><Copy size={14} /> Duplicar</button>}
                  {podeGerenciar && <button className="gf-icon-btn danger" title="Excluir" onClick={() => excluirPlano(p)}><Trash2 size={15} /></button>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showNovo && <NovoPlanejamentoModal onClose={() => setShowNovo(false)} onCreate={criarPlano} />}
    </div>
  );
}

function NovoPlanejamentoModal({ onClose, onCreate }) {
  const [dataInicio, setDataInicio] = useState(todayISO());
  const [dataFim, setDataFim] = useState(todayISO());
  const [erro, setErro] = useState("");

  const submit = (e) => {
    e.preventDefault();
    if (!dataInicio || !dataFim) { setErro("Informe as duas datas."); return; }
    if (dataFim < dataInicio) { setErro("A data final não pode ser anterior à data inicial."); return; }
    onCreate(dataInicio, dataFim);
  };

  return (
    <Modal title="Novo Planejamento Semanal" onClose={onClose} width={420}>
      <form onSubmit={submit} className="gf-stack" style={{ gap: 14 }}>
        <Field label="Data inicial"><input type="date" required value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} /></Field>
        <Field label="Data final"><input type="date" required value={dataFim} onChange={(e) => setDataFim(e.target.value)} /></Field>
        {erro && <p className="gf-warn">{erro}</p>}
        <div className="gf-form-actions">
          <button type="submit" className="gf-btn gf-btn-primary">Criar planejamento</button>
        </div>
      </form>
    </Modal>
  );
}

// Editor (e visualizador, quando readOnly) de um planejamento: um card por dia, com as atividades
// daquele dia em linhas compactas e reordenáveis (drag-and-drop nativo).
function PlanEditor({ obra, plano, readOnly, setPlanejamentosSemanais, disciplinas, setDisciplinas, fornecedorOptions, podeGerenciar, currentUser, logAudit, onBack }) {
  const [atividadeModal, setAtividadeModal] = useState(null);
  const [repeatPrompt, setRepeatPrompt] = useState(null);
  const [dragInfo, setDragInfo] = useState(null);
  const [dragOverDia, setDragOverDia] = useState(null);

  const editavel = !readOnly && podeGerenciar;

  const atualizarPlano = (updater, historicoAcao) => {
    setPlanejamentosSemanais((prev) => prev.map((p) => {
      if (p.id !== plano.id) return p;
      const base = updater(p);
      const historicoExtra = (p.status === "Finalizado" && historicoAcao)
        ? [{ usuario: currentUser?.nome || "—", dataHora: nowStamp(), acao: historicoAcao }, ...(p.historico || [])]
        : (p.historico || []);
      return { ...base, editadoPor: currentUser?.nome || "—", editadoEm: Date.now(), historico: historicoExtra };
    }));
  };

  const salvarAtividade = (diaData, dados, repetirDias) => {
    const camposConteudo = { descricao: dados.descricao, disciplina: dados.disciplina, fornecedor: dados.fornecedor, observacao: dados.observacao };

    if (dados.id) {
      const atividadeOriginal = plano.dias.flatMap((d) => d.atividades).find((a) => a.id === dados.id);
      const temRepeticoes = atividadeOriginal?.groupId && plano.dias.some((d) => d.atividades.some((a) => a.groupId === atividadeOriginal.groupId && a.id !== atividadeOriginal.id));
      if (temRepeticoes) {
        setRepeatPrompt({ kind: "edit", atividadeId: dados.id, groupId: atividadeOriginal.groupId, camposConteudo });
        return;
      }
      aplicarEdicao(dados.id, null, camposConteudo, false);
    } else {
      const groupId = (repetirDias && repetirDias.length) ? uid("planoact-grp") : null;
      const diasAlvo = [diaData, ...(repetirDias || [])];
      atualizarPlano((p) => ({
        ...p,
        dias: p.dias.map((d) => diasAlvo.includes(d.data)
          ? { ...d, atividades: [...d.atividades, { id: uid("planoact"), ordem: d.atividades.length, groupId, ...camposConteudo }] }
          : d),
      }), "Adicionou atividade em planejamento finalizado");
    }
    setAtividadeModal(null);
  };

  const aplicarEdicao = (atividadeId, groupId, camposConteudo, aplicarATodas) => {
    atualizarPlano((p) => ({
      ...p,
      dias: p.dias.map((d) => ({
        ...d,
        atividades: d.atividades.map((a) => {
          if (aplicarATodas && groupId && a.groupId === groupId) return { ...a, ...camposConteudo };
          if (!aplicarATodas && a.id === atividadeId) return { ...a, ...camposConteudo };
          return a;
        }),
      })),
    }), "Editou atividade de planejamento finalizado");
    setRepeatPrompt(null);
    setAtividadeModal(null);
  };

  const excluirAtividade = (diaData, atividade) => {
    const temRepeticoes = atividade.groupId && plano.dias.some((d) => d.atividades.some((a) => a.groupId === atividade.groupId && a.id !== atividade.id));
    if (temRepeticoes) {
      setRepeatPrompt({ kind: "delete", atividadeId: atividade.id, groupId: atividade.groupId, diaData });
      return;
    }
    if (!window.confirm("Excluir esta atividade?")) return;
    aplicarExclusao(atividade.id, diaData, null, false);
  };

  const aplicarExclusao = (atividadeId, diaData, groupId, aplicarATodas) => {
    atualizarPlano((p) => ({
      ...p,
      dias: p.dias.map((d) => ({
        ...d,
        atividades: (aplicarATodas && groupId)
          ? d.atividades.filter((a) => a.groupId !== groupId)
          : d.atividades.filter((a) => !(d.data === diaData && a.id === atividadeId)),
      })),
    }), "Excluiu atividade de planejamento finalizado");
    setRepeatPrompt(null);
  };

  const duplicarAtividade = (diaData, atividade) => {
    atualizarPlano((p) => ({
      ...p,
      dias: p.dias.map((d) => d.data === diaData
        ? { ...d, atividades: [...d.atividades, {
            id: uid("planoact"), ordem: d.atividades.length, groupId: null,
            descricao: atividade.descricao, disciplina: atividade.disciplina, fornecedor: atividade.fornecedor, observacao: atividade.observacao,
          }] }
        : d),
    }));
  };

  const reordenarAtividades = (diaData, draggedId, targetId) => {
    if (draggedId === targetId) return;
    atualizarPlano((p) => ({
      ...p,
      dias: p.dias.map((d) => {
        if (d.data !== diaData) return d;
        const lista = [...d.atividades].sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
        const fromIdx = lista.findIndex((a) => a.id === draggedId);
        const toIdx = lista.findIndex((a) => a.id === targetId);
        if (fromIdx === -1 || toIdx === -1) return d;
        const [moved] = lista.splice(fromIdx, 1);
        lista.splice(toIdx, 0, moved);
        return { ...d, atividades: lista.map((a, i) => ({ ...a, ordem: i })) };
      }),
    }));
  };

  // Move uma atividade para outro dia do mesmo planejamento (drag-and-drop entre dias),
  // opcionalmente inserindo-a na posição de uma atividade-alvo dentro do dia de destino.
  // Se origem e destino forem o mesmo dia, apenas reordena. Move apenas a atividade arrastada
  // (mesmo que ela faça parte de um grupo de repetição) — as demais repetições não são afetadas.
  const moverAtividadeEntreDias = (fromDiaData, atividadeId, toDiaData, targetId) => {
    if (fromDiaData === toDiaData) {
      if (targetId && targetId !== atividadeId) reordenarAtividades(fromDiaData, atividadeId, targetId);
      return;
    }
    atualizarPlano((p) => {
      let atividadeMovida = null;
      const diasSemAtividade = p.dias.map((d) => {
        if (d.data !== fromDiaData) return d;
        const restante = d.atividades
          .filter((a) => {
            if (a.id === atividadeId) { atividadeMovida = a; return false; }
            return true;
          })
          .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0))
          .map((a, i) => ({ ...a, ordem: i }));
        return { ...d, atividades: restante };
      });
      if (!atividadeMovida) return p;
      const diasFinal = diasSemAtividade.map((d) => {
        if (d.data !== toDiaData) return d;
        const listaAtual = [...d.atividades].sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
        let insertIdx = listaAtual.length;
        if (targetId) {
          const idx = listaAtual.findIndex((a) => a.id === targetId);
          if (idx !== -1) insertIdx = idx;
        }
        listaAtual.splice(insertIdx, 0, atividadeMovida);
        return { ...d, atividades: listaAtual.map((a, i) => ({ ...a, ordem: i })) };
      });
      return { ...p, dias: diasFinal };
    }, "Moveu atividade para outro dia em planejamento finalizado");
  };

  const finalizarPlano = () => {
    if (!window.confirm("Finalizar este planejamento? Ele continuará podendo ser consultado normalmente.")) return;
    setPlanejamentosSemanais((prev) => prev.map((p) => p.id === plano.id
      ? { ...p, status: "Finalizado", editadoPor: currentUser?.nome || "—", editadoEm: Date.now() }
      : p));
    logAudit?.({ tipoOperacao: "Finalização de Planejamento Semanal", registroAlterado: `${obra.nome} (${fmtDate(plano.dataInicio)} a ${fmtDate(plano.dataFim)})`, valorAnterior: "Em elaboração", valorNovo: "Finalizado" });
  };

  return (
    <div className="gf-stack">
      <button className="gf-btn gf-btn-ghost" onClick={onBack} style={{ alignSelf: "flex-start" }}>← Voltar para {obra.nome}</button>
      <div className="gf-toolbar">
        <div>
          <h2>Planejamento Semanal — {obra.nome}</h2>
          <div className="gf-field-hint">Período: {fmtDate(plano.dataInicio)} a {fmtDate(plano.dataFim)}</div>
        </div>
        <div className="gf-row-actions">
          <Badge tone={plano.status === "Finalizado" ? "green" : "orange"}>{plano.status}</Badge>
          <button className="gf-btn gf-btn-ghost" onClick={() => gerarPlanejamentoPNG(plano, obra)}><ImageDown size={14} /> Gerar PNG</button>
          {editavel && plano.status !== "Finalizado" && (
            <button className="gf-btn gf-btn-primary" onClick={finalizarPlano}><Check size={14} /> Finalizar Planejamento</button>
          )}
        </div>
      </div>

      {readOnly && <p className="gf-field-hint">Modo de visualização — nenhuma alteração pode ser feita aqui.</p>}
      {!readOnly && !podeGerenciar && <p className="gf-field-hint">Seu usuário não tem permissão para editar planejamentos semanais.</p>}
      {plano.status === "Finalizado" && editavel && (
        <p className="gf-field-hint">Este planejamento já foi finalizado. Qualquer alteração feita agora ficará registrada no histórico.</p>
      )}

      <div className="gf-plano-dias">
        {plano.dias.map((dia) => {
          const atividadesOrdenadas = [...dia.atividades].sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
          return (
            <div
              className={`gf-card gf-plano-dia-card${dragOverDia === dia.data ? " gf-plano-dia-dragover" : ""}`}
              key={dia.data}
              onDragOver={(e) => { if (editavel && dragInfo) e.preventDefault(); }}
              onDragEnter={() => { if (editavel && dragInfo) setDragOverDia(dia.data); }}
              onDragLeave={(e) => { if (e.currentTarget === e.target) setDragOverDia(null); }}
              onDrop={(e) => {
                if (!editavel || !dragInfo) return;
                e.preventDefault();
                // Drop fora de uma linha específica (dia vazio ou espaço abaixo da lista): move para o fim do dia.
                moverAtividadeEntreDias(dragInfo.diaData, dragInfo.atividadeId, dia.data, null);
                setDragInfo(null);
                setDragOverDia(null);
              }}
            >
              <div className="gf-card-head">
                <h3>{weekdayName(dia.data).toUpperCase()} — {fmtDate(dia.data)}</h3>
                {editavel && (
                  <button className="gf-btn gf-btn-ghost" onClick={() => setAtividadeModal({ diaData: dia.data, atividade: null })}>
                    <Plus size={14} /> Adicionar Atividade
                  </button>
                )}
              </div>
              {atividadesOrdenadas.length === 0 ? (
                <p className="gf-field-hint">Nenhuma atividade cadastrada para este dia. {editavel && "Arraste uma atividade de outro dia para cá, se desejar."}</p>
              ) : (
                <div className="gf-plano-atividades">
                  {atividadesOrdenadas.map((a) => (
                    <div
                      key={a.id} className="gf-plano-atividade-row"
                      draggable={editavel}
                      onDragStart={() => editavel && setDragInfo({ diaData: dia.data, atividadeId: a.id })}
                      onDragEnd={() => { setDragInfo(null); setDragOverDia(null); }}
                      onDragOver={(e) => { if (editavel && dragInfo) e.preventDefault(); }}
                      onDrop={(e) => {
                        if (!editavel || !dragInfo) return;
                        e.preventDefault();
                        e.stopPropagation();
                        moverAtividadeEntreDias(dragInfo.diaData, dragInfo.atividadeId, dia.data, a.id);
                        setDragInfo(null);
                        setDragOverDia(null);
                      }}
                    >
                      {editavel && <span className="gf-plano-drag-handle"><GripVertical size={14} /></span>}
                      <div className="gf-plano-atividade-info">
                        <div className="gf-plano-atividade-desc">{a.descricao}</div>
                        <div className="gf-plano-atividade-meta">
                          <Badge tone="blue">{a.disciplina || "—"}</Badge>
                          <span>{a.fornecedor || "—"}</span>
                          {a.groupId && <Badge tone="purple">Repete</Badge>}
                        </div>
                        {a.observacao && <div className="gf-plano-atividade-obs">{a.observacao}</div>}
                      </div>
                      {editavel && (
                        <div className="gf-row-actions">
                          <button className="gf-icon-btn" title="Editar" onClick={() => setAtividadeModal({ diaData: dia.data, atividade: a })}><Pencil size={14} /></button>
                          <button className="gf-icon-btn" title="Duplicar" onClick={() => duplicarAtividade(dia.data, a)}><Copy size={14} /></button>
                          <button className="gf-icon-btn danger" title="Excluir" onClick={() => excluirAtividade(dia.data, a)}><Trash2 size={14} /></button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {atividadeModal && (
        <AtividadeModal
          diaData={atividadeModal.diaData}
          atividade={atividadeModal.atividade}
          diasDoPlano={plano.dias}
          disciplinas={disciplinas} setDisciplinas={setDisciplinas}
          fornecedorOptions={fornecedorOptions}
          onClose={() => setAtividadeModal(null)}
          onSave={salvarAtividade}
        />
      )}

      {repeatPrompt && (
        <Modal title={repeatPrompt.kind === "edit" ? "Atividade repetida" : "Excluir atividade repetida"} onClose={() => setRepeatPrompt(null)} width={440}>
          <p style={{ marginTop: 0 }}>
            {repeatPrompt.kind === "edit"
              ? "Esta atividade se repete em outros dias. Deseja alterar apenas esta atividade ou todas as repetições?"
              : "Esta atividade se repete em outros dias. Deseja excluir apenas deste dia ou de todos os dias?"}
          </p>
          <div className="gf-form-actions">
            <button
              className="gf-btn gf-btn-ghost"
              onClick={() => (repeatPrompt.kind === "edit"
                ? aplicarEdicao(repeatPrompt.atividadeId, repeatPrompt.groupId, repeatPrompt.camposConteudo, false)
                : aplicarExclusao(repeatPrompt.atividadeId, repeatPrompt.diaData, repeatPrompt.groupId, false))}
            >Apenas este dia</button>
            <button
              className="gf-btn gf-btn-primary"
              onClick={() => (repeatPrompt.kind === "edit"
                ? aplicarEdicao(repeatPrompt.atividadeId, repeatPrompt.groupId, repeatPrompt.camposConteudo, true)
                : aplicarExclusao(repeatPrompt.atividadeId, repeatPrompt.diaData, repeatPrompt.groupId, true))}
            >Todas as repetições</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// Formulário de criação/edição de uma atividade de um dia do planejamento.
function AtividadeModal({ diaData, atividade, diasDoPlano, disciplinas, setDisciplinas, fornecedorOptions, onClose, onSave }) {
  const isEdicao = !!atividade;
  const [descricao, setDescricao] = useState(atividade?.descricao || "");
  const [disciplina, setDisciplina] = useState(atividade?.disciplina || "");
  const [fornecedor, setFornecedor] = useState(atividade?.fornecedor || "");
  const [observacao, setObservacao] = useState(atividade?.observacao || "");
  const [repete, setRepete] = useState(false);
  const [diasSelecionados, setDiasSelecionados] = useState([]);
  const [erro, setErro] = useState("");

  const outrosDias = diasDoPlano.filter((d) => d.data !== diaData);
  const fornecedorSelectOptions = [{ value: "Não se aplica", label: "Não se aplica" }, ...fornecedorOptions.map((s) => ({ value: s, label: s }))];

  const toggleDia = (data) => {
    setDiasSelecionados((prev) => (prev.includes(data) ? prev.filter((d) => d !== data) : [...prev, data]));
  };

  const submit = (e) => {
    e.preventDefault();
    if (!descricao.trim()) { setErro("Informe a descrição da atividade."); return; }
    if (!disciplina) { setErro("Selecione a disciplina."); return; }
    onSave(diaData, { id: atividade?.id, descricao: descricao.trim(), disciplina, fornecedor, observacao: observacao.trim() }, repete ? diasSelecionados : []);
  };

  return (
    <Modal title={isEdicao ? "Editar Atividade" : "Adicionar Atividade"} onClose={onClose} width={520}>
      <form onSubmit={submit} className="gf-stack" style={{ gap: 14 }}>
        <Field label="Descrição">
          <input value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Descreva a atividade…" />
        </Field>
        <Field label="Disciplina">
          <DisciplinaSelect value={disciplina} onChange={setDisciplina} disciplinas={disciplinas} setDisciplinas={setDisciplinas} />
        </Field>
        <Field label="Fornecedor">
          <SearchableSelect value={fornecedor} onChange={setFornecedor} options={fornecedorSelectOptions} placeholder="Buscar fornecedor…" />
        </Field>
        <Field label="Observação" hint="Opcional">
          <textarea rows={2} value={observacao} onChange={(e) => setObservacao(e.target.value)} placeholder="Observações adicionais…" />
        </Field>
        {!isEdicao && outrosDias.length > 0 && (
          <div>
            <label className="gf-checkbox">
              <input type="checkbox" checked={repete} onChange={(e) => { setRepete(e.target.checked); if (!e.target.checked) setDiasSelecionados([]); }} />
              Esta atividade se repete em outros dias?
            </label>
            {repete && (
              <div className="gf-rateio-box" style={{ marginTop: 8 }}>
                {outrosDias.map((d) => (
                  <label className="gf-checkbox" key={d.data} style={{ fontWeight: 500 }}>
                    <input type="checkbox" checked={diasSelecionados.includes(d.data)} onChange={() => toggleDia(d.data)} />
                    {weekdayName(d.data)} — {fmtDate(d.data)}
                  </label>
                ))}
              </div>
            )}
          </div>
        )}
        {erro && <p className="gf-warn">{erro}</p>}
        <div className="gf-form-actions">
          <button type="submit" className="gf-btn gf-btn-primary">Salvar atividade</button>
        </div>
      </form>
    </Modal>
  );
}

/* ===================================================================
   RELATÓRIOS DE OBRA — LÓGICA PURA (sem React, sem DOM exceto DOMParser injetável)
   Módulo operacional/técnico. NÃO toca em dados financeiros.
   (marcador: REL_PURE_BEGIN)
=================================================================== */

const REL_PREFIXO = "glover:rel:";
const REL_STATUS_ELAB = "Em elaboração";
const REL_STATUS_FINAL = "Finalizado";

/* ---------- Datas (strings ISO YYYY-MM-DD; aritmética em UTC) ---------- */
const relIsoParaDias = (iso) => Math.floor(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 86400000);
const relDiasParaIso = (n) => new Date(n * 86400000).toISOString().slice(0, 10);
const relSomaDias = (iso, n) => relDiasParaIso(relIsoParaDias(iso) + n);
const relDiaSemana = (iso) => new Date(relIsoParaDias(iso) * 86400000).getUTCDay(); // 0 = domingo
const relDataValida = (iso) => typeof iso === "string" && /^\d{4}-\d{2}-\d{2}$/.test(iso) && relDiasParaIso(relIsoParaDias(iso)) === iso;
const relFmtData = (iso) => (iso && relDataValida(iso) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : "—");
const relFmtDataCurta = (iso) => (iso && relDataValida(iso) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "");
const REL_MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function relPeriodoExtenso(ini, fim) {
  if (!relDataValida(ini) || !relDataValida(fim)) return "";
  const [ya, ma, da] = ini.split("-"), [yb, mb, db] = fim.split("-");
  if (ini === fim) return `${db} de ${REL_MESES[+mb - 1]} de ${yb}`;
  if (ya === yb && ma === mb) return `${da} a ${db} de ${REL_MESES[+mb - 1]} de ${yb}`;
  return `${da} de ${REL_MESES[+ma - 1]} de ${ya} a ${db} de ${REL_MESES[+mb - 1]} de ${yb}`;
}

/* ---------- Números ---------- */
const relRound = (v, dec = 2) => { const f = Math.pow(10, dec); return Math.round((v + Number.EPSILON) * f) / f; };
// Formata número em pt-BR até `maxDec` casas, sem zeros à direita desnecessários (28 -> "28", 28.5 -> "28,5").
function relFmtNum(v, maxDec = 1) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  const s = relRound(v, maxDec).toFixed(maxDec).replace(/0+$/, "").replace(/\.$/, "");
  return s.replace(".", ",");
}
const relFmtPct = (v, maxDec = 1) => (v === null || v === undefined || !isFinite(v) ? "—" : `${relFmtNum(v, maxDec)}%`);
const relFmtDias = (min, minPorDia) => (minPorDia > 0 ? relFmtNum(min / minPorDia, 2) : "—");
// Interpreta "55", "55,5", "55.5", "55%" -> número; "" -> null (não aferida); inválido -> NaN
function relParsePct(texto) {
  if (texto === null || texto === undefined) return null;
  const t = String(texto).replace("%", "").replace(",", ".").trim();
  if (t === "") return null;
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}
const relPctValido = (v) => typeof v === "number" && isFinite(v) && v >= 0 && v <= 100;

// Arredonda uma lista de valores (que somam `total`) para `dec` casas pelo método do maior resto,
// garantindo que a soma dos valores arredondados seja EXATAMENTE `total`. Retorna inteiros em unidades de 10^-dec.
function relDistribuirArredondado(valores, total = 100, dec = 2) {
  const f = Math.pow(10, dec);
  const alvo = Math.round(total * f);
  const soma = valores.reduce((a, b) => a + b, 0);
  if (!valores.length || soma <= 0) return valores.map(() => 0);
  const brutos = valores.map((v) => (v / soma) * alvo);
  const pisos = brutos.map((b) => Math.floor(b + 1e-9));
  let resto = alvo - pisos.reduce((a, b) => a + b, 0);
  const ordem = brutos.map((b, i) => ({ i, r: b - pisos[i] })).sort((a, b) => b.r - a.r || a.i - b.i);
  for (let k = 0; k < ordem.length && resto > 0; k++, resto--) pisos[ordem[k].i] += 1;
  return pisos;
}

function relNomeArquivoPDF(obraNome, numero, dataFinal) {
  const limpo = String(obraNome || "Obra").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "Obra";
  const n = String(numero ?? 0).padStart(2, "0");
  const d = relDataValida(dataFinal) ? dataFinal : "sem-data";
  return `Relatorio_Obra_${limpo}_N${n}_${d}.pdf`;
}

/* ---------- XML do Microsoft Project ---------- */
function relFilhos(el, nome) {
  const out = [];
  if (!el) return out;
  for (let n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 1 && n.localName === nome) out.push(n);
  return out;
}
const relFilho = (el, nome) => relFilhos(el, nome)[0] || null;
function relTxt(el, nome) {
  const f = relFilho(el, nome);
  return f && f.textContent != null ? f.textContent.trim() : "";
}
const relNumOuNull = (s) => (s === "" || s === null || s === undefined || isNaN(Number(s)) ? null : Number(s));
const relDataXML = (s) => (s && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : null);

// Duração ISO 8601 do Project ("PT80H0M0S", "P5D"...) -> minutos de trabalho (inteiro). Nunca assume 8h/dia.
function relDuracaoMin(str, minPorDia) {
  if (!str) return null;
  const m = /^P(?:(\d+(?:\.\d+)?)Y)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)W)?(?:(\d+(?:\.\d+)?)D)?(?:T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?)?$/.exec(str.trim());
  if (!m) return null;
  const [, , , w, d, h, mi, s] = m.map((x) => (x === undefined ? 0 : Number(x)));
  return Math.round((w || 0) * 5 * minPorDia + (d || 0) * minPorDia + (h || 0) * 60 + (mi || 0) + (s || 0) / 60);
}

function relParseCalendarios(root, avisos) {
  const cals = {};
  const bloco = relFilho(root, "Calendars");
  let recorrentes = 0, workWeeks = 0;
  for (const c of relFilhos(bloco, "Calendar")) {
    if (relTxt(c, "IsBaselineCalendar") === "1") continue;
    const uid = relTxt(c, "UID");
    if (uid === "") continue;
    const cal = { uid, nome: relTxt(c, "Name"), baseUid: null, dias: {}, excecoes: [] };
    const base = relTxt(c, "BaseCalendarUID");
    if (base !== "" && base !== "-1" && relTxt(c, "IsBaseCalendar") !== "1") cal.baseUid = base;
    for (const wd of relFilhos(relFilho(c, "WeekDays"), "WeekDay")) {
      const tipo = Number(relTxt(wd, "DayType"));
      const trab = relTxt(wd, "DayWorking") === "1";
      if (tipo >= 1 && tipo <= 7) cal.dias[tipo] = trab;
      else if (tipo === 0) {
        const tp = relFilho(wd, "TimePeriod");
        const de = relDataXML(relTxt(tp, "FromDate")), ate = relDataXML(relTxt(tp, "ToDate"));
        if (de && ate) cal.excecoes.push({ de, ate, trabalha: trab });
      }
    }
    for (const ex of relFilhos(relFilho(c, "Exceptions"), "Exception")) {
      const tp = relFilho(ex, "TimePeriod");
      const de = relDataXML(relTxt(tp, "FromDate")), ate = relDataXML(relTxt(tp, "ToDate"));
      const ocorr = Number(relTxt(ex, "Occurrences") || 1), tipoRec = Number(relTxt(ex, "Type") || 1);
      if (ocorr > 1 && tipoRec !== 1 && tipoRec !== 0) recorrentes++;
      if (de && ate) cal.excecoes.push({ de, ate, trabalha: relTxt(ex, "DayWorking") === "1" });
    }
    if (relFilho(c, "WorkWeeks")) workWeeks++;
    cals[uid] = cal;
  }
  if (recorrentes) avisos.push({ nivel: "aviso", msg: `${recorrentes} exceção(ões) de calendário recorrente(s) (semanal/mensal/anual) não foram expandidas; apenas o intervalo informado no XML é considerado.` });
  if (workWeeks) avisos.push({ nivel: "aviso", msg: "O XML contém semanas de trabalho alternativas (WorkWeeks), que não são interpretadas; vale a semana padrão do calendário." });
  return cals;
}

// Dia útil segundo o calendário (exceções próprias > dia da semana próprio > calendário-base). Padrão: segunda a sexta.
function relDiaUtil(cals, calUid, iso, prof = 0) {
  const c = cals && cals[calUid];
  const dow = relDiaSemana(iso);
  if (!c || prof > 10) return dow !== 0 && dow !== 6;
  let achou;
  for (const e of c.excecoes) if (iso >= e.de && iso <= e.ate) achou = e.trabalha; // a última prevalece
  if (achou !== undefined) return achou;
  const dt = dow + 1; // 1..7 = domingo..sábado
  if (c.dias[dt] !== undefined) return c.dias[dt];
  if (c.baseUid !== null && cals[c.baseUid]) return relDiaUtil(cals, c.baseUid, iso, prof + 1);
  return dow !== 0 && dow !== 6;
}

// Lista de dias úteis (inteiros "dias desde 1970") entre ini e fim, inclusive.
function relDiasUteisEntre(cals, calUid, ini, fim) {
  const out = [];
  if (!ini || !fim) return out;
  const a = relIsoParaDias(ini), b = relIsoParaDias(fim);
  if (b < a || b - a > 20000) return out;
  for (let d = a; d <= b; d++) if (relDiaUtil(cals, calUid, relDiasParaIso(d))) out.push(d);
  return out;
}

/**
 * Lê o XML exportado pelo Microsoft Project.
 * @param {string} texto  conteúdo XML
 * @param {function} DomParserCtor  construtor de DOMParser (injetável para testes)
 * @returns {{ok:boolean, erro?:string, projeto?, calendarios?, tarefas?, avisos:Array}}
 */
function relParseProjectXML(texto, DomParserCtor) {
  const avisos = [];
  const Parser = DomParserCtor || (typeof DOMParser !== "undefined" ? DOMParser : null);
  if (!Parser) return { ok: false, erro: "Leitor de XML indisponível neste navegador.", avisos };
  if (!texto || !texto.trim()) return { ok: false, erro: "O arquivo está vazio.", avisos };
  const doc = new Parser().parseFromString(texto, "application/xml");
  const erroTag = doc.getElementsByTagName("parsererror")[0];
  if (erroTag) return { ok: false, erro: "O arquivo não é um XML válido (" + (erroTag.textContent || "").trim().slice(0, 120) + ").", avisos };
  const root = doc.documentElement;
  if (!root || root.localName !== "Project") return { ok: false, erro: "O XML não parece ter sido exportado pelo Microsoft Project (elemento raiz \"Project\" não encontrado).", avisos };

  let minPorDia = relNumOuNull(relTxt(root, "MinutesPerDay"));
  let minPorDiaAssumido = false;
  if (!minPorDia || minPorDia <= 0) {
    minPorDia = 480; minPorDiaAssumido = true;
    avisos.push({ nivel: "aviso", msg: "O XML não informa as horas de trabalho por dia (MinutesPerDay). Foi assumido 8 horas/dia; confira a conversão das durações." });
  }
  const projeto = {
    nome: relTxt(root, "Title") || relTxt(root, "Name") || "",
    minPorDia, minPorDiaAssumido,
    minPorSemana: relNumOuNull(relTxt(root, "MinutesPerWeek")),
    calUid: relTxt(root, "CalendarUID") || null,
    ini: relDataXML(relTxt(root, "StartDate")), fim: relDataXML(relTxt(root, "FinishDate")),
  };
  const calendarios = relParseCalendarios(root, avisos);
  if (!Object.keys(calendarios).length) avisos.push({ nivel: "aviso", msg: "O XML não contém calendários de trabalho. Será usada a semana padrão (segunda a sexta, sem feriados)." });
  else if (projeto.calUid && !calendarios[projeto.calUid]) avisos.push({ nivel: "aviso", msg: "O calendário padrão do projeto não foi encontrado no XML; será usada a semana padrão (segunda a sexta)." });

  const blocoTarefas = relFilho(root, "Tasks");
  const els = relFilhos(blocoTarefas, "Task");
  if (!els.length) return { ok: false, erro: "O XML não contém tarefas (elemento Tasks vazio ou ausente).", avisos };

  const tarefas = [];
  const pilha = []; // [{nivel, idx}]
  let ignoradasNulas = 0;
  for (const el of els) {
    const uid = relTxt(el, "UID");
    const nivel = relNumOuNull(relTxt(el, "OutlineLevel"));
    if (uid === "") continue;
    if (relTxt(el, "IsNull") === "1") { ignoradasNulas++; continue; }
    if (uid === "0" && (nivel === 0 || nivel === null)) continue; // tarefa-resumo do projeto
    if (nivel === null || nivel < 1) { ignoradasNulas++; continue; }
    const t = {
      uid, nome: relTxt(el, "Name") || "(sem nome)",
      wbs: relTxt(el, "WBS") || relTxt(el, "OutlineNumber") || "",
      nivel,
      resumoXml: relTxt(el, "Summary") === "1",
      marcoXml: relTxt(el, "Milestone") === "1",
      ativo: relTxt(el, "Active") !== "0",
      durMin: relDuracaoMin(relTxt(el, "Duration"), minPorDia),
      ini: relDataXML(relTxt(el, "Start")), fim: relDataXML(relTxt(el, "Finish")),
      cal: (() => { const c = relTxt(el, "CalendarUID"); return c === "" || c === "-1" ? null : c; })(),
      pctProj: relNumOuNull(relTxt(el, "PercentComplete")),
      bIni: null, bFim: null, bDurMin: null,
      preds: relFilhos(el, "PredecessorLink").map((p) => ({ uid: relTxt(p, "PredecessorUID"), tipo: relNumOuNull(relTxt(p, "Type")), lag: relNumOuNull(relTxt(p, "LinkLag")) })),
      pai: null, temFilhos: false,
    };
    for (const b of relFilhos(el, "Baseline")) {
      if (relTxt(b, "Number") === "0") {
        t.bIni = relDataXML(relTxt(b, "Start")); t.bFim = relDataXML(relTxt(b, "Finish"));
        t.bDurMin = relDuracaoMin(relTxt(b, "Duration"), minPorDia);
      }
    }
    while (pilha.length && pilha[pilha.length - 1].nivel >= nivel) pilha.pop();
    if (pilha.length) { t.pai = tarefas[pilha[pilha.length - 1].idx].uid; tarefas[pilha[pilha.length - 1].idx].temFilhos = true; }
    pilha.push({ nivel, idx: tarefas.length });
    tarefas.push(t);
  }
  if (!tarefas.length) return { ok: false, erro: "Nenhuma tarefa válida foi encontrada no XML.", avisos };
  if (ignoradasNulas) avisos.push({ nivel: "info", msg: `${ignoradasNulas} linha(s) em branco/nula(s) foram ignoradas.` });

  // Macro = raiz da cadeia hierárquica (nível 1)
  const porUid = new Map(tarefas.map((t) => [t.uid, t]));
  let semDuracao = 0, inativas = 0, resumosVazios = 0;
  for (const t of tarefas) {
    let r = t, g = 0;
    while (r.pai && porUid.has(r.pai) && g++ < 50) r = porUid.get(r.pai);
    t.macroUid = r.uid;
    t.resumo = t.temFilhos;
    if (t.resumoXml && !t.temFilhos) resumosVazios++;
    t.marco = !t.resumo && (t.marcoXml || t.durMin === 0);
    if (!t.resumo && !t.marco && !t.resumoXml && t.durMin === null) semDuracao++;
    if (!t.ativo && !t.resumo) inativas++;
    t.executavel = !t.resumo && !t.resumoXml && !t.marco && t.ativo && t.durMin !== null && t.durMin > 0;
  }
  if (semDuracao) avisos.push({ nivel: "aviso", msg: `${semDuracao} atividade(s) sem duração válida no XML foram excluídas do cálculo.` });
  if (inativas) avisos.push({ nivel: "aviso", msg: `${inativas} atividade(s) inativa(s) no Project foram excluídas do cálculo.` });
  if (resumosVazios) avisos.push({ nivel: "aviso", msg: `${resumosVazios} atividade(s) marcada(s) como resumo, mas sem subatividades, foram excluídas do cálculo.` });
  const nExec = tarefas.filter((t) => t.executavel).length;
  if (!nExec) avisos.push({ nivel: "erro", msg: "Nenhuma atividade executável (de menor nível, com duração maior que zero) foi encontrada. Não será possível calcular o avanço físico." });
  const semDatas = tarefas.filter((t) => t.executavel && (!t.ini || !t.fim)).length;
  if (semDatas) avisos.push({ nivel: "aviso", msg: `${semDatas} atividade(s) executável(is) sem datas de início/término: o avanço previsto delas será considerado 0%.` });
  const temBaseline = tarefas.some((t) => t.executavel && t.bIni && t.bFim);
  if (!temBaseline) avisos.push({ nivel: "info", msg: "O XML não possui linha de base (Baseline 0) salva. O cronograma importado poderá ser usado como referência do avanço previsto." });
  else if (tarefas.some((t) => t.executavel && !(t.bIni && t.bFim))) avisos.push({ nivel: "aviso", msg: "A linha de base está incompleta: algumas atividades executáveis não possuem Baseline; para elas serão usadas as datas atuais." });
  return { ok: true, projeto, calendarios, tarefas, avisos, temBaseline };
}

/* ---------- Versões: chave estável, diff ---------- */
const relNorm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();

// Atribui `chave` (identidade estável entre versões): mesma UID; senão WBS + nome.
function relAtribuirChaves(tarefasNovas, tarefasAnteriores) {
  const usadas = new Set();
  const antPorUid = new Map(), antPorWbsNome = new Map();
  for (const t of tarefasAnteriores || []) {
    antPorUid.set(t.uid, t);
    const k = relNorm(t.wbs) + "|" + relNorm(t.nome);
    if (!antPorWbsNome.has(k)) antPorWbsNome.set(k, t);
  }
  const resultado = tarefasNovas.map((t) => ({ ...t, chave: null }));
  // 1ª passada: UID
  for (const t of resultado) {
    const a = antPorUid.get(t.uid);
    if (a && a.chave && !usadas.has(a.chave)) { t.chave = a.chave; usadas.add(a.chave); }
  }
  // 2ª passada: WBS + nome
  for (const t of resultado) {
    if (t.chave) continue;
    const a = antPorWbsNome.get(relNorm(t.wbs) + "|" + relNorm(t.nome));
    if (a && a.chave && !usadas.has(a.chave)) { t.chave = a.chave; usadas.add(a.chave); }
  }
  // novas
  const todas = new Set([...usadas, ...(tarefasAnteriores || []).map((t) => t.chave)]);
  for (const t of resultado) {
    if (t.chave) continue;
    let c = `t${t.uid}`, n = 2;
    while (todas.has(c)) c = `t${t.uid}_${n++}`;
    t.chave = c; todas.add(c);
  }
  // pai/macro por chave
  const porUid = new Map(resultado.map((t) => [t.uid, t.chave]));
  for (const t of resultado) {
    t.paiChave = t.pai ? porUid.get(t.pai) || null : null;
    t.macroChave = porUid.get(t.macroUid) || t.chave;
  }
  return resultado;
}

// Compara duas versões (já com chaves). Retorna adicionadas/removidas/alteradas e totais.
function relDiffVersoes(antigas, novas) {
  const A = new Map(antigas.map((t) => [t.chave, t])), N = new Map(novas.map((t) => [t.chave, t]));
  const adicionadas = [], removidas = [], alteradas = [];
  for (const t of novas) if (!A.has(t.chave)) adicionadas.push({ chave: t.chave, nome: t.nome, wbs: t.wbs, executavel: t.executavel, durMin: t.durMin });
  for (const t of antigas) if (!N.has(t.chave)) removidas.push({ chave: t.chave, nome: t.nome, wbs: t.wbs, executavel: t.executavel, durMin: t.durMin });
  const campos = [["nome", "Nome"], ["wbs", "EAP/WBS"], ["nivel", "Nível"], ["paiChave", "Agrupador (pai)"], ["durMin", "Duração"], ["ini", "Início"], ["fim", "Término"], ["executavel", "Executável"]];
  for (const t of novas) {
    const a = A.get(t.chave);
    if (!a) continue;
    const mud = [];
    for (const [k, rot] of campos) {
      const va = a[k] ?? null, vb = t[k] ?? null;
      if (va !== vb) mud.push({ campo: rot, de: va, para: vb, chaveCampo: k });
    }
    if (mud.length) alteradas.push({ chave: t.chave, nome: t.nome, wbs: t.wbs, mudancas: mud, estrutural: mud.some((m) => ["nome", "wbs", "nivel", "paiChave", "durMin", "executavel"].includes(m.chaveCampo)) });
  }
  const soma = (l) => l.filter((t) => t.executavel).reduce((s, t) => s + (t.durMin || 0), 0);
  const relevante = adicionadas.some((t) => t.executavel) || removidas.some((t) => t.executavel) || alteradas.some((t) => t.mudancas.some((m) => ["durMin", "executavel", "paiChave"].includes(m.chaveCampo)));
  return { adicionadas, removidas, alteradas, totalMinAntes: soma(antigas), totalMinDepois: soma(novas), relevante };
}

/* ---------- Metodologia de avanço físico ---------- */
const relExecutaveis = (tarefas) => (tarefas || []).filter((t) => t.executavel);

// Pesos automáticos (duração / Σ durações), em centésimos de % (inteiros) que somam exatamente 10000.
function relPesos(atividades) {
  const bp = relDistribuirArredondado(atividades.map((a) => a.durMin), 100, 2);
  const total = bp.reduce((a, b) => a + b, 0);
  return { bp, totalMin: atividades.reduce((s, a) => s + a.durMin, 0), ok: atividades.length === 0 || total === 10000 };
}

/**
 * Reconstrói a distribuição planejada de dias úteis de cada atividade executável.
 * ref: { tipo: "baseline" | "primeira", tarefasRef?: tarefas da 1ª versão (com chaves) }
 * Premissa: distribuição uniforme do trabalho pelos dias úteis (calendário do Project) entre início e término.
 */
function relPlanejamento(versao, ref) {
  const avisos = [];
  const cals = versao.calendarios || {};
  const calProj = versao.projeto?.calUid || null;
  const refPorChave = new Map(((ref && ref.tarefasRef) || []).map((t) => [t.chave, t]));
  const itens = new Map();
  let usouBaseline = 0, usouPrimeira = 0, usouAtual = 0, semDatas = 0, incoerentes = 0;
  const execs = relExecutaveis(versao.tarefas);
  for (const t of execs) {
    let ini = null, fim = null, fonte = "atual";
    if (ref && ref.tipo === "baseline" && t.bIni && t.bFim) { ini = t.bIni; fim = t.bFim; fonte = "baseline"; usouBaseline++; }
    else if (ref && ref.tipo === "primeira" && refPorChave.get(t.chave)?.ini && refPorChave.get(t.chave)?.fim) {
      const r = refPorChave.get(t.chave); ini = r.ini; fim = r.fim; fonte = "primeira"; usouPrimeira++;
    } else { ini = t.ini; fim = t.fim; fonte = "atual"; usouAtual++; }
    const calUid = t.cal || calProj;
    const dias = ini && fim ? relDiasUteisEntre(cals, calUid, ini, fim) : [];
    if (!ini || !fim) semDatas++;
    else if (versao.projeto?.minPorDia && t.durMin) {
      const dd = t.durMin / versao.projeto.minPorDia;
      if (dias.length && Math.abs(dias.length - dd) > Math.max(1, dd * 0.25)) incoerentes++;
    }
    itens.set(t.chave, { chave: t.chave, dias, ini, fim, fonte });
  }
  if (ref && ref.tipo === "baseline" && usouAtual) avisos.push({ nivel: "aviso", msg: `${usouAtual} atividade(s) sem Baseline: o previsto delas usa as datas atuais do cronograma.` });
  if (ref && ref.tipo === "primeira" && usouAtual) avisos.push({ nivel: "aviso", msg: `${usouAtual} atividade(s) não existem na primeira versão importada: o previsto delas usa as datas da versão atual.` });
  if (!ref) avisos.push({ nivel: "aviso", msg: "Nenhuma referência de linha de base definida; o previsto usa as datas da versão atual." });
  if (semDatas) avisos.push({ nivel: "aviso", msg: `${semDatas} atividade(s) sem datas de início/término: previsto considerado 0%.` });
  if (incoerentes) avisos.push({ nivel: "aviso", msg: `${incoerentes} atividade(s) com duração incompatível com os dias úteis entre início e término. O previsto usa a contagem de dias úteis entre as datas; a duração (peso) vem do campo Duração do XML.` });
  const premissas = ["Distribuição uniforme do trabalho pelos dias úteis de cada atividade (calendários do Project; fins de semana, feriados e exceções respeitados)."];
  premissas.push(ref && ref.tipo === "baseline" ? "Referência do previsto: linha de base (Baseline 0) do Microsoft Project." : "Referência do previsto: primeira versão do cronograma importada (o XML não possui linha de base).");
  return { itens, avisos, premissas, fonteTipo: ref ? ref.tipo : null };
}

// Fração planejada concluída (0..1) de uma atividade até a data (inclusive), contando dias úteis.
function relFracaoPrevista(plan, chave, iso) {
  const it = plan.itens.get(chave);
  if (!it || !it.dias.length) return 0;
  const alvo = relIsoParaDias(iso);
  let lo = 0, hi = it.dias.length; // quantidade de dias <= alvo
  while (lo < hi) { const mid = (lo + hi) >> 1; if (it.dias[mid] <= alvo) lo = mid + 1; else hi = mid; }
  return lo / it.dias.length;
}

const relStatusAfer = (a) => (a === undefined || a === null || a.pct === null || a.pct === undefined ? "nao" : a.pct === 0 ? "zero" : a.pct >= 100 ? "completa" : "parcial");

/**
 * Cálculo completo do avanço em uma data de referência.
 * afer: { [chave]: { pct, origem } }  (ausente = não aferida; considerada 0% no somatório, com sinalização)
 */
function relCalcularAvanco(versao, plan, afer, dataRef) {
  const atividades = relExecutaveis(versao.tarefas);
  const minPorDia = versao.projeto?.minPorDia || 480;
  const pesos = relPesos(atividades);
  const linhas = [];
  let totalMin = 0, realCent = 0, prevNum = 0; // realCent: Σ durMin × pct(centésimos) ; prevNum: Σ durMin × fração
  let nNao = 0, nZero = 0, nParcial = 0, nCompleta = 0;
  const macros = new Map();
  const nomePorChave = new Map(versao.tarefas.map((t) => [t.chave, t]));
  // Agrupador do gráfico: tarefa-resumo 2 níveis abaixo do topo (ex.: nível 3 quando a obra é o nível 1).
  const nivelBase = Math.min(...versao.tarefas.map((t) => t.nivel || 1));
  const nivelAlvo = nivelBase + 2;
  const cadeia = (t) => { // da raiz até a própria tarefa
    const c = []; let x = t, g = 0;
    while (x && g++ < 60) { c.unshift(x); x = x.paiChave ? nomePorChave.get(x.paiChave) : null; }
    return c;
  };
  const macroDe = (t) => {
    const c = cadeia(t);
    const alvo = c.find((x) => x.nivel === nivelAlvo);
    if (alvo) return alvo;
    // cronograma mais raso: usa o resumo mais profundo acima da atividade (ou ela mesma se não houver)
    return c.length > 1 ? c[c.length - 2] : t;
  };
  atividades.forEach((t, i) => {
    const mac = macroDe(t);
    t = { ...t, macroChave: mac.chave };
    const a = afer ? afer[t.chave] : undefined;
    const st = relStatusAfer(a);
    if (st === "nao") nNao++; else if (st === "zero") nZero++; else if (st === "completa") nCompleta++; else nParcial++;
    const pctReal = st === "nao" ? 0 : Math.min(100, Math.max(0, a.pct));
    const frac = dataRef ? relFracaoPrevista(plan, t.chave, dataRef) : 0;
    const pctCent = Math.round(pctReal * 100);
    totalMin += t.durMin; realCent += t.durMin * pctCent; prevNum += t.durMin * frac;
    const linha = {
      chave: t.chave, nome: t.nome, wbs: t.wbs, nivel: t.nivel, macroChave: t.macroChave, durMin: t.durMin,
      pesoBp: pesos.bp[i], pctReal, aferida: st !== "nao", status: st, pctPrev: frac * 100,
      equivRealMin: (t.durMin * pctCent) / 10000, equivPrevMin: t.durMin * frac,
    };
    linhas.push(linha);
    let m = macros.get(t.macroChave);
    if (!m) {
      const mt = nomePorChave.get(t.macroChave);
      const pai = mt && mt.paiChave ? nomePorChave.get(mt.paiChave) : null;
      m = { chave: t.macroChave, nome: mt ? mt.nome : "(sem agrupador)", wbs: mt ? mt.wbs : "", grupo: pai ? pai.nome : "", durMin: 0, realCent: 0, prevNum: 0, n: 0, nNao: 0 };
      macros.set(t.macroChave, m);
    }
    m.durMin += t.durMin; m.realCent += t.durMin * pctCent; m.prevNum += t.durMin * frac; m.n++; if (st === "nao") m.nNao++;
  });
  const contNomes = new Map();
  for (const m of macros.values()) contNomes.set(relNorm(m.nome), (contNomes.get(relNorm(m.nome)) || 0) + 1);
  const macrosLista = [...macros.values()].map((m) => ({
    chave: m.chave, nome: contNomes.get(relNorm(m.nome)) > 1 && m.grupo ? `${m.nome} (${m.grupo})` : m.nome, wbs: m.wbs, durMin: m.durMin, n: m.n, nNao: m.nNao,
    pctReal: m.durMin ? m.realCent / m.durMin / 100 : 0, pctPrev: m.durMin ? (m.prevNum / m.durMin) * 100 : 0,
    equivRealMin: m.realCent / 10000,
  }));
  const ordemMacro = new Map(versao.tarefas.map((t, i) => [t.chave, i]));
  macrosLista.sort((a, b) => (ordemMacro.get(a.chave) ?? 0) - (ordemMacro.get(b.chave) ?? 0));
  const real = totalMin ? realCent / totalMin / 100 : 0;
  const prev = totalMin ? (prevNum / totalMin) * 100 : 0;
  return {
    linhas, macros: macrosLista, totalMin, minPorDia, pesosOk: pesos.ok, nAtividades: atividades.length,
    real: relRound(real, 4), prev: relRound(prev, 4), equivRealMin: realCent / 10000, equivPrevMin: prevNum,
    contagem: { nao: nNao, zero: nZero, parcial: nParcial, completa: nCompleta },
  };
}

function relIndicadores(prev, real) {
  const dev = relRound(real - prev, 1);
  const situacao = dev > 0 ? "ADIANTADA" : dev < 0 ? "ATRASADA" : "CONFORME O PREVISTO";
  const sinal = dev > 0 ? "+" : dev < 0 ? "−" : "";
  return {
    prev: relRound(prev, 1), real: relRound(real, 1), desvio: dev, situacao,
    desvioTexto: `${sinal}${relFmtNum(Math.abs(dev), 1)} ${Math.abs(dev) === 1 ? "PONTO PERCENTUAL" : "PONTOS PERCENTUAIS"}`,
  };
}

// Curva S prevista: amostras semanais do primeiro ao último dia útil planejado.
function relCurvaPrevista(versao, plan) {
  const atividades = relExecutaveis(versao.tarefas).filter((t) => plan.itens.get(t.chave)?.dias.length);
  if (!atividades.length) return [];
  let min = Infinity, max = -Infinity;
  for (const t of atividades) { const d = plan.itens.get(t.chave).dias; min = Math.min(min, d[0]); max = Math.max(max, d[d.length - 1]); }
  const totalMin = relExecutaveis(versao.tarefas).reduce((s, t) => s + t.durMin, 0);
  const pontos = [];
  const pontoEm = (dia) => {
    let acc = 0;
    for (const t of atividades) {
      const dias = plan.itens.get(t.chave).dias;
      let lo = 0, hi = dias.length;
      while (lo < hi) { const m = (lo + hi) >> 1; if (dias[m] <= dia) lo = m + 1; else hi = m; }
      acc += t.durMin * (lo / dias.length);
    }
    return { d: relDiasParaIso(dia), v: totalMin ? (acc / totalMin) * 100 : 0 };
  };
  pontos.push({ d: relDiasParaIso(min - 1), v: 0 });
  for (let d = min + 6; d < max; d += 7) pontos.push(pontoEm(d));
  pontos.push(pontoEm(max));
  return pontos;
}

// Série realizada: apenas datas com aferição registrada (sem interpolar/inventar).
function relCurvaRealizada(historico) {
  const mapa = new Map();
  for (const h of historico) if (relDataValida(h.dataRef) && isFinite(h.real)) mapa.set(h.dataRef, h.real);
  return [...mapa.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([d, v]) => ({ d, v }));
}

// Sugestão de aferição: último percentual registrado para cada atividade em relatórios anteriores.
function relSugestoes(relatoriosAnteriores) {
  const ord = [...relatoriosAnteriores].sort((a, b) => (a.dataRef < b.dataRef ? -1 : a.dataRef > b.dataRef ? 1 : (a.numero || 0) - (b.numero || 0)));
  const sug = {};
  for (const r of ord) for (const [k, v] of Object.entries(r.afer || {})) if (v && relPctValido(v.pct)) sug[k] = { pct: v.pct, dataRef: r.dataRef, numero: r.numero };
  return sug;
}

/* ---------- Texto automático ---------- */
function relTextoIntroducao(obraNome, ini, fim) {
  const per = relPeriodoExtenso(ini, fim);
  return `O presente relatório tem como objetivo apresentar o acompanhamento das atividades executadas na obra ${obraNome || "—"}${per ? `, compreendendo o período de ${per}` : ""}.`;
}

function relListaTexto(itens, max = 4) {
  const l = itens.slice(0, max);
  const resto = itens.length - l.length;
  let s = l.join("; ");
  if (resto > 0) s += `; e outras ${resto}`;
  return s;
}

/**
 * Análise técnica por regras (sem IA, sem inventar causas).
 * dados: { obraNome, ind:{prev,real,desvio}, dataRef, macros, linhas, principais:[string], anterior:{real,dataRef}|null, nNao }
 */
function relGerarAnaliseTexto(d) {
  const p = [];
  const { ind } = d;
  const dd = relFmtNum(Math.abs(ind.desvio), 1);
  let s1 = `O avanço físico aferido da obra atingiu ${relFmtPct(ind.real)}, enquanto o cronograma de referência previa ${relFmtPct(ind.prev)} até ${relFmtData(d.dataRef)}`;
  if (ind.desvio > 0) s1 += `, representando um adiantamento de ${dd} ponto${Math.abs(ind.desvio) === 1 ? "" : "s"} percentua${Math.abs(ind.desvio) === 1 ? "l" : "is"}.`;
  else if (ind.desvio < 0) s1 += `, representando um atraso de ${dd} ponto${Math.abs(ind.desvio) === 1 ? "" : "s"} percentua${Math.abs(ind.desvio) === 1 ? "l" : "is"} em relação ao cronograma.`;
  else s1 += ", o que indica andamento conforme o previsto.";
  p.push(s1);
  if (d.anterior && isFinite(d.anterior.real)) {
    const delta = relRound(ind.real - d.anterior.real, 1);
    const pl = Math.abs(delta) === 1 ? "ponto percentual" : "pontos percentuais";
    p.push(`Em relação à aferição anterior (${relFmtData(d.anterior.dataRef)}), o avanço físico aferido passou de ${relFmtPct(d.anterior.real)} para ${relFmtPct(ind.real)} (${delta >= 0 ? "+" : "−"}${relFmtNum(Math.abs(delta), 1)} ${pl} no intervalo).`);
  }
  if (d.principais && d.principais.length) p.push(`Entre as principais atividades registradas no período, destacam-se: ${relListaTexto(d.principais.map((x) => x.replace(/[.;\s]+$/, "")), 6)}.`);
  const LIM = 5;
  const macros = (d.macros || []).filter((m) => m.nNao < m.n); // só macros com ao menos uma aferição
  const acima = macros.filter((m) => m.pctReal - m.pctPrev >= LIM).sort((a, b) => (b.pctReal - b.pctPrev) - (a.pctReal - a.pctPrev));
  const abaixo = macros.filter((m) => m.pctPrev - m.pctReal >= LIM).sort((a, b) => (b.pctPrev - b.pctReal) - (a.pctPrev - a.pctReal));
  const fm = (m) => `${m.nome} (realizado ${relFmtPct(m.pctReal)} x previsto ${relFmtPct(m.pctPrev)})`;
  if (acima.length) p.push(`Apresentaram avanço superior ao previsto as atividades macro: ${relListaTexto(acima.map(fm), 3)}.`);
  if (abaixo.length) p.push(`Apresentaram avanço inferior ao previsto as atividades macro: ${relListaTexto(abaixo.map(fm), 3)}.`);
  if (!acima.length && !abaixo.length && macros.length) p.push("Não foram identificadas atividades macro com desvio relevante (igual ou superior a 5 pontos percentuais) em relação ao previsto.");
  // Atividades com término previsto até a data e ainda não concluídas (fato objetivo)
  const vencidas = (d.linhas || []).filter((l) => l.aferida && l.pctPrev >= 99.999 && l.pctReal < 100).sort((a, b) => (100 - a.pctReal) * a.durMin < (100 - b.pctReal) * b.durMin ? 1 : -1);
  if (vencidas.length) p.push(`Atividades com término previsto até a data de referência e ainda não concluídas (${vencidas.length}): ${relListaTexto(vencidas.map((l) => `${l.nome} (${relFmtPct(l.pctReal)})`), 4)}. Recomenda-se priorizar a conclusão dessas atividades no próximo período.`);
  if (d.nNao > 0) p.push(`Ressalva: ${d.nNao} atividade(s) executável(is) ainda não possuem aferição neste relatório e foram consideradas com 0% no cálculo do avanço realizado.`);
  if (ind.desvio < 0 && !abaixo.length && !vencidas.length) p.push("Recomenda-se acompanhar a evolução das atividades no próximo período para recuperação do desvio apontado.");
  return p.join("\n\n");
}

/* ---------- Integridade ---------- */
// Verificações de integridade do cronograma para exibição (regras 1, 2, 13, 15)
function relVerificarIntegridade(versao) {
  const ex = relExecutaveis(versao.tarefas);
  const pesos = relPesos(ex);
  const problemas = [];
  if (!ex.length) problemas.push("Sem atividades executáveis.");
  if (ex.some((t) => t.resumo || t.marco)) problemas.push("Há resumo/marco entre as executáveis.");
  if (!pesos.ok) problemas.push("Pesos não somam 100%.");
  return { ok: problemas.length === 0, problemas, totalMin: pesos.totalMin, somaPesosBp: pesos.bp.reduce((a, b) => a + b, 0), n: ex.length };
}


/* ---------- Consolidação (usada pela tela, pelo snapshot e pelo PDF) ---------- */
// historico: [{id, dataRef, real}] de TODOS os relatórios (resumos) da obra, exceto o atual.
function relConsolidar({ rel, versao, plan, historico, refTipo, versaoNome }) {
  if (!versao || !plan) return null;
  const av = relCalcularAvanco(versao, plan, rel.afer || {}, rel.dataRef);
  const ind = relIndicadores(av.prev, av.real);
  const hist = (historico || []).filter((h) => h.id !== rel.id && h.dataRef && h.dataRef <= rel.dataRef && isFinite(h.real));
  const real = relCurvaRealizada([...hist, { dataRef: rel.dataRef, real: relRound(av.real, 2) }]);
  const premissas = [...plan.premissas];
  if (versaoNome) premissas.push(`Versão do cronograma utilizada: ${versaoNome}.`);
  premissas.push(`Duração das atividades convertida em dias de trabalho com ${relFmtNum(av.minPorDia / 60, 2)} h/dia.`);
  return {
    geral: { ...ind, nAtividades: av.nAtividades, totalDias: av.totalMin / av.minPorDia },
    macros: av.macros.map((m) => ({ chave: m.chave, wbs: m.wbs, nome: m.nome, durDias: m.durMin / av.minPorDia, pctReal: m.pctReal, pctPrev: m.pctPrev, n: m.n, nNao: m.nNao })),
    linhas: av.linhas.map((l) => ({ chave: l.chave, nome: l.nome, wbs: l.wbs, nivel: l.nivel, macroChave: l.macroChave, durMin: l.durMin, pesoBp: l.pesoBp, pctReal: l.pctReal, aferida: l.aferida, status: l.status, pctPrev: l.pctPrev })),
    curva: { prev: relCurvaPrevista(versao, plan), real },
    premissas, contagem: av.contagem, nNao: av.contagem.nao, minPorDia: av.minPorDia, totalMin: av.totalMin,
    pesosOk: av.pesosOk, refTipo: refTipo || plan.fonteTipo, versaoNome: versaoNome || "", avisos: plan.avisos,
  };
}

/* ===================================================================
   RELATÓRIOS DE OBRA — RENDERIZAÇÃO DE PÁGINAS (canvas) E ESCRITA DE PDF
   Páginas A4 retrato desenhadas em canvas 1680 x 2376 px (~203 dpi), exportadas em JPEG
   e empacotadas em um PDF mínimo escrito à mão (sem bibliotecas externas).

=================================================================== */

const REL_W = 1680, REL_H = 2376, REL_M = 140;
const REL_COR = {
  verde: "#0E3B2E", verdeMed: "#1D5A45", accent: "#2F8F5B", accentClaro: "#BFE0CC", cinza: "#F0F1EE", cinzaMed: "#D9DCD7",
  texto: "#1F2A25", muted: "#5D6B64", vermelho: "#B23A34", branco: "#FFFFFF",
};
const REL_FONTE_CORPO = '"Inter", "Helvetica Neue", Helvetica, Arial, sans-serif';
const REL_FONTE_TITULO = '"Space Grotesk", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif';
const relFonte = (px, peso = 400, titulo = false) => `${peso} ${px}px ${titulo ? REL_FONTE_TITULO : REL_FONTE_CORPO}`;
const REL_TOPO_CONTEUDO = 380, REL_BASE_CONTEUDO = REL_H - 270;

function relCriarCanvas(w, h) {
  const c = (globalThis.__relCriarCanvas ? globalThis.__relCriarCanvas() : document.createElement("canvas"));
  c.width = w; c.height = h;
  return c;
}
function relCarregarImagem(src) {
  if (globalThis.__relCarregarImagem) return globalThis.__relCarregarImagem(src);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Não foi possível carregar a imagem."));
    img.src = src;
  });
}
async function relCanvasParaJpeg(canvas, qualidade) {
  if (typeof canvas.toBuffer === "function") return new Uint8Array(canvas.toBuffer("image/jpeg", Math.round(qualidade * 100)));
  const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", qualidade));
  if (!blob) throw new Error("Falha ao gerar a imagem da página.");
  return new Uint8Array(await blob.arrayBuffer());
}

/* ---------- primitivas de desenho ---------- */
function relCaminhoArredondado(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function relRetangulo(ctx, x, y, w, h, cor, r = 0) {
  ctx.fillStyle = cor;
  if (r > 0) { relCaminhoArredondado(ctx, x, y, w, h, r); ctx.fill(); } else ctx.fillRect(x, y, w, h);
}
function relTexto(ctx, texto, x, y, { fonte, cor = REL_COR.texto, align = "left", espaco = 0 } = {}) {
  if (fonte) ctx.font = fonte;
  ctx.fillStyle = cor; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = espaco ? `${espaco}px` : "0px";
  ctx.fillText(texto, x, y);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
// Quebra de linha por palavras usando a fonte atual do contexto. Palavras maiores que a largura são partidas.
function relQuebrar(ctx, texto, larg) {
  const out = [];
  for (const par of String(texto ?? "").split(/\r?\n/)) {
    if (par.trim() === "") { out.push(""); continue; }
    let linha = "";
    for (const palavra of par.split(/\s+/).filter(Boolean)) {
      let p = palavra;
      while (ctx.measureText(p).width > larg) { // palavra gigante
        let k = p.length;
        while (k > 1 && ctx.measureText(p.slice(0, k)).width > larg) k--;
        if (linha) { out.push(linha); linha = ""; }
        out.push(p.slice(0, k)); p = p.slice(k);
      }
      const teste = linha ? linha + " " + p : p;
      if (ctx.measureText(teste).width <= larg) linha = teste;
      else { out.push(linha); linha = p; }
    }
    if (linha) out.push(linha);
  }
  return out;
}
function relElipse(ctx, texto, larg) {
  if (ctx.measureText(texto).width <= larg) return texto;
  let t = texto;
  while (t.length > 1 && ctx.measureText(t + "…").width > larg) t = t.slice(0, -1);
  return t + "…";
}
function relAjustarFonte(ctx, texto, larg, pxMax, pxMin, peso, titulo) {
  let px = pxMax;
  ctx.font = relFonte(px, peso, titulo);
  while (px > pxMin && ctx.measureText(texto).width > larg) { px -= 2; ctx.font = relFonte(px, peso, titulo); }
  return px;
}
function relLimitarLinhas(ctx, linhas, max, larg) {
  if (linhas.length <= max) return linhas;
  const l = linhas.slice(0, max);
  l[max - 1] = relElipse(ctx, l[max - 1] + "…", larg);
  return l;
}

/* ---------- fluxo de texto com paginação ---------- */
// blocos: {k:'h2'|'p'|'li'|'gap'|'kpis'|'nota', texto|h|itens}. Retorna lista de páginas, cada uma com ops já quebrados.
function relFluxo(ctx, blocos, yIni, yFim, larg) {
  const paginas = [[]];
  let y = yIni;
  const LH = 46;
  const nova = () => { paginas.push([]); y = yIni; };
  for (const b of blocos) {
    if (b.k === "gap") { if (y + b.h <= yFim) { y += b.h; } else nova(); continue; }
    if (b.k === "kpis") {
      const h = 200;
      if (y + h > yFim) nova();
      paginas[paginas.length - 1].push({ k: "kpis", y, h, itens: b.itens });
      y += h + 30; continue;
    }
    if (b.k === "h2") {
      ctx.font = relFonte(36, 700, true);
      const linhas = relQuebrar(ctx, b.texto, larg);
      const h = linhas.length * 52 + 30;
      if (y + h + 2 * LH > yFim) nova();
      paginas[paginas.length - 1].push({ k: "h2", y: y + 30, linhas, h });
      y += h + 6; continue;
    }
    const nota = b.k === "nota";
    const fpx = nota ? 26 : 30, lh = nota ? 38 : LH;
    const indent = b.k === "li" ? 56 : 0;
    ctx.font = relFonte(fpx, 400);
    const linhas = relQuebrar(ctx, b.texto, larg - indent);
    let i = 0;
    while (i < linhas.length) {
      let cabem = Math.floor((yFim - y) / lh);
      if (cabem < 2 && linhas.length - i > 1) { nova(); cabem = Math.floor((yFim - y) / lh); }
      if (cabem < 1) { nova(); cabem = Math.floor((yFim - y) / lh); }
      const fatia = linhas.slice(i, i + cabem);
      const h = fatia.length * lh;
      paginas[paginas.length - 1].push({ k: b.k, y, linhas: fatia, h, lh, fpx, indent, bullet: b.k === "li" && i === 0, vazio: false });
      y += h; i += fatia.length;
    }
    y += b.k === "li" ? 12 : 22;
  }
  return paginas;
}

/* ---------- paginação do relatório ---------- */
function relPaginar(ctx, d) {
  const larg = REL_W - 2 * REL_M;
  const paginas = [{ tipo: "capa" }, { tipo: "indice" }];
  const secoes = {};
  // 1. Introdução
  const blocosIntro = [{ k: "p", texto: d.introTexto || "" }, { k: "h2", texto: "Principais atividades realizadas no período" }];
  if (d.principais && d.principais.length) for (const a of d.principais) blocosIntro.push({ k: "li", texto: a });
  else blocosIntro.push({ k: "nota", texto: "Nenhuma atividade foi informada para o período." });
  if (d.geral) blocosIntro.push({ k: "gap", h: 30 }, { k: "h2", texto: "Situação do avanço físico na data de referência" }, { k: "kpis", itens: [
    { rot: "AVANÇO PREVISTO", val: relFmtPct(d.geral.prev) }, { rot: "AVANÇO REALIZADO", val: relFmtPct(d.geral.real) }, { rot: "SITUAÇÃO", val: d.geral.situacao, pequeno: true },
  ] });
  const fi = relFluxo(ctx, blocosIntro, REL_TOPO_CONTEUDO, REL_BASE_CONTEUDO, larg);
  secoes.intro = paginas.length + 1;
  fi.forEach((ops, i) => paginas.push({ tipo: "texto", sec: 1, titulo: "1. INTRODUÇÃO", cont: i > 0, ops }));
  // 2. Avanço físico
  secoes.avanco = paginas.length + 1;
  const macros = d.macros || [];
  const LINHA_H = 100;
  const capPrim = Math.max(1, Math.floor((REL_BASE_CONTEUDO - 840) / LINHA_H));
  const capOutras = Math.max(1, Math.floor((REL_BASE_CONTEUDO - REL_TOPO_CONTEUDO - 80) / LINHA_H));
  let pos = 0, primeira = true;
  do {
    const cap = primeira ? capPrim : capOutras;
    paginas.push({ tipo: "avanco", sec: 2, titulo: "2. AVANÇO FÍSICO", cont: !primeira, primeira, macros: macros.slice(pos, pos + cap), todas: macros.length });
    pos += cap; primeira = false;
  } while (pos < macros.length);
  // 3. Previsto x realizado
  secoes.curva = paginas.length + 1;
  paginas.push({ tipo: "curva", sec: 3, titulo: "3. ANDAMENTO — PREVISTO X REALIZADO" });
  // 4. Registro fotográfico

      ctx.drawImage(f.img, REL_M + (wTot - w) / 2, y + (boxH - h) / 2, w, h);
    } else relTexto(ctx, "Imagem indisponível", REL_M + wTot / 2, y + boxH / 2, { fonte: relFonte(28, 500), cor: REL_COR.muted, align: "center" });
    const rotulo = `Foto ${String(f.n).padStart(2, "0")} — `;
    ctx.font = relFonte(27, 700);
    const wr = ctx.measureText(rotulo).width;
    ctx.font = relFonte(27, 400);
    const leg = relLimitarLinhas(ctx, relQuebrar(ctx, " ".repeat(0) + (f.legenda || "(sem legenda)"), wTot - wr), 2, wTot - wr);
    relTexto(ctx, rotulo, REL_M, y + boxH + 42, { fonte: relFonte(27, 700), cor: REL_COR.verde });
    leg.forEach((l, k) => relTexto(ctx, l, REL_M + wr, y + boxH + 42 + k * 36, { fonte: relFonte(27, 400), cor: REL_COR.texto }));
    const meta = [f.disciplina, f.data ? relFmtData(f.data) : ""].filter(Boolean).join("  |  ");
    if (meta) relTexto(ctx, meta, REL_M, y + boxH + 42 + 2 * 36 + 4, { fonte: relFonte(22, 500), cor: REL_COR.muted });

function relDesenharPagina(ctx, d, pg, n, total, secoes, logo) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, REL_W, REL_H);
  if (pg.tipo === "capa") relCapa(ctx, d);
  else if (pg.tipo === "indice") relIndice(ctx, d, secoes);
  else if (pg.tipo === "texto") relPaginaTexto(ctx, d, pg);
  else if (pg.tipo === "avanco") relPaginaAvanco(ctx, d, pg);
  else if (pg.tipo === "curva") relPaginaCurva(ctx, d, pg);

}

// Renderiza todas as páginas (duas passagens: paginar -> desenhar com nº real de páginas). Retorna JPEGs.
async function relRenderizarRelatorio(d, { qualidade = 0.9, onProgresso } = {}) {
  try {
    if (typeof document !== "undefined" && document.fonts && document.fonts.load) {
      await Promise.all(["400 24px Inter", "500 24px Inter", "600 24px Inter", "700 24px Inter", "700 24px \"Space Grotesk\""].map((f) => document.fonts.load(f).catch(() => null)));
    }

  let logo = null;
  try { if (d.logoSrc) logo = await relCarregarImagem(d.logoSrc); } catch (e) { logo = null; }
  const canvas = relCriarCanvas(REL_W, REL_H);
  const ctx = canvas.getContext("2d");
  const { paginas, secoes } = relPaginar(ctx, d);
  const total = paginas.length;
  const saida = [];
  for (let i = 0; i < total; i++) {

}

/* ---------- escrita do PDF (A4 retrato, uma imagem JPEG por página) ---------- */
function relMontarPDF(paginas, { titulo = "Relatório de Obra", autor = "Glover Engenharia" } = {}) {
  const enc = new TextEncoder();
  const partes = []; let pos = 0;
  const offs = [];
  const put = (u8) => { partes.push(u8); pos += u8.length; };
  const putS = (s) => put(enc.encode(s));
  const hexUtf16 = (s) => { let h = "FEFF"; for (let i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(4, "0").toUpperCase(); return `<${h}>`; };
  const n = paginas.length;
  const idPagina = (i) => 4 + 3 * i, idConteudo = (i) => 5 + 3 * i, idImagem = (i) => 6 + 3 * i;
  const total = 3 + 3 * n;
  put(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a])); // %PDF-1.4 + comentário binário
  const obj = (id, corpo) => { offs[id] = pos; putS(`${id} 0 obj\n`); if (typeof corpo === "string") putS(corpo); else corpo(); putS("\nendobj\n"); };
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Kids [${paginas.map((_, i) => `${idPagina(i)} 0 R`).join(" ")}] /Count ${n} >>`);
  const agora = new Date();
  const dataPdf = `D:${agora.getUTCFullYear()}${String(agora.getUTCMonth() + 1).padStart(2, "0")}${String(agora.getUTCDate()).padStart(2, "0")}${String(agora.getUTCHours()).padStart(2, "0")}${String(agora.getUTCMinutes()).padStart(2, "0")}${String(agora.getUTCSeconds()).padStart(2, "0")}Z`;
  obj(3, `<< /Title ${hexUtf16(titulo)} /Author ${hexUtf16(autor)} /Creator ${hexUtf16("Glover Engenharia - Relatórios de Obra")} /Producer ${hexUtf16("Glover Engenharia")} /CreationDate (${dataPdf}) >>`);
  const PW = 595.28, PH = 841.89;
  paginas.forEach((p, i) => {
    obj(idPagina(i), `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${idImagem(i)} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${idConteudo(i)} 0 R >>`);
    const cont = `q\n${PW} 0 0 ${PH} 0 0 cm\n/Im0 Do\nQ\n`;
    obj(idConteudo(i), `<< /Length ${cont.length} >>\nstream\n${cont}endstream`);
    obj(idImagem(i), () => {
      putS(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);
      put(p.jpeg);
      putS("\nendstream");
    });
  });
  const xrefPos = pos;
  putS(`xref\n0 ${total + 1}\n0000000000 65535 f \n`);
  for (let id = 1; id <= total; id++) putS(`${String(offs[id]).padStart(10, "0")} 00000 n \n`);
  putS(`trailer\n<< /Size ${total + 1} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);
  const out = new Uint8Array(pos); let o = 0;
  for (const p of partes) { out.set(p, o); o += p.length; }
  return out;
}

const relEhAusente = (e) => /n[ãa]o encontrada|not found|PGRST116/i.test((e && e.message) || "");

async function relLerTexto(key) {
  try {
    const res = await window.storage.get(key, true);
    return res && res.value ? res.value : null;
  } catch (e) {
    if (relEhAusente(e)) return null; // chave inexistente; qualquer outro erro (rede etc.) é propagado
    throw e;
  }
}
async function relLer(key) {
  const t = await relLerTexto(key);
  if (!t) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}
async function relGravar(key, obj) { await window.storage.set(key, JSON.stringify(obj), true); }

/* ---------- relatórios ---------- */
// Lista todos os relatórios da obra (inclusive os marcados como excluídos, para o chamador filtrar).
// A lista é reconstruída a partir das "reservas de número" sequenciais (1, 2, 3...), que nunca são removidas.
async function relListarRelatorios(obraId) {
  const claims = [];
  let n = 1, fim = false;
  while (!fim && n < 2000) {
    const lote = await Promise.all(Array.from({ length: 8 }, (_, i) => relLer(relChave.claim(obraId, n + i))));
    for (let i = 0; i < lote.length && !fim; i++) { if (lote[i]) claims.push({ n: n + i, ...lote[i] }); else fim = true; }
    n += 8;
  }
  const resumos = await Promise.all(claims.map((c) => relLer(relChave.sum(obraId, c.relId))));
  return resumos.filter(Boolean).sort((a, b) => (a.numero < b.numero ? 1 : -1));
}

// Reserva o próximo número livre da obra. Verificação por leitura após gravação + nova conferência;
// em colisão, tenta o número seguinte. Números de relatórios excluídos nunca são reaproveitados.
async function relReservarNumero(obraId, relId, usuario) {
  const nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let n = 1;
  // descobre o primeiro número livre (varredura em lotes)
  for (let achou = false; !achou && n < 5000;) {
    const lote = await Promise.all(Array.from({ length: 8 }, (_, i) => relLer(relChave.claim(obraId, n + i))));
    const livre = lote.findIndex((c) => !c);
    if (livre >= 0) { n += livre; achou = true; } else n += 8;
  }
  for (let tent = 0; tent < 40; tent++) {
    const atual = await relLer(relChave.claim(obraId, n));
    if (atual && atual.nonce !== nonce) { n++; continue; }
    await relGravar(relChave.claim(obraId, n), { relId, nonce, em: Date.now(), por: usuario || "—" });
    await relDormir(180 + Math.random() * 220);
    let v = await relLer(relChave.claim(obraId, n));
    if (!v || v.nonce !== nonce) { n++; continue; }
    await relDormir(300);
    v = await relLer(relChave.claim(obraId, n));
    if (v && v.nonce === nonce) return n;
    n++;
  }
  throw new Error("Não foi possível reservar um número de relatório. Tente novamente.");
}

function relResumo(rel) {
  return {
    id: rel.id, obraId: rel.obraId, numero: rel.numero, periodoIni: rel.periodoIni, periodoFim: rel.periodoFim, dataRef: rel.dataRef,
    responsavel: rel.responsavel, status: rel.status, criadoEm: rel.criadoEm, criadoPor: rel.criadoPor, editadoEm: rel.editadoEm, editadoPor: rel.editadoPor,
    cronVersaoId: rel.cronVersaoId || null, ind: rel.ind || null, nFotos: (rel.fotos || []).length, rev: rel.rev || 0, excluido: !!rel.excluido,
  };
}
// Grava relatório + resumo. Detecta edição simultânea por outro usuário (campo rev).
async function relSalvarRelatorio(rel, usuario, { forcar = false } = {}) {
  const atual = await relLer(relChave.sum(rel.obraId, rel.id));
  if (atual && !forcar && (atual.rev || 0) !== (rel.rev || 0)) return { conflito: true, atual };
  const novo = { ...rel, rev: (rel.rev || 0) + 1, editadoEm: Date.now(), editadoPor: usuario || "—" };
  await relGravar(relChave.rel(rel.obraId, rel.id), novo);
  await relGravar(relChave.sum(rel.obraId, rel.id), relResumo(novo));
  return { ok: true, rel: novo };
}
const relLerRelatorio = (obraId, relId) => relLer(relChave.rel(obraId, relId));

async function relExcluirRelatorio(rel, usuario) {
  const r = { ...rel, excluido: true, excluidoEm: Date.now(), excluidoPor: usuario || "—", rev: (rel.rev || 0) + 1 };
  await relGravar(relChave.sum(rel.obraId, rel.id), relResumo(r));
  await relGravar(relChave.rel(rel.obraId, rel.id), { ...r, afer: {}, fotos: [], snapshot: null });
  for (const f of rel.fotos || []) { try { await relGravarTexto(relChave.foto(rel.id, f.id), ""); } catch (e) { /* melhor esforço */ } }
}

/* ---------- fotos ---------- */
async function relProcessarFoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await relCarregarImagem(url);
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    const esc = Math.min(1, 1600 / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * esc)), h = Math.max(1, Math.round(h0 * esc));
    const c = relCriarCanvas(w, h), x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
    x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, w, h);
    return { dataUri: c.toDataURL("image/jpeg", 0.82), w, h };
  } finally { URL.revokeObjectURL(url); }
}
const relGravarFoto = (relId, fotoId, obj) => relGravar(relChave.foto(relId, fotoId), obj);
const relLerFoto = (relId, fotoId) => relLer(relChave.foto(relId, fotoId));

/* ---------- cronograma (versões) ---------- */
const relCacheVersoes = new Map();

async function relCronLerMeta(obraId) { return (await relLer(relChave.cron(obraId))) || relMetaVazia(); }

  if (!versaoId) return null;
  const k = `${obraId}:${versaoId}`;
  if (relCacheVersoes.has(k)) return relCacheVersoes.get(k);
