                }} options={fornecedorSelectOptions} placeholder="Buscar fornecedor…" error={!!erros.fornecedor} />
              </Field>
              <Field label="Apropriação">
                <ApropriacaoField
                  value={form.apropriacao} onChange={(v) => upd({ apropriacao: v })}
                  centroCustoId={obraSaidaEfetiva} fornecedorNome={form.fornecedor}
                  apropriacoesGlobais={apropriacoes} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
                  excecoes={excecoes} onAddExcecao={(nome) => setExcecoes((prev) => [...new Set([...prev, nome])])}
                  error={!!erros.apropriacao}
                />
              </Field>
              <Field label="Descrição / NF" className="gf-span-2">
                <input value={form.descricao} onChange={(e) => upd({ descricao: e.target.value })} placeholder="Ex.: NF 1234 — material elétrico" />
              </Field>
              <Field label="Anexos (nota fiscal, boleto)" hint="Um ou mais arquivos — PDF, JPG ou PNG, até ~3 MB cada" className="gf-span-2">
                <FdAnexosField anexos={form.anexos} onChange={(v) => setForm((f) => ({ ...f, anexos: v }))} />
              </Field>
            </div>
            {Object.keys(erros).length > 0 && <div className="gf-warn gf-form-error">Preencha os campos obrigatórios: obra faturada, obra do gasto, data, valor, fornecedor e apropriação.</div>}
            <div className="gf-form-actions">
              <button type="submit" className="gf-btn gf-btn-primary" disabled={!conta || salvando}>{salvando ? "Salvando…" : form.id ? "Salvar alterações" : "Lançar faturamento direto"}</button>
              <span className="gf-hint">Cria a entrada na obra faturada e a saída na obra do gasto, ambas na conta {FAT_DIRETO_NOME}.</span>
            </div>
          </form>
        </section>
      )}

      {resumoObras.length > 0 && (
        <section className="gf-card">
          <div className="gf-card-head"><h2>Resumo por obra</h2></div>
          <div className="gf-table-wrap">
            <table className="gf-table">
              <thead><tr><th>Obra</th><th className="num">Faturado direto (entrada)</th><th className="num">Gasto direto (saída)</th></tr></thead>
              <tbody>
                {resumoObras.map(({ obra, fat, gasto }) => (
                  <tr key={obra.id}><td>{obra.nome}</td><td className="num mono pos">{BRL(fat)}</td><td className="num mono neg">{BRL(gasto)}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      )}

      <section className="gf-card">
        <div className="gf-card-head">
          <h2>Lançamentos de faturamento direto</h2>
          <div className="gf-summary-inline"><span>Total <b>{BRL(totalFiltrado)}</b></span></div>
        </div>
        <div className="gf-filters">
          <div className="gf-search">
            <Search size={15} />
            <input placeholder="Pesquisar por fornecedor, obra, apropriação…" value={filtros.q} onChange={(e) => setFiltros((f) => ({ ...f, q: e.target.value }))} />
          </div>
          <div className="gf-filters-grid">
            <input type="date" title="De" value={filtros.de} onChange={(e) => setFiltros((f) => ({ ...f, de: e.target.value }))} />
            <input type="date" title="Até" value={filtros.ate} onChange={(e) => setFiltros((f) => ({ ...f, ate: e.target.value }))} />
            <select value={filtros.obraId} onChange={(e) => setFiltros((f) => ({ ...f, obraId: e.target.value }))}>
              <option value="">Obra (todas)</option>
              {obras.map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
            </select>
          </div>
        </div>
        <div className="gf-table-wrap">
          <table className="gf-table gf-table-ledger">
            <thead>
              <tr><th>Data</th><th>Obra faturada</th><th>Obra do gasto</th><th>Fornecedor</th><th>Apropriação</th><th className="num">Valor</th><th>Descrição</th><th>Anexos</th><th></th></tr>
            </thead>
            <tbody>
              {filtrados.length === 0 && (
                <tr><td colSpan={9}><EmptyState icon={Receipt} title="Nenhum faturamento direto encontrado" body="Registre um novo faturamento direto acima ou ajuste os filtros." /></td></tr>
              )}
              {filtrados.map((r) => (
                <tr key={r.id}>
                  <td>{fmtDate(r.saida.data)}</td>
                  <td>{nomeObra(r.entrada.obraId)}</td>
                  <td>{nomeObra(r.saida.obraId)}{r.entrada.obraId !== r.saida.obraId && <Badge tone="orange" style={{ marginLeft: 6 }}>Outra obra</Badge>}</td>
                  <td>{r.saida.fornecedor}</td>
                  <td>{r.saida.apropriacao || "—"}</td>
                  <td className="num mono">{BRL(r.saida.valor)}</td>
                  <td className="gf-td-desc" title={r.saida.descricao}>{r.saida.descricao || "—"}</td>
                  <td>
                    {(r.saida.anexos || []).length > 0
                      ? <button type="button" className="gf-btn gf-btn-ghost" style={{ padding: "4px 8px" }} onClick={() => setVerAnexos(r)}><Paperclip size={12} /> {r.saida.anexos.length}</button>
                      : <span className="gf-muted">—</span>}
                  </td>
                  <td>
                    {podeGerenciar && (
                      <div className="gf-row-actions">
                        <button className="gf-icon-btn" title="Editar" onClick={() => editar(r)}><Pencil size={14} /></button>
                        <button className="gf-icon-btn" title="Excluir" onClick={() => excluir(r)}><Trash2 size={14} /></button>
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
      {verAnexos && <FdAnexosModal registro={verAnexos} onClose={() => setVerAnexos(null)} />}
    </div>
  );
}

/* ---------------------------------------------------------------
   Página: Programação de Pagamentos
   Gestores de obra criam ordens de pagamento (depósito); administradores e o assistente
   administrativo (operacional) efetuam o pagamento, apontando a(s) conta(s) de onde saiu o valor.
   Ao pagar, são gerados os lançamentos de saída (aba Lançamentos → saldos bancários).
--------------------------------------------------------------- */

const PP_PODE_PAGAR_PAPEIS = ["admin", "operacional"];
const ppPodePagar = (u) => !!u && can(u, "progpag_pagar") && PP_PODE_PAGAR_PAPEIS.includes(u.papel);
const ppArred = (v) => Math.round((Number(v) || 0) * 100) / 100;
const ppContratoDe = (contratos, obraId, fornecedor) => contratos.find((c) => c.ativo !== false && c.obraId === obraId && c.fornecedor === fornecedor) || null;
// Total já medido/pago do contrato: valor inicial informado + ordens (exceto a que está sendo editada).
const ppMedidoAnterior = (contrato, ordens, ignorarId) =>
  ppArred((Number(contrato?.medidoInicial) || 0) + ordens.filter((o) => o.contratoId === contrato?.id && o.id !== ignorarId).reduce((s, o) => s + (Number(o.valor) || 0), 0));

function PPContratosModal({ contratos, setContratos, ordens, obras, fornecedorOptions, currentUser, logAudit, onClose }) {
  const blank = { id: null, obraId: "", fornecedor: "", valorTotal: "", medidoInicial: "", ativo: true };
  const [f, setF] = useState(blank);
  const [erro, setErro] = useState("");
  const nomeObra = (id) => obras.find((o) => o.id === id)?.nome || "—";
  const idsObras = new Set(obras.map((o) => o.id));
  const lista = contratos.filter((c) => idsObras.has(c.obraId));
  const salvar = (e) => {
    e.preventDefault();
    if (!f.obraId || !f.fornecedor || !(Number(f.valorTotal) > 0)) { setErro("Informe obra, fornecedor e valor total do contrato."); return; }
    if (contratos.some((c) => c.id !== f.id && c.ativo !== false && f.ativo && c.obraId === f.obraId && c.fornecedor === f.fornecedor)) { setErro("Já existe um contrato ativo deste fornecedor nesta obra."); return; }
    const reg = { id: f.id || uid("ctr"), obraId: f.obraId, fornecedor: f.fornecedor, valorTotal: ppArred(f.valorTotal), medidoInicial: ppArred(f.medidoInicial), ativo: !!f.ativo, criadoPor: currentUser?.nome || "—", criadoEm: Date.now() };
    setContratos((prev) => (f.id ? prev.map((c) => (c.id === f.id ? { ...c, ...reg, criadoPor: c.criadoPor, criadoEm: c.criadoEm } : c)) : [...prev, reg]));
    logAudit?.({ tipoOperacao: f.id ? "Edição de contrato de fornecedor" : "Cadastro de contrato de fornecedor", registroAlterado: `${nomeObra(reg.obraId)} — ${reg.fornecedor}`, valorAnterior: "—", valorNovo: BRL(reg.valorTotal) });
    setF(blank); setErro("");
  };
  return (
    <Modal title="Contratos de fornecedores" onClose={onClose} width={760}>
      <p className="gf-field-hint">Com um contrato ativo cadastrado para a obra e o fornecedor, o valor total e o saldo após medição são preenchidos automaticamente nas ordens de pagamento.</p>
      <form onSubmit={salvar} className="gf-form-grid gf-modal-form">
        <Field label="Obra">
          <select value={f.obraId} onChange={(e) => setF((s) => ({ ...s, obraId: e.target.value }))}>
            <option value="">Selecione…</option>
            {obras.filter((o) => !o.arquivada).map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
          </select>
        </Field>
        <Field label="Fornecedor"><SearchableSelect value={f.fornecedor} onChange={(v) => setF((s) => ({ ...s, fornecedor: v }))} options={fornecedorOptions.map((x) => ({ value: x, label: x }))} placeholder="Buscar fornecedor…" /></Field>
        <Field label="Valor total do contrato (R$)"><input type="number" min="0.01" step="0.01" value={f.valorTotal} onChange={(e) => setF((s) => ({ ...s, valorTotal: e.target.value }))} /></Field>
        <Field label="Já medido/pago antes (R$)" hint="Opcional — o que já foi medido fora do sistema"><input type="number" min="0" step="0.01" value={f.medidoInicial} onChange={(e) => setF((s) => ({ ...s, medidoInicial: e.target.value }))} /></Field>
        <Field label="Situação">
          <select value={f.ativo ? "1" : "0"} onChange={(e) => setF((s) => ({ ...s, ativo: e.target.value === "1" }))}><option value="1">Ativo</option><option value="0">Encerrado</option></select>
        </Field>
        {erro && <div className="gf-warn gf-span-2">{erro}</div>}
        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">{f.id ? "Salvar contrato" : "Adicionar contrato"}</button>
          {f.id && <button type="button" className="gf-btn gf-btn-ghost" onClick={() => { setF(blank); setErro(""); }}>Cancelar edição</button>}
        </div>
      </form>
      <div className="gf-table-wrap">
        <table className="gf-table">
          <thead><tr><th>Obra</th><th>Fornecedor</th><th className="num">Valor total</th><th className="num">Medido</th><th className="num">Saldo</th><th>Situação</th><th></th></tr></thead>
          <tbody>
            {lista.length === 0 && <tr><td colSpan={7}><EmptyState icon={FileText} title="Nenhum contrato cadastrado" body="Cadastre acima ou ao criar uma ordem de pagamento." /></td></tr>}
            {lista.map((c) => {
              const med = ppMedidoAnterior(c, ordens, null);
              return (
                <tr key={c.id}>
                  <td>{nomeObra(c.obraId)}</td><td>{c.fornecedor}</td>
                  <td className="num mono">{BRL(c.valorTotal)}</td><td className="num mono">{BRL(med)}</td><td className={`num mono ${c.valorTotal - med < 0 ? "neg" : ""}`}>{BRL(c.valorTotal - med)}</td>
                  <td><Badge tone={c.ativo !== false ? "green" : "gray"}>{c.ativo !== false ? "Ativo" : "Encerrado"}</Badge></td>
                  <td><button type="button" className="gf-icon-btn" title="Editar" onClick={() => setF({ id: c.id, obraId: c.obraId, fornecedor: c.fornecedor, valorTotal: String(c.valorTotal), medidoInicial: String(c.medidoInicial || ""), ativo: c.ativo !== false })}><Pencil size={14} /></button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

function PPOrdemModal({ ordem, obras, ordens, contratos, setContratos, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, currentUser, onClose, onSave }) {
  const [f, setF] = useState(ordem ? { ...ordem, valor: String(ordem.valor), valorContrato: String(ordem.valorContrato ?? ""), saldoAposMedicao: String(ordem.saldoAposMedicao ?? "") }
    : { obraId: "", fornecedor: "", apropriacao: "", valor: "", dataPagamento: todayISO(), descricao: "", valorContrato: "", saldoAposMedicao: "", cadastrarContrato: true });
  const [excecoes, setExcecoes] = useState(ordem?.apropriacao ? [ordem.apropriacao] : []);
  const [erro, setErro] = useState("");
  const contrato = ppContratoDe(contratos, f.obraId, f.fornecedor);
  const medido = contrato ? ppMedidoAnterior(contrato, ordens, ordem?.id) : 0;
  const valorNum = Number(f.valor) || 0;
  const saldoAuto = contrato ? ppArred(contrato.valorTotal - medido - valorNum) : null;
  const valorContratoEf = contrato ? contrato.valorTotal : f.valorContrato;
  const saldoEf = contrato ? saldoAuto : f.saldoAposMedicao;
  const upd = (p) => { setF((s) => ({ ...s, ...p })); setErro(""); };
  const reapropriar = (obraId, fornecedor) => {
    const disp = computeApropriacoesDisponiveis(obraId, fornecedor, apropriacoes, orcamentoItens, fornecedoresCadastro);
    return f.apropriacao && [...disp, ...excecoes].includes(f.apropriacao) ? f.apropriacao : "";
  };
  const submit = (e) => {
    e.preventDefault();
    if (!f.obraId || !f.fornecedor || !f.apropriacao || !(valorNum > 0) || !f.dataPagamento) { setErro("Preencha obra, fornecedor, apropriação, valor e data para pagamento."); return; }
    if (!contrato && (f.valorContrato === "" || f.saldoAposMedicao === "")) { setErro("Informe o valor total do contrato e o saldo após a medição (ou cadastre um contrato ativo para esta obra e fornecedor)."); return; }
    let contratoId = contrato ? contrato.id : null;
    if (!contrato && f.cadastrarContrato && Number(f.valorContrato) > 0 && !ordem) {
      contratoId = uid("ctr");
      const jaMedido = ppArred(Number(f.valorContrato) - Number(f.saldoAposMedicao) - valorNum); // o que já havia sido medido antes desta ordem
      setContratos((prev) => [...prev, { id: contratoId, obraId: f.obraId, fornecedor: f.fornecedor, valorTotal: ppArred(f.valorContrato), medidoInicial: Math.max(0, jaMedido), ativo: true, criadoPor: currentUser?.nome || "—", criadoEm: Date.now() }]);
    }
    onSave({
      obraId: f.obraId, fornecedor: f.fornecedor, apropriacao: f.apropriacao, valor: ppArred(valorNum), dataPagamento: f.dataPagamento,
      descricao: (f.descricao || "").trim(), valorContrato: ppArred(valorContratoEf), saldoAposMedicao: ppArred(saldoEf), contratoId,
    });
  };
  return (
    <Modal title={ordem ? "Editar ordem de pagamento" : "Nova ordem de pagamento"} onClose={onClose} width={680}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Obra">
          <SearchableSelect value={f.obraId} onChange={(v) => upd({ obraId: v, apropriacao: reapropriar(v, f.fornecedor) })}
            options={obras.filter((o) => !o.arquivada).map((o) => ({ value: o.id, label: o.nome }))} placeholder="Selecione a obra…" />
        </Field>
        <Field label="Fornecedor">
          <SearchableSelect value={f.fornecedor} onChange={(v) => upd({ fornecedor: v, apropriacao: reapropriar(f.obraId, v) })}
            options={fornecedorOptions.map((x) => ({ value: x, label: x }))} placeholder="Buscar fornecedor…" />
        </Field>
        <Field label="Apropriação">
          <ApropriacaoField value={f.apropriacao} onChange={(v) => upd({ apropriacao: v })} centroCustoId={f.obraId} fornecedorNome={f.fornecedor}
            apropriacoesGlobais={apropriacoes} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro}
            excecoes={excecoes} onAddExcecao={(n) => setExcecoes((p) => [...new Set([...p, n])])} />
        </Field>
        <Field label="Valor a pagar (R$)"><input type="number" min="0.01" step="0.01" value={f.valor} onChange={(e) => upd({ valor: e.target.value })} /></Field>
        <Field label="Data para pagamento"><input type="date" value={f.dataPagamento} onChange={(e) => upd({ dataPagamento: e.target.value })} /></Field>
        <Field label="Descrição"><input value={f.descricao || ""} onChange={(e) => upd({ descricao: e.target.value })} placeholder="Ex.: 2ª medição — instalações elétricas" /></Field>
        <Field label="Valor total do contrato (R$)" hint={contrato ? "Contrato ativo encontrado — preenchido automaticamente" : "Sem contrato ativo para esta obra/fornecedor: informe manualmente"}>
          <input type="number" step="0.01" value={contrato ? contrato.valorTotal : f.valorContrato} readOnly={!!contrato} onChange={(e) => upd({ valorContrato: e.target.value })} />
        </Field>
        <Field label="Saldo do contrato após medição (R$)" hint={contrato ? `Total ${BRL(contrato.valorTotal)} − já medido ${BRL(medido)} − esta ordem ${BRL(valorNum)}` : "Valor que restará do contrato após esta medição"}>
          <input type="number" step="0.01" value={contrato ? saldoAuto : f.saldoAposMedicao} readOnly={!!contrato} onChange={(e) => upd({ saldoAposMedicao: e.target.value })} />
        </Field>
        {contrato && saldoAuto < 0 && <div className="gf-warn gf-span-2">Atenção: esta ordem ultrapassa o saldo do contrato em {BRL(-saldoAuto)}.</div>}
        {!contrato && !ordem && (
          <label className="gf-checkbox gf-span-2">
            <input type="checkbox" checked={!!f.cadastrarContrato} onChange={(e) => upd({ cadastrarContrato: e.target.checked })} />
            <span>Cadastrar como contrato ativo desta obra e fornecedor (as próximas ordens preenchem o valor e o saldo automaticamente)</span>
          </label>
        )}
        {erro && <div className="gf-warn gf-span-2">{erro}</div>}
        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">{ordem ? "Salvar alterações" : "Criar ordem de pagamento"}</button>
        </div>
      </form>
    </Modal>
  );
}

function PPPagarModal({ ordem, accounts, obraNome, onClose, onConfirm }) {
  const [data, setData] = useState(todayISO());
  const [linhas, setLinhas] = useState([{ id: 1, contaId: accounts[0]?.id || "", valor: String(ordem.valor) }]);
  const [erro, setErro] = useState("");
  const soma = ppArred(linhas.reduce((s, l) => s + (Number(l.valor) || 0), 0));
  const resta = ppArred(ordem.valor - soma);
  const setL = (id, p) => { setLinhas((ls) => ls.map((l) => (l.id === id ? { ...l, ...p } : l))); setErro(""); };
  const submit = (e) => {
    e.preventDefault();
    if (!data) return;
    if (linhas.some((l) => !l.contaId || !(Number(l.valor) > 0))) { setErro("Informe conta e valor em todas as linhas."); return; }
    if (new Set(linhas.map((l) => l.contaId)).size !== linhas.length) { setErro("Cada conta pode aparecer apenas uma vez."); return; }
    if (Math.abs(resta) > 0.005) { setErro(`A soma das contas (${BRL(soma)}) deve ser igual ao valor da ordem (${BRL(ordem.valor)}).`); return; }
    onConfirm({ data, contas: linhas.map((l) => ({ contaId: l.contaId, valor: ppArred(l.valor) })) });
  };
  return (
    <Modal title="Efetuar pagamento" onClose={onClose} width={560}>
      <div className="gf-detail-meta" style={{ gridTemplateColumns: "repeat(2,1fr)" }}>
        <div><span>Obra</span><b>{obraNome}</b></div><div><span>Fornecedor</span><b>{ordem.fornecedor}</b></div>
        <div><span>Apropriação</span><b>{ordem.apropriacao}</b></div><div><span>Valor</span><b className="mono">{BRL(ordem.valor)}</b></div>
      </div>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form" style={{ marginTop: 14 }}>
        <Field label="Data do pagamento"><input type="date" required value={data} onChange={(e) => setData(e.target.value)} /></Field>
        <div className="gf-span-2">
          <span className="gf-field-label" style={{ display: "block", marginBottom: 6 }}>Conta(s) de onde saiu o valor</span>
          {linhas.map((l) => (
            <div key={l.id} style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <select value={l.contaId} onChange={(e) => setL(l.id, { contaId: e.target.value })} style={{ flex: 2 }}>
                <option value="">Selecione…</option>
                {accounts.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
              </select>
              <input type="number" min="0.01" step="0.01" value={l.valor} onChange={(e) => setL(l.id, { valor: e.target.value })} style={{ flex: 1 }} />
              {linhas.length > 1 && <button type="button" className="gf-icon-btn" title="Remover" onClick={() => setLinhas((ls) => ls.filter((x) => x.id !== l.id))}><X size={14} /></button>}
            </div>
          ))}
          <button type="button" className="gf-btn gf-btn-ghost" onClick={() => setLinhas((ls) => [...ls, { id: Math.max(...ls.map((x) => x.id)) + 1, contaId: "", valor: resta > 0 ? String(resta) : "" }])}><Plus size={14} /> Adicionar outra conta</button>
        </div>
        <div className="gf-account-balance gf-span-2">
          <span>{Math.abs(resta) < 0.005 ? "Valores conferem" : resta > 0 ? "Falta distribuir" : "Excede o valor da ordem em"}</span>
          <strong className="mono">{Math.abs(resta) < 0.005 ? BRL(soma) : BRL(Math.abs(resta))}</strong>
        </div>
        {erro && <div className="gf-warn gf-span-2">{erro}</div>}
        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">Confirmar pagamento</button>
          <span className="gf-hint">Gera o(s) lançamento(s) de saída e atualiza o saldo da(s) conta(s).</span>
        </div>
      </form>
    </Modal>
  );
}

function ProgramacaoPagamentosPage({ ordens, setOrdens, contratos, setContratos, accounts, obras, entries, setEntries, apropriacoes, fornecedorOptions, orcamentoItens, fornecedoresCadastro, currentUser, logAudit }) {
  const [aba, setAba] = useState("programadas");
  const [modal, setModal] = useState(null); // { tipo: "nova" | "editar" | "pagar" | "contratos", ordem }
  const [filtros, setFiltros] = useState({ q: "", obraId: "", de: "", ate: "" });
  const podeCriar = can(currentUser, "progpag_criar");
  const podePagar = ppPodePagar(currentUser);
  const idsEscopo = useMemo(() => new Set(obras.map((o) => o.id)), [obras]);
  const nomeObra = (id) => obras.find((o) => o.id === id)?.nome || "—";
  const nomeConta = (id) => accounts.find((a) => a.id === id)?.nome || "—";
  const contasAtivas = accounts.filter((a) => a.status === "Ativa" && !isFatDiretoAccount(a));
  const hoje = todayISO();

  const doEscopo = ordens.filter((o) => idsEscopo.has(o.obraId));
  const passa = (o, campoData) => {
    if (filtros.obraId && o.obraId !== filtros.obraId) return false;
    if (filtros.de && o[campoData] < filtros.de) return false;
    if (filtros.ate && o[campoData] > filtros.ate) return false;
    if (filtros.q && !relNorm([o.fornecedor, o.apropriacao, o.descricao, nomeObra(o.obraId)].join(" ")).includes(relNorm(filtros.q))) return false;
    return true;
  };
  const pendentes = doEscopo.filter((o) => o.status === "pendente" && passa(o, "dataPagamento")).sort((a, b) => (a.dataPagamento < b.dataPagamento ? -1 : 1));
  const concluidos = doEscopo.filter((o) => o.status === "pago" && passa(o, "dataPagamentoEfetivo")).sort((a, b) => ((b.pagamento?.data || "") < (a.pagamento?.data || "") ? -1 : 1));
  const totalPend = pendentes.reduce((s, o) => s + o.valor, 0);
  const totalConc = concluidos.reduce((s, o) => s + o.valor, 0);

  const salvarOrdem = (dados, editando) => {
    if (editando) {
      setOrdens((prev) => prev.map((o) => (o.id === editando.id ? { ...o, ...dados, ...carimbarEdicao(currentUser) } : o)));
      logAudit?.({ tipoOperacao: "Edição de ordem de pagamento", registroAlterado: `${nomeObra(dados.obraId)} — ${dados.fornecedor}`, valorAnterior: BRL(editando.valor), valorNovo: BRL(dados.valor) });
    } else {
      setOrdens((prev) => [...prev, { id: uid("pp"), status: "pendente", ...dados, criadoPor: currentUser?.nome || "—", criadoEm: Date.now() }]);
      logAudit?.({ tipoOperacao: "Ordem de pagamento", registroAlterado: `${nomeObra(dados.obraId)} — ${dados.fornecedor}`, valorAnterior: "—", valorNovo: BRL(dados.valor) });
    }
    setModal(null);
  };
  const excluir = (o) => {
    if (!window.confirm(`Excluir a ordem de pagamento de ${BRL(o.valor)} para ${o.fornecedor}?`)) return;
    setOrdens((prev) => prev.filter((x) => x.id !== o.id));
    logAudit?.({ tipoOperacao: "Exclusão de ordem de pagamento", registroAlterado: `${nomeObra(o.obraId)} — ${o.fornecedor}`, valorAnterior: BRL(o.valor), valorNovo: "—" });
  };
  const pagar = (o, { data, contas }) => {
    if (!podePagar) return;
    const n = contas.length;
    const novos = contas.map((c, i) => ({
      id: uid("lan"), tipo: "saida", origemTipo: "CONTA_EMPRESA", contaId: c.contaId, contaInvestidorId: null,
      obraId: o.obraId, data, valor: c.valor, fornecedor: o.fornecedor, apropriacao: o.apropriacao,
      descricao: `${o.descricao ? o.descricao + " — " : ""}Programação de pagamento${n > 1 ? ` (parte ${i + 1}/${n})` : ""}`,
      programacaoId: o.id, createdAt: Date.now(), ...carimbarCriacao(currentUser),
    }));
    setEntries((prev) => [...prev, ...novos]);
    setOrdens((prev) => prev.map((x) => (x.id === o.id ? { ...x, status: "pago", dataPagamentoEfetivo: data, pagamento: { data, contas, entryIds: novos.map((e) => e.id), pagoPor: currentUser?.nome || "—", pagoEm: Date.now() } } : x)));
    logAudit?.({ tipoOperacao: "Pagamento de ordem de pagamento", registroAlterado: `${nomeObra(o.obraId)} — ${o.fornecedor}`, valorAnterior: "—", valorNovo: `${BRL(o.valor)} (${contas.map((c) => nomeConta(c.contaId)).join(", ")})` });
    setModal(null);
  };
  const estornar = (o) => {
    if (!podePagar) return;
    if (!window.confirm(`Estornar o pagamento de ${BRL(o.valor)} para ${o.fornecedor}? Os lançamentos gerados serão removidos e a ordem volta para "Programadas".`)) return;
    const ids = new Set(o.pagamento?.entryIds || []);
    setEntries((prev) => prev.filter((e) => !ids.has(e.id)));
    setOrdens((prev) => prev.map((x) => { if (x.id !== o.id) return x; const { pagamento, dataPagamentoEfetivo, ...resto } = x; return { ...resto, status: "pendente" }; }));
    logAudit?.({ tipoOperacao: "Estorno de pagamento programado", registroAlterado: `${nomeObra(o.obraId)} — ${o.fornecedor}`, valorAnterior: BRL(o.valor), valorNovo: "—" });
  };

  const filtrosUI = (
    <div className="gf-filters">
      <div className="gf-search"><Search size={15} /><input placeholder="Pesquisar por fornecedor, obra, apropriação…" value={filtros.q} onChange={(e) => setFiltros((f) => ({ ...f, q: e.target.value }))} /></div>
      <div className="gf-filters-grid">
        <input type="date" title="De" value={filtros.de} onChange={(e) => setFiltros((f) => ({ ...f, de: e.target.value }))} />
        <input type="date" title="Até" value={filtros.ate} onChange={(e) => setFiltros((f) => ({ ...f, ate: e.target.value }))} />
        <select value={filtros.obraId} onChange={(e) => setFiltros((f) => ({ ...f, obraId: e.target.value }))}>
          <option value="">Obra (todas)</option>
          {obras.map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
        </select>
      </div>
    </div>
  );

  return (
    <div className="gf-stack">
      <section className="gf-card">
        <div className="gf-card-head">
          <h2>Programação de Pagamentos</h2>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {podeCriar && <button className="gf-btn gf-btn-ghost" onClick={() => setModal({ tipo: "contratos" })}><FileText size={14} /> Contratos</button>}
            {podeCriar && <button className="gf-btn gf-btn-primary" onClick={() => setModal({ tipo: "nova" })}><Plus size={14} /> Nova ordem de pagamento</button>}
          </div>
        </div>
        <div className="gf-segmented">
          <button type="button" className={aba === "programadas" ? "is-active" : ""} onClick={() => setAba("programadas")}>Programadas ({doEscopo.filter((o) => o.status === "pendente").length})</button>
          <button type="button" className={aba === "concluidos" ? "is-active" : ""} onClick={() => setAba("concluidos")}>Pagamentos Concluídos ({doEscopo.filter((o) => o.status === "pago").length})</button>
        </div>
        {filtrosUI}
      </section>

      {aba === "programadas" ? (
        <section className="gf-card">
          <div className="gf-card-head"><h2>Ordens programadas</h2><div className="gf-summary-inline"><span>Total a pagar <b className="neg">{BRL(totalPend)}</b></span></div></div>
          <div className="gf-table-wrap">
            <table className="gf-table gf-table-ledger">
              <thead><tr><th>Pagar em</th><th>Obra</th><th>Fornecedor</th><th>Apropriação</th><th className="num">Valor</th><th className="num">Contrato</th><th className="num">Saldo após medição</th><th>Descrição</th><th></th></tr></thead>
              <tbody>
                {pendentes.length === 0 && <tr><td colSpan={9}><EmptyState icon={CalendarClock} title="Nenhuma ordem programada" body={podeCriar ? "Crie uma nova ordem de pagamento." : "Não há pagamentos pendentes."} /></td></tr>}
                {pendentes.map((o) => (
                  <tr key={o.id}>
                    <td>{fmtDate(o.dataPagamento)}{o.dataPagamento < hoje && <Badge tone="red" style={{ marginLeft: 6 }}>Atrasada</Badge>}</td>
                    <td>{nomeObra(o.obraId)}</td><td>{o.fornecedor}</td><td>{o.apropriacao}</td>
                    <td className="num mono">{BRL(o.valor)}</td>
                    <td className="num mono">{BRL(o.valorContrato)}</td>
                    <td className={`num mono ${o.saldoAposMedicao < 0 ? "neg" : ""}`}>{BRL(o.saldoAposMedicao)}</td>
                    <td className="gf-td-desc" title={o.descricao}>{o.descricao || "—"}<div className="gf-muted" style={{ fontSize: 11 }}>por {o.criadoPor}</div></td>
                    <td>
                      <div className="gf-row-actions">
                        {podePagar && <button className="gf-icon-btn" title="Efetuar pagamento" onClick={() => setModal({ tipo: "pagar", ordem: o })}><CircleDollarSign size={15} /></button>}
                        {podeCriar && <button className="gf-icon-btn" title="Editar" onClick={() => setModal({ tipo: "editar", ordem: o })}><Pencil size={14} /></button>}
                        {podeCriar && <button className="gf-icon-btn" title="Excluir" onClick={() => excluir(o)}><Trash2 size={14} /></button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      ) : (
        <section className="gf-card">
          <div className="gf-card-head"><h2>Pagamentos Concluídos</h2><div className="gf-summary-inline"><span>Total pago <b>{BRL(totalConc)}</b></span></div></div>
          <div className="gf-table-wrap">
            <table className="gf-table gf-table-ledger">
              <thead><tr><th>Pago em</th><th>Obra</th><th>Fornecedor</th><th>Apropriação</th><th className="num">Valor</th><th>Conta(s)</th><th>Descrição</th><th></th></tr></thead>
              <tbody>
                {concluidos.length === 0 && <tr><td colSpan={8}><EmptyState icon={CircleDollarSign} title="Nenhum pagamento concluído" body="Os pagamentos efetuados aparecem aqui." /></td></tr>}
                {concluidos.map((o) => (
                  <tr key={o.id}>
                    <td>{fmtDate(o.pagamento?.data)}</td><td>{nomeObra(o.obraId)}</td><td>{o.fornecedor}</td><td>{o.apropriacao}</td>
                    <td className="num mono">{BRL(o.valor)}</td>
                    <td>{(o.pagamento?.contas || []).map((c) => <div key={c.contaId}>{nomeConta(c.contaId)} <span className="gf-muted">{BRL(c.valor)}</span></div>)}<div className="gf-muted" style={{ fontSize: 11 }}>por {o.pagamento?.pagoPor}</div></td>
                    <td className="gf-td-desc" title={o.descricao}>{o.descricao || "—"}</td>
                    <td>{podePagar && <div className="gf-row-actions"><button className="gf-icon-btn" title="Estornar pagamento" onClick={() => estornar(o)}><Undo2 size={14} /></button></div>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      )}

      {modal?.tipo === "nova" && <PPOrdemModal ordem={null} obras={obras} ordens={ordens} contratos={contratos} setContratos={setContratos} apropriacoes={apropriacoes} fornecedorOptions={fornecedorOptions} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro} currentUser={currentUser} onClose={() => setModal(null)} onSave={(d) => salvarOrdem(d, null)} />}
      {modal?.tipo === "editar" && <PPOrdemModal ordem={modal.ordem} obras={obras} ordens={ordens} contratos={contratos} setContratos={setContratos} apropriacoes={apropriacoes} fornecedorOptions={fornecedorOptions} orcamentoItens={orcamentoItens} fornecedoresCadastro={fornecedoresCadastro} currentUser={currentUser} onClose={() => setModal(null)} onSave={(d) => salvarOrdem(d, modal.ordem)} />}
      {modal?.tipo === "pagar" && <PPPagarModal ordem={modal.ordem} accounts={contasAtivas} obraNome={nomeObra(modal.ordem.obraId)} onClose={() => setModal(null)} onConfirm={(p) => pagar(modal.ordem, p)} />}
      {modal?.tipo === "contratos" && <PPContratosModal contratos={contratos} setContratos={setContratos} ordens={ordens} obras={obras} fornecedorOptions={fornecedorOptions} currentUser={currentUser} logAudit={logAudit} onClose={() => setModal(null)} />}
    </div>
  );
}

/* ---------------------------------------------------------------
   Página: Usuários e Permissões
--------------------------------------------------------------- */

function UsuariosPage({ usuarios, setUsuarios, currentUser, auditLog, logAudit, obras = [], contasInvestidores = [] }) {
  const [tab, setTab] = useState("usuarios");
  const [editingUser, setEditingUser] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [filtros, setFiltros] = useState({ usuario: "", tipo: "", de: "", ate: "" });

  const salvarUsuario = (data) => {
    if (data.id) {
      const anterior = usuarios.find((u) => u.id === data.id);
      setUsuarios((prev) => prev.map((u) => (u.id === data.id ? data : u)));
      if (anterior) {
        const mudouPerms = JSON.stringify(anterior.perms) !== JSON.stringify(data.perms);
        const mudouPapel = anterior.papel !== data.papel;
        const mudouAtivo = anterior.ativo !== data.ativo;
        if (mudouPerms || mudouPapel || mudouAtivo) {
          logAudit?.({
            tipoOperacao: "Alteração de permissões de usuário", registroAlterado: data.nome,
            valorAnterior: `${PAPEL_LABEL[anterior.papel] || anterior.papel}${anterior.ativo ? "" : " (inativo)"}`,
            valorNovo: `${PAPEL_LABEL[data.papel] || data.papel}${data.ativo ? "" : " (inativo)"}`,
          });
        }
      }
    } else {
      setUsuarios((prev) => [...prev, { ...data, id: uid("user") }]);
      logAudit?.({ tipoOperacao: "Cadastro de usuário", registroAlterado: data.nome, valorAnterior: "—", valorNovo: PAPEL_LABEL[data.papel] || data.papel });
    }
    setEditingUser(null); setShowNew(false);
  };

  const auditFiltrado = auditLog
    .filter((a) => (filtros.usuario ? a.usuario === filtros.usuario : true))
    .filter((a) => (filtros.tipo ? a.tipoOperacao === filtros.tipo : true));

  const usuariosNomes = [...new Set(auditLog.map((a) => a.usuario))];
  const tiposOperacao = [...new Set(auditLog.map((a) => a.tipoOperacao))];

  return (
    <div className="gf-stack">
      <div className="gf-toolbar">
        <h2>Usuários e permissões</h2>
        {tab === "usuarios" && <button className="gf-btn gf-btn-primary" onClick={() => setShowNew(true)}><Plus size={15} /> Novo usuário</button>}
      </div>

      <div className="gf-segmented" style={{ marginBottom: 4 }}>
        <button className={tab === "usuarios" ? "is-active" : ""} onClick={() => setTab("usuarios")}>Usuários</button>
        <button className={tab === "auditoria" ? "is-active" : ""} onClick={() => setTab("auditoria")}>Log de auditoria</button>
      </div>

      {tab === "usuarios" && (
        <div className="gf-grid-cards">
          {usuarios.map((u) => (
            <div className={`gf-card gf-account-card ${!u.ativo ? "is-inactive" : ""}`} key={u.id}>
              <div className="gf-card-head">
                <div>
                  <div className="gf-eyebrow">{PAPEL_LABEL[u.papel] || u.papel}</div>
                  <h3>{u.nome}</h3>
                </div>
                <div className="gf-row-actions">
                  <Badge tone={u.ativo ? "green" : "gray"}>{u.ativo ? "Ativo" : "Inativo"}</Badge>
                  <button className="gf-icon-btn" title="Editar permissões" onClick={() => setEditingUser(u)}><Pencil size={14} /></button>
                </div>
              </div>
              {isInvestidor(u) ? (
                <p className="gf-field-hint">
                  Somente leitura · Obra: <b>{obras.find((o) => o.id === u.investidorObraId)?.nome || "— (não definida)"}</b>
                  {" "}· Conta: <b>{contasInvestidores.find((c) => c.id === u.investidorContaId)?.nome || "— (não definida)"}</b>
                </p>
              ) : (
                <p className="gf-field-hint">{ALL_PERM_KEYS.filter((k) => u.perms?.[k]).length} de {ALL_PERM_KEYS.length} permissões ativas</p>
              )}
            </div>
          ))}
        </div>
      )}

      {tab === "auditoria" && (
        <section className="gf-card">
          <div className="gf-card-head"><h2>Log de auditoria</h2></div>
          <div className="gf-filters-grid" style={{ gridTemplateColumns: "repeat(2,1fr)", marginBottom: 14 }}>
            <select value={filtros.usuario} onChange={(e) => setFiltros((f) => ({ ...f, usuario: e.target.value }))}>
              <option value="">Usuário (todos)</option>
              {usuariosNomes.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            <select value={filtros.tipo} onChange={(e) => setFiltros((f) => ({ ...f, tipo: e.target.value }))}>
              <option value="">Tipo de operação (todos)</option>
              {tiposOperacao.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="gf-table-wrap">
            <table className="gf-table">
              <thead><tr><th>Data/hora</th><th>Usuário</th><th>Operação</th><th>Registro</th><th>Anterior</th><th>Novo</th></tr></thead>
              <tbody>
                {auditFiltrado.length === 0 && (
                  <tr><td colSpan={6}><EmptyState icon={ShieldCheck} title="Nenhum registro de auditoria" body="As operações sensíveis (saldo inicial, exclusões, pagamentos, permissões) aparecerão aqui." /></td></tr>
                )}
                {auditFiltrado.map((a) => (
                  <tr key={a.id}>
                    <td className="mono">{a.data}</td>
                    <td>{a.usuario}</td>
                    <td>{a.tipoOperacao}</td>
                    <td className="gf-td-desc">{a.registroAlterado}</td>
                    <td className="mono">{a.valorAnterior}</td>
                    <td className="mono">{a.valorNovo}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      )}

      {(editingUser || showNew) && (
        <UsuarioModal usuario={editingUser} usuarios={usuarios} obras={obras} contasInvestidores={contasInvestidores} onClose={() => { setEditingUser(null); setShowNew(false); }} onSave={salvarUsuario} />
      )}
    </div>
  );
}

function UsuarioModal({ usuario, usuarios = [], obras = [], contasInvestidores = [], onClose, onSave }) {
  const [f, setF] = useState(usuario ? { ...usuario, perms: { ...usuario.perms } } : {
    nome: "", papel: "customizavel", ativo: true, senha: "", perms: permsAllFalse(),
  });
  const [erro, setErro] = useState("");
  const upd = (p) => setF((s) => ({ ...s, ...p }));
  const togglePerm = (key) => setF((s) => ({ ...s, perms: { ...s.perms, [key]: !s.perms[key] } }));
  const aplicarTemplate = (papel) => {
    const perms = papel === "admin" ? permsAllTrue()
      : papel === "operacional" ? { ...ASSISTENTE_PERMS }
      : papel === "investidor" ? { ...permsAllFalse(), investidores_visualizar: true }
      : papel === "gestor_obra" ? { ...GESTOR_PERMS }
      : permsAllFalse();
    upd({ papel, perms });
  };
  const ehInv = f.papel === "investidor";
  const ehGes = f.papel === "gestor_obra";
  const toggleObraGestor = (id) => setF((s) => {
    const atual = s.gestorObras || [];
    return { ...s, gestorObras: atual.includes(id) ? atual.filter((x) => x !== id) : [...atual, id] };
  });
  const submit = (e) => {
    e.preventDefault();
    if (!f.nome.trim() || !String(f.senha || "").trim()) return;
    if (ehInv) {
      if (!f.investidorObraId || !f.investidorContaId) { setErro("Selecione a obra e a Conta Investidor que este investidor poderá visualizar."); return; }
      const nomeNorm = f.nome.trim().toLowerCase();
      if (usuarios.some((u) => u.id !== f.id && u.nome.trim().toLowerCase() === nomeNorm)) {
        setErro("Já existe um usuário com este nome. O investidor entra digitando o nome, então ele precisa ser único."); return;
      }
    }
    const { investidorObraId, investidorContaId, gestorObras, ...resto } = f;
    onSave({ ...resto, nome: f.nome.trim(), ...(ehInv ? { investidorObraId, investidorContaId } : {}), ...(ehGes ? { gestorObras: gestorObras || [] } : {}) });
  };

  return (
    <Modal title={usuario ? "Editar usuário" : "Novo usuário"} onClose={onClose} width={640}>
      <form onSubmit={submit} className="gf-form-grid gf-modal-form">
        <Field label="Nome"><input required value={f.nome} onChange={(e) => upd({ nome: e.target.value })} /></Field>
        <Field label="Senha" hint="Visível apenas para administradores nesta tela">
          <input required value={f.senha || ""} onChange={(e) => upd({ senha: e.target.value })} placeholder="Defina uma senha" />
        </Field>
        <Field label="Status">
          <select value={f.ativo ? "ativo" : "inativo"} onChange={(e) => upd({ ativo: e.target.value === "ativo" })}>
            <option value="ativo">Ativo</option><option value="inativo">Inativo</option>
          </select>
        </Field>
        <div className="gf-span-2">
          <span className="gf-field-label" style={{ display: "block", marginBottom: 6 }}>Perfil (aplica um modelo de permissões — você ainda pode ajustar individualmente abaixo)</span>
          <div className="gf-segmented gf-segmented-3" style={{ flexWrap: "wrap", display: "flex" }}>
            <button type="button" className={f.papel === "admin" ? "is-active" : ""} onClick={() => aplicarTemplate("admin")}>Administrador</button>
            <button type="button" className={f.papel === "operacional" ? "is-active" : ""} onClick={() => aplicarTemplate("operacional")}>Operacional</button>
            <button type="button" className={f.papel === "customizavel" ? "is-active" : ""} onClick={() => aplicarTemplate("customizavel")}>Personalizado</button>
            <button type="button" className={f.papel === "investidor" ? "is-active" : ""} onClick={() => aplicarTemplate("investidor")}>Investidor</button>
            <button type="button" className={f.papel === "gestor_obra" ? "is-active" : ""} onClick={() => aplicarTemplate("gestor_obra")}>Gestor de Obra</button>
          </div>
        </div>

        {ehInv && (
          <>
            <div className="gf-span-2 gf-hint">
              Perfil <b>somente leitura</b>: o investidor só vê a obra e a Conta Investidor escolhidas abaixo (Painel de Obras e Contas Investidores) e não consegue criar, editar ou excluir nada.
              Ele entra pela opção “Acesso de investidor” da tela de login, digitando este nome de usuário e a senha.
            </div>
            <Field label="Obra que poderá visualizar">
              <select required value={f.investidorObraId || ""} onChange={(e) => { upd({ investidorObraId: e.target.value }); setErro(""); }}>
                <option value="" disabled>Selecione…</option>
                {obras.map((o) => <option key={o.id} value={o.id}>{o.nome}{o.arquivada ? " (concluída)" : ""}</option>)}
              </select>
            </Field>
            <Field label="Conta Investidor que poderá visualizar">
              <select required value={f.investidorContaId || ""} onChange={(e) => { upd({ investidorContaId: e.target.value }); setErro(""); }}>
                <option value="" disabled>Selecione…</option>
                {contasInvestidores.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </Field>
            {erro && <div className="gf-warn gf-span-2">{erro}</div>}
          </>
        )}

        {ehGes && (
          <div className="gf-span-2">
            <div className="gf-hint" style={{ marginBottom: 8 }}>
              O <b>Gestor de Obra</b> acessa somente <b>Planejamento Semanal</b>, <b>Relatórios de Obra</b> e <b>Obras Gerenciamento</b>, e apenas das obras marcadas abaixo.
              Sem nenhuma obra marcada, ele não vê obra alguma.
            </div>
            <span className="gf-field-label" style={{ display: "block", marginBottom: 6 }}>Obras que este usuário poderá acessar</span>
            <div className="gf-perm-grid">
              {obras.length === 0 && <span className="gf-field-hint">Nenhuma obra cadastrada.</span>}
              {obras.map((o) => (
                <label className="gf-checkbox gf-perm-item" key={o.id}>
                  <input type="checkbox" checked={(f.gestorObras || []).includes(o.id)} onChange={() => toggleObraGestor(o.id)} />
                  <span>{o.nome}{o.arquivada ? " (concluída)" : ""}</span>
                </label>
              ))}
            </div>
            <span className="gf-field-label" style={{ display: "block", margin: "12px 0 6px" }}>Permissões nas páginas liberadas</span>
            <div className="gf-perm-grid">
              {GESTOR_PERM_KEYS.map((k) => (
                <label className="gf-checkbox gf-perm-item" key={k}>
                  <input type="checkbox" checked={!!f.perms[k]} onChange={() => togglePerm(k)} />
                  <span>{permLabel(k)}</span>
                </label>
              ))}
            </div>
          </div>
        )}

        {!ehInv && !ehGes && <div className="gf-span-2">
          {PERMISSION_GROUPS.map((g) => (
            <div key={g.group} style={{ marginBottom: 12 }}>
              <span className="gf-field-label" style={{ display: "block", marginBottom: 6 }}>{g.group}</span>
              <div className="gf-perm-grid">
                {g.keys.map((k) => (
                  <label className="gf-checkbox gf-perm-item" key={k.key}>
                    <input type="checkbox" checked={!!f.perms[k.key]} onChange={() => togglePerm(k.key)} />
                    <span>{k.label}</span>
                  </label>
                ))}
              </div>
            </div>
          ))}
        </div>}

        <div className="gf-form-actions gf-span-2">
          <button type="submit" className="gf-btn gf-btn-primary">Salvar usuário</button>
        </div>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   Página: Dívidas e Investimentos
--------------------------------------------------------------- */

function DividasInvestimentosPage({ dividas, investimentos, entries, accounts, obras }) {
  const [filters, setFilters] = useState({ de: "", ate: "", instituicao: "", tipoDivida: "", tipoInvestimento: "", status: "", obraId: "" });
  const [dividaDetail, setDividaDetail] = useState(null);
  const [investimentoDetail, setInvestimentoDetail] = useState(null);

  const obraName = (id) => (id === SEM_OBRA ? "Administrativo / Custos internos" : obras.find((o) => o.id === id)?.nome || "—");
  const instituicoes = [...new Set([...dividas.map((d) => d.instituicao), ...investimentos.map((i) => i.instituicao)])].filter(Boolean);
  const statusOptions = [...new Set([...dividas.map((d) => d.status), ...investimentos.map((i) => i.status)])].filter(Boolean);

  const dentroPeriodo = (data) => (!filters.de || data >= filters.de) && (!filters.ate || data <= filters.ate);

  const filteredDividas = dividas
    .filter((d) => (filters.instituicao ? d.instituicao === filters.instituicao : true))
    .filter((d) => (filters.tipoDivida ? d.tipoOperacao === filters.tipoDivida : true))
    .filter((d) => (filters.status ? d.status === filters.status : true))
    .filter((d) => (filters.obraId ? d.obraId === filters.obraId : true))
    .filter((d) => dentroPeriodo(d.dataContratacao));

  const filteredInvestimentos = investimentos
    .filter((i) => (filters.instituicao ? i.instituicao === filters.instituicao : true))
    .filter((i) => (filters.tipoInvestimento ? i.tipoInvestimento === filters.tipoInvestimento : true))
    .filter((i) => (filters.status ? i.status === filters.status : true))
    .filter((i) => (filters.obraId ? i.obraId === filters.obraId : true))
    .filter((i) => dentroPeriodo(i.dataAplicacao));

  const dividasComStats = filteredDividas.map((d) => ({ ...d, stats: computeDividaStats(d, entries) }));
  const investimentosComStats = filteredInvestimentos.map((i) => ({ ...i, stats: computeInvestimentoStats(i, entries) }));

  const curMonthKey = monthKey(todayISO());
  const anoAtual = new Date().getFullYear();
  const idsDividas = new Set(filteredDividas.map((d) => d.id));
  const idsInvestimentos = new Set(filteredInvestimentos.map((i) => i.id));

  const totais = useMemo(() => {
    const dividaTotalAtual = dividasComStats.filter((d) => d.status !== "Quitada").reduce((s, d) => s + d.stats.saldoDevedor, 0);
    const totalJurosPagos = dividasComStats.reduce((s, d) => s + d.stats.jurosPagos, 0);
    const jurosPagosNoMes = entries.filter((e) => e.dividaSubtipo === "pagamento" && idsDividas.has(e.dividaId) && monthKey(e.data) === curMonthKey).reduce((s, e) => s + (Number(e.juros) || 0), 0);
    const parcelasAPagar = dividasComStats.filter((d) => d.status === "Ativa").reduce((s, d) => s + d.stats.parcelasRestantes, 0);

    const totalInvestido = investimentosComStats.filter((i) => i.status === "Ativo").reduce((s, i) => s + i.stats.principalLiquido, 0);
    const valorAtualInvestimentos = investimentosComStats.reduce((s, i) => s + i.stats.valorAtual, 0);
    const rendimentosAcumulados = investimentosComStats.reduce((s, i) => s + i.stats.rendimentos, 0);
    const rendimentosNoMes = entries.filter((e) => e.investimentoSubtipo === "rendimento" && idsInvestimentos.has(e.investimentoId) && monthKey(e.data) === curMonthKey).reduce((s, e) => s + (Number(e.valor) || 0), 0);
    const rentabilidadeAcumulada = totalInvestido > 0 ? (rendimentosAcumulados / totalInvestido) * 100 : 0;

    const jurosPagosAno = entries.filter((e) => e.dividaSubtipo === "pagamento" && idsDividas.has(e.dividaId) && e.data?.slice(0, 4) === String(anoAtual)).reduce((s, e) => s + (Number(e.juros) || 0), 0);
    const rendimentosAno = entries.filter((e) => e.investimentoSubtipo === "rendimento" && idsInvestimentos.has(e.investimentoId) && e.data?.slice(0, 4) === String(anoAtual)).reduce((s, e) => s + (Number(e.valor) || 0), 0);

    return {
      dividaTotalAtual, totalJurosPagos, jurosPagosNoMes, parcelasAPagar, totalAPagarFuturo: dividaTotalAtual,
      totalInvestido, valorAtualInvestimentos, rendimentosAcumulados, rendimentosNoMes, rentabilidadeAcumulada,
      dividaLiquida: dividaTotalAtual - valorAtualInvestimentos, patrimonioLiquido: valorAtualInvestimentos - dividaTotalAtual,
      jurosPagosAno, rendimentosAno, custoFinanceiroLiquido: jurosPagosAno - rendimentosAno,
    };
  }, [dividasComStats, investimentosComStats, entries, curMonthKey, anoAtual]);

  // Evolução mensal (últimos meses com movimentação)
  const evolucao = useMemo(() => {
    const todosMeses = new Set();
    entries.forEach((e) => { if (e.dividaId || e.investimentoId) todosMeses.add(monthKey(e.data)); });
    const meses = [...todosMeses].sort();
    if (meses.length === 0) return [];
    let dividaAcum = 0, investAcum = 0, rendAcum = 0;
    const contratacoesPorMes = {}, amortPorMes = {}, jurosPorMes = {}, aplicPorMes = {}, rendPorMes = {};
    entries.forEach((e) => {
      const mk = monthKey(e.data);
      if (e.dividaSubtipo === "contratacao") contratacoesPorMes[mk] = (contratacoesPorMes[mk] || 0) + e.valor;
      if (e.dividaSubtipo === "pagamento") { amortPorMes[mk] = (amortPorMes[mk] || 0) + (e.amortizacao || 0); jurosPorMes[mk] = (jurosPorMes[mk] || 0) + (e.juros || 0); }
      if (e.investimentoSubtipo === "aplicacao" || e.investimentoSubtipo === "aporte") aplicPorMes[mk] = (aplicPorMes[mk] || 0) + e.valor;
      if (e.investimentoSubtipo === "resgate") aplicPorMes[mk] = (aplicPorMes[mk] || 0) - e.valor;
      if (e.investimentoSubtipo === "rendimento") rendPorMes[mk] = (rendPorMes[mk] || 0) + e.valor;
    });
    return meses.map((mk) => {
      dividaAcum += (contratacoesPorMes[mk] || 0) - (amortPorMes[mk] || 0);
      investAcum += (aplicPorMes[mk] || 0);
      rendAcum += (rendPorMes[mk] || 0);
      return {
        mesLabel: monthLabel(mk), dividaTotal: Math.max(0, dividaAcum), jurosPagos: jurosPorMes[mk] || 0,
        investimentos: investAcum + rendAcum, rendimentos: rendPorMes[mk] || 0, dividaLiquida: Math.max(0, dividaAcum) - (investAcum + rendAcum),
      };
    });
  }, [entries]);

  return (
    <div className="gf-stack">
      <div className="gf-toolbar"><h2>Dívidas e investimentos</h2></div>

      <section className="gf-card">
        <div className="gf-card-head"><h2>Filtros</h2></div>
        <div className="gf-filters-grid" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
          <input type="date" title="De" value={filters.de} onChange={(e) => setFilters((f) => ({ ...f, de: e.target.value }))} />
          <input type="date" title="Até" value={filters.ate} onChange={(e) => setFilters((f) => ({ ...f, ate: e.target.value }))} />
          <select value={filters.instituicao} onChange={(e) => setFilters((f) => ({ ...f, instituicao: e.target.value }))}>
            <option value="">Instituição (todas)</option>
            {instituicoes.map((i) => <option key={i} value={i}>{i}</option>)}
          </select>
          <select value={filters.status} onChange={(e) => setFilters((f) => ({ ...f, status: e.target.value }))}>
            <option value="">Status (todos)</option>
            {statusOptions.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={filters.tipoDivida} onChange={(e) => setFilters((f) => ({ ...f, tipoDivida: e.target.value }))}>
            <option value="">Tipo de dívida (todos)</option>
            {TIPOS_DIVIDA.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
          <select value={filters.tipoInvestimento} onChange={(e) => setFilters((f) => ({ ...f, tipoInvestimento: e.target.value }))}>
            <option value="">Tipo de investimento (todos)</option>
            {TIPOS_INVESTIMENTO.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
          <select value={filters.obraId} onChange={(e) => setFilters((f) => ({ ...f, obraId: e.target.value }))}>
            <option value="">Obra/centro de custo (todos)</option>
            <option value={SEM_OBRA}>Administrativo / Custos internos</option>
            {obras.map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
          </select>
        </div>
      </section>

      <div className="gf-dvi-columns">
        <section className="gf-card">
          <div className="gf-card-head"><h2>Dívidas</h2></div>
          <div className="gf-account-rows">
            <div><span>Dívida total atual</span><b className="mono neg">{BRL(totais.dividaTotalAtual)}</b></div>
            <div><span>Total de juros pagos</span><b className="mono">{BRL(totais.totalJurosPagos)}</b></div>
            <div><span>Juros pagos no mês</span><b className="mono">{BRL(totais.jurosPagosNoMes)}</b></div>
            <div><span>Parcelas a pagar</span><b className="mono">{totais.parcelasAPagar}</b></div>
            <div><span>Total a pagar futuro (saldo devedor)</span><b className="mono">{BRL(totais.totalAPagarFuturo)}</b></div>
          </div>
        </section>
        <section className="gf-card">
          <div className="gf-card-head"><h2>Investimentos</h2></div>
          <div className="gf-account-rows">
            <div><span>Total investido</span><b className="mono">{BRL(totais.totalInvestido)}</b></div>
            <div><span>Valor atual dos investimentos</span><b className="mono pos">{BRL(totais.valorAtualInvestimentos)}</b></div>
            <div><span>Rendimentos acumulados</span><b className="mono pos">{BRL(totais.rendimentosAcumulados)}</b></div>
            <div><span>Rendimentos no mês</span><b className="mono pos">{BRL(totais.rendimentosNoMes)}</b></div>
            <div><span>Rentabilidade acumulada</span><b className="mono">{totais.rentabilidadeAcumulada.toFixed(1)}%</b></div>
          </div>
        </section>
      </div>

      <section className="gf-card">
        <div className="gf-card-head"><h2>Visão consolidada</h2></div>
        <div className="gf-account-rows" style={{ flexWrap: "wrap" }}>
          <div><span>Dívidas</span><b className="mono neg">{BRL(totais.dividaTotalAtual)}</b></div>
          <div><span>Investimentos (valor atual)</span><b className="mono pos">{BRL(totais.valorAtualInvestimentos)}</b></div>
          <div><span>Patrimônio financeiro líquido</span><b className={`mono ${totais.patrimonioLiquido >= 0 ? "pos" : "neg"}`}>{BRL(totais.patrimonioLiquido)}</b></div>
          <div><span>Dívida líquida</span><b className={`mono ${totais.dividaLiquida <= 0 ? "pos" : "neg"}`}>{BRL(totais.dividaLiquida)}</b></div>
          <div><span>Juros pagos no ano</span><b className="mono">{BRL(totais.jurosPagosAno)}</b></div>
          <div><span>Rendimentos no ano</span><b className="mono pos">{BRL(totais.rendimentosAno)}</b></div>
          <div><span>Custo financeiro líquido (ano)</span><b className={`mono ${totais.custoFinanceiroLiquido >= 0 ? "neg" : "pos"}`}>{BRL(totais.custoFinanceiroLiquido)}</b></div>
        </div>
      </section>

      {evolucao.length > 0 && (
        <section className="gf-card">
          <div className="gf-card-head"><h2>Evolução mensal</h2></div>
          <div className="gf-chart-box">
            <ResponsiveContainer width="100%" height={260}>
              <LineChart data={evolucao} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
                <CartesianGrid stroke="var(--gf-border)" vertical={false} />
                <XAxis dataKey="mesLabel" tick={{ fontSize: 11, fill: "var(--gf-muted)" }} axisLine={{ stroke: "var(--gf-border)" }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: "var(--gf-muted)" }} axisLine={false} tickLine={false} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} width={44} />
                <Tooltip formatter={(v) => BRL(v)} contentStyle={{ fontFamily: "var(--gf-font-mono)", fontSize: 12, borderRadius: 8, border: "1px solid var(--gf-border)" }} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                <Line type="monotone" dataKey="dividaTotal" name="Dívida total" stroke="var(--gf-danger)" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="investimentos" name="Investimentos" stroke="var(--gf-accent)" strokeWidth={2} dot={false} />
                <Line type="monotone" dataKey="dividaLiquida" name="Dívida líquida" stroke="var(--gf-primary)" strokeWidth={2} strokeDasharray="4 3" dot={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </section>
      )}

      <section className="gf-card">
        <div className="gf-card-head"><h2>Dívidas cadastradas</h2></div>
        {dividasComStats.length === 0 ? (
          <EmptyState icon={TrendingDown} title="Nenhuma dívida encontrada" body='Classifique um lançamento de entrada como "Dívida / Crédito" na página Lançamentos para registrar uma contratação.' />
        ) : (
          <div className="gf-grid-cards">
            {dividasComStats.map((d) => (
              <button className="gf-card gf-obra-card" key={d.id} onClick={() => setDividaDetail(d)}>
                <div className="gf-card-head">
                  <div><div className="gf-eyebrow">{d.tipoOperacao}</div><h3>{d.instituicao}</h3></div>
                  <Badge tone={d.status === "Quitada" ? "gray" : "red"}>{d.status}</Badge>
                </div>
                <div className="gf-account-rows">
                  <div><span>Valor contratado</span><b className="mono">{BRL(d.valorContratado)}</b></div>
                  <div><span>Saldo devedor</span><b className="mono neg">{BRL(d.stats.saldoDevedor)}</b></div>
                  <div><span>Parcelas pagas/restantes</span><b className="mono">{d.stats.parcelasPagas}/{d.qtdParcelas}</b></div>
                  <div><span>Juros pagos</span><b className="mono">{BRL(d.stats.jurosPagos)}</b></div>
                </div>
                <span className="gf-card-cta">Ver detalhes <ChevronRight size={14} /></span>
              </button>
            ))}
          </div>
        )}
      </section>

      <section className="gf-card">
        <div className="gf-card-head"><h2>Investimentos cadastrados</h2></div>
        {investimentosComStats.length === 0 ? (
          <EmptyState icon={TrendingUp} title="Nenhum investimento encontrado" body='Classifique um lançamento de saída como "Investimento" na página Lançamentos para registrar uma aplicação.' />
        ) : (
          <div className="gf-grid-cards">
            {investimentosComStats.map((i) => (
              <button className="gf-card gf-obra-card" key={i.id} onClick={() => setInvestimentoDetail(i)}>
                <div className="gf-card-head">
                  <div><div className="gf-eyebrow">{i.tipoInvestimento}</div><h3>{i.instituicao}</h3></div>
                  <Badge tone={i.status === "Ativo" ? "green" : "gray"}>{i.status}</Badge>
                </div>
                <div className="gf-account-rows">
                  <div><span>Valor investido líquido</span><b className="mono">{BRL(i.stats.principalLiquido)}</b></div>
                  <div><span>Valor atual</span><b className="mono pos">{BRL(i.stats.valorAtual)}</b></div>
                  <div><span>Rendimentos</span><b className="mono pos">{BRL(i.stats.rendimentos)}</b></div>
                  <div><span>Rentabilidade</span><b className="mono">{i.stats.rentabilidade.toFixed(1)}%</b></div>
                </div>
                <span className="gf-card-cta">Ver detalhes <ChevronRight size={14} /></span>
              </button>
            ))}
          </div>
        )}
      </section>

      {dividaDetail && <DividaDetailModal divida={dividaDetail} obraName={obraName} accounts={accounts} onClose={() => setDividaDetail(null)} />}
      {investimentoDetail && <InvestimentoDetailModal investimento={investimentoDetail} obraName={obraName} accounts={accounts} onClose={() => setInvestimentoDetail(null)} />}
    </div>
  );
}

function DividaDetailModal({ divida, obraName, accounts, onClose }) {
  const s = divida.stats;
  const accountName = (id) => accounts.find((a) => a.id === id)?.nome || "—";
  return (
    <Modal title={`${divida.instituicao} — ${divida.tipoOperacao}`} onClose={onClose} width={720}>
      <div className="gf-detail-meta" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
        <div><span>Data de contratação</span><b>{fmtDate(divida.dataContratacao)}</b></div>
        <div><span>Valor contratado</span><b className="mono">{BRL(divida.valorContratado)}</b></div>
        <div><span>Taxa de juros</span><b>{divida.taxaJuros || "—"}</b></div>
        <div><span>Sistema de amortização</span><b>{divida.sistemaAmortizacao || "—"}</b></div>
        <div><span>Centro de custo</span><b>{obraName(divida.obraId)}</b></div>
        <div><span>Próximo vencimento</span><b>{divida.proximoVencimento ? fmtDate(divida.proximoVencimento) : "—"}</b></div>
        <div><span>Valor da próxima parcela</span><b className="mono">{divida.valorParcelaEstimado ? BRL(divida.valorParcelaEstimado) : "—"}</b></div>
        <div><span>Status</span><b>{divida.status}</b></div>
      </div>

      <div className="gf-account-rows gf-detail-stats" style={{ flexWrap: "wrap" }}>
        <div><span>Saldo devedor</span><b className="mono neg">{BRL(s.saldoDevedor)}</b></div>
        <div><span>Parcelas pagas</span><b className="mono">{s.parcelasPagas}</b></div>
        <div><span>Parcelas restantes</span><b className="mono">{s.parcelasRestantes}</b></div>

        <div><span>Encargos pagos</span><b className="mono">{BRL(s.encargosPagos)}</b></div>

          <tbody>
            {s.pagamentos.length === 0 && <tr><td colSpan={6}><EmptyState icon={Receipt} title="Nenhum pagamento registrado" body="Nenhuma parcela paga ainda para esta dívida." /></td></tr>}
