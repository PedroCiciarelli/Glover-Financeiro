}
// Referência do previsto: { tipo: "baseline" | "primeira", tarefasRef } (nunca trocada silenciosamente)
async function relResolverRef(obraId, meta) {

  if (meta.ref.tipo === "baseline") return { tipo: "baseline", tarefasRef: null };

// Prepara uma importação (sem gravar): parse + chaves + diff contra a versão atual.
async function relCronPreparar(obraId, texto, meta) {

  const tarefas = relAtribuirChaves(parsed.tarefas, atual ? atual.tarefas : []);
  const diff = atual ? relDiffVersoes(atual.tarefas, tarefas) : null;

async function relPrepararDadosPDF(rel, obra, usuarioLista, { usarSnapshot = true } = {}) {

        <>
          <button className="gf-btn gf-btn-ghost" style={{ alignSelf: "flex-start" }} onClick={() => setMostrarArquivadas((v) => !v)}>
            <Archive size={14} /> {mostrarArquivadas ? "Ocultar" : "Mostrar"} obras concluídas/arquivadas ({arquivadas.length})
          </button>
          {mostrarArquivadas && <div className="gf-grid-cards">{arquivadas.map(card)}</div>}
        </>
      )}
    </div>
  );
}

/* ---------- Página da obra ---------- */
function RelObraPage({ obra, onBack, podeGerenciar, currentUser, logAudit, disciplinas, usuarios }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState(null);
  const [meta, setMeta] = useState(null);
  const [editandoId, setEditandoId] = useState(null);
  const [novoAberto, setNovoAberto] = useState(false);
  const [previaId, setPreviaId] = useState(null);
  const [ocupado, setOcupado] = useState("");
  const usuarioNome = currentUser?.nome || "—";

  const carregar = useCallback(async () => {
    setErro(null);
    try {
      const [l, m] = await Promise.all([relListarRelatorios(obra.id), relCronLerMeta(obra.id)]);
      setLista(l.filter((r) => !r.excluido).sort(relCompararRel));
      setMeta(m);
    } catch (e) { setErro((e && e.message) || "Falha ao carregar os relatórios."); }
  }, [obra.id]);
  useEffect(() => { carregar(); }, [carregar]);

  if (editandoId) {
    return (
      <RelEditor
        obra={obra} relId={editandoId} podeGerenciar={podeGerenciar} currentUser={currentUser} logAudit={logAudit}
        disciplinas={disciplinas} usuarios={usuarios}
        onBack={() => { setEditandoId(null); carregar(); }}
      />
    );
  }

  const gerarPDF = async (r) => {
    try {
      setOcupado(`Gerando PDF do relatório ${String(r.numero).padStart(2, "0")}…`);
      const rel = await relLerRelatorio(obra.id, r.id);
      if (!rel) throw new Error("Relatório não encontrado.");
      const dados = await relPrepararDadosPDF(rel, obra, usuarios);
      const out = await relRenderizarRelatorio(dados, { qualidade: 0.9, onProgresso: (i, t) => setOcupado(`Gerando PDF… página ${i} de ${t}`) });
      relBaixarBytes(relMontarPDF(out.paginas, { titulo: `Relatório de Obra nº ${rel.numero} — ${obra.nome}` }), relNomeArquivoPDF(obra.nome, rel.numero, rel.periodoFim));
    } catch (e) { window.alert("Não foi possível gerar o PDF: " + ((e && e.message) || e)); }
    setOcupado("");
  };

  const duplicar = async (r) => {
    if (!podeGerenciar) return;
    if (!window.confirm(`Duplicar o relatório nº ${String(r.numero).padStart(2, "0")}? Será criado um novo relatório (Em elaboração) com o mesmo conteúdo, inclusive fotografias.`)) return;
    try {
      setOcupado("Duplicando relatório…");
      const orig = await relLerRelatorio(obra.id, r.id);
      if (!orig) throw new Error("Relatório não encontrado.");
      const novoId = uid("rel");
      const numero = await relReservarNumero(obra.id, novoId, usuarioNome);
      const fotos = [];
      for (const f of orig.fotos || []) {
        const nf = uid("foto");
        const dados = await relLerFoto(orig.id, f.id);
        if (dados) { await relGravarFoto(novoId, nf, dados); fotos.push({ ...f, id: nf }); }
      }
      const agora = Date.now();
      const novo = {
        ...orig, id: novoId, numero, status: REL_STATUS_ELAB, snapshot: null, log: [], excluido: false, rev: 0,
        fotos, criadoEm: agora, criadoPor: usuarioNome, editadoEm: agora, editadoPor: usuarioNome, finalizadoEm: null, finalizadoPor: null,
      };
      const res = await relSalvarRelatorio(novo, usuarioNome, { forcar: true });
      logAudit?.({ tipoOperacao: "Duplicação de Relatório de Obra", registroAlterado: `${obra.nome} — Relatório ${String(numero).padStart(2, "0")}`, valorAnterior: `Relatório ${String(orig.numero).padStart(2, "0")}`, valorNovo: "Duplicado" });
      await carregar();
      if (res.ok) setEditandoId(novoId);
    } catch (e) { window.alert("Não foi possível duplicar: " + ((e && e.message) || e)); }
    setOcupado("");
  };

  const excluir = async (r) => {
    if (!podeGerenciar) return;
    if (!window.confirm(`Excluir o Relatório ${String(r.numero).padStart(2, "0")} (${fmtDate(r.periodoIni)} a ${fmtDate(r.periodoFim)})? Esta ação não pode ser desfeita; as fotografias serão removidas.`)) return;
    try {
      setOcupado("Excluindo relatório…");
      const rel = await relLerRelatorio(obra.id, r.id);
      await relExcluirRelatorio(rel || { ...r, fotos: [] }, usuarioNome);
      logAudit?.({ tipoOperacao: "Exclusão de Relatório de Obra", registroAlterado: `${obra.nome} — Relatório ${String(r.numero).padStart(2, "0")}`, valorAnterior: r.status, valorNovo: "Excluído" });
      await carregar();
    } catch (e) { window.alert("Não foi possível excluir: " + ((e && e.message) || e)); }
    setOcupado("");
  };

  return (
    <div className="gf-stack">
      <button className="gf-btn gf-btn-ghost" onClick={onBack} style={{ alignSelf: "flex-start" }}>← Voltar para as obras</button>
      <div className="gf-toolbar">
        <div>
          <h2>RELATÓRIOS DE OBRA — {obra.nome}</h2>
          <div className="gf-field-hint">{obra.cliente ? `Cliente: ${obra.cliente}` : ""}</div>
        </div>
        {podeGerenciar && (
          <button className="gf-btn gf-btn-primary gf-rel-novo" onClick={() => setNovoAberto(true)} disabled={!lista}>
            <Plus size={15} /> Novo Relatório de Obra
          </button>
        )}
      </div>
      {!podeGerenciar && <p className="gf-field-hint">Modo de consulta — seu usuário não tem permissão para criar ou editar relatórios de obra.</p>}
      {ocupado && <div className="gf-rel-aviso gf-rel-aviso-info">{ocupado}</div>}

      <RelCronogramaSecao obra={obra} meta={meta} setMeta={setMeta} podeGerenciar={podeGerenciar} currentUser={currentUser} logAudit={logAudit} />

      <div className="gf-card">
        <div className="gf-card-head"><h2>Histórico de relatórios</h2></div>
        {erro ? (
          <div className="gf-rel-aviso gf-rel-aviso-erro">{erro} <button className="gf-btn gf-btn-ghost" onClick={carregar}>Tentar novamente</button></div>
        ) : !lista ? (
          <p className="gf-field-hint">Carregando relatórios…</p>
        ) : lista.length === 0 ? (
          <EmptyState icon={FileText} title="Nenhum relatório criado" body={podeGerenciar ? "Clique em “Novo Relatório de Obra” para começar." : "Ainda não há relatórios para esta obra."} />
        ) : (
          <div className="gf-rel-lista">
            {lista.map((r) => (
              <div className="gf-rel-item" key={r.id}>
                <div className="gf-rel-item-info">
                  <div className="gf-rel-item-titulo">Relatório {String(r.numero).padStart(2, "0")} — {fmtDate(r.periodoIni)} a {fmtDate(r.periodoFim)}</div>
                  <div className="gf-plano-atividade-meta">
                    <Badge tone={r.status === REL_STATUS_FINAL ? "green" : "orange"}>{r.status}</Badge>
                    <span>Ref.: {fmtDate(r.dataRef)}</span>
                    {r.ind && <span>Realizado {relFmtPct(r.ind.real)} | Previsto {relFmtPct(r.ind.prev)}</span>}
                    <span>Resp.: {r.responsavel || "—"}</span>
                    <span>{r.nFotos} foto(s)</span>
                    <span>Editado {r.editadoEm ? new Date(r.editadoEm).toLocaleDateString("pt-BR") : "—"} por {r.editadoPor || "—"}</span>
                  </div>
                </div>
                <div className="gf-row-actions gf-rel-item-acoes">
                  <button className="gf-icon-btn" title="Visualizar (pré-visualização)" onClick={() => setPreviaId(r.id)}><Eye size={14} /></button>
                  <button className="gf-icon-btn" title={podeGerenciar ? "Editar" : "Abrir"} onClick={() => setEditandoId(r.id)}><Pencil size={14} /></button>
                  {podeGerenciar && <button className="gf-icon-btn" title="Duplicar" onClick={() => duplicar(r)}><Copy size={14} /></button>}
                  <button className="gf-icon-btn" title="Gerar PDF" onClick={() => gerarPDF(r)} disabled={!!ocupado}><FileDown size={14} /></button>
                  {podeGerenciar && <button className="gf-icon-btn danger" title="Excluir" onClick={() => excluir(r)}><Trash2 size={14} /></button>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {novoAberto && (
        <RelNovoModal
          obra={obra} meta={meta} lista={lista || []} usuarios={usuarios} currentUser={currentUser} logAudit={logAudit}
          onClose={() => setNovoAberto(false)}
          onCriado={async (id) => { setNovoAberto(false); await carregar(); setEditandoId(id); }}
        />
      )}
      {previaId && (
        <RelPreviewModal obra={obra} relId={previaId} usuarios={usuarios} onClose={() => setPreviaId(null)} />
      )}
    </div>
  );
}

/* ---------- Novo relatório ---------- */
function RelNovoModal({ obra, meta, lista, usuarios, currentUser, logAudit, onClose, onCriado }) {
  const ultimo = lista.length ? [...lista].sort((a, b) => (a.periodoFim < b.periodoFim ? 1 : -1))[0] : null;
  const iniSug = ultimo ? relSomaDias(ultimo.periodoFim, 1) : todayISO();
  const [ini, setIni] = useState(iniSug);
  const [fim, setFim] = useState(ultimo ? relSomaDias(ultimo.periodoFim, 7) : relSomaDias(todayISO(), 6));
  const [ref, setRef] = useState(ultimo ? relSomaDias(ultimo.periodoFim, 7) : todayISO());
  const [refEditada, setRefEditada] = useState(false);
  const nomes = (usuarios || []).filter((u) => u.ativo && !isInvestidor(u)).map((u) => u.nome);
  const [resp, setResp] = useState(currentUser?.nome || nomes[0] || "");
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");
  const [numManual, setNumManual] = useState("");
  const usuarioNome = currentUser?.nome || "—";
  const sugestao = Math.max(0, ...lista.filter((r) => !r.excluido).map((r) => Number(r.numero) || 0)) + 1;

  const criar = async (e) => {
    e.preventDefault();
    const manual = numManual.trim() === "" ? null : Number(numManual);
    if (manual !== null && (!Number.isInteger(manual) || manual < 1 || manual > 9999)) return setErro("O número do relatório deve ser um inteiro entre 1 e 9999.");
    if (manual !== null && lista.some((r) => !r.excluido && Number(r.numero) === manual) && !window.confirm(`Já existe um relatório nº ${String(manual).padStart(2, "0")} nesta obra. Usar o mesmo número mesmo assim?`)) return;
    if (![ini, fim, ref].every(relDataValida)) return setErro("Informe datas válidas.");
    if (fim < ini) return setErro("A data final do período não pode ser anterior à data inicial.");
    if (!resp.trim()) return setErro("Informe o responsável pelo relatório.");
    setSalvando(true); setErro("");
    try {
      const relId = uid("rel");
      const reservado = await relReservarNumero(obra.id, relId, usuarioNome);
      const numero = manual !== null ? manual : reservado;
      const agora = Date.now();
      const rel = {
        id: relId, obraId: obra.id, numero, periodoIni: ini, periodoFim: fim, dataRef: ref, responsavel: resp.trim(),
        status: REL_STATUS_ELAB, cronVersaoId: meta?.atualId || null, afer: {},
        introTexto: relTextoIntroducao(obra.nome, ini, fim), introEditada: false, principais: "",
        fotos: [], analise: "", ind: null, snapshot: null, log: [], rev: 0,
        criadoEm: agora, criadoPor: usuarioNome, editadoEm: agora, editadoPor: usuarioNome, excluido: false,
      };
      const r = await relSalvarRelatorio(rel, usuarioNome, { forcar: true });
      if (!r.ok) throw new Error("Falha ao salvar o relatório.");
      logAudit?.({ tipoOperacao: "Criação de Relatório de Obra", registroAlterado: `${obra.nome} — Relatório ${String(numero).padStart(2, "0")}`, valorAnterior: "—", valorNovo: `${fmtDate(ini)} a ${fmtDate(fim)}` });
      onCriado(relId);
    } catch (err) { setErro((err && err.message) || "Falha ao criar o relatório."); setSalvando(false); }
  };

  return (
    <Modal title="Novo Relatório de Obra" onClose={onClose} width={560}>
      <form onSubmit={criar} className="gf-form-grid gf-modal-form">
        <Field label="Data inicial do período"><input type="date" value={ini} onChange={(e) => { setIni(e.target.value); }} required /></Field>
        <Field label="Data final do período"><input type="date" value={fim} onChange={(e) => { setFim(e.target.value); if (!refEditada) setRef(e.target.value); }} required /></Field>
        <Field label="Data de referência da aferição" hint="Data até a qual o avanço previsto é calculado."><input type="date" value={ref} onChange={(e) => { setRef(e.target.value); setRefEditada(true); }} required /></Field>
        <Field label="Responsável pelo relatório">
          <input list="rel-resp" value={resp} onChange={(e) => setResp(e.target.value)} required />
          <datalist id="rel-resp">{nomes.map((n) => <option key={n} value={n} />)}</datalist>
        </Field>
        <Field label="Número do relatório" hint={`Deixe em branco para numeração automática (próximo: ${String(sugestao).padStart(2, "0")}). Você pode digitar outro número e alterá-lo depois.`}>
          <input type="number" min="1" max="9999" step="1" value={numManual} placeholder={`Automático (${String(sugestao).padStart(2, "0")})`} onChange={(e) => setNumManual(e.target.value)} />
        </Field>
        <p className="gf-field-hint" style={{ gridColumn: "1 / -1" }}>
          {meta?.atualId ? "Será usada a versão mais recente do cronograma importado." : "Atenção: nenhum cronograma foi importado para esta obra; o avanço físico e a Curva S ficarão indisponíveis até a importação do XML."}
        </p>
        {erro && <div className="gf-rel-aviso gf-rel-aviso-erro" style={{ gridColumn: "1 / -1" }}>{erro}</div>}
        <div className="gf-row-actions" style={{ gridColumn: "1 / -1" }}>
          <button type="button" className="gf-btn gf-btn-ghost" onClick={onClose}>Cancelar</button>
          <button type="submit" className="gf-btn gf-btn-primary" disabled={salvando}>{salvando ? "Criando…" : "Criar e abrir editor"}</button>
        </div>
      </form>
    </Modal>
  );
}

/* ---------- Cronograma Microsoft Project ---------- */
function RelCronogramaSecao({ obra, meta, setMeta, podeGerenciar, currentUser, logAudit }) {
  const [prep, setPrep] = useState(null); // { prep, arquivo, texto }
  const [lendo, setLendo] = useState(false);
  const [erro, setErro] = useState("");
  const [verAtividades, setVerAtividades] = useState(false);
  const inputRef = useRef(null);
  const usuarioNome = currentUser?.nome || "—";

  const escolher = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setErro(""); setLendo(true);
    try {
      if (!/\.xml$/i.test(f.name)) throw new Error("Selecione um arquivo .xml exportado do Microsoft Project (formato .mpp não é suportado).");
      const texto = await f.text();
      const m = await relCronLerMeta(obra.id);
      const p = await relCronPreparar(obra.id, texto, m);
      if (!p.ok) throw new Error(p.erro);
      setPrep({ prep: p, arquivo: f.name, texto });
    } catch (err) { setErro((err && err.message) || "Falha ao ler o XML."); }
    setLendo(false);
  };

  const confirmar = async () => {
    setLendo(true);
    try {
      const novo = await relCronConfirmarImportacao(obra.id, prep.prep, prep.arquivo, prep.texto, usuarioNome);
      setMeta(novo);
      logAudit?.({ tipoOperacao: "Importação de cronograma (Relatórios de Obra)", registroAlterado: `${obra.nome} — ${prep.arquivo}`, valorAnterior: "—", valorNovo: `Versão ${novo.versoes.length}` });
      setPrep(null);
    } catch (err) { setErro((err && err.message) || "Falha ao salvar o cronograma."); }
    setLendo(false);
  };

  const adotarBaseline = async () => {
    const atual = meta.versoes.find((v) => v.id === meta.atualId);
    if (!atual || !atual.temBaseline) return;
    if (!window.confirm("Adotar a linha de base do Microsoft Project como referência do avanço previsto? Isso altera o avanço previsto dos relatórios em elaboração. Relatórios finalizados não são afetados.")) return;
    try {
      const novo = await relCronDefinirRef(obra.id, { tipo: "baseline", versaoId: atual.id }, usuarioNome);
      setMeta(novo);
      logAudit?.({ tipoOperacao: "Referência do cronograma alterada (Relatórios de Obra)", registroAlterado: obra.nome, valorAnterior: "Primeira importação", valorNovo: "Linha de base do Project" });
    } catch (err) { setErro((err && err.message) || "Falha ao salvar."); }
  };

  const versoes = meta ? meta.versoes : [];
  const atual = versoes.find((v) => v.id === meta?.atualId);
  return (
    <div className="gf-card">
      <div className="gf-card-head">
        <h2>CRONOGRAMA MICROSOFT PROJECT</h2>
        <div className="gf-row-actions">
          {atual && <button className="gf-btn gf-btn-ghost" onClick={() => setVerAtividades(true)}><Layers size={14} /> Atividades e pesos</button>}
          {podeGerenciar && (
            <>
              <input ref={inputRef} type="file" accept=".xml,text/xml,application/xml" style={{ display: "none" }} onChange={escolher} />
              <button className="gf-btn gf-btn-primary" onClick={() => inputRef.current && inputRef.current.click()} disabled={lendo}>
                <Upload size={14} /> {versoes.length ? "Atualizar cronograma (XML)" : "Importar cronograma (XML)"}
              </button>
            </>
          )}
        </div>
      </div>
      {erro && <div className="gf-rel-aviso gf-rel-aviso-erro">{erro}</div>}
      {lendo && <div className="gf-rel-aviso gf-rel-aviso-info">Processando arquivo…</div>}
      {!meta ? <p className="gf-field-hint">Carregando…</p> : versoes.length === 0 ? (
        <EmptyState icon={CalendarRange} title="Nenhum cronograma importado" body="Exporte o cronograma do Microsoft Project em XML (Arquivo > Salvar como > XML) e importe aqui para calcular o avanço previsto e realizado." />
      ) : (
        <>
          <div className="gf-rel-ref">
            <b>Referência do avanço previsto:</b>{" "}
            {meta.ref?.tipo === "baseline" ? "linha de base (Baseline 0) do Microsoft Project" : `primeira versão importada (v${versoes.find((v) => v.id === meta.ref?.versaoId)?.numero ?? 1}) — o XML não possui linha de base`}
            {meta.ref?.definidoEm ? ` — definida em ${new Date(meta.ref.definidoEm).toLocaleDateString("pt-BR")} por ${meta.ref.definidoPor}` : ""}.
            {" "}A referência não é substituída automaticamente por novas importações.
            {podeGerenciar && meta.ref?.tipo === "primeira" && atual?.temBaseline && (
              <div style={{ marginTop: 6 }}><button className="gf-btn gf-btn-ghost" onClick={adotarBaseline}>A versão atual possui linha de base: adotar como referência</button></div>
            )}
          </div>
          <div className="gf-table-wrap">
            <table className="gf-table">
              <thead><tr><th>Versão</th><th>Arquivo</th><th>Importado em</th><th className="num">Atividades exec.</th><th className="num">Dias de trabalho acum.</th><th>Linha de base</th><th>Mudanças vs. anterior</th></tr></thead>
              <tbody>
                {[...versoes].reverse().map((v) => (
                  <tr key={v.id}>
                    <td>v{v.numero} {v.id === meta.atualId && <Badge tone="green">Atual</Badge>}</td>
                    <td className="gf-td-desc" title={v.arquivo}>{v.arquivo}</td>
                    <td>{new Date(v.importadoEm).toLocaleString("pt-BR")} <span className="gf-field-hint">({v.importadoPor})</span></td>
                    <td className="num mono">{v.nExec}</td>
                    <td className="num mono">{relFmtDias(v.totalMin, v.minPorDia)}</td>
                    <td>{v.temBaseline ? "Sim" : "Não"}</td>
                    <td>{v.diff ? `+${v.diff.add} / −${v.diff.rem} / ~${v.diff.alt}` : "Versão inicial"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
      {prep && <RelImportModal prep={prep} meta={meta} onCancel={() => setPrep(null)} onConfirm={confirmar} salvando={lendo} />}
      {verAtividades && atual && <RelAtividadesModal obraId={obra.id} versaoInfo={atual} onClose={() => setVerAtividades(false)} />}
    </div>
  );
}

function RelAvisosLista({ avisos }) {
  if (!avisos || !avisos.length) return null;
  return (
    <div className="gf-rel-avisos">
      {avisos.map((a, i) => <div key={i} className={`gf-rel-aviso gf-rel-aviso-${a.nivel === "erro" ? "erro" : a.nivel === "aviso" ? "atencao" : "info"}`}>{a.msg}</div>)}
    </div>
  );
}

function RelImportModal({ prep, meta, onCancel, onConfirm, salvando }) {
  const p = prep.prep;
  const exec = relExecutaveis(p.parsed.tarefas);
  const total = exec.reduce((s, t) => s + t.durMin, 0);
  const d = p.diff;
  const bloqueado = p.avisos.some((a) => a.nivel === "erro");
  const lista = (itens, f) => (itens.length ? <ul className="gf-rel-ul">{itens.slice(0, 40).map((x, i) => <li key={i}>{f(x)}</li>)}{itens.length > 40 && <li>… e mais {itens.length - 40}</li>}</ul> : null);
  const fmtV = (c, v) => (v === null || v === undefined ? "—" : c === "Duração" ? relFmtDias(v, p.parsed.projeto.minPorDia) + " dias" : c === "Início" || c === "Término" ? relFmtData(v) : String(v));
  return (
    <Modal title="Importar cronograma — conferência" onClose={onCancel} width={820}>
      <div className="gf-stack" style={{ gap: 12 }}>
        <div className="gf-rel-resumo-grid">
          <div><span>Arquivo</span><b>{prep.arquivo}</b></div>

            {d.removidas.length > 0 && <details open={d.removidas.length <= 15}><summary><b>Removidas ({d.removidas.length})</b></summary>{lista(d.removidas, (x) => `${x.wbs} ${x.nome}`)}</details>}
            {d.alteradas.length > 0 && <details><summary><b>Alteradas ({d.alteradas.length})</b></summary>{lista(d.alteradas, (x) => `${x.wbs} ${x.nome}: ` + x.mudancas.filter((m) => m.chaveCampo !== "paiChave").map((m) => `${m.campo} ${fmtV(m.campo, m.de)} → ${fmtV(m.campo, m.para)}`).join("; "))}</details>}

  );
}

/* ---------- Gráfico da Curva S (tela) ---------- */
function RelCurvaSVG({ curva, dataRef }) {
  const prev = (curva && curva.prev) || [], real = (curva && curva.real) || [];
  const todas = [...prev, ...real].map((p) => relIsoParaDias(p.d));
  if (dataRef) todas.push(relIsoParaDias(dataRef));
  if (!todas.length) return <p className="gf-field-hint">Cronograma indisponível — a curva S não pôde ser calculada.</p>;
  const W = 860, H = 380, x0 = 50, x1 = W - 16, yT = 14, yB = H - 44;
  const dmin = Math.min(...todas), dmax = Math.max(Math.max(...todas), dmin + 1);
  const X = (iso) => x0 + ((relIsoParaDias(iso) - dmin) / (dmax - dmin)) * (x1 - x0);
  const Y = (v) => yB - ((yB - yT) * Math.max(0, Math.min(100, v))) / 100;
  const path = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="gf-rel-svg" role="img" aria-label="Curva S de avanço físico">
      {[0, 20, 40, 60, 80, 100].map((v) => (<g key={v}><line x1={x0} x2={x1} y1={Y(v)} y2={Y(v)} stroke="#E3E6E1" /><text x={x0 - 8} y={Y(v) + 4} fontSize="11" textAnchor="end" fill="#5D6B64">{v}%</text></g>))}
      {Array.from({ length: 8 }, (_, i) => { const dia = Math.round(dmin + ((dmax - dmin) * i) / 7); return <text key={i} x={x0 + ((x1 - x0) * i) / 7} y={H - 20} fontSize="11" textAnchor="middle" fill="#5D6B64">{relFmtDataCurta(relDiasParaIso(dia))}</text>; })}
      {dataRef && <line x1={X(dataRef)} x2={X(dataRef)} y1={yT} y2={yB} stroke="#5D6B64" strokeDasharray="5 4" />}
      {prev.length > 0 && <path d={path(prev)} fill="none" stroke="#5D6B64" strokeWidth="3" strokeDasharray="8 5" />}
      {real.length > 1 && <path d={path(real)} fill="none" stroke="#0E3B2E" strokeWidth="3.5" />}
      {real.map((p, i) => <circle key={i} cx={X(p.d)} cy={Y(p.v)} r="5" fill="#0E3B2E" stroke="#fff" strokeWidth="2" />)}
    </svg>
  );
}

/* ---------- Campo de aferição ---------- */
function RelAferInput({ valor, onCommit, disabled, placeholder }) {
  const fmt = (v) => (v === null || v === undefined ? "" : relFmtNum(v, 2));
  const [txt, setTxt] = useState(fmt(valor));
  const [erro, setErro] = useState(false);
  useEffect(() => { setTxt(fmt(valor)); setErro(false); }, [valor]);
  const commit = () => {
    const v = relParsePct(txt);
    if (v === null) { setErro(false); if (valor !== null && valor !== undefined) onCommit(null); return; }
    if (Number.isNaN(v) || !relPctValido(v)) { setErro(true); return; }
    setErro(false);
    if (relRound(v, 2) !== valor) onCommit(relRound(v, 2));
  };
  return (
    <input
      className={`gf-rel-afer-input${erro ? " gf-input-error" : ""}`} inputMode="decimal" value={txt} disabled={disabled}
      placeholder={placeholder} title={erro ? "Informe um valor entre 0 e 100" : "Percentual realizado (0 a 100)"}
      onChange={(e) => setTxt(e.target.value)} onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } }}
    />
  );
}

const REL_ST_ROTULO = { nao: ["Não aferida", "gray"], zero: ["0%", "yellow"], parcial: ["Em andamento", "blue"], completa: ["Concluída", "green"] };

/* ---------- Editor do relatório ---------- */
function RelEditor({ obra, relId, podeGerenciar, currentUser, logAudit, disciplinas, usuarios, onBack }) {
  const [rel, setRelRaw] = useState(null);
  const [ctx, setCtx] = useState(null); // { versao, plan, meta, resumos, anteriores, ref }
  const [erro, setErro] = useState("");
  const [aba, setAba] = useState("dados");
  const [dirty, setDirty] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const [msg, setMsg] = useState("");
  const [editandoFinal, setEditandoFinal] = useState(false);
  const [previa, setPrevia] = useState(false);
  const [fotoCache, setFotoCache] = useState({});
  const [filtro, setFiltro] = useState({ busca: "", status: "todas", aberto: {} });
  const usuarioNome = currentUser?.nome || "—";

  const setRel = (fn) => { setRelRaw((r) => (typeof fn === "function" ? fn(r) : fn)); setDirty(true); };

  useEffect(() => {
    let vivo = true;
    (async () => {
      try {
        const r = await relLerRelatorio(obra.id, relId);
        if (!r || r.excluido) throw new Error("Relatório não encontrado (pode ter sido excluído).");
        const [meta, resumos] = await Promise.all([relCronLerMeta(obra.id), relListarRelatorios(obra.id)]);
        const versao = await relCarregarVersao(obra.id, r.cronVersaoId);
        const ref = await relResolverRef(obra.id, meta);
        const plan = versao ? relPlanejamento(versao, ref) : null;
        const ativos = resumos.filter((s) => !s.excluido && s.id !== relId && s.dataRef <= r.dataRef).sort((a, b) => (a.dataRef < b.dataRef ? 1 : -1)).slice(0, 40);
        const anteriores = (await Promise.all(ativos.map((s) => relLerRelatorio(obra.id, s.id)))).filter(Boolean);
        if (!vivo) return;
        setRelRaw(r); setCtx({ versao, plan, meta, resumos: resumos.filter((s) => !s.excluido), anteriores, ref });
      } catch (e) { if (vivo) setErro((e && e.message) || "Falha ao carregar o relatório."); }
    })();
    return () => { vivo = false; };
  }, [obra.id, relId]);

  const finalizadoTrava = rel && rel.status === REL_STATUS_FINAL && !editandoFinal;
  const somenteLeitura = !podeGerenciar || finalizadoTrava;

  const vInfo = ctx && rel ? ctx.meta.versoes.find((v) => v.id === rel.cronVersaoId) : null;
  const cons = useMemo(() => {
    if (!rel || !ctx) return null;
    if (finalizadoTrava && rel.snapshot && rel.snapshot.cons) return rel.snapshot.cons;
    if (!ctx.versao) return null;
    return relConsolidar({
      rel, versao: ctx.versao, plan: ctx.plan, refTipo: ctx.ref && ctx.ref.tipo,
      versaoNome: vInfo ? `v${vInfo.numero} (${vInfo.arquivo})` : "",
      historico: ctx.resumos.filter((s) => s.ind).map((s) => ({ id: s.id, dataRef: s.dataRef, real: s.ind.real })),
    });
  }, [rel, ctx, finalizadoTrava, vInfo]);
  const sugestoes = useMemo(() => (ctx ? relSugestoes(ctx.anteriores) : {}), [ctx]);

  // carrega miniaturas ao abrir a aba de fotos
  useEffect(() => {
    if (aba !== "fotos" || !rel) return;
    let vivo = true;
    (async () => {
      for (const f of rel.fotos || []) {
        if (fotoCache[f.id]) continue;
        try { const d = await relLerFoto(rel.id, f.id); if (vivo && d) setFotoCache((c) => ({ ...c, [f.id]: d.dataUri })); } catch (e) { /* ignora */ }
      }
    })();
    return () => { vivo = false; };
  }, [aba, rel && rel.fotos && rel.fotos.length]);

  if (erro) return (<div className="gf-stack"><button className="gf-btn gf-btn-ghost" onClick={onBack} style={{ alignSelf: "flex-start" }}>← Voltar</button><div className="gf-rel-aviso gf-rel-aviso-erro">{erro}</div></div>);
  if (!rel || !ctx) return (<div className="gf-stack"><p className="gf-field-hint">Carregando relatório…</p></div>);

  const voltar = () => { if (dirty && !window.confirm("Há alterações não salvas. Sair mesmo assim?")) return; onBack(); };

  const salvar = async (extra = {}, opcoes = {}) => {
    const nn = Number(rel.numero);
    if (!Number.isInteger(nn) || nn < 1 || nn > 9999) { window.alert("O número do relatório deve ser um inteiro entre 1 e 9999."); return false; }
    setSalvando(true); setMsg("");
    try {
      const salvoAntes = await relLer(relChave.sum(rel.obraId, rel.id));
      if (!salvoAntes || nn !== Number(salvoAntes.numero)) {
        const outros = (await relListarRelatorios(rel.obraId)).filter((r) => !r.excluido && r.id !== rel.id && Number(r.numero) === nn);
        if (outros.length && !window.confirm(`Já existe um relatório nº ${String(nn).padStart(2, "0")} nesta obra. Usar o mesmo número mesmo assim?`)) { setSalvando(false); return false; }
      }
      let novo = { ...rel, ...extra, numero: nn };
      novo.ind = cons ? { prev: cons.geral.prev, real: cons.geral.real } : null;
      if (rel.status === REL_STATUS_FINAL && editandoFinal && cons) {
        novo.snapshot = { geradoEm: Date.now(), geradoPor: usuarioNome, versaoId: rel.cronVersaoId, cons };
        novo.log = [...(rel.log || []), { em: Date.now(), por: usuarioNome, acao: "Edição de relatório finalizado", motivo: rel.__motivo || "", antes: rel.ind || null, depois: novo.ind }];
      }
      delete novo.__motivo;
      let r = await relSalvarRelatorio(novo, usuarioNome);
      if (r.conflito) {
        if (!window.confirm(`Este relatório foi alterado por ${r.atual.editadoPor || "outro usuário"} em ${new Date(r.atual.editadoEm).toLocaleString("pt-BR")} depois que você o abriu. Sobrescrever com a sua versão?`)) { setSalvando(false); return false; }
        r = await relSalvarRelatorio(novo, usuarioNome, { forcar: true });
      }
      setRelRaw(r.rel); setDirty(false); setMsg("Salvo às " + new Date().toLocaleTimeString("pt-BR"));
      if (opcoes.encerrarEdicaoFinal) setEditandoFinal(false);
      setSalvando(false);
      return r.rel;
    } catch (e) { setMsg(""); window.alert("Não foi possível salvar: " + ((e && e.message) || e)); setSalvando(false); return false; }
  };

  const finalizar = async () => {
    if (!cons) { if (!window.confirm("Não há cronograma associado: o relatório será finalizado sem indicadores de avanço. Continuar?")) return; }
    else if (cons.nNao > 0 && !window.confirm(`${cons.nNao} atividade(s) ainda não foram aferidas e serão consideradas com 0%. Finalizar mesmo assim?`)) return;
    else if (!window.confirm("Finalizar este relatório? Uma versão consolidada (snapshot) será armazenada e novas importações de cronograma não o alterarão.")) return;
    const agora = Date.now();
    const r = await salvar({ status: REL_STATUS_FINAL, finalizadoEm: agora, finalizadoPor: usuarioNome, snapshot: cons ? { geradoEm: agora, geradoPor: usuarioNome, versaoId: rel.cronVersaoId, cons } : null }, { encerrarEdicaoFinal: true });
    if (r) logAudit?.({ tipoOperacao: "Finalização de Relatório de Obra", registroAlterado: `${obra.nome} — Relatório ${String(rel.numero).padStart(2, "0")}`, valorAnterior: REL_STATUS_ELAB, valorNovo: REL_STATUS_FINAL });
  };
  const reabrir = () => {
    const motivo = window.prompt("Este relatório está finalizado. Informe o motivo da alteração (ficará registrado no histórico):");
    if (motivo === null) return;
    setRelRaw((r) => ({ ...r, __motivo: motivo.trim() || "(não informado)" }));
    setEditandoFinal(true);
    logAudit?.({ tipoOperacao: "Edição de Relatório de Obra finalizado", registroAlterado: `${obra.nome} — Relatório ${String(rel.numero).padStart(2, "0")}`, valorAnterior: REL_STATUS_FINAL, valorNovo: `Reaberto: ${motivo}` });
  };

  const upd = (campos) => setRel((r) => ({ ...r, ...campos }));
  const setAfer = (chave, pct, origem = "manual") => setRel((r) => {
    const afer = { ...(r.afer || {}) };
    if (pct === null) delete afer[chave]; else afer[chave] = { pct, origem, em: Date.now() };
    return { ...r, afer };
  });
  const aplicarSugestoes = () => setRel((r) => {
    const afer = { ...(r.afer || {}) };
    let n = 0;
    for (const l of cons ? cons.linhas : []) if (!afer[l.chave] && sugestoes[l.chave]) { afer[l.chave] = { pct: sugestoes[l.chave].pct, origem: "sugestao", em: Date.now() }; n++; }
    setMsg(`${n} sugestão(ões) aplicada(s).`);
    return { ...r, afer };
  });
  const aplicarPctProject = () => {
    if (!ctx.versao) return;
    if (!window.confirm("Preencher as atividades ainda não aferidas com o % de conclusão registrado no Project?")) return;
    setRel((r) => {
      const afer = { ...(r.afer || {}) };
      for (const t of relExecutaveis(ctx.versao.tarefas)) if (!afer[t.chave] && t.pctProj != null && relPctValido(t.pctProj)) afer[t.chave] = { pct: t.pctProj, origem: "project", em: Date.now() };
      return { ...r, afer };
    });
  };
  const atualizarVersao = async () => {
    const atualId = ctx.meta.atualId;
    if (!atualId || atualId === rel.cronVersaoId) return;
    if (!window.confirm("Atualizar este relatório para a versão mais recente do cronograma? As aferições são mantidas pelas atividades correspondentes; o avanço previsto e o realizado serão recalculados.")) return;
    const versao = await relCarregarVersao(obra.id, atualId);
    const plan = relPlanejamento(versao, ctx.ref);
    setCtx({ ...ctx, versao, plan });
    upd({ cronVersaoId: atualId });
  };

  const gerarAnalise = () => {
    if (!cons) return window.alert("É necessário um cronograma importado para gerar a análise.");
    if (rel.analise && rel.analise.trim() && !window.confirm("Substituir o texto atual da análise técnica pela sugestão automática?")) return;
    const ant = ctx.anteriores.filter((a) => a.ind && a.dataRef < rel.dataRef)[0];
    const texto = relGerarAnaliseTexto({
      obraNome: obra.nome, ind: cons.geral, dataRef: rel.dataRef, macros: cons.macros, linhas: cons.linhas, nNao: cons.nNao,
      principais: relLinhasLista(rel.principais), anterior: ant ? { real: ant.ind.real, dataRef: ant.dataRef } : null,
    });
    upd({ analise: texto });
  };

  /* fotos */
  const adicionarFotos = async (files) => {
    const arr = Array.from(files || []);
    if (!arr.length) return;
    let falhas = 0;
    for (let i = 0; i < arr.length; i++) {
      setMsg(`Processando foto ${i + 1} de ${arr.length}…`);
      try {
        const p = await relProcessarFoto(arr[i]);
        const id = uid("foto");
        await relGravarFoto(rel.id, id, { id, dataUri: p.dataUri, w: p.w, h: p.h });
        setFotoCache((c) => ({ ...c, [id]: p.dataUri }));
        setRel((r) => ({ ...r, fotos: [...(r.fotos || []), { id, legenda: "", disciplina: "", data: "", w: p.w, h: p.h }] }));
      } catch (e) { falhas++; }
    }
    setMsg(falhas ? `${falhas} arquivo(s) não puderam ser adicionados (formato não suportado ou falha ao salvar).` : "Fotos adicionadas. Lembre-se de salvar o relatório.");
  };
  const moverFoto = (i, d) => setRel((r) => { const f = [...r.fotos]; const j = i + d; if (j < 0 || j >= f.length) return r; [f[i], f[j]] = [f[j], f[i]]; return { ...r, fotos: f }; });
  const atualizarFoto = (id, campos) => setRel((r) => ({ ...r, fotos: r.fotos.map((f) => (f.id === id ? { ...f, ...campos } : f)) }));
  const removerFoto = (id) => { if (!window.confirm("Remover esta fotografia do relatório?")) return; setRel((r) => ({ ...r, fotos: r.fotos.filter((f) => f.id !== id) })); };

  const abas = [["dados", "Dados"], ["intro", "Introdução"], ["afericao", "Avanço Físico"], ["curva", "Previsto x Realizado"], ["fotos", "Fotos"], ["analise", "Análise Técnica"]];
  const periodoOk = rel.periodoIni && rel.periodoFim && rel.periodoFim >= rel.periodoIni;
  const nomesResp = (usuarios || []).filter((u) => u.ativo && !isInvestidor(u)).map((u) => u.nome);

  const linhasPorMacro = (() => {
    if (!cons) return [];
    const q = filtro.busca.trim().toLowerCase();
    const g = new Map();
    for (const l of cons.linhas) {
      if (filtro.status !== "todas" && l.status !== filtro.status) continue;
      if (q && !(`${l.wbs} ${l.nome}`.toLowerCase().includes(q))) continue;
      if (!g.has(l.macroChave)) g.set(l.macroChave, []);
      g.get(l.macroChave).push(l);
    }
    return cons.macros.filter((m) => g.has(m.chave)).map((m) => ({ macro: m, linhas: g.get(m.chave) }));
  })();
  const ordemAfer = Object.keys(rel.afer || {}).length;
  const aferOrfas = ctx.versao ? Object.keys(rel.afer || {}).filter((k) => !ctx.versao.tarefas.some((t) => t.chave === k && t.executavel)).length : 0;

  return (
    <div className="gf-stack">
      <button className="gf-btn gf-btn-ghost" onClick={voltar} style={{ alignSelf: "flex-start" }}>← Voltar para os relatórios</button>
      <div className="gf-toolbar">
        <div>
          <h2>Relatório {String(rel.numero).padStart(2, "0")} — {obra.nome}</h2>
          <div className="gf-field-hint">Período: {fmtDate(rel.periodoIni)} a {fmtDate(rel.periodoFim)} | Referência: {fmtDate(rel.dataRef)} {dirty && <b style={{ color: "#B0530E" }}>— alterações não salvas</b>} {msg && <span>— {msg}</span>}</div>
        </div>
        <div className="gf-row-actions gf-rel-editor-acoes">
          <Badge tone={rel.status === REL_STATUS_FINAL ? "green" : "orange"}>{editandoFinal ? "Finalizado (em edição)" : rel.status}</Badge>
          <button className="gf-btn gf-btn-ghost" onClick={() => setPrevia(true)}><Eye size={14} /> Pré-visualizar Relatório</button>
          {!somenteLeitura && <button className="gf-btn gf-btn-ghost" onClick={() => salvar()} disabled={salvando || !dirty}><Check size={14} /> {salvando ? "Salvando…" : "Salvar"}</button>}
          {podeGerenciar && rel.status !== REL_STATUS_FINAL && <button className="gf-btn gf-btn-primary" onClick={finalizar} disabled={salvando || !periodoOk}><Check size={14} /> Finalizar</button>}
          {podeGerenciar && rel.status === REL_STATUS_FINAL && !editandoFinal && <button className="gf-btn gf-btn-ghost" onClick={reabrir}><Pencil size={14} /> Editar relatório finalizado</button>}
          {podeGerenciar && rel.status === REL_STATUS_FINAL && editandoFinal && <button className="gf-btn gf-btn-primary" onClick={finalizar} disabled={salvando}><Check size={14} /> Salvar e finalizar novamente</button>}
        </div>
      </div>
      {rel.status === REL_STATUS_FINAL && !editandoFinal && <div className="gf-rel-aviso gf-rel-aviso-info">Relatório finalizado em {rel.finalizadoEm ? new Date(rel.finalizadoEm).toLocaleString("pt-BR") : "—"} por {rel.finalizadoPor || "—"}. Os valores exibidos vêm do snapshot consolidado e não mudam com novas importações do cronograma.</div>}
      {editandoFinal && <div className="gf-rel-aviso gf-rel-aviso-atencao">Você está editando um relatório finalizado. A alteração será registrada no histórico do relatório.</div>}
      {!podeGerenciar && <div className="gf-rel-aviso gf-rel-aviso-info">Modo de consulta — seu usuário não pode editar relatórios de obra.</div>}

      <div className="gf-segmented gf-rel-abas">
        {abas.map(([k, r]) => <button key={k} className={aba === k ? "is-active" : ""} style={aba === k ? { background: "var(--gf-gray-100)", color: "var(--gf-primary)" } : null} onClick={() => setAba(k)}>{r}</button>)}
      </div>

      {aba === "dados" && (
        <div className="gf-card">
          <div className="gf-form-grid gf-modal-form">
            <Field label="Data inicial do período"><input type="date" value={rel.periodoIni} disabled={somenteLeitura} onChange={(e) => { const v = e.target.value; upd({ periodoIni: v, ...(rel.introEditada ? {} : { introTexto: relTextoIntroducao(obra.nome, v, rel.periodoFim) }) }); }} /></Field>
            <Field label="Data final do período"><input type="date" value={rel.periodoFim} disabled={somenteLeitura} onChange={(e) => { const v = e.target.value; upd({ periodoFim: v, ...(rel.introEditada ? {} : { introTexto: relTextoIntroducao(obra.nome, rel.periodoIni, v) }) }); }} /></Field>
            <Field label="Data de referência da aferição"><input type="date" value={rel.dataRef} disabled={somenteLeitura} onChange={(e) => upd({ dataRef: e.target.value })} /></Field>
            <Field label="Número do relatório">
              <input type="number" min="1" max="9999" step="1" value={rel.numero} disabled={somenteLeitura} onChange={(e) => upd({ numero: e.target.value === "" ? "" : Math.trunc(Number(e.target.value)) })} />
            </Field>
            <Field label="Responsável">
              <input list="rel-resp2" value={rel.responsavel || ""} disabled={somenteLeitura} onChange={(e) => upd({ responsavel: e.target.value })} />
              <datalist id="rel-resp2">{nomesResp.map((n) => <option key={n} value={n} />)}</datalist>
            </Field>
          </div>
          {!periodoOk && <div className="gf-rel-aviso gf-rel-aviso-erro">A data final do período não pode ser anterior à data inicial.</div>}
          <div className="gf-rel-resumo-grid" style={{ marginTop: 14 }}>
            <div><span>Número</span><b>{String(rel.numero).padStart(2, "0")}</b></div>
            <div><span>Criado</span><b>{new Date(rel.criadoEm).toLocaleString("pt-BR")} — {rel.criadoPor}</b></div>
            <div><span>Última edição</span><b>{new Date(rel.editadoEm).toLocaleString("pt-BR")} — {rel.editadoPor}</b></div>
            <div><span>Versão do cronograma</span><b>{vInfo ? `v${vInfo.numero} — ${vInfo.arquivo}` : "Nenhum cronograma associado"}</b></div>
          </div>
          {ctx.meta.atualId && ctx.meta.atualId !== rel.cronVersaoId && !somenteLeitura && (
            <div className="gf-rel-aviso gf-rel-aviso-atencao" style={{ marginTop: 12 }}>
              Existe uma versão mais recente do cronograma (v{ctx.meta.versoes.find((v) => v.id === ctx.meta.atualId)?.numero}). Este relatório continua usando a versão anterior até que você atualize.
              {" "}<button className="gf-btn gf-btn-ghost" onClick={atualizarVersao}>Atualizar para a versão mais recente</button>
            </div>
          )}
          {!rel.cronVersaoId && ctx.meta.atualId && !somenteLeitura && (
            <div className="gf-rel-aviso gf-rel-aviso-atencao" style={{ marginTop: 12 }}>Há um cronograma importado, mas este relatório ainda não está vinculado a ele. <button className="gf-btn gf-btn-ghost" onClick={atualizarVersao}>Vincular à versão atual</button></div>
          )}
          {(rel.log || []).length > 0 && (
            <div style={{ marginTop: 14 }}>
              <div className="gf-eyebrow">Histórico de edições após finalização</div>
              <ul className="gf-rel-ul">{rel.log.map((l, i) => <li key={i}>{new Date(l.em).toLocaleString("pt-BR")} — {l.por}: {l.acao}. Motivo: {l.motivo || "—"}. {l.antes && l.depois ? `Realizado ${relFmtPct(l.antes.real)} → ${relFmtPct(l.depois.real)}.` : ""}</li>)}</ul>
            </div>
          )}
        </div>
      )}

      {aba === "intro" && (
        <div className="gf-card gf-stack" style={{ gap: 14 }}>
          <Field label="Texto introdutório" hint="Gerado automaticamente a partir da obra e do período; pode ser editado livremente.">
            <textarea rows={4} value={rel.introTexto || ""} disabled={somenteLeitura} onChange={(e) => upd({ introTexto: e.target.value, introEditada: true })} />
          </Field>
          {!somenteLeitura && <button className="gf-btn gf-btn-ghost" style={{ alignSelf: "flex-start" }} onClick={() => upd({ introTexto: relTextoIntroducao(obra.nome, rel.periodoIni, rel.periodoFim), introEditada: false })}>Restaurar texto automático</button>}
          <Field label="Principais atividades realizadas no período" hint="Uma atividade por linha. Serão apresentadas como lista no PDF.">
            <textarea rows={7} value={rel.principais || ""} disabled={somenteLeitura} onChange={(e) => upd({ principais: e.target.value })} placeholder={"Execução da infraestrutura elétrica do pavimento térreo\nInstalação de divisórias drywall\nExecução de contrapiso"} />
          </Field>
        </div>
      )}

      {aba === "afericao" && (
        <div className="gf-stack" style={{ gap: 14 }}>
          {!cons ? (
            <div className="gf-card"><EmptyState icon={CalendarRange} title="Cronograma não disponível" body="Importe o cronograma XML do Microsoft Project na página da obra e vincule-o a este relatório para aferir o avanço físico." /></div>
          ) : (
            <>
              <div className="gf-rel-kpis">
                <div><span>Avanço realizado</span><b>{relFmtPct(cons.geral.real, 2)}</b></div>
                <div><span>Avanço previsto (em {relFmtData(rel.dataRef)})</span><b>{relFmtPct(cons.geral.prev, 2)}</b></div>
                <div><span>Dias de trabalho acumulados</span><b>{relFmtNum(cons.geral.totalDias, 2)}</b></div>
                <div><span>Não aferidas / 0% / parciais / concluídas</span><b>{cons.contagem.nao} / {cons.contagem.zero} / {cons.contagem.parcial} / {cons.contagem.completa}</b></div>
              </div>
              {cons.nNao > 0 && <div className="gf-rel-aviso gf-rel-aviso-atencao">{cons.nNao} atividade(s) ainda não aferida(s): entram no cálculo como 0%, mas não são tratadas como executadas nem como concluídas.</div>}
              {aferOrfas > 0 && <div className="gf-rel-aviso gf-rel-aviso-info">{aferOrfas} aferição(ões) pertencem a atividades que não constam mais na versão do cronograma vinculada; foram preservadas, mas não entram no cálculo.</div>}
              {!cons.pesosOk && <div className="gf-rel-aviso gf-rel-aviso-erro">Os pesos das atividades não somam 100%. Verifique o cronograma.</div>}
              <RelAvisosLista avisos={cons.avisos} />
              <div className="gf-card">
                <div className="gf-card-head"><h2>Avanço físico por atividade macro</h2></div>
                <div className="gf-rel-macros">
                  {cons.macros.map((m) => (
                    <div className="gf-rel-macro-row" key={m.chave}>
                      <div className="gf-rel-macro-nome" title={m.nome}>{m.wbs} {m.nome}</div>
                      <div className="gf-rel-barra"><div className="gf-rel-barra-fill" style={{ width: `${Math.min(100, m.pctReal)}%` }} /><div className="gf-rel-barra-prev" style={{ left: `${Math.min(100, m.pctPrev)}%` }} title={`Previsto ${relFmtPct(m.pctPrev)}`} /></div>
                      <div className="gf-rel-macro-val"><b>{relFmtPct(m.pctReal)}</b><span>prev. {relFmtPct(m.pctPrev)}</span></div>
                    </div>
                  ))}
                </div>
                <p className="gf-field-hint">Barra = realizado; marcador = previsto. Percentual da macro = Σ (duração × % realizado) ÷ Σ duração (sem média simples).</p>
              </div>
              <div className="gf-card">
                <div className="gf-card-head">
                  <h2>Aferição das atividades</h2>
                  <div className="gf-row-actions" style={{ flexWrap: "wrap" }}>
                    <input placeholder="Buscar atividade…" value={filtro.busca} onChange={(e) => setFiltro((f) => ({ ...f, busca: e.target.value }))} style={{ maxWidth: 200 }} />
                    <select value={filtro.status} onChange={(e) => setFiltro((f) => ({ ...f, status: e.target.value }))}>
                      <option value="todas">Todas</option><option value="nao">Não aferidas</option><option value="zero">Aferidas com 0%</option><option value="parcial">Em andamento</option><option value="completa">Concluídas</option>
                    </select>
                    {!somenteLeitura && Object.keys(sugestoes).length > 0 && <button className="gf-btn gf-btn-ghost" onClick={aplicarSugestoes}>Aplicar sugestões da aferição anterior</button>}
                    {!somenteLeitura && <button className="gf-btn gf-btn-ghost" onClick={aplicarPctProject}>Usar % do Project nas não aferidas</button>}
                  </div>
                </div>
                <p className="gf-field-hint">Informe apenas as atividades que evoluíram. Campo vazio = não aferida. {Object.keys(sugestoes).length > 0 ? "A aferição anterior aparece como sugestão (botão “usar”) e só vale depois de aplicada." : ""} Valores entre 0 e 100.</p>
                {linhasPorMacro.length === 0 && <p className="gf-field-hint">Nenhuma atividade encontrada com o filtro atual.</p>}
                {linhasPorMacro.map(({ macro, linhas }) => {
                  const aberto = filtro.aberto[macro.chave] !== false && (filtro.aberto[macro.chave] || linhasPorMacro.length <= 3 || filtro.busca || filtro.status !== "todas" || false);
                  return (
                    <div className="gf-rel-grupo" key={macro.chave}>
                      <button className="gf-rel-grupo-cab" onClick={() => setFiltro((f) => ({ ...f, aberto: { ...f.aberto, [macro.chave]: !aberto } }))}>
                        <ChevronRight size={14} className={aberto ? "gf-rot90" : ""} />
                        <span className="gf-rel-grupo-nome">{macro.wbs} {macro.nome}</span>
                        <span className="gf-rel-grupo-info">{relFmtNum(macro.durDias, 2)} dias | realizado {relFmtPct(macro.pctReal)} | previsto {relFmtPct(macro.pctPrev)}</span>
                      </button>
                      {aberto && (
                        <div className="gf-table-wrap">
                          <table className="gf-table gf-rel-tabela-afer">
                            <thead><tr><th>Atividade</th><th className="num">Duração (dias)</th><th className="num">Peso</th><th className="num">Previsto</th><th>Realizado (%)</th><th>Sugestão anterior</th><th>Situação</th><th className="num">Dias equiv.</th></tr></thead>
                            <tbody>
                              {linhas.map((l) => {
                                const a = (rel.afer || {})[l.chave];
                                const sg = sugestoes[l.chave];
                                const [rot, tom] = REL_ST_ROTULO[l.status];
                                return (
                                  <tr key={l.chave} className={`gf-rel-st-${l.status}`}>
                                    <td style={{ paddingLeft: 10 + Math.max(0, l.nivel - 2) * 14 }}><span className="mono gf-field-hint">{l.wbs}</span> {l.nome}</td>
                                    <td className="num mono">{relFmtDias(l.durMin, cons.minPorDia)}</td>
                                    <td className="num mono">{relFmtNum(l.pesoBp / 100, 2)}%</td>
                                    <td className="num mono">{relFmtPct(l.pctPrev, 0)}</td>
                                    <td>
                                      <div className="gf-rel-afer-cel">
                                        <RelAferInput valor={a ? a.pct : null} disabled={somenteLeitura} placeholder="—" onCommit={(v) => setAfer(l.chave, v)} />
                                        {!somenteLeitura && <button className="gf-icon-btn" title="Marcar 100%" onClick={() => setAfer(l.chave, 100)}><Check size={12} /></button>}
                                      </div>
                                    </td>
                                    <td>{sg ? <>{!somenteLeitura && !a ? <button className="gf-btn gf-btn-ghost gf-rel-btn-mini" onClick={() => setAfer(l.chave, sg.pct, "sugestao")}>usar {relFmtPct(sg.pct)}</button> : <span className="gf-field-hint">{relFmtPct(sg.pct)}</span>} <span className="gf-field-hint">({relFmtDataCurta(sg.dataRef)})</span></> : <span className="gf-field-hint">—</span>}</td>
                                    <td><Badge tone={tom}>{rot}</Badge></td>
                                    <td className="num mono">{relFmtNum(l.equivRealMin !== undefined ? l.equivRealMin / cons.minPorDia : (l.durMin * l.pctReal / 100) / cons.minPorDia, 2)}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      )}

      {aba === "curva" && (
        <div className="gf-card gf-stack" style={{ gap: 14 }}>
          {!cons ? <EmptyState icon={CalendarRange} title="Cronograma não disponível" body="A Curva S depende do cronograma importado." /> : (
            <>
              <div className="gf-rel-kpis">
                <div><span>Avanço previsto</span><b>{relFmtPct(cons.geral.prev)}</b></div>
                <div><span>Avanço realizado</span><b>{relFmtPct(cons.geral.real)}</b></div>
                <div><span>Desvio</span><b className={cons.geral.desvio < 0 ? "neg" : ""}>{cons.geral.desvioTexto}</b></div>
                <div><span>Situação</span><b className={cons.geral.situacao === "ATRASADA" ? "neg" : ""}>{cons.geral.situacao}</b></div>
              </div>
              <RelCurvaSVG curva={cons.curva} dataRef={rel.dataRef} />
              <div className="gf-rel-legenda"><span><i className="prev" /> Previsto (cronograma)</span><span><i className="real" /> Realizado (aferições registradas)</span></div>
              <ul className="gf-rel-ul">{cons.premissas.map((p, i) => <li key={i}>{p}</li>)}<li>Realizado: apenas datas com aferição registrada em relatório; nenhum valor é inventado ou interpolado.</li></ul>
            </>
          )}
        </div>
      )}

      {aba === "fotos" && (
        <div className="gf-card gf-stack" style={{ gap: 14 }}>
          {!somenteLeitura && (
            <div>
              <label className="gf-btn gf-btn-primary" style={{ cursor: "pointer" }}>
                <ImagePlus size={14} /> Adicionar fotografias
                <input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={(e) => { adicionarFotos(e.target.files); e.target.value = ""; }} />
              </label>
              <p className="gf-field-hint">As imagens são redimensionadas (até 1600 px) e comprimidas antes de salvar. Salve o relatório após organizar as fotos.</p>
            </div>
          )}
          {(rel.fotos || []).length === 0 ? <EmptyState icon={ImagePlus} title="Nenhuma fotografia" body="Adicione fotografias das atividades executadas no período." /> : (
            <div className="gf-rel-fotos">
              {rel.fotos.map((f, i) => (
                <div className="gf-rel-foto" key={f.id}>
                  <div className="gf-rel-foto-img">{fotoCache[f.id] ? <img src={fotoCache[f.id]} alt={`Foto ${i + 1}`} /> : <span className="gf-field-hint">Carregando…</span>}</div>
                  <div className="gf-rel-foto-campos">
                    <div className="gf-rel-foto-topo"><b>Foto {String(i + 1).padStart(2, "0")}</b>
                      {!somenteLeitura && <div className="gf-row-actions">
                        <button className="gf-icon-btn" title="Mover para cima" onClick={() => moverFoto(i, -1)} disabled={i === 0}><ArrowUp size={13} /></button>
                        <button className="gf-icon-btn" title="Mover para baixo" onClick={() => moverFoto(i, 1)} disabled={i === rel.fotos.length - 1}><ArrowDown size={13} /></button>
                        <button className="gf-icon-btn danger" title="Remover" onClick={() => removerFoto(f.id)}><Trash2 size={13} /></button>
                      </div>}
                    </div>
                    <Field label="Legenda / descrição"><textarea rows={2} value={f.legenda} disabled={somenteLeitura} onChange={(e) => atualizarFoto(f.id, { legenda: e.target.value })} /></Field>
                    <div className="gf-form-grid gf-modal-form">
                      <Field label="Disciplina / atividade">
                        <input list="rel-disc" value={f.disciplina} disabled={somenteLeitura} onChange={(e) => atualizarFoto(f.id, { disciplina: e.target.value })} />
                      </Field>
                      <Field label="Data (opcional)"><input type="date" value={f.data || ""} disabled={somenteLeitura} onChange={(e) => atualizarFoto(f.id, { data: e.target.value })} /></Field>
                    </div>
                  </div>
                </div>
              ))}
              <datalist id="rel-disc">{(disciplinas || []).map((d) => <option key={d} value={d} />)}</datalist>
            </div>
          )}
        </div>
      )}

      {aba === "analise" && (
        <div className="gf-card gf-stack" style={{ gap: 12 }}>
          {!somenteLeitura && <button className="gf-btn gf-btn-ghost" style={{ alignSelf: "flex-start" }} onClick={gerarAnalise}><Sparkles size={14} /> Gerar Análise Automaticamente</button>}
          <Field label="Análise técnica" hint="A sugestão automática usa apenas indicadores e fatos do relatório (sem atribuir causas). Edite livremente. Separe parágrafos com uma linha em branco.">
            <textarea rows={16} value={rel.analise || ""} disabled={somenteLeitura} onChange={(e) => upd({ analise: e.target.value })} />
          </Field>
        </div>
      )}

      {previa && <RelPreviewModal obra={obra} relObj={{ ...rel, __editandoFinal: editandoFinal, ind: cons ? { prev: cons.geral.prev, real: cons.geral.real } : rel.ind }} usuarios={usuarios} onClose={() => setPrevia(false)} />}

.gf-chip{ background:var(--gf-gray-100); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--gf-ink); }
.gf-chip-muted{ color:var(--gf-muted); }

/* Grid cards (accounts/obras) */
.gf-grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:14px; }
.gf-account-card.is-inactive{ opacity:.55; }
.gf-account-card-clickable{ cursor:pointer; }
.gf-account-card-clickable:hover{ box-shadow:0 4px 14px rgba(14,59,46,.10); border-color:var(--gf-accent); }
.gf-account-meta{ font-size:12px; color:var(--gf-muted); margin-bottom:10px; }
.gf-account-rows{ display:flex; flex-direction:column; gap:6px; padding:10px 0; border-top:1px solid var(--gf-border); border-bottom:1px solid var(--gf-border); }
.gf-account-rows div{ display:flex; justify-content:space-between; font-size:12.5px; }
.gf-account-rows span{ color:var(--gf-muted); }
.gf-account-balance{ display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
.gf-account-balance span{ font-size:12px; color:var(--gf-muted); font-weight:600; }
.gf-account-balance strong{ font-size:17px; }

.gf-obra-card{ text-align:left; cursor:pointer; border:1px solid var(--gf-border); font-family:inherit; position:relative; }
.gf-obra-card-static{ cursor:default; }
.gf-card-cta{ display:inline-flex; align-items:center; gap:2px; font-size:12px; color:var(--gf-accent); font-weight:600; margin-top:10px; }

.gf-chart-box{ padding-top:4px; }
.gf-chart-title{ font-family:var(--gf-font-display); font-size:13px; font-weight:600; color:var(--gf-primary); margin:18px 0 6px; }

/* Modal */
.gf-modal-backdrop{ position:fixed; inset:0; background:rgba(14,20,17,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.gf-modal{ background:#fff; border-radius:14px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.25); }
.gf-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--gf-border); position:sticky; top:0; background:#fff; z-index:2; }
.gf-modal-head h3{ font-family:var(--gf-font-display); font-size:16px; margin:0; color:var(--gf-primary); }
.gf-modal-body{ padding:18px 20px 22px; }

.gf-obra-detail{ display:flex; flex-direction:column; }
.gf-detail-meta{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding-bottom:14px; border-bottom:1px solid var(--gf-border); margin-bottom:12px; align-items:end; }
.gf-detail-meta div span{ display:block; font-size:11px; color:var(--gf-muted); }
.gf-detail-edit{ grid-column:span 4; justify-self:start; }
.gf-detail-stats{ border:none; padding:0 0 4px; }

.gf-fornecedor-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px; padding-top:14px; border-top:1px solid var(--gf-border); }
.gf-summary-block{ display:flex; flex-direction:column; gap:6px; }
.gf-summary-block > span{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--gf-muted); font-weight:600; }
.gf-summary-line{ display:flex; justify-content:space-between; font-size:12.5px; }
.gf-summary-block strong{ font-size:17px; }

.gf-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:36px 10px; color:var(--gf-muted); text-align:center; }
.gf-empty strong{ color:var(--gf-ink); font-size:13.5px; }
.gf-empty p{ margin:0; font-size:12.5px; max-width:320px; }

/* Planejamento Semanal */
.gf-plano-dias{ display:flex; flex-direction:column; gap:14px; }
.gf-plano-atividades{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
.gf-plano-atividade-row{ display:flex; align-items:flex-start; gap:10px; border:1px solid var(--gf-border); border-radius:10px; padding:10px 12px; background:var(--gf-gray-100); }
.gf-plano-drag-handle{ color:var(--gf-muted); cursor:grab; padding-top:2px; flex:0 0 auto; }
.gf-plano-atividade-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.gf-plano-atividade-desc{ font-weight:600; font-size:13.5px; color:var(--gf-ink); }
.gf-plano-atividade-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--gf-muted); }
.gf-plano-atividade-obs{ font-size:12px; color:var(--gf-muted); font-style:italic; }
.gf-plano-dia-card{ transition:background-color .12s ease, box-shadow .12s ease; }
.gf-archive-trigger{ transition:background-color .12s ease, box-shadow .12s ease, color .12s ease; }
.gf-archive-trigger-dragover{ background-color:var(--gf-blue-50, #eff6ff); box-shadow:inset 0 0 0 2px var(--gf-primary); color:var(--gf-primary); }
.gf-plano-dia-dragover{ background-color:var(--gf-blue-50, #eff6ff); box-shadow:inset 0 0 0 2px var(--gf-primary); }
.gf-plano-atividade-row[draggable="true"]{ cursor:grab; }

/* ===== Relatórios de Obra ===== */
.gf-rel-card-icon{ color:var(--gf-accent); margin:6px 0 2px; }
.gf-rel-novo{ font-size:14px; padding:11px 18px; }
.gf-rel-aviso{ border-radius:10px; padding:10px 14px; font-size:12.5px; line-height:1.45; border:1px solid var(--gf-border); background:var(--gf-gray-100); color:var(--gf-ink); }
.gf-rel-aviso-info{ background:#EEF4F0; border-color:#CFE0D5; }
.gf-rel-aviso-atencao{ background:#FBF1D2; border-color:#EFDC9B; color:#6B5305; }
.gf-rel-aviso-erro{ background:var(--gf-danger-soft); border-color:var(--gf-danger); color:var(--gf-danger); }
.gf-rel-avisos{ display:flex; flex-direction:column; gap:6px; }
.gf-rel-lista{ display:flex; flex-direction:column; gap:8px; }
.gf-rel-item{ display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--gf-border); border-radius:10px; padding:11px 14px; background:var(--gf-gray-100); flex-wrap:wrap; }
.gf-rel-item-info{ flex:1; min-width:240px; display:flex; flex-direction:column; gap:6px; }
.gf-rel-item-titulo{ font-weight:700; color:var(--gf-primary); font-size:14px; }
.gf-rel-item-acoes{ flex:0 0 auto; }
.gf-rel-ref{ font-size:12.5px; background:var(--gf-gray-100); border-radius:10px; padding:10px 14px; margin-bottom:12px; color:var(--gf-ink); }
.gf-rel-resumo-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.gf-rel-resumo-grid > div{ background:var(--gf-gray-100); border-radius:10px; padding:9px 12px; display:flex; flex-direction:column; gap:3px; }
.gf-rel-resumo-grid span{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--gf-muted); font-weight:600; }
.gf-rel-resumo-grid b{ font-size:13px; word-break:break-word; }
.gf-rel-ul{ margin:6px 0 0; padding-left:18px; font-size:12.5px; color:var(--gf-ink); display:flex; flex-direction:column; gap:3px; }
.gf-rel-tr-resumo td{ background:var(--gf-gray-100); }
.gf-rel-previa{ display:flex; flex-direction:column; gap:16px; align-items:center; background:#d9dcd7; padding:16px; border-radius:10px; }
.gf-rel-previa img{ width:100%; max-width:760px; height:auto; box-shadow:0 4px 18px rgba(0,0,0,.2); background:#fff; }
.gf-rel-svg{ width:100%; height:auto; max-height:420px; background:#FAFAF8; border:1px solid var(--gf-border); border-radius:10px; }
.gf-rel-abas{ flex-wrap:wrap; margin-bottom:0; }
.gf-rel-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
.gf-rel-kpis > div{ background:#fff; border:1px solid var(--gf-border); border-left:4px solid var(--gf-accent); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:4px; }
.gf-rel-kpis span{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--gf-muted); font-weight:600; }
.gf-rel-kpis b{ font-family:var(--gf-font-display); font-size:20px; color:var(--gf-primary); }
.gf-rel-kpis b.neg{ color:var(--gf-danger); }
.gf-rel-macros{ display:flex; flex-direction:column; gap:10px; }
.gf-rel-macro-row{ display:grid; grid-template-columns:minmax(120px,1.1fr) 2fr 90px; gap:12px; align-items:center; }
.gf-rel-macro-nome{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gf-rel-barra{ position:relative; height:16px; background:var(--gf-gray-100); border-radius:8px; }
.gf-rel-barra-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--gf-accent); border-radius:8px; }
.gf-rel-barra-prev{ position:absolute; top:-4px; bottom:-4px; width:3px; background:var(--gf-ink); border-radius:2px; }
.gf-rel-macro-val{ display:flex; flex-direction:column; align-items:flex-end; font-size:13px; }
.gf-rel-macro-val span{ font-size:10.5px; color:var(--gf-muted); }
.gf-rel-grupo{ border:1px solid var(--gf-border); border-radius:10px; margin-top:10px; overflow:hidden; }
.gf-rel-grupo-cab{ width:100%; display:flex; align-items:center; gap:8px; background:var(--gf-gray-100); border:none; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; flex-wrap:wrap; }
.gf-rel-grupo-cab svg.gf-rot90{ transform:rotate(90deg); }
.gf-rel-grupo-nome{ font-weight:700; color:var(--gf-primary); font-size:13px; flex:1; min-width:160px; }
.gf-rel-grupo-info{ font-size:11.5px; color:var(--gf-muted); }
.gf-rel-tabela-afer td, .gf-rel-tabela-afer th{ white-space:nowrap; }
.gf-rel-tabela-afer td:first-child{ white-space:normal; min-width:220px; }
.gf-rel-afer-cel{ display:flex; align-items:center; gap:6px; }
.gf-rel-afer-input{ width:76px; text-align:right; }
.gf-rel-btn-mini{ padding:4px 8px; font-size:11.5px; }
.gf-rel-st-nao td:first-child{ border-left:3px solid #C9CEC8; }
.gf-rel-st-zero td:first-child{ border-left:3px solid #D9B43A; }
.gf-rel-st-parcial td:first-child{ border-left:3px solid #4A86B5; }
.gf-rel-st-completa td:first-child{ border-left:3px solid var(--gf-accent); }
.gf-rel-legenda{ display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--gf-muted); }
.gf-rel-legenda i{ display:inline-block; width:26px; height:0; border-top:3px dashed #5D6B64; vertical-align:middle; margin-right:6px; }
.gf-rel-legenda i.real{ border-top:4px solid #0E3B2E; }
.gf-rel-fotos{ display:flex; flex-direction:column; gap:12px; }
.gf-rel-foto{ display:flex; gap:14px; border:1px solid var(--gf-border); border-radius:10px; padding:12px; background:var(--gf-gray-100); }
.gf-rel-foto-img{ flex:0 0 180px; height:140px; background:#fff; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.gf-rel-foto-img img{ max-width:100%; max-height:100%; object-fit:contain; }
.gf-rel-foto-campos{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.gf-rel-foto-topo{ display:flex; justify-content:space-between; align-items:center; }
.gf-rel-editor-acoes{ flex-wrap:wrap; }
@media (max-width: 700px){
  .gf-rel-foto{ flex-direction:column; }
  .gf-rel-foto-img{ flex:0 0 auto; width:100%; height:200px; }
  .gf-rel-macro-row{ grid-template-columns:1fr 70px; }
  .gf-rel-macro-nome{ grid-column:1 / -1; white-space:normal; }
  .gf-rel-item{ flex-direction:column; align-items:stretch; }
  .gf-rel-item-acoes{ justify-content:flex-start; }
}

@media (max-width: 900px){
  .gf-tiles{ grid-template-columns:repeat(3,1fr); }
  .gf-form-grid{ grid-template-columns:repeat(2,1fr); }
  .gf-filters-grid{ grid-template-columns:repeat(3,1fr); }
  .gf-detail-meta{ grid-template-columns:repeat(2,1fr); }
  .gf-detail-edit{ grid-column:span 2; }
  .gf-fornecedor-summary{ grid-template-columns:1fr; }
}
@media (max-width: 640px){
  .gf-app{ flex-direction:column; }
  .gf-sidebar{ width:100%; flex-direction:row; align-items:center; min-height:auto; padding:12px 14px; overflow-x:auto; }
  .gf-nav{ flex-direction:row; }
  .gf-sidebar-foot{ display:none; }
  .gf-tiles{ grid-template-columns:repeat(2,1fr); }
  .gf-form-grid{ grid-template-columns:1fr; }
  .gf-modal-form{ grid-template-columns:1fr; }
  .gf-span-2{ grid-column:span 1; }
  .gf-filters-grid{ grid-template-columns:repeat(2,1fr); }
  .gf-page{ padding:16px; }
  .gf-topbar{ padding:16px; }
}
`;

const rootEl = document.getElementById("root");
const root = createRoot(rootEl);
root.render(<App />);

</script>

</body>
